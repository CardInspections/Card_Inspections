ck","text":"","sev":"minor","choices":[]}]},{"name":"Ductwork","c":[{"id":"75c8757","type":"defect","title":"Unbalanced Distribution of Conditioned Air","text":"I observed indications of an unbalanced distribution of conditioned air throughout the house.  Not every room as s supply source for conditioned air (heated or cooled air).","sev":"moderate","choices":[]},{"id":"a2810d2","type":"defect","title":"Missing Cooled-Air Supply at a Room","text":"I observed an absence of a cooled-air supply register at a room.  Every living space should have a cooled-air or conditioned air source supplied to it.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"211b5bc","type":"defect","title":"Duct Damaged","text":"I observed indications of damage at the ductwork.","sev":"minor","choices":[]},{"id":"445236f","type":"defect","title":"Ducts Not Sealed","text":"Air supply ducts were not sealed. Ideally all ducts are sealed with mastic in order to be more energy-efficient.","sev":"minor","choices":[]},{"id":"09ae683","type":"defect","title":"Missing Register at Room","text":"I observed a missing heat supply register for a room. Every room should have an air register to supply conditioned air to that room. Not sure why it's not installed. This room may feel uncomfortable or different than the other rooms of the house.","sev":"moderate","choices":[]},{"id":"015bf10","type":"info","title":"Ductwork Installed","text":"I observed ductwork in the house.  Air conditioning (cooling) systems, including heat pump systems, use ductwork to distribute the cooled, conditioned air throughout the house. I will attempt to determine if the each room has a cooling source or conditioned-air supply, but I may not be able to find every duct register.","sev":"minor","choices":["Insulated","Non-insulated"]}]}]},{"name":"Plumbing","subs":[{"name":"Main Water Shut-Off Valve","c":[{"id":"f727f62","type":"defect","title":"Active Water Leak at Valve","text":"I observed an active water leak at the main water shut-off valve.","sev":"moderate","choices":[]},{"id":"1d1a865","type":"limit","title":"Unable to Locate","text":"LMT - I was unable to determine the location of the main water shut-off valve.  Ask the homeowner.","sev":"minor","choices":[]},{"id":"16697c6","type":"info","title":"Homeowner's Responsibility","text":"It's your job to know where the main water and fuel shutoff valves are located. And be sure to keep an eye out for any water and plumbing leaks.","sev":"minor","choices":[]},{"id":"60d4a0c","type":"limit","title":"Inaccessible","text":"LMT - I observed conditions that made the inspection of the main water shut-off valve inaccessible.  Inspection restriction.","sev":"minor","choices":[]},{"id":"64bb4fc","type":"defect","title":"Pex Water Pipe Not Properly Supported","text":"Many runs of led pipe were observed to be installed improperly.  Pex pipe should be supported every 32\u201d minimum.  Further evaluation and repair by a licensed plumbing contractor is recommended.","sev":"moderate","choices":[]},{"id":"9233f2c","type":"limit","title":"Water Turned Off at Main Valve","text":"LMT - I observed that the main water shut-off valve was turned off. There was no water running at the house. Inspection restriction.","sev":"minor","choices":[]},{"id":"2b7e76b","type":"defect","title":"Missing Bonding Jumper","text":"I observed indications of a missing bonding jumper cable that should be installed over the water meter.","sev":"moderate","choices":[]},{"id":"ae738cf","type":"defect","title":"Missing Handle at Main Valve","text":"I observed a missing handle at the main shut-off valve.","sev":"moderate","choices":[]},{"id":"326ccab","type":"defect","title":"Lead Service Line Suspected","text":"","sev":"moderate","choices":[]},{"id":"262e570","type":"info","title":"Location of Main Shut-Off Valve","text":"","sev":"minor","choices":["Basement","Crawlspace","Garage","Outside of House","Unable to Determine","Mechanical Room","Closet","Cabinet","Laundry Room","Well House"]},{"id":"acb94df","type":"info","title":"Pex pipe not properly installed","text":"","sev":"minor","choices":[]},{"id":"fddbec0","type":"defect","title":"Missing Main Shut Off Valve","text":"Main Water Service Valve Missing.","sev":"minor","choices":[]}]},{"name":"Water Supply","c":[{"id":"b1e719f","type":"limit","title":"Unable to Determine Public or Private","text":"LMT - I was unable to determine whether the water supplied to the house that I inspected was from a public water utility source or a private well water source.  Ask the homeowner for this information.","sev":"minor","choices":[]},{"id":"2940ba2","type":"info","title":"Water Supply Is Private","text":"The water supply to the house appeared to be from a private water supply source based upon the observed indications at the time of the inspection.  To confirm and be certain, I recommend asking the homeowner for details.","sev":"minor","choices":[]},{"id":"c4b814e","type":"defect","title":"Pressure Gauge Damaged","text":"","sev":"moderate","choices":[]},{"id":"c49dc9b","type":"info","title":"Water Supply Is Public","text":"The water supply to the house appeared to be from the public water supply source based upon the observed indications at the time of the inspection.  To confirm and be certain, I recommend asking the homeowner for details.","sev":"minor","choices":[]},{"id":"3da9d22","type":"info","title":"Water Supply Pipe Material","text":"","sev":"minor","choices":["Cooper","Poly","Copper","Lead","Galvanized","Pvc"]},{"id":"ae7049b","type":"defect","title":"Defect At Main Water Supply","text":"I observed a defect at the main water supply.","sev":"moderate","choices":[]},{"id":"8730f0e","type":"defect","title":"Pressure Tank Rusted","text":"","sev":"moderate","choices":[]},{"id":"ca7bf7a","type":"defect","title":"Well Head Cap","text":"","sev":"moderate","choices":[]},{"id":"2e71d50","type":"defect","title":"Jet Pump- Nearing End Of Useful Life","text":"","sev":"moderate","choices":[]}]},{"name":"Main Fuel Supply Shut-Off Valve","c":[{"id":"ced0617","type":"limit","title":"Unable to Locate","text":"LMT - I was unable to determine the location of the main fuel shut-off valve.  Ask the homeowner.","sev":"minor","choices":[]},{"id":"51fe0bd","type":"defect","title":"CSST Gas Pipe- Not Bonded","text":"SFTY- Proper bonding of the CSST gas line was not observed.  CSST (corrugated stainless steel tubing) gas line bonding is a safety measure that connects the CSST gas piping system to the building's grounding electrode system. This creates a path for electricity to safely connect to the ground, which helps protect the gas line from damage and fires caused by lightning strikes and power surges.\n\nHere are some things to know about CSST gas line bonding:\n\nBonding requirements: The CSST must be permanently bonded to the building's grounding electrode system.  The bonding clamp can be mounted anywhere in the piping system, but it must be attached to a rigid pipe, malleable iron pipefitting, prefabricated manifold, or brass CSST fitting.\nBonding clamp: The bonding clamp must be listed for the type of mechanical attachment and location. If the clamp is exposed to the weather, it must be listed for that application.\n\nImproper bonding of Corrugated Stainless Steel Tubing (CSST) piping can increase the odds of failure.  Electrical discharge can cause holes to form in the pipe causing gas leaks.\n\nRecommendation\n\nEvaluation by a licensed electrician or HVAC contractor to ensure all installation requirements have been met is recommended.  To learn more about CSST click here.","sev":"major","choices":[]},{"id":"d6c260c","type":"defect","title":"Gas Meter Tilted","text":"I observed a defect at the gas meter. It's tilted as if the ground at the meter had settled.","sev":"moderate","choices":[]},{"id":"089235a","type":"limit","title":"Inaccessible","text":"LMT - I observed conditions that made the inspection of the main fuel shut-off valve inaccessible.  Inspection restriction.","sev":"minor","choices":[]},{"id":"cf364bf","type":"limit","title":"Gas Turned Off at Main Valve","text":"LMT - I observed that the main gas valve is turned off at the meter. No gas at the house. Inspection restriction.","sev":"minor","choices":[]},{"id":"a50f92a","type":"defect","title":"Bushing used","text":"","sev":"moderate","choices":[]},{"id":"e93b88a","type":"defect","title":"Active Gas Leak at Valve","text":"I observed an active gas leak at the main fuel shut-off valve.  Hazard.  Material defect.","sev":"major","choices":[]},{"id":"6f2cf0e","type":"defect","title":"Minor Rust at Meter","text":"I observed some minor surface rust at the gas meter components. Monitoring recommended.","sev":"minor","choices":[]},{"id":"d0b3298","type":"info","title":"Location of Main Shut-Off Valve","text":"","sev":"minor","choices":["Side of House","Near Electric Meter","Basement","Crawlspace","Unable to Determine","Back of home","Front Of Home"]}]},{"name":"Fuel Storage System","c":[{"id":"327c165","type":"defect","title":"Buried Oil Tank Observed","text":"I observe indications of a buried oil tank.  This could be a potential environmental problem, but I could not determine that.  Everything is buried.","sev":"moderate","choices":[]},{"id":"2768241","type":"limit","title":"Fuel-Storage System is Buried","text":"LMT - Apparently the fuel-storage system is buried.  This is an inspection restriction.  Ask the homeowner for details about the buried system.","sev":"minor","choices":[]},{"id":"eab7985","type":"defect","title":"Defect Observed at Fuel-Storage System","text":"I observed a defect at the fuel-storage system.  Major defect.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"2147efe","type":"defect","title":"Gas Line Not Properly Supported","text":"Gas lines should be properly supported to prevent damage and a possible gas leak.  Repair by a licensed mechanical contractor is recommended.","sev":"moderate","choices":[]},{"id":"de57181","type":"info","title":"Fuel-Storage System Was Observed","text":"I observed a fuel-storage system.","sev":"minor","choices":["Outside in Yard","Outside of House","In the Basement","In the Garage","In the House","In a Storage Shed"]}]},{"name":"Hot Water Source","c":[{"id":"e199c00","type":"info","title":"Type of Hot Water Source","text":"I inspected for the main source of the distributed hot water to the plumbing fixtures (sinks, tubs, showers).  I recommend asking the homeowner for details about the hot water equipment and past performance.","sev":"minor","choices":["Electric Hot Water Tank","Gas-Fired Hot Water Tank","Hot Water from Boiler","Hot Water from Solar System","Geothermal","Other","Tankless Gas Water Heater"]},{"id":"75c4b46","type":"defect","title":"TPR Discharge Not Long Enough","text":"SFTY- The temperature and pressure relief valve (t&p) discharge tube is required to terminate no more than 4\u201d above the floor.  The discharge pipe protects against scalding water in the event the t&p valve discharges.  This is a safety hazard and should be repaired by a licensed plumber.","sev":"major","choices":[]},{"id":"0d49b78","type":"limit","title":"Inspection Restriction","text":"LMT - The inspection of the system was restricted.  I was unable to completely inspect the system.","sev":"minor","choices":[]},{"id":"0825270","type":"defect","title":"Defect at TPR Valve Discharge","text":"I observed a defect a the TPR (temperature, pressure, and relief) valve. The discharge pipe that serves a temperature pressure relief valve must:\n\n\u2022 Not be connected to the drainage system.\n\n\u2022 Discharge through an air gap located in the same room as the water heater.\n\n\u2022 Not be smaller than the diameter of the outlet of the valve.\n\n\u2022 Serve a single relief device.\n\n\u2022 Discharge to the floor.\n\n\u2022 Discharge in a manner that does not cause personal injury or structural damage.\n\n\u2022 Discharge to a termination point that is readily observable.\n\n\u2022 Not be trapped.\n\n\u2022 Be installed so as to flow by gravity.\n\n\u2022 Terminate no more than 6 inches above the floor or flood level rim of the waste receptor. And not less than 2 times the discharge pipe diameter.\n\n\u2022 Not have valves or tee fittings.\n\n\u2022 Be constructed of materials listed or rated for such use.\n\n\u2022 Be one nominal size larger that the size of the relief valve outlet, where the relief valve discharge piping is installed with insert fittings.","sev":"moderate","choices":[]},{"id":"c7dbbef","type":"info","title":"Inspected Hot Water Source","text":"I inspected the hot water source and equipment according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"4aa1029","type":"info","title":"Inspected TPR Valve","text":"I inspected the temperature and pressure relief valve.","sev":"minor","choices":[]},{"id":"e8a41be","type":"defect","title":"Old System","text":"I observed during my inspection that the system appeared to be old and at the end of its service life. It may not be reliable. Ask the homeowner or occupant about its recent performance. Regular maintenance and monitoring of its condition is recommended. Budgeting for repairs and future replacement is recommended. InterNACHI's Standard Estimate Life Expectancy Chart for Homes","sev":"minor","choices":[]},{"id":"6e5b15a","type":"defect","title":"TPR Relief Valve Leaking","text":"The Temperature Pressure Relief Valve was observed to have corrosion.  This is a sign it is leaking and failing.  This is the main safety device of your water heater.  Immediate correction is recomended.","sev":"major","choices":[]},{"id":"69af1a9","type":"info","title":"Inspected Venting Connections","text":"I inspected the venting connections.","sev":"minor","choices":[]},{"id":"e8d8790","type":"info","title":"Inspected Seismic Bracing","text":"I inspected the seismic bracing for the hot water tank.","sev":"minor","choices":[]},{"id":"246d061","type":"defect","title":"Rust Observed","text":"","sev":"moderate","choices":[]},{"id":"1241a56","type":"defect","title":"Corrosion- Lack of Dielectric Fitting","text":"I observed corrosion at the hot water source.  A dielectric fitting should have been used to prevent corrosion between dissimilar metals.  Repair by a licensed plumber is recommended.","sev":"moderate","choices":[]},{"id":"1680f83","type":"defect","title":"Plastic Water Pipes Connexted Directly To Gas Fired Water Heater","text":"Plastic water pipes should not be connected directly to the water heater, they should be installed a minimum of 18\u201d from the vent hood.  The flue gases can cause plastic pipe to melt which could cause a fire and/ or a leak.  Repair by a licensed plumber is recommended.","sev":"major","choices":[]},{"id":"b5c325b","type":"defect","title":"Defect at Vent Connection Pipe","text":"SFTY- I observed a defect at the vent connection pipe of the hot water source. The horizontal run of the vent pipe should not exceed three-fourths of the vertical rise of the flue to which the vent is attached. This is causing a backdraft of flue gases as evident by the discoloration of the dielectric union.  The inspector recommends consulting a licensed plumber for repair.","sev":"major","choices":[]},{"id":"016a2bb","type":"defect","title":"Water Leak","text":"I observed an active water leak at the hot water source.","sev":"moderate","choices":[]},{"id":"2f6d1b2","type":"defect","title":"Missing Catch Pan Under Water Heater","text":"I observed that the hot water tank is missing a water leak catch pan.  If the water heater leaks the entire 40 gallon tank, or more, of water could be released onto your finished floor causing major damage.  The addition of a water heater pan and proper drain by a licensed plumbing contractor is recommended.","sev":"minor","choices":[]},{"id":"555a984","type":"defect","title":"Backdrafting","text":"I observed indications of backdrafting at the hot water source, which is a material defect and hazardous condition.","sev":"major","choices":[]},{"id":"68214a0","type":"defect","title":"TPR Discharge Pipe- Unapproved Material","text":"The Temperature Pressure Relief Valve discharge pipe is not of a manufacturer approved material.  This is present to protect from scalding in the event the relief valve discharges.  Safety Issue.  Repair by a licensed plumber recomended.","sev":"major","choices":[]},{"id":"9400577","type":"defect","title":"Missing Gas Disconnect","text":"The water heater was not supplied with a fuel disconnect for servicing.  The inspector recommends a disconnect valve on the gas line be installed by a licensed mechanical contractor.","sev":"moderate","choices":[]},{"id":"4c391d0","type":"defect","title":"Fuel Line Missing Drip Leg","text":"No sediment trap or drip leg was installed at this boiler. Sediment traps and drip legs are installed to keep particulates and moisture out of the gas valve. Particulates or moisture in the gas valve can interfere with boiler burner operation. The Inspector recommends installation of a sediment trap/drip leg by a qualified plumbing contractor.","sev":"major","choices":[]},{"id":"8e51036","type":"defect","title":"Working Space","text":"","sev":"moderate","choices":[]},{"id":"53f637d","type":"info","title":"Approximent Age Of Hot Water Source","text":"Water Heaters have a average life expectancy of 6-12 years.","sev":"minor","choices":[]},{"id":"452a5d1","type":"defect","title":"Defect at the TPR Valve","text":"I observed a defect a the TPR (temperature, pressure, and relief) valve.","sev":"moderate","choices":[]},{"id":"19ccc59","type":"defect","title":"Tank Should Be Raised","text":"I observed that the hot water tank should be raised at least 18 inches from the floor.","sev":"moderate","choices":[]},{"id":"eb96603","type":"defect","title":"Water Heater Installed In Bedroom/ Bathroom","text":"A water heater was observed installed in a bedroom or bathroom.  This is a safety hazard as combustion gases could be released into the home.  Relocation of the water heater by a licensed plumbing contractor is recommended.","sev":"major","choices":[]},{"id":"f01670c","type":"info","title":"Hot Water Source Brand","text":"","sev":"minor","choices":["A.O. Smith","Lochinvar","Bradford White","Kenmore","Hotpoint","Richmond","Montgomery Ward","Rheem","Whirlpool","GE","Reliance","State","HWI"]},{"id":"c3409c9","type":"info","title":"Hot Water Source Model and Serial Number- Data Tag","text":"","sev":"minor","choices":[]},{"id":"556c92b","type":"defect","title":"Water Heater Installed In Confined Space","text":"This water heater was installed in a confined space.  In this circumstance, an area is considered a confined space if the volume of space in which the water heater is installed is less than 50 cubic feet per 1,000btu/hr of aggregate input of the water heater.  This is a safety issue and should be corrected by a licensed plumbing contractor.","sev":"major","choices":[]},{"id":"5865e9d","type":"defect","title":"Missing Romex Connector","text":"The inspector observed a missing romex connector on the water heater.  A romex connector protects the wires from being damaged by the metal edges of the junction box.  Repair by a licensed electrician is recommended.","sev":"minor","choices":[]},{"id":"78571a5","type":"info","title":"Fuel Disconnect","text":"In the event of an emergency or when servicing the water heater this is the gas disconnect for the appliance.","sev":"minor","choices":[]},{"id":"beff44a","type":"defect","title":"Water heater rusted","text":"Rust was observed at the bottom of the water heater, this can be a sign the water heater is failing and needs to be replaced.  In certain circumstances a rusted out water heat can cause a flood in the home.  Replacment of this unit is recommended.","sev":"major","choices":[]},{"id":"e0528c7","type":"defect","title":"Water Heater Not Mobile Home Approved","text":"The water heater is not approved for use in mobile homes. The water heater currently in place appears to be a standard residential model, and its installation in a mobile home environment raises significant concerns regarding safety, compliance, and potential hazards.\n\nDangers of Using Non-Mobile Home Approved Water Heater\n\n1. Improper Ventilation: Standard water heaters are designed for installation in well-ventilated spaces, which might differ significantly from the confined spaces found in mobile homes. The lack of proper ventilation can result in the accumulation of toxic fumes, such as carbon monoxide, leading to health hazards for occupants.\n\n2. Weight and Structural Integrity: Mobile homes have specific load-bearing limitations due to their design. Standard water heaters are often heavier than those designed for mobile homes. Installing a non-mobile home approved water heater can strain the structure and potentially compromise the stability and safety of the mobile home.\n\n3. Fire Hazards: Mobile home approved water heaters typically have safety features to prevent the ignition of flammable materials in the confined space. Using a standard water heater could increase the risk of fires, especially if it's not adequately isolated from combustible materials.\n\n4. Lack of Compliance: Mobile homes are subject to various building codes and regulations that ensure the safety of occupants. Using a water heater that is not approved for mobile home use can result in non-compliance with these regulations, which may have legal implications.\n\nRecommendation for Water Heater Replacement\n\nTo ensure the safety and compliance of the property, it is strongly recommended that the existing non-mobile home approved water heater be replaced with a water heater explicitly designed and approved for use in mobile homes. Mobile home approved water heaters are specifically engineered to address the unique challenges of mobile home installations, including weight, ventilation, and safety requirements.\n\nSources:\n\n1. Department of Housing and Urban Development (HUD) \u2013 Manufactured Home Procedural and Enforcement Regulations.\n\n2. Mobile Home Living \u2013 Why You Shouldn't Use a Normal Water Heater in a Mobile Home.","sev":"moderate","choices":[]}]},{"name":"Drain, Waste, & Vent Systems","c":[{"id":"473b440","type":"limit","title":"Not All Pipes Were Inspected","text":"LMT - The inspection was restricted because not all of the pipes were exposed, readily accessible, and observed.  For example, most of the drainage pipes were hidden within the walls.","sev":"minor","choices":[]},{"id":"bf0d13b","type":"defect","title":"Active Leaking Pipe","text":"I observed an active plumbing leak coming from a drain and waste pipe pipe.","sev":"moderate","choices":[]},{"id":"bbad3a9","type":"info","title":"Inspected Drain, Waste, Vent Pipes","text":"I attempted to inspect the drain, waste, and vent pipes.  Not all of the pipes and components were accessible and observed.  Inspection restriction.  Ask the homeowner about water and sewer leaks or blockages in the past.","sev":"minor","choices":[]},{"id":"fdb413b","type":"defect","title":"Improper Slope of Pipe","text":"I observed indications of an improper slope of a drain pipe.  Drain pipes must be sloped properly \"downhill\" in order to drain.","sev":"moderate","choices":[]},{"id":"bf92d2e","type":"defect","title":"Improper Connection- Service Cast Iron","text":"I observed an improper connection at a drain, waste, and vent pipe.  The cleanout was not properly installed.  There are ways to properly installed a cleanout in the Service Cast Iron Fittings.  A specialized plumbing contractor may have to perform this work.","sev":"moderate","choices":[]},{"id":"54464d5","type":"defect","title":"Duct Tape On Pipe","text":"Multiple areas of the waste discharge pipe were observed to have duct tape installed.  This is not common practice and the reason for the tape was unknown.  While no signs of active leaks were observed it is possible the tape covers leaks.","sev":"minor","choices":[]},{"id":"ac3fcf8","type":"defect","title":"Bucket Trap Observed","text":"","sev":"moderate","choices":[]},{"id":"3c980e0","type":"defect","title":"Possible Leak From Cast Iron Pipes","text":"Some of the cast iron pipes showed signs of corrosion at the time of the inspection.  This could be a sign the pipes, fittings, or bands (rubber connectors covered with a thin metal sleeve) are deteriorated.  Repairs may have been made without cleaning up the signs of corrosion.  Further evaluation to determine if the pipes are leaking is reccomended.","sev":"minor","choices":[]},{"id":"63778eb","type":"defect","title":"Inadequate Pipe Support","text":"I observed a section of pipe that had inadequate pipe support.","sev":"moderate","choices":[]},{"id":"a52ab0f","type":"info","title":"Drain Pipe Material","text":"","sev":"minor","choices":["PVC","Cast Iron","Copper","ABS"]},{"id":"925f776","type":"defect","title":"Drainage Not Functional at Sink","text":"I observed a sink with drainage that was not functioning.","sev":"moderate","choices":[]},{"id":"84f266d","type":"defect","title":"Drainage Not Functional at Toilet","text":"I observed a toilet with drainage that was not functioning.","sev":"moderate","choices":[]},{"id":"923a6d2","type":"defect","title":"Drainage Not Functional at Shower","text":"I observed a tub with shower that was not functioning.","sev":"moderate","choices":[]},{"id":"a6c22dc","type":"defect","title":"Drainage Not Functional at Tub","text":"I observed a tub with drainage that was not functioning.","sev":"moderate","choices":[]},{"id":"0afdc01","type":"defect","title":"Possible Leak From Toilet","text":"","sev":"moderate","choices":[]}]},{"name":"Water Supply & Distribution Systems","c":[{"id":"ec78e3a","type":"limit","title":"Not All Pipes Were Inspected","text":"LMT - The inspection was restricted because not all of the water supply pipes were exposed, readily accessible, and observed.  For example, most of the water distribution pipes, valves and connections were hidden within the walls.","sev":"minor","choices":[]},{"id":"079bf4b","type":"defect","title":"Saddle Valve Installed","text":"Saddle valves use a small hollow needle to penetrate the pipe and allow water to flow through it.  They are sealed with a rubber seal that is clamped around the pipe.  These valves are known to fail and could cause a flood.  They do not meet modern professional standards and should be replaced by a licensed plumbing contractor before they fail.","sev":"minor","choices":[]},{"id":"d883b7b","type":"info","title":"Inspected Water Supply & Distribution Pipes","text":"I attempted to inspect the water supply and distribution pipes (plumbing pipes). Not all of the pipes and components were accessible and observed. Inspection restriction. Ask the homeowner about water supply, problems with water supply, and water leaks in the past.","sev":"minor","choices":[]},{"id":"baa425e","type":"defect","title":"Hose Bib Not Frost Free","text":"A hose bib that is not frost free can freeze, causing a flood in the home.  The inspector noted one or more hose bibs that were not frost free.  Please note you must shut these off INSIDE the home and leave the outside spigot open during freezing temperature.\n\nThe inspector recommends installation of a frost free hydrant to help avoid a frozen and broken pipe.","sev":"moderate","choices":[]},{"id":"fe18694","type":"defect","title":"Corrosion at Water Shut-Off Valve","text":"I observed a water leak that developed into corrosion at a water supply shut-off valve.  Repair by a licensed plumber is recommended.","sev":"moderate","choices":[]},{"id":"819d51b","type":"defect","title":"Pex Pipe Not Properly Supported","text":"Per pipe should be supported every 36\u201d.  Without support the pipe could become damaged or sag.  Repair by a licensed plumber is recomended.","sev":"moderate","choices":[]},{"id":"f7a54ec","type":"defect","title":"Hose Bib Not Working","text":"","sev":"moderate","choices":[]},{"id":"3ae6a93","type":"defect","title":"Active Plumbing Water Leak Observed","text":"I observed indications of an active plumbing water leak.  Major defect.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"cad5acd","type":"defect","title":"Improper Installation of Water Pipes","text":"I observed indications of poor workmanship and improper installation of the water supply pipes.  Defect.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"edf0b10","type":"defect","title":"Active Water Leak at Water Shut-Off Valve","text":"I observed an active water leak at a water shut-off valve.","sev":"moderate","choices":[]},{"id":"c58cfaf","type":"defect","title":"Polybutylene Supply Pipes","text":"I observed indications that the water supply pipes were made from polybutylene material. This material can be prone to fail without warning, causing damage to the home structure. Recommend a qualified plumber inspect the pipe further and consider replacing pipes and fittings with an approved material.\n\nYou can read more about polybutylene piping at www.nachi.org/pb.","sev":"major","choices":[]},{"id":"215afec","type":"defect","title":"Improper Repair Of Water Pipe Leak","text":"","sev":"moderate","choices":[]},{"id":"bb79108","type":"defect","title":"Pioes not insulated","text":"","sev":"moderate","choices":[]},{"id":"10fe921","type":"info","title":"Water Supply Material","text":"","sev":"minor","choices":["Copper","Poly","Galvanized","Lead"]},{"id":"8758a7b","type":"defect","title":"Nibco Pex","text":"","sev":"moderate","choices":[]},{"id":"c6002ee","type":"defect","title":"Deficiency in the Hot & Cold Water Supply","text":"I observed indications of a defect in the hot and cold water supply.","sev":"moderate","choices":[]},{"id":"1b9b503","type":"info","title":"Water Distribution Material","text":"","sev":"minor","choices":["Cooper","Pex","CPVC","Copper","Galvanized","Poly","Polybutylene","PVC Sch 40"]},{"id":"f1f6680","type":"defect","title":"Toilet Damage","text":"I observed indications of a toilet that was damaged.","sev":"moderate","choices":[]},{"id":"e3985be","type":"defect","title":"Toilet Loose Connection to Floor","text":"I observed indications of a toilet that had a loose connection to the floor.","sev":"moderate","choices":[]},{"id":"69f3237","type":"defect","title":"Toilet Leaking","text":"I observed indications of a toilet that was leaking.","sev":"moderate","choices":[]},{"id":"fbe0760","type":"defect","title":"Toilet Tank Component Defect","text":"I observed indications of a toilet that had tank components that did not operate.","sev":"moderate","choices":[]},{"id":"54487c8","type":"defect","title":"Defect at Two Fixtures Operated Simultaneously","text":"I observed indications of a defect in the water supply by viewing the functional flow in two fixtures operated simultaneously.","sev":"moderate","choices":[]}]},{"name":"Irrigation","c":[{"id":"e2853ab","type":"defect","title":"Irrigation Not Operational","text":"","sev":"minor","choices":[]}]},{"name":"Sump Pump","c":[{"id":"f6f238e","type":"defect","title":"Sump Pump Not Operational","text":"","sev":"moderate","choices":[]},{"id":"212093d","type":"defect","title":"Sump Pump Crack Lid Not Secure","text":"","sev":"moderate","choices":[]},{"id":"746723a","type":"defect","title":"Discharges Next To Foundation","text":"","sev":"moderate","choices":[]},{"id":"3521a12","type":"defect","title":"Sump Pump Missing Check Valve","text":"","sev":"moderate","choices":[]},{"id":"088ff0f","type":"defect","title":"Sump Crock Not Properly Installed","text":"","sev":"moderate","choices":[]},{"id":"4e52827","type":"defect","title":"Sump Pump Discharges Into Sewer","text":"","sev":"moderate","choices":[]},{"id":"3b44967","type":"defect","title":"Sump Pump Not Tested","text":"The inspector could not reach the float to test the sump pump.  This is a limitation of the inspection.","sev":"minor","choices":[]},{"id":"a81b688","type":"info","title":"Battery Backup Present","text":"","sev":"minor","choices":[]},{"id":"8dd8c56","type":"limit","title":"Floor Covering Prevented Full Inspection","text":"LMT - Floor covering overtop of the sump pit prevented full inspection of the sump pump.  This is an inspection restriction.","sev":"minor","choices":[]}]},{"name":"Hose Bib","c":[{"id":"098e096","type":"defect","title":"Not Frost Free","text":"One or more hose bibs on the exterior of the home were not frost free.  Frost free hose bibs protect the outlet from freezing.  Unprotected devices will have to be winterized before cold weather to prevent freezing.  Replacement is recomended.","sev":"moderate","choices":[]},{"id":"75bbfbe","type":"defect","title":"Not Working","text":"The hose bib was not operational at the time of the inspection.  Repair may be necessary.","sev":"moderate","choices":[]},{"id":"83b693b","type":"defect","title":"Leaking","text":"","sev":"moderate","choices":[]},{"id":"bddd7b9","type":"defect","title":"Not Winterized","text":"The frost free hydrant was turned on with a hose attached at the time of the inspection.  This could lead to freezing and burst pipes if not corrected before cold weather.  Disconnect the hose and turn the hydrant off.","sev":"minor","choices":[]},{"id":"49bb514","type":"defect","title":"Handle Missing- Not Tested","text":"The handle to the hose bib was not present.  Not Tested.  Repair is necessary.","sev":"minor","choices":[]},{"id":"f2cd303","type":"limit","title":"Hose Bibs Not Inspected- Timers","text":"LMT - Timers on the hose bibs prevented a full inspection.","sev":"minor","choices":[]},{"id":"d384b8a","type":"defect","title":"Loose","text":"","sev":"minor","choices":[]}]},{"name":"Water Conditioning Systems","c":[{"id":"2a28b26","type":"info","title":"Whole House Sediment Filter Observed","text":"Inspection of this system lies beyond the home inspection.  Optimally placed near the point the water service line enters the house, the filter prevents particles suspended in the water from reaching downstream appliances and fixtures, where sediment can clog and damage everything from shower heads and faucets to boilers and water heaters.  replacing the Sediment Pre-Filter every 3 to 6 months. You can replace this filter sooner if you notice the water flow is slowing down or the water color becomes darker.","sev":"minor","choices":[]},{"id":"64548d8","type":"info","title":"Water Softener System","text":"Inspection of this system lies beyond the scope of the home inspection.","sev":"minor","choices":[]}]}]},{"name":"Electrical","subs":[{"name":"Service Drop","c":[{"id":"cf21238","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"facfa24","type":"info","title":"Inspected the Service Drop","text":"I inspected the electrical service drop.","sev":"minor","choices":[]},{"id":"5102a73","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]}]},{"name":"Overhead Service Conductors & Attachment Point","c":[{"id":"bcb4479","type":"defect","title":"In Contact w/Tree","text":"The overhead electrical line is in contact with the tree. Hazardous.","sev":"moderate","choices":[]},{"id":"fd9ed14","type":"defect","title":"Inadequate 3' Clearance","text":"I observed inadequate clearances between the electrical service conductors at a place from which someone could reach and fatally touch the electrical lines.\n\nThere must be at least 3 feet of clearance between the service conductors and an openable window, porch, balcony, or similar location.","sev":"moderate","choices":[]},{"id":"c1dc391","type":"info","title":"Inspected the Overhead Service Conductors & Attachment Point","text":"I inspected the electrical overhead service conductors and attachment point.","sev":"minor","choices":[]},{"id":"6a676bd","type":"defect","title":"Inadequate Clearance at Grade","text":"I observed inadequate vertical clearances between the electrical service conductors and the grade or ground surface. Defect.","sev":"moderate","choices":[]},{"id":"204f66a","type":"defect","title":"Inadequate Clearance at Roof","text":"I observed inadequate vertical clearances between the electrical service conductors and the roof surface. Defect.","sev":"moderate","choices":[]},{"id":"affa9f1","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"d606d33","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]}]},{"name":"Service Head, Gooseneck & Drip Loops","c":[{"id":"eac1ebc","type":"defect","title":"Drip Loop Deficiency","text":"I observed deficiencies at the electrical drip loop. Defect.","sev":"moderate","choices":[]},{"id":"b9e8d70","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"7a0825b","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"f934061","type":"info","title":"Inspected the Service Head, Gooseneck & Drip Loops","text":"I inspected the electrical service head, gooseneck and drip loops.","sev":"minor","choices":[]}]},{"name":"Service Mast, Service Conduit & Raceway","c":[{"id":"3d48e30","type":"defect","title":"Damage at Mast","text":"I observed indications of damage at the service mast. Hazardous.","sev":"moderate","choices":[]},{"id":"22b0416","type":"defect","title":"Inadequate Support at Conduit","text":"I observed indications of inadequate support at the electrical conduit.","sev":"moderate","choices":[]},{"id":"407361c","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"228e926","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"30a5104","type":"info","title":"Inspected the Service Mast, Service Conduit & Raceway","text":"I inspected the electrical service mast, service conduit and raceway.","sev":"minor","choices":[]}]},{"name":"Electric Meter & Base","c":[{"id":"070273d","type":"defect","title":"Meter Base Not Secure","text":"I observed indications that the electric meter base was loose at time of inspection. Recommend re-securing by a qualified contractor.","sev":"moderate","choices":[]},{"id":"2c85c96","type":"defect","title":"Conduit Not Sealed","text":"The conduit was not sealed at the point it entered the meter.  Water intrusion may cause damage.  Repair by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"08383b4","type":"defect","title":"Meter Missing","text":"I observed that the electric meter was missing. Inspection restriction. I was unable to perform a thorough inspection of the house.","sev":"moderate","choices":[]},{"id":"42b49f3","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"2e51963","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"f960439","type":"info","title":"Inspected the Electric Meter & Base","text":"I inspected the electrical electric meter and base.","sev":"minor","choices":[]},{"id":"e8eb6fa","type":"info","title":"Entrance Style","text":"","sev":"minor","choices":["Overhead","Underground"]},{"id":"2c73926","type":"info","title":"Service Voltage","text":"","sev":"minor","choices":["110","220"]}]},{"name":"GFCIs & Electrical","c":[{"id":"7876c2d","type":"info","title":"Inspected GFCIs","text":"I inspected ground-fault circuit interrupter receptacles and circuit breakers observed and deemed to be GFCIs using a GFCI tester, where possible.","sev":"minor","choices":[]},{"id":"798aeed","type":"limit","title":"Unable to Inspect Everything","text":"LMT - I was unable to inspect every electrical component or proper installation of the GFCI system according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the electrical system as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"3e752df","type":"defect","title":"Ungrounded Receptical","text":"The outlet was not grounded.  Grounding of electrical receptacles (which some laypeople refer to as outlets) is an important safety feature that has been required in new construction since 1962, as it minimizes the risk of electric shock and protects electrical equipment from damage. Modern, grounded 120-volt receptacles in the United States have a small, round ground slot centered below two vertical hot and neutral slots, and it provides an alternate path for electricity that may stray from an appliance. Older homes often have ungrounded, two-slot receptacles that are outdated and potentially dangerous.\n\nWhile homeowners may be made aware of the limitations of ungrounded electrical receptacles, upgrades are not necessarily required. Many small electrical appliances, such as alarm clocks and coffee makers, are two-pronged and are thus unaffected by a lack of grounding in the building\u2019s electrical system.\n\nUpgrading the system will bring it closer to modern safety standards, however, and this may be accomplished in the following ways:\n\n\u2022 Install three-slot receptacles and wire them so that they\u2019re correctly grounded.\n\n\u2022 Install ground-fault circuit interrupters (GFCIs). These can be installed upstream or at the receptacle itself. GFCIs are an accepted replacement because they will protect against electric shocks even in the absence of grounding, but they may not protect the powered appliance. Also, GFCI-protected ungrounded receptacles may not work effectively with surge protectors. Ungrounded GFCI-protected receptacles should be identified with labels that come with the new receptacles that state:  \u201cNo Equipment Ground.\u201d\n\n\u2022 Replace three-slot receptacles with two-slot receptacles. Two-slot receptacles correctly represent that the system is ungrounded, lessening the chance that they will be used improperly.","sev":"moderate","choices":[]},{"id":"12d4c98","type":"limit","title":"Unable to Test GFCI","text":"LMT - I was unable to test the GFCI at the exterior. Inspection restriction.","sev":"minor","choices":[]},{"id":"a2f8e67","type":"defect","title":"No Power Detected On GFCI Outlet","text":"The outlet did not have power at the time of the inspection.  This may be due to a loose wire connection, which could cause arcing and a fire or injury.  Recommend evaluation and repair of the outlet by a licensed electrician is recomended.","sev":"moderate","choices":[]},{"id":"5c41fa8","type":"defect","title":"Hot and Neutral Wires Reversed","text":"The inspectors tester shows the hot and neutral wires were reversed on this outlet.  This can cause injury as the hot current will now enter any device plugged into this outlet on the neutral circuit.  This could electrify parts of the device even when the device is off.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"f944639","type":"defect","title":"Missing In Service Receptical Cover","text":"In-service covers are the current standard for exterior outlets.  They help prevent moisture from shorting out plugs when in use by providing a protective cover over the outlet even while plugged in.  Replacement of all covers which do not meet this current standard is recommended.","sev":"minor","choices":[]},{"id":"0c94f23","type":"defect","title":"Missing GFCI","text":"GFCI (Ground Fault Circuit Interrupter) receptacles are crucial for electrical safety in areas prone to moisture or where electrical outlets are exposed to water. Here are key locations where GFCI receptacles should be installed:\n\n\u2022 Kitchens: All countertop receptacles should have GFCI protection to guard against electrical shock from spilled liquids or splashes.\n\n\u2022 Bathrooms: All receptacles in bathrooms need GFCI protection due to the high humidity and potential for water contact.\n\n\u2022 Basements: Receptacles in unfinished basements should be GFCI-protected, as these areas can be damp and prone to moisture.\n\n\u2022 Garages: All receptacles in garages require GFCI protection for the same reasons as basements.\n\n\u2022 Outdoor Areas: Exterior receptacles, including those on patios, decks, and around the house, must have GFCI protection to protect against moisture and outdoor conditions.\n\n\u2022 Crawl Spaces: Receptacles in crawl spaces should also be GFCI-protected, as these areas can be damp.\n\n\u2022 Laundry Rooms: GFCI protection is recommended for receptacles near washing machines or sinks.\n\n\u2022 Wet Bars: Receptacles in areas with wet bars should be GFCI-protected to prevent electrical hazards.\n\nGFCI receptacles help prevent electrical shock by quickly cutting off the power if a ground fault is detected, making them essential in any area where water and electricity could potentially mix.","sev":"moderate","choices":[]},{"id":"442cd30","type":"defect","title":"False Ground","text":"The electrical tester detected a false ground on one or more outlets.  This could be an indication of improper working practices and should be evaluated by a licensed electrician.","sev":"major","choices":[]},{"id":"f048454","type":"defect","title":"Improper Installation of GFCI","text":"I observed indications of improper installation at the GFCI device.","sev":"moderate","choices":[]},{"id":"e9148bc","type":"defect","title":"Hot and Ground Wires Reversed","text":"The inspectors tester shows the hot and ground wires were reversed on this outlet.  This can cause injury as the outlet and bonding circuit could be electrified.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"c074cc4","type":"defect","title":"Fixture Not Sealed Properly","text":"The lack of a sealant and mounting block allows water to get behind the fixture.  Possible electrical hazard.  Caulk the fixture and install a J-block to prevent water from getting behind the fixture.","sev":"minor","choices":[]},{"id":"f36c18c","type":"defect","title":"Electrical Defect","text":"I observed indications of an electrical defect at the exterior.","sev":"moderate","choices":[]},{"id":"7426571","type":"defect","title":"GFCI Defect","text":"I observed indications of a defect at a GFCI.","sev":"moderate","choices":[]},{"id":"ee594ed","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.","sev":"moderate","choices":[]},{"id":"66fc18b","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"bef5390","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"ab5717e","type":"defect","title":"Missing Receptacle","text":"I observed indications that there was a missing electrical receptacle outlet at the house exterior. At a minimum, there should be at least one receptacle in the front and back of the house.","sev":"moderate","choices":[]},{"id":"850aa1f","type":"defect","title":"Outlets Were Not Present On The Exterior Of The Home","text":"The National Electric Code (NEC) now requires a minimum of two exterior receptacles for a home, located at the front and back and usually on the wall of the house, and they must be GFCI-protected for shock prevention and have an in-use or weatherproof cover. The required receptacles cannot be higher than six foot six inches (6\u2019-6\u201d).","sev":"minor","choices":[]},{"id":"89469a1","type":"defect","title":"Weatherproofing Seal Around Outlet Cover Missing","text":"The seal prevents moisture from damaging or coming in contact with the electrical circuit.  Seal gaps with an approved gasketing material.","sev":"minor","choices":[]},{"id":"c2fc90b","type":"defect","title":"Bulb Is Flickering","text":"The flickering is related to loose wiring.  Ensure the wires are securely connected with a proper connector.  If the bulb is still flickering, have repaired by a qualified electrician.  A flickering bulb may indicate potential loose wiring.","sev":"minor","choices":[]}]},{"name":"Service-Entrance Conductors","c":[{"id":"d62be20","type":"defect","title":"Sheath Defect at Service-Entrance Conductors","text":"I observed indications of deficiencies in the integrity of the service-entrance conductors exterior protective sheath. Electrical hazard. Could potentially allow water to penetrate the line.","sev":"moderate","choices":[]},{"id":"b502e34","type":"defect","title":"Trees in contact","text":"","sev":"moderate","choices":[]},{"id":"e562b8e","type":"defect","title":"Flashing Defect","text":"The rubber flashing on the electrical entrance mast is damaged and may be leaking.  Possible hidden damage.   Replacement is recommended .  Check here for some options.","sev":"major","choices":[]},{"id":"f226171","type":"defect","title":"Minor Rust Observed On Meter Box","text":"Rust could be an indication that components inside the box are damaged.  Possible hidden damage.  Further evaluation by a licensed electrician recommended.","sev":"major","choices":[]},{"id":"90d2beb","type":"defect","title":"Conduit Not Installed","text":"The inspector recommends conduit be installed on the entrance wire as it is susceptible to damage.  This is a safety hazard.  Repair by a licensed electrician is recomended.","sev":"moderate","choices":[]},{"id":"d806fa9","type":"info","title":"Inspected Service-Entrance Conductors","text":"I inspected the electrical service-entrance conductors.","sev":"minor","choices":[]},{"id":"2751ccc","type":"defect","title":"Close To Roof","text":"","sev":"moderate","choices":[]},{"id":"a2f7146","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"366f31c","type":"info","title":"Service Entrance Style","text":"","sev":"minor","choices":["Overhead","Underground"]},{"id":"4ca74e6","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"5ba10cc","type":"defect","title":"Weatherhead Damaged","text":"","sev":"moderate","choices":[]}]},{"name":"Main Service Disconnect","c":[{"id":"c53cae5","type":"limit","title":"Disconnect Rating Not Labeled","text":"LMT - The main service disconnect's amperage rating was not labeled. I was unable to identify the rating.","sev":"minor","choices":[]},{"id":"c929be3","type":"defect","title":"Missing Screws On Service Panel","text":"","sev":"minor","choices":[]},{"id":"6366969","type":"info","title":"Homeowner's Responsibility","text":"It's your job to know where the main electrical panel is located, including the main service disconnect that turns everything off.\n\nBe sure to test your GFCIs, AFCIs, and smoke detectors regularly. You can replace light bulbs, but more than that, you ought to hire an electrician. Electrical work is hazardous and mistakes can be fatal. Hire a professional whenever there's an electrical problem in your house.","sev":"minor","choices":[]},{"id":"84705dc","type":"info","title":"Inspected Main Service Disconnect","text":"I inspected the electrical main service disconnect.","sev":"minor","choices":[]},{"id":"d481398","type":"defect","title":"Missing Knockouts","text":"The breaker box is missing knockouts.  These can be replaced inexpensively using plastic knockout covers available at hardware stores and home centers. They are brand specific so make sure you have the bran with you when purchasing.","sev":"minor","choices":[]},{"id":"e28eadb","type":"defect","title":"ITE Pushmatic","text":"There are safety warnings but conflicting opinions among inspectors and electricians about these electrical panels under either the Pushmatic\u2122 or Bulldog\u2122 brand names. It is apparent that Pushmatic\u2122 or Bulldog\u2122 brand circuit breakers, use a less reliable trip mechanism (no internal magnetic trip) than that offered by modern equipment. On this basis and pending further research we consider these products questionable with conflicting opinions that currently deserve a warning but not a condemnation.  For more information click here.","sev":"moderate","choices":[]},{"id":"4e776de","type":"info","title":"Main Disconnect Rating, If Labeled","text":"I observed indications of the main service disconnect's amperage rating. It was labeled.","sev":"minor","choices":["100","150","200","Other","Not Labeled"]},{"id":"1cc3654","type":"defect","title":"Damage to Main Disconnect","text":"I observed indications of major damage at the main electrical disconnect.","sev":"moderate","choices":[]},{"id":"7e75aac","type":"info","title":"Service Disconnect Brand","text":"","sev":"minor","choices":["Eaton","Murray","Square D","Cutler Hammer","Pushmatic","Siemens","General Electric","Stablok","Crouse-Hinds","Bryant","Unknown","Westinghouse","Challenger"]},{"id":"7041fb8","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"bf68709","type":"defect","title":"Ground Wire Modified","text":"strands on the ground wire were cut to allow the wire to fit into the lug.  This should be evaluated by a licensed electrician to determine if it is a safety issue.","sev":"minor","choices":[]},{"id":"d142020","type":"defect","title":"Double Tap","text":"","sev":"moderate","choices":[]},{"id":"91064d2","type":"defect","title":"Breakers","text":"","sev":"moderate","choices":[]},{"id":"cea36ac","type":"defect","title":"Aluminum Wiring Used At Unapproved Terminal","text":"","sev":"moderate","choices":[]},{"id":"96c8c8b","type":"defect","title":"Main Disconnect Missing","text":"I was unable to find a main electrical disconnect.","sev":"moderate","choices":[]},{"id":"792b565","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"74a903f","type":"defect","title":"Stablok Panel Observed","text":"","sev":"major","choices":[]},{"id":"2454232","type":"limit","title":"Personal Belongings","text":"LMT - Personal belonging blocked the inspectors access to the electrical panel.  The panel was not inspected.","sev":"minor","choices":[]},{"id":"39d57f8","type":"limit","title":"Lack Of Access","text":"LMT - The service disconnect should be free of obstructions within three feet in front of the box.  The panel cover was not removed.","sev":"minor","choices":[]},{"id":"3f26c9a","type":"defect","title":"Working Space","text":"","sev":"major","choices":[]},{"id":"8db05b2","type":"defect","title":"Panel Showed Signs Of Rust","text":"","sev":"major","choices":[]}]},{"name":"Electrical Wiring","c":[{"id":"f2bd8d7","type":"defect","title":"Missing Junction Box Cover","text":"Junction boxes should be covered to prevent electrical shock.  Installation of approved cover devices on all open junction boxes is recomended.","sev":"moderate","choices":[]},{"id":"a7371bf","type":"limit","title":"Unable to Inspect All of the Wiring","text":"LMT - I was unable to inspect all of the electrical wiring. Obviously, most of the wiring is hidden from view within walls. Beyond the scope of a visual home inspection.","sev":"minor","choices":[]},{"id":"1ac48e1","type":"defect","title":"Improper Wire Splice","text":"","sev":"moderate","choices":[]},{"id":"9f14faf","type":"defect","title":"Exposed Live Electrical Wires","text":"I observed exposed live electrical wires. Hazardous condition.","sev":"moderate","choices":[]},{"id":"c78346c","type":"defect","title":"Solid Conductor Aluminum Branch-Circuit Wiring","text":"I observed indications of solid conductor aluminum branch-circuit wiring. Modern solid aluminum wiring, when used correctly and installed to current standards, is not inherently \u201cbad,\u201d but it is not as ideal as copper wiring for most residential applications.  It does have limitations and risks that should be considered:\n\nPros of Modern Aluminum Wiring:\n\n    1.    Cost-Effective: Aluminum is less expensive than copper, making it a popular choice for high-load applications like service entrance cables and larger circuits.\n\n    2.    Lighter Weight: It is easier to handle and install in larger-gauge wiring compared to copper.\n\nCons and Potential Issues:\n\n    1.    Higher Expansion and Contraction: Aluminum expands and contracts more than copper when heated, which can lead to loosening connections over time.\n\n    2.    Oxidation: Aluminum oxidizes when exposed to air, creating a layer that can increase electrical resistance and generate heat at connections if not properly managed.\n\n    3.    Brittleness: Aluminum is more prone to damage or breakage during installation or bending than copper.\n\nModern Standards and Safety:\n\nModern aluminum wiring is manufactured and installed differently than older aluminum wiring (used in homes in the 1960s-70s), which had significant safety issues. Today\u2019s aluminum wiring is often alloyed with other materials to improve performance and is used mainly for larger circuits, such as service entrances and feeder cables. However, it is not commonly used for standard branch circuits.\n\nSafety Considerations:\n\n    \u2022    Aluminum wiring must be installed using connectors and devices specifically rated for aluminum to avoid issues like overheating.\n\n    \u2022    Connections should be checked periodically to ensure they remain tight and secure.\n\n    \u2022    A certified electrician should handle installation and maintenance of aluminum wiring to ensure compliance with local codes and safety standards.\n\nIt is recommended that the electrical system be evaluated by a licensed electrician.\n\nTalk with you insurance agent about whether the presence of aluminum wiring in your home is a hazard, a defect, and a problem that requires changes to their policy language.\n\nFor further information on aluminum wiring contact the U.S. Consumer Product Safety Commission via the Internet at http://www.cpsc.gov.\n\nFor more details, visit InterNACHI's Free Inspection Library.","sev":"moderate","choices":[]},{"id":"c71da81","type":"defect","title":"Improper Wiring","text":"I observed indications of improper wiring. Electrical hazard.","sev":"moderate","choices":[]},{"id":"e712067","type":"defect","title":"Overhead Service Wires To Gambrel Barn Not Sized Properly","text":"It is possible the overhead wires feeding the gambrel barn are too small for the distance ran overhead.  The sizing of wires lies outside the inspectors inspection.  A licensed electrician should be consulted to determine proper wiring practices.","sev":"major","choices":[]},{"id":"d329696","type":"info","title":"Type of Wiring, If Visible","text":"","sev":"minor","choices":["NM-B (Romex)","Old Ungrounded Wiring","Aluminum Solid","Knob & Tube","Conduit","Cloth Insulated Wiring","Aluminum Aloy","Aluminum Stranded","Tinned Copper"]},{"id":"25674c8","type":"defect","title":"Missing Conduit","text":"Conduit should extend to at least 18\" below grade.  The exposed wire could become damaged and cause injury.  This is a safety issue.  Correction by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"57f569f","type":"defect","title":"Electrical Componets Painted","text":"","sev":"moderate","choices":[]},{"id":"9954bb8","type":"defect","title":"Arcing or Excessive Heat","text":"I observed indications of arcing or excessive heat. Hazard.","sev":"moderate","choices":[]},{"id":"6d6a8cc","type":"info","title":"Entrance Wire Type","text":"","sev":"minor","choices":["Cooper","Aluminumn","Copper","Unknown"]},{"id":"0d994fe","type":"info","title":"Distribution Wire Type","text":"","sev":"minor","choices":["Copper","Aluminum","Unknown","Tinned coated copper"]},{"id":"6558ba0","type":"defect","title":"Improper Breaker Tie","text":"I observed an improper installation of a breaker tie.","sev":"moderate","choices":[]},{"id":"d9e1424","type":"defect","title":"Damage to Wires Observed","text":"I observed damage to a wire(s). Electrical hazard.","sev":"moderate","choices":[]},{"id":"0cb6961","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"b6160cc","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"18ae5c7","type":"defect","title":"CSST","text":"","sev":"minor","choices":[]}]},{"name":"Panelboards & Breakers","c":[{"id":"7d9e2c0","type":"limit","title":"Inadequate Workspace at Panelboard","text":"LMT - I observed inadequate workspace at the panelboard.\n\nA clear working space for accessing all of the electrical equipment is needed. A clear space that is 3 feet deep, 30 inches wide, and 6' 6\" in height should be provided in front of the equipment.","sev":"minor","choices":[]},{"id":"78ce2b0","type":"defect","title":"Grounded Conductor (Neutral, White Wire) Double Tapped","text":"I observed indications of a grounded conductor (neutral, white-color) wire that was double tapped or under the same lug as another wire.  This can cause the wires to become loose and arc causing a fire or injury.  Repair by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"bab8278","type":"limit","title":"Unable to Inspect the Panelboards and Breakers Closely","text":"LMT - I was restricted in my visual-only inspection in that I did not inspect closely all of the panelboards, components, connections, and breakers. I am not an electrician, but I will inspect the electrical system according to the Home Inspection Standards of Practice as best as I can during the inspection.","sev":"minor","choices":[]},{"id":"6205354","type":"limit","title":"Breaker(s) in Off Position","text":"LMT - I observed a breaker in the \"off\" position prior to inspecting the electrical panel. Recommend asking the homeowner what this breaker is connected to, and why it is off.","sev":"minor","choices":[]},{"id":"505dece","type":"defect","title":"Missing Identification of Disconnects at Panel","text":"I observed missing/inadequate identification of each circuit.\n\nEach circuit must be clearly identified as to its purpose. No two circuits should be labeled the same.","sev":"moderate","choices":[]},{"id":"f851034","type":"defect","title":"Service Panel- Grounds/ Neutrals Not Separated","text":"The inspector noted that the grounding and neutral conductors within the subpanel are not properly isolated from each other, as required by electrical standards.  Isolating grounds and neutrals in a subpanel is essential to prevent unintended current flow on grounding paths, which can create safety hazards such as electric shock, equipment malfunction, or fire risks. It also helps ensure that the electrical system operates efficiently and complies with code requirements.\n\nRecommendation\n\nThe inspector recommends a licensed electrical contractor separate the grounds and neutrals and evaluate the box to ensure it will meet current code requirements.","sev":"moderate","choices":[]},{"id":"bed75e8","type":"defect","title":"Doubled Hot Conductors","text":"I observed doubled hot conductor wires connected to the same single breaker disconnect. Each breaker should have just one conductor wire connected to it.\n\nCorrective Action\n\nThe inspector recommends a licensed electrician repair the panel.","sev":"moderate","choices":[]},{"id":"8b9322a","type":"defect","title":"Rust, Corrosion, Water Inside Cabinet","text":"I observed indications of water intrusion, rust and corrosion inside the electrical panel cabinet.  Visible indications of water damage could mean the inaccessible parts, such as the inner workings of the breakers, could be damaged also. Hazard. Further evaluation by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"0ed0205","type":"defect","title":"Open Knockout (Filler Missing)","text":"I observed unused circuit-breaker panel opening that was not filled. Missing filler plate at the electrical panel cover. Hazardous. Fatal if someone sticks their finger through the opening and touches a live electrical component.","sev":"moderate","choices":[]},{"id":"30aebd3","type":"defect","title":"Inadequate Illumination at Panel","text":"I observed indications of inadequate illumination at the electrical panel area making access and use of the panel difficult.","sev":"minor","choices":[]},{"id":"dcaa3e5","type":"info","title":"Inspected Main Panelboard & Breakers","text":"I inspected the electrical panelboards and over-current protection devices (circuit breakers and fuses).","sev":"minor","choices":[]},{"id":"97f4085","type":"defect","title":"Doubled Tapped","text":"I observed doubled wires connected under the same single lug.  This can allow he wires to become loose and arc.  Correction by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"126c98a","type":"info","title":"Inspected Subpanel & Breakers","text":"I inspected the electrical subpanel and over-current protection devices (circuit breakers and fuses).","sev":"minor","choices":[]},{"id":"72d509b","type":"defect","title":"Wire not marked correctly","text":"The white wire connected to the breaker should be marked with red or black tape to indicate it is being used as a hot or live conductor.  This can be accomplished by coloring the wire back for a couple inches near the end of the wire or wrapping black tape around the wire.  Because this work is being performed in a disconnect box the work should be performed by a licensed electrician.","sev":"moderate","choices":[]},{"id":"e116cb4","type":"defect","title":"Inadequate Work Space at Panel","text":"I observed inadequate workspace at the electrical panel. Inspection restriction. This makes accessing the electrical panel disconnects and components difficult.\n\nA clear working space must be provided and maintained for safe access. At least 3 feet deep clear space should be in front of the equipment, 30 inches wide, and 6 feet 6 inches of headroom.","sev":"minor","choices":[]},{"id":"6ce0c66","type":"defect","title":"Incorrect Type of Screws at Panel Cover","text":"I observed the use of incorrect types of screws / fasteners at the electrical panel cover. This could be potentially hazardous if the screws puncture a live electrical wire.","sev":"moderate","choices":[]},{"id":"4f8bb13","type":"defect","title":"Debris inside panel","text":"","sev":"moderate","choices":[]},{"id":"daa02e0","type":"defect","title":"Knockouts Missing","text":"\"Knockouts\" are missing on the electric panel. This poses a safety hazard and it is recommended that the opening in the panel caused by the missing knockout(s) be properly sealed by a licensed electrician.","sev":"minor","choices":[]},{"id":"e69d76e","type":"defect","title":"Fuse Box Observed","text":"Fuse boxes do not meet current standards and should be evaluated by a licensed electrician.  An upgrade to a breaker style disconnect box is recommended but not required.","sev":"minor","choices":[]},{"id":"f03f5ad","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"97aab86","type":"defect","title":"Foreign Object / Contamination Inside Panel","text":"I observed indications of foreign objects and contamination inside the electrical panel.","sev":"moderate","choices":[]},{"id":"fd48c35","type":"defect","title":"Subpanel Not Supplied with 4 Conductors","text":"I observed that the subpanel was not supplied with 4 conductors.\n\nSubpanels must be supplied with 4 conductors with the grounds and neutrals being isolated at the subpanel.","sev":"moderate","choices":[]},{"id":"b5e1bdf","type":"defect","title":"Two Neutrals Under Lug","text":"I observed indications at the panelboard that there is more than one neutral conductor under a terminal.","sev":"moderate","choices":[]},{"id":"aa19a6e","type":"defect","title":"Wrong Brand Breaker Used","text":"Manufacturers require brand specific breakers be used in their box.  While breakers often seem to fit other brand boxes they may not properly fit and could cause damage to the equipment.  Replacement of the breakers by a licensed electrician is recommended.","sev":"major","choices":[]},{"id":"be12666","type":"defect","title":"Open Breaker Knockout (Filler Plate Missing)","text":"I observed unused circuit-breaker panel opening that was not filled. Missing filler plate at the electrical panel cover. Hazardous. Fatal if someone sticks their finger through the opening and touches a live electrical component.","sev":"moderate","choices":[]},{"id":"39d3a16","type":"defect","title":"Cable Connector Defect","text":"I observed a defect at the electrical cable connector at the panelboard.","sev":"moderate","choices":[]},{"id":"c428c79","type":"defect","title":"Damage to Panel Cover","text":"I observed damage and a defect at the electrical panel cover.","sev":"moderate","choices":[]},{"id":"9240914","type":"defect","title":"Breaker is Too High from the Floor","text":"I observed that the breaker is too high from the floor. Making this very difficult to access and disconnect if needed. Potentially hazardous. No electrical disconnect or fuse, including the main breaker, should be higher than 6 feet 7 inches from the floor.","sev":"moderate","choices":[]},{"id":"63ff579","type":"defect","title":"Arcing or Excessive Heat","text":"I observed indications of arcing or excessive heat. Hazard.","sev":"moderate","choices":[]},{"id":"a64de60","type":"defect","title":"Ampacity / Overfusing Problem","text":"I observed indications of an ampacity problem, where there was a large-sized breaker connected to small-gauge wire. Hazard.","sev":"moderate","choices":[]},{"id":"7c371ab","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"7a44f28","type":"defect","title":"Breaker Incorrectly Wired","text":"Circuit breaker was incorrectly wired / installed.  This indicates that work was probably not performed by a licensed electrician and poses a safety hazard. Recommend that a licensed electrician check the entire panel and repair and replace as need.","sev":"major","choices":[]},{"id":"8f2ca30","type":"defect","title":"Panel Damaged","text":"","sev":"moderate","choices":[]},{"id":"fc45d97","type":"defect","title":"Defect at Entrance Conducts and Lugs","text":"I observed indications of a defect at the entrance conductors and lug nuts at the electrical panel.","sev":"moderate","choices":[]},{"id":"54019d2","type":"defect","title":"Defect at Clamp, Connector, Bushing","text":"I observed indications of a defect at the clamp, connector, and bushing component at the electrical panel.","sev":"moderate","choices":[]},{"id":"a58f4eb","type":"defect","title":"Doorbell Transformer Inside Cabinet","text":"I observed that the doorbell transformer was installed within the cabinet, which is not permitted.","sev":"moderate","choices":[]},{"id":"28d7bc6","type":"defect","title":"Melted Wire","text":"I observed indications of a melted wire, which is a sign of overheating or a hazardous condition.","sev":"moderate","choices":[]},{"id":"45c5f3c","type":"defect","title":"Cabinet Loosely Secured To Wall","text":"I observed indications that the electrical panel cabinet may not be secured to the wall properly.","sev":"moderate","choices":[]},{"id":"ee91f3d","type":"defect","title":"Panelboard In Closet Defect","text":"I observed that the electrical panelboard was located inside a clothes closet.\n\nThis is a defect and not permitted by standards. (NEC 240.24(D)).","sev":"moderate","choices":[]},{"id":"9084540","type":"defect","title":"Zinsco Panel","text":"I observed indications that the panelboard was manufactured by Zinsco. These panels have a reputation for being problematic and further evaluation by a qualified electrician is recommended. Zinsco panels can generally be identified by a blue and silver \"Zinsco\" label inside the panel, an embossed \"Magnetrip\" label at the top of the panel face, and the colorful breakers.\n\n\u2022 There may be components of the panel that contain aluminum.\n\n\u2022 The connection between the breakers and the bus bar may be defective.\n\n\u2022 The bus bar may be corroded.\n\n\u2022 Breakers may be turned off, but the circuit could still be live.\n\nThe obsolete and unreliable Zinsco panel should be further evaluated and replaced by a licensed electrician.","sev":"moderate","choices":[]},{"id":"dd7b4d9","type":"defect","title":"FPE Federal Pacific Panel","text":"I observed indications that the electrical panelboard is a Federal Pacific Electric FPE panel. This panel is dangerous and should be further evaluated and replaced by a licensed electrician.\n\nFPE panel breakers are known to fail to trip at a much higher rate than standard panels. When a breaker fails to trip, the breaker and other components, including wires, may overheat and melt. The panel itself could overheat and catch fire.","sev":"moderate","choices":[]},{"id":"2f8a291","type":"defect","title":"Improper Breaker Observed- Square D","text":"A Square D QO style breaker was observed in a Square D Homeline box.  These components are not designed to work together and could cause injury, arcing, or another dangerous situation.  Correction by a licensed electrician is recommended.","sev":"major","choices":[]},{"id":"034fe20","type":"info","title":"Subpanel Brand and Amperage Rating","text":"","sev":"minor","choices":["Siemens","200 A","General Electric","Cutler Hammer","Westinghouse","Eaton","100A","Square D- QO","Square D- Homeline","Gould"]},{"id":"402730a","type":"defect","title":"Ground wires improperly installed","text":"The ground wires were observed to be improperly installed in the breaker box.  A lug was missing and multiple wires were installed under a single lug which was not properly tightened.  Repair by a licensed electrician is recommended.","sev":"major","choices":[]}]},{"name":"Service Grounding & Bonding","c":[{"id":"b75da3f","type":"defect","title":"Inadequate Ground","text":"I observed indications that the grounding electrode conductor to the water pipe was corroded and should be checked by a licensed electrician.  A simple solution of vinger, salt and water.","sev":"moderate","choices":[]},{"id":"b166599","type":"limit","title":"Unable to Confirm Proper Grounding and Bonding","text":"LMT - I was unable to confirm proper installation of the system grounding and bonding according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the grounding and bonding as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"73ac84d","type":"defect","title":"Unable to Confirm Presence of Grounded Conductor","text":"I was unable to confirm by observation the presence of a grounded conductor.","sev":"moderate","choices":[]},{"id":"70e0af4","type":"defect","title":"Defect at Rod Connector","text":"I observed indications that the connection to the grounding rod is not made with a proper listed connection and connector.","sev":"moderate","choices":[]},{"id":"9c6e39b","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"031455c","type":"defect","title":"Ground Rod Not Flush","text":"I observed indications that the grounding rod is not flush with or below grade level.","sev":"moderate","choices":[]},{"id":"cca5038","type":"defect","title":"Missing GEC Grounding Electrode Conductor","text":"I observed indications of a missing the GEC grounding electrode conductor.","sev":"moderate","choices":[]},{"id":"103813a","type":"defect","title":"No Ground Wire","text":"I was unable to confirm a grounding electrode conductor and rod system.","sev":"moderate","choices":[]},{"id":"18cbec1","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"3e0e281","type":"info","title":"Inspected the Service Grounding & Bonding","text":"I inspected the electrical service grounding and bonding.","sev":"minor","choices":[]}]},{"name":"Electrical Defects","c":[{"id":"cd33a79","type":"defect","title":"Receptacle/ Switch Covers Missing","text":"During the inspection of the interior and exterior electrical system, the inspector observed electric receptacles missing protective cover plates. These exposed outlets were located in areas accessible to occupants and potentially subject to moisture or physical contact.\n\nRecommendation\n\nIt is recommended that a licensed electrician or qualified contractor install appropriate cover plates on all exposed receptacles. This will help ensure safety, code compliance, and protection of the electrical system throughout the home.","sev":"minor","choices":[]},{"id":"189d3f9","type":"defect","title":"Receptical Box Loose","text":"A loose receptacle box can cause wires to loosen overtime.  The inspector noted the wire coating leading to this box was damaged, this can create a short in the wire. This could be a fire hazard.  Repair by a licensed electrician is recommended.","sev":"major","choices":[]},{"id":"18b6bea","type":"defect","title":"Switch Defect","text":"","sev":"minor","choices":[]},{"id":"152e587","type":"defect","title":"Junction Box Cover Missing","text":"Junction box covers prevent injury or damage to the wire splice.  The inspector recommen

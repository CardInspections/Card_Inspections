,"title":"Floor Surface is Not Sloped","text":"I observed indications that the carport floor surface is not sloped properly. The area of floor used for parking of automobiles or other vehicles must be sloped. The sloped surface will help the movement of liquids to a drain or toward the main vehicle doorway of the carport.","sev":"minor","choices":[]},{"id":"c9799f0","type":"defect","title":"Structural Defect at Carport","text":"I observed indications of a structural defect at the carport.","sev":"moderate","choices":[]}]},{"name":"Firewall at Carport","c":[{"id":"5f14db1","type":"defect","title":"Firewall Breach at Carport","text":"I observed a firewall breach at the carport, where the wall shared between the house and the carport has an opening through which fire can travel. Potential fire hazard.","sev":"moderate","choices":[]}]},{"name":"Structural at Carport","c":[{"id":"a716a2f","type":"defect","title":"Structural Defect","text":"I observed a major structural defect at the carport.","sev":"moderate","choices":[]},{"id":"ed5321d","type":"info","title":"Inspected Structure","text":"I inspected the structure of the carport according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]}]},{"name":"Electrical at Carport","c":[{"id":"ffdbed8","type":"defect","title":"Electrical Defect at Carport","text":"I observed an electrical defect at the carport.","sev":"moderate","choices":[]},{"id":"b2f1310","type":"info","title":"Inspected Electrical at Carport","text":"I inspected the electrical system/components of the carport according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"c528f30","type":"defect","title":"Missing GFCI Protection","text":"I observed missing GFCI protection at the carport.","sev":"moderate","choices":[]}]}]},{"name":"Basement, Foundation, Crawlspace & Structure","subs":[{"name":"Basement","c":[{"id":"1f1601f","type":"limit","title":"Personal Storage Restriction","text":"LMT - Personal items limited my visual inspection. Moving personal items and storage is not required by the Standards of Practice. I could not see everything. Many things were blocking my inspection.","sev":"minor","choices":[]},{"id":"d94cd3c","type":"defect","title":"Active Water Penetration Observed- Staining","text":"I observed indications of active water penetration into the house, staining on the floor.\n\nCorrection and further evaluation by a basement waterproofing specialist is recommended.","sev":"moderate","choices":[]},{"id":"89c6fa5","type":"info","title":"Homeowner's Responsibility","text":"One of the most common problems in a house is a wet basement or foundation. You should monitor the walls and floors for signs of water penetration, such as dampness, water stains, peeling paint, efflorescence, and rust on exposed metal parts. In a finished basement, look for rotted or warped wood paneling and doors, loose floor tiles, and mildew stains. It may come through the walls or cracks in the floor, or from backed-up floor drains, leaky plumbing lines, or a clogged air-conditioner condensate line.","sev":"minor","choices":[]},{"id":"e527c91","type":"info","title":"Type of Basement Foundation Described","text":"","sev":"minor","choices":["Concrete","Masonry Block","Brick","Stone","Rock","Other","Concrete Masonry Unit (CMU)","Wood Framed"]},{"id":"2a466c7","type":"defect","title":"Efflorescence Observed","text":"I observed efflorescence.\n\nEfflorescence is the white chalky powder that you might find on the surface of a concrete or brick wall. It can be a cosmetic issue, or it can be an indication of moisture intrusion that could lead to major structural and indoor air quality issues.\n\nI noted the presence of efflorescence in the inspection report because it generally occurs where there is excess moisture, a condition that also encourages the growth of mold.","sev":"moderate","choices":[]},{"id":"622e9bc","type":"limit","title":"Basement Finished","text":"LMT - The basement was finished. This was an inspection restriction, because the finished floor, walls, and ceiling blocked my visual inspection of the basement, its systems and components.","sev":"minor","choices":[]},{"id":"a293733","type":"defect","title":"Temporary Post","text":"There are two types of steel support posts: single-piece and multiple-piece (aka telescopic) columns. Using the improper type of support posts, or installing the proper type of post improperly, can lead to future failure of the structure. Support posts help distribute and carry weight load from one area to another; in most cases, this would be transferring the weight of the home (it's structure, occupants, the occupants' belongings, etc.) to the basement floor. These posts normally are connected to a wood or steel I-beam; the ends of the wood or steel I-beam bear upon the foundation walls.\n\nTemporary Post\n\nPermanent Post\n\nGenerally, only single-piece posts are approved for permanent use. This type of post is steel and hollow. It must be at least 3\" diameter and should have an ICC or BOCA (reference of building codes) sticker on it. This sticker shows that the post has been evaluated and certified by a third party testing firm to meet specific design criteria. The sticker is sometimes removed upon the post's installation. A permanent-rated post will normally have a screwed adjustable end and a flat steel plate (flange) end. The single-piece post may be installed in either orientation (adjustable end up or down). The bottom end should be cemented or properly bolted into the basement floor and the other end is generally bolted to the steel or wooden beam supporting the home. The International Code Council (ICC) requires that an engineer, architect, or builder be able to prove that the structural posts in a home are sufficient in load carrying capability and that a sufficient number of them are installed in the proper location(s).\n\nThe multiple-piece posts are almost always smaller than 3\" in diameter and are only temporary-rated posts. These go by various names including 'jack posts' and 'lally columns'. These types of posts are only to be used for temporary uses such as jacking up a home slowly over a period of time; when the jacking (slow lifting of the home) is done, a permanent column(s) should be installed in the proper location(s), and the temporary posts removed. Although, in many cases, based upon over a decade inspecting homes, these temporary posts are, sometimes, the only type installed and left in place.\n\nThe issue with temporary-rated support posts is that they are often rated for much less weight load than a permanent-rated post. The weight that a home exerts can allow a temporary-rated post to bend, bow, or break over time. The top plate (flange) should also not be bowed or dished; rather, it should remain straight. Also, don't assume that just because the post is not visually damaged at this point, that it is necessarily safe to leave in place without repair. Homes get used to the weight distribution of the occupants' belongings\n\nFurther evaluation by a licensed contractor or structural engineer is recommended.","sev":"moderate","choices":[]},{"id":"835d7b7","type":"info","title":"Basement Was Inspected","text":"The basement was inspected according to the Home Inspection Standards of Practice.\n\nThe basement can be a revealing area in the house and often provides a general picture of how the entire structure works. In most basements, the structure is exposed overhead, as are the HVAC distribution system, plumbing supply and DWV lines, and the electrical branch-circuit wiring. I inspected those systems and components.","sev":"minor","choices":[]},{"id":"67d5007","type":"defect","title":"Possible Microbial Growth","text":"Multiple areas of the basement were observed to have possible microbial growth.  Microbial growth could cause health issues.  More information can be found by clicking here.  The inspector recommends further evaluation by an IICRC mold abatement contractor.  Find an IICRC contractor by clicking here.","sev":"moderate","choices":[]},{"id":"b5239c2","type":"info","title":"Foundation Was Inspected","text":"The foundation was inspected according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"5719ce2","type":"info","title":"Structural Components Were Inspected","text":"Structural components were inspected according to the Home Inspection Standards of Practice, including readily observed floor joists.","sev":"minor","choices":[]},{"id":"900196c","type":"defect","title":"Foundation Crack - Minor","text":"I observed indications of a crack at the foundation. The crack is hairline with no major displacement or movement.","sev":"minor","choices":[]},{"id":"a4cbdbb","type":"defect","title":"Foundation Crack - Major","text":"I observed a major crack at the structural wall of the house foundation.\n\nI am not a structural engineer.  I recommend a structural engineer further evaluate and make recommendations related to this observation.","sev":"moderate","choices":[]},{"id":"68adb9c","type":"defect","title":"Possible Foundation Movement","text":"I observed indications of possible foundation movement.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"6f296d8","type":"defect","title":"Prior Water Penetration Observed","text":"I observed indications that sometime in the past, there was water penetration or intrusion into the house.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"fd8dac8","type":"defect","title":"Improper Repair","text":"One or more areas of the structural framing were observed to have improper repairs.  This could be a structural deficiency.  Further evaluation by a structural engineer or licensed residential contractor is recomended.","sev":"moderate","choices":[]},{"id":"1978a38","type":"defect","title":"Foundation Wall Leaning","text":"I observed indications of a leaning foundation wall. This is a major defect.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"5ac67b5","type":"defect","title":"Improper Construction Practices","text":"I observed indications of poor workmanship and poor construction techniques. There are structural concerns because of this poor construction and building practice at this area. Major defect.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"0546c9a","type":"defect","title":"Stairway Headroom","text":"","sev":"moderate","choices":[]},{"id":"ce63a35","type":"defect","title":"Possible Repair/ Inaccessible","text":"Exterior grade plywood was observed on the outside of the home.  This plywood may be concealing hidden damage or other defects.  Further evaluation after access is gained is recommended.","sev":"moderate","choices":[]},{"id":"03c2d81","type":"defect","title":"Wood in Contact With or Close to Soil","text":"I observed indications of wooden structural components in contact with soil or in close proximity with soil.  This condition is prone to water penetration into the structural materials resulting in water damage.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"a41b499","type":"defect","title":"Possible Foundation Movement - Unlevel Floor","text":"I observed indications of possible foundation movement at an unlevel floor area.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"d0f7d22","type":"defect","title":"Missing GFCI in Unfinished Basement","text":"I observed a missing GFCI protection in the unfinished basement.\n\nGFCI protection is required for all 15- and 20-amp, 120-volt receptacles in the unfinished basement. NEC 210.8(A)(5).","sev":"moderate","choices":[]},{"id":"3f4dd0f","type":"defect","title":"Mortar Cracked- Minor","text":"Mortar on the foundation is cracked or deteriorated.  Tuck pointing, or replacing the deteriorated mortar by a licensed masonry contractor is recommended.","sev":"minor","choices":[]},{"id":"867e9d7","type":"defect","title":"Structural Bracket Fasteners Missing","text":"All structural brackets should be installed by filling all holes with a 10d Joist Hanger Nail.  Missing nails can diminish the designed load capacity of the bracket. Finish installing nails per manufacturer recommendations.","sev":"minor","choices":[]},{"id":"17360ef","type":"defect","title":"Possible Foundation Movement - Drywall Cracks","text":"I observed indications of possible foundation movement at observed sheetrock, drywall or plaster cracks.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"5df828f","type":"defect","title":"Possible Foundation Movement - Out-of-Square Door Frame","text":"I observed indications of possible foundation movement at an out-of-square door frame.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"5497f53","type":"defect","title":"Heaving & Settling of Concrete Floor","text":"I observed indications of movement/settling of the concrete floor in the basement area. This may be a compromise the structural integrity of the foundation or structure of the house. I am not sure. I am not a structural engineer.\n\nI recommend a qualified structural engineer inspect further and provide a professional opinion related to this observation.","sev":"moderate","choices":[]},{"id":"7078ae7","type":"defect","title":"Improper Notch, Hole, or Cut","text":"I observed indications of cutting, notching and boring of framing members that may, in my opinion, present a structural or safety concern.\n\nThere are structural concerns because of this condition. Major defect.\n\nCorrection and further evaluation is recommended.\n\nNotches in solid lumber joists, rafters and beams can not be greater than 1/6th of the member's depth, must not be longer than 1/3rd of the member depth, and must not be located in the middle 1/3rd of the span.\n\nNotches at the ends must not exceed 1/4th the member depth.\n\nThe tension side of members 4 inches or greater in thickness must not be notched, except at the ends.\n\nThe diameter of holes bored or cut into members must not exceed 1/3rd the member depth.\n\nHoles must not be closer than 2 inches to the top or bottom of the member, or to any other hole located in the member. If the member is notched, the hole must not be closer than 2 inches to the notch.","sev":"moderate","choices":[]},{"id":"d675090","type":"defect","title":"Missing TRR in Unfinished Basement","text":"I observed missing tamper-resistance at a receptacle in the unfinished basement.\n\nAll 15- and 20-amp, 120-volt receptacle outlets must be tamper resistant type unless located higher than 5' and 6\" above the floor of the unfinished basement.","sev":"moderate","choices":[]}]},{"name":"Insulation in Foundation/Basement Area","c":[{"id":"1587b29","type":"defect","title":"General Absence of Insulation","text":"I observed indications of the general absence of insulation in the foundation area.   The rim joists should be insulated to limit energy costs.  For more information on how to properly install insulation click here.","sev":"minor","choices":[]},{"id":"5c7dd76","type":"info","title":"Insulation Was Inspected","text":"During the home inspection, I inspected for insulation in unfinished spaces, including attics, crawlspaces and foundation areas.  I inspected for ventilation of unfinished spaces, including attics, crawlspaces and foundation areas.  And I inspected mechanical exhaust systems in the kitchen, bathrooms and laundry area.\n\nI attempted to describe the type of insulation observed and the approximate average depth of insulation observed at the unfinished attic floor area or roof structure.\n\nI reported as in need of correction the general absence of insulation or ventilation in unfinished spaces.","sev":"minor","choices":[]},{"id":"6c66506","type":"defect","title":"Insulation Installed Upside Down in Crawlspace","text":"I observed that the insulation installed on the floor joists above the foundation area is installed upside down.","sev":"moderate","choices":[]},{"id":"77fe1a7","type":"info","title":"Type of Insulation Observed","text":"","sev":"minor","choices":["Batt","Blown","Cellulose","Fiberglass","Foam-board","Foiled-faced","Loose-fill","Mineral Wool","None","Spray Foam","Vermiculite"]},{"id":"6d40ffa","type":"defect","title":"Insulation Hanging Loosely","text":"I observed that the insulation installed on the floor joists above the foundation area is hanging loosely and falling off.","sev":"moderate","choices":[]},{"id":"e1ab77d","type":"info","title":"Approximate Average Depth of Insulation","text":"Determining how much insulation should be installed in a house depends upon where a home is located.   proper amount of insulation should be installed at a particular area of a house is dependent upon which climate zone the house is located.\n\nThis house is located in a climate zone that requires an R-value of","sev":"minor","choices":["missing insulation","insulation thickness varied greatly","1-3 inches","3-6 inches","6-9 inches","9-12 inches","greater than 12 inches"]},{"id":"c9d0417","type":"defect","title":"Insulation Installed Improperly","text":"I observed that the insulation installed on the floor joists above the foundation area is installed improperly.","sev":"moderate","choices":[]},{"id":"525aa7c","type":"info","title":"Rim Joist Insulated with Spray Foam","text":"The rim joist was insulated with spray foam.  This is, in the inspectors opinion, the best type of insulation for this area as it not only insulated but creates an air barrier.","sev":"minor","choices":[]}]},{"name":"Structure/ Framing","c":[{"id":"6a7d935","type":"defect","title":"Lack Of Support","text":"","sev":"minor","choices":[]},{"id":"e385f9a","type":"defect","title":"Minor Crack- Possible Moisture Intrusion","text":"A minor crack was observed in the concrete foundation.  The crack appears to penetrate through both sides of the wall and water staining was observed.  The inspector recommends further evaluation and correction by a foundation sprecialist","sev":"moderate","choices":[]},{"id":"8b79010","type":"info","title":"Structural Bracket Not Attatched Properly","text":"","sev":"minor","choices":[]},{"id":"860a036","type":"defect","title":"Columns Unstable","text":"The wood columns are showing signs of rot and leaning.  Multiple columns were observed that did not seem structurally sound.  Replacement of the columns by a licensed builder is recommended.  Click here for more information.","sev":"moderate","choices":[]},{"id":"2a8c95d","type":"defect","title":"Joist Improperly Notched","text":"A joist was observed that was improperly notched.  Improperly notched Joists can become weak and cause structural issues within the structure.  Repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"a3e9a5b","type":"defect","title":"Improper/ Lack Of Fasteners On Structural Bracket","text":"Structural brackets are designed to work with all the pre-drilled nail holes filled.  Lack of fasteners or improper fasteners can cause the brackets to fail.  This is a structural issues, however an easy repair.  Installation of 10d galvanized nails is recommended.","sev":"major","choices":[]},{"id":"e599ff4","type":"defect","title":"Joist Cracked","text":"","sev":"moderate","choices":[]},{"id":"3a32462","type":"defect","title":"Charred Wood","text":"","sev":"major","choices":[]},{"id":"500d277","type":"defect","title":"Lack of fasteners","text":"","sev":"major","choices":[]},{"id":"acaed03","type":"limit","title":"Old System","text":"AGED - Parts of the home were built to a standard that, while it most likely met standards at the time of construction, do not meet current building standards.  Because there are not standards to rely upon when inspecting these systems it can be difficult for the inspector to properly evaluate them.  Further evaluation by a licensed contractor or structural engineer is recommende.","sev":"minor","choices":[]},{"id":"cd2c2e5","type":"info","title":"Structure Inspected","text":"The visible portions of the basement/ crawlspace was inspected.  Many things can block the view for a full inspection including wall and ceiling finishes, insulation, personal belongings, etc.","sev":"minor","choices":[]},{"id":"1fb8631","type":"defect","title":"Improper Structural Repair","text":"Joists were improperly sisters to damaged wood.  Fasteners were not properly installed and the joist was not run to a bearing wall.  Further evaluation and repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"3f4815b","type":"info","title":"Home Built Slab on Grade","text":"The home was built slab on grade, meaning the walls are built on top of a cement pad that acts as the floor of the home also.  The slab was poured on grade meaning there is no basement or crawlspace under the home.   Be aware that HVAC and plumbing repairs can be more expensive as the pipes, drains, gas lines, and ductwork run through the cement","sev":"minor","choices":[]},{"id":"bf60e52","type":"defect","title":"Temporary Post Observed","text":"","sev":"moderate","choices":[]},{"id":"a1247c4","type":"defect","title":"Staining- Possible Moisture Intrusion","text":"I observed indications of a possible mold growth issue and excessive moisture or humidity in the basement. Major defect.   Mold can cause health issues and damage the structure.  For more information on the effects of the mold click here.  Remediation of the potential mold should be done by a qualified contractor.  The inspector recommends an IICRC mold abatement contractor, to find one in your area click here.\n\nWhile the inspector always recomends a IICRC certified mold abatement contractor the EPA does allow for a homeowner to abate their own mold if it is under 10 square feet.  It is important to always follow proper safety procedures (for more information click here).\n\nThere are many chemicals that are advertised to clean the mold, however they are not all equal.  The product we recommend for cleaning most areas of suspected mold is Concrobium.  The inspector has discussed the use of this product with the engineers from the company as well as a representative from the EPA and feels comfortable that, while following manufacturer instructions, the product is effective and safe to use.\n\nOnce properly cleaned the area should be primed using a mold inhibiting paint.  The product we recommend is Zinsser Mold Killing Primer.  After much research the inspector believes this product will perform as intended when used properly.","sev":"moderate","choices":[]},{"id":"b137a16","type":"defect","title":"Foundation Wall Step Cracks Observed","text":"Step cracks are diagonal cracks that follow the mortar or the points of weakness between bricks or blocks in concrete or masonry foundation walls. They may appear like stairs or steps, hence the name\u2075. Step cracks can occur on exterior or interior walls, including crawl spaces and basement walls.\n\nStep cracks can be caused by a variety of factors, such as natural settling, concrete shrinking, soil pressure, moisture changes, or frost heaving. Depending on the width, depth, and location of the cracks, they may indicate a minor cosmetic issue or a serious structural problem that could compromise the integrity of the foundation and lead to water damage or flooding.\n\nTo assess the severity of step cracks, it is important to monitor them for expansion or movement over time. A simple way to do this is to mark the ends of the cracks with a pencil and write the date next to them. Then, measure the width of the cracks at the widest point and record it as well. Check the cracks at least monthly for several months and make additional marks and measurements if the cracks grow or shift.\n\nAs a general rule of thumb, step cracks that are hairline (less than 1/8 inch wide) or narrow (between 1/8 and 1/4 inch wide) are usually not a cause for concern, as long as they do not expand or leak water. They are likely due to normal settling or shrinking of the concrete and can be easily repaired with grout or caulk\u00b2\u00b3. However, step cracks that are wide (more than 1/4 inch), deep (penetrating more than half of the wall thickness), or uneven (one side higher than the other) are signs of serious foundation problems that require professional attention. They may indicate that the foundation has settled unevenly or shifted due to soil conditions or frost action. In this case, repairing the cracks alone will not solve the underlying issue and may even worsen it. The foundation may need to be stabilized with piers, anchors, braces, or other methods depending on the situation.\n\nCorrective Action\n\nStep cracks in a foundation are common but should not be ignored. They can reveal important information about the condition and performance of the foundation. By inspecting and monitoring them regularly, you can determine whether they are harmless or harmful and take appropriate action to repair them or seek professional help.  The inspector recomends consulting with a foundation specialist or basement waterproofing contractor to determine the severity of the cracks as movement of the foundation wall was observed.  Bids should be obtained before your Inspection Objection Deadline","sev":"major","choices":[]}]},{"name":"Ventilation in Foundation/Basement Area","c":[{"id":"4adeaac","type":"defect","title":"Excessive Humidity","text":"I observed indications of excessive humidity levels and moisture intrusion in the foundation and basement area. This might have been related to proper ventilation or air conditioning.","sev":"moderate","choices":[]},{"id":"efbb413","type":"info","title":"Ventilation Inspected","text":"During the home inspection, I inspected for insulation in unfinished spaces, including attics, crawlspaces and foundation areas.  And I inspected mechanical exhaust systems in the kitchen, bathrooms and laundry area.\n\nI report as in need of correction the general absence of ventilation in unfinished spaces.","sev":"minor","choices":[]},{"id":"dd7d9e2","type":"info","title":"Attic Insulation Thickness","text":"Determining how much insulation should be installed in a house depends upon where a home is located.   proper amount of insulation should be installed at a particular area of a house is dependent upon which climate zone the house is located.\n\nThis house is located in a climate zone that requires an R-value of","sev":"minor","choices":["missing insulation","insulation thickness varied greatly","1-3 inches","3-6 inches","6-9 inches","9-12 inches","greater than 12 inches"]},{"id":"af92633","type":"info","title":"Insulation Type","text":"","sev":"minor","choices":["Batt","Blown","Cellulose","Fiberglass","Foam-board","Foiled-faced","Loose-fill","Mineral Wool","None","Spray Foam","Vermiculite"]},{"id":"cd16367","type":"defect","title":"Dehumidifier Observed","text":"","sev":"minor","choices":[]}]},{"name":"Sump Pump","c":[{"id":"99b6818","type":"defect","title":"Battery Back-Up for Sump Pump Recommended","text":"I recommend a battery back-up system for the sump pump.\n\nA battery backup sump pump system provides critical protection for your home, especially during power outages or primary pump failures. Here\u2019s why it\u2019s a smart investment:\n\n    1.    Power Outage Protection: Heavy rains that cause flooding often coincide with power outages. A battery backup ensures your sump pump continues to operate, even when electricity is unavailable.\n\n    2.    Primary Pump Failure: Mechanical issues, clogs, or wear and tear can cause the primary sump pump to fail. The backup pump automatically activates, reducing the risk of basement flooding.\n\n    3.    High Water Volume: During extreme weather, a backup pump can assist the primary pump in handling a high volume of water, providing an extra layer of protection.\n\n    4.    Peace of Mind: Even if you\u2019re away from home, a backup system can help prevent costly water damage by keeping your basement or crawl space dry.\n\nFor optimal protection, consider installing a battery backup sump pump system. Regularly test both the primary and backup systems and replace the battery as recommended by the manufacturer to ensure reliable performance.","sev":"minor","choices":[]},{"id":"45976b6","type":"limit","title":"Unable to Turn On Sump Pump","text":"LMT - I was unable to turn on the sump pump/ there was a lack of water in the sump pit. This was an inspection restriction.  The sump pump was not tested.","sev":"minor","choices":[]},{"id":"efb48c6","type":"limit","title":"Unable to Determine Discharge of Sump Pump","text":"LMT - I was unable to determine where the sump pump discharges.  It should discharge outside at least 6 feet away from the house foundation.  Monitoring is recommended.","sev":"minor","choices":[]},{"id":"88dbd5c","type":"limit","title":"Sump Pump Lid is Sealed Shut","text":"LMT - The sump pump lid was sealed shut.  This is an inspection restriction.   The inspector was not able to test or view the sump pump.","sev":"minor","choices":[]},{"id":"e9ab596","type":"info","title":"Sump Pump Installed","text":"I observed a sump pump was installed in the house.\n\nNeglecting to test a sump pump routinely, especially if it is rarely used, can lead to severe water damage when a heavy storm, snow melt, or flooding sends water against the home.\n\nOverload of the sump pump due to poor drainage elsewhere on the property can lead to pump failure. Frequent sump operation can be a sign of excessive water buildup under the basement floor due to poorly sloped landscaping, poor rain runoff, gutter back-flows, and other problems.\n\nLack of a back-up sump pump, which can be quickly installed in the event the first pump fails, can lead to serious water damage and property loss. This is especially important if the sump pump is relied upon to maintain a dry basement, or if the house is located in an area of seasonally high groundwater. Sump failure can cause extensive water damage and the loss of valuable personal belongings.","sev":"minor","choices":[]},{"id":"898cf64","type":"info","title":"Water in Sump Pump","text":"I observed standing water in the sump pump bucket. This may indicate that the sump pump is critical and necessary to keep the house basement or foundation from having water intrusion problems developing.","sev":"minor","choices":[]},{"id":"263d436","type":"info","title":"Sump Pump Activated","text":"I activated the sump pump. It turned on.\n\nThe sump pump should not recycle. When a sump pump is used to keep a buildings interior dry, the discharge should drain away from the building and should not add to the subsurface water condition that the sump pump is meant to control.","sev":"minor","choices":[]},{"id":"559e43d","type":"defect","title":"Sump Pump is Improperly Installed","text":"I observed that the sump pump was not properly installed.  Defect.  The sump pump discharges into the sewer.  This can result in fines from the city.  Correction will be required by the city upon purchasing.","sev":"moderate","choices":[]},{"id":"79f5cd0","type":"defect","title":"Drain Pipe Not Properly Supported","text":"","sev":"moderate","choices":[]},{"id":"e4e0754","type":"defect","title":"Lack Of Check Valve At Sump Pump","text":"A check valve prevents water from backfilling the crock which can create short cycling and premature wear of the pump.  Installation of a check valve by a licensed plumber is recomended","sev":"minor","choices":[]},{"id":"673e639","type":"defect","title":"Sump Pump Discharges Near Home","text":"","sev":"moderate","choices":[]},{"id":"d5c049b","type":"defect","title":"Dirt Hole","text":"I observed that a dirt hole was being used for the sump pump instead of a properly installed pump bucket.  A dirt hole may clog the pump.  A dirt hole makes the system unreliable.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"91dc486","type":"defect","title":"Lack Of Sump Pump Lid","text":"The sump pump lid was missing at the time of inspection.  A lid prevents debris entering into the crock damaging the pump.  Replacement is recommended.","sev":"moderate","choices":[]},{"id":"7cfd198","type":"info","title":"Sump Pump Not Activated","text":"The sump pump float was too deep to activate.  The system included a backup sump pump, a great upgrade that will help protect your home.","sev":"minor","choices":[]},{"id":"bb72ebe","type":"limit","title":"Sump Pump Removed","text":"EXC - There wasn't a sump pump installed in the sump pit at the time of the inspection.","sev":"minor","choices":[]},{"id":"15159ca","type":"defect","title":"Sump pump discharges to sewer","text":"","sev":"moderate","choices":[]}]},{"name":"Under-Floor Crawlspace","c":[{"id":"9a489e1","type":"defect","title":"Missing Vapor Barrier","text":"A vapor barrier protects the underside of the home (joists and subfloor) from moisture damage.  Unfinished crawlspaces will release humidity into the crawlspace area which, if improperly ventilated, can cause damage to the structural members of the home.  A properly installed moisture barrier will prevent the majority of the moisture from reaching the structural members.\n\nTo install a moisture barrier the entire surface of the crawlspace should be covered with a minimum .6mil plastic sheeting, overlapped and sealed at the seams at least 3 inches and brought up the wall at least 6\" sealed at the top.\n\nInstallation of a proper moisture barrier is recommended to prevent future issues with the structure of the home.","sev":"moderate","choices":[]},{"id":"78865f5","type":"limit","title":"Personal Storage Restriction","text":"LMT - Personal items limited my visual inspection. Moving personal items and storage is not required by the Standards of Practice. I could not see everything. Many things were blocking my inspection.","sev":"minor","choices":[]},{"id":"ad24f24","type":"info","title":"Homeowner's Responsibility","text":"One of the most common problems in a house with a crawlspace is water intrusion, condensation, and excessively high humidity levels. You should monitor the walls and floors for signs of water penetration, such as dampness, water stains, efflorescence, and rust on exposed metal parts. Water may come through the walls or cracks in the floor, or from backed-up floor drains, leaky plumbing lines, or a clogged air-conditioner condensate line.","sev":"minor","choices":[]},{"id":"c6e78e7","type":"info","title":"Type of Under-Floor Crawlspace Foundation Described","text":"","sev":"minor","choices":["Concrete","Masonry Block","Brick","Stone","Rock","Other","Concrete Masonry Unit"]},{"id":"0f15135","type":"defect","title":"Prior Water Penetration Observed","text":"I observed indications that sometime in the past, there was water penetration or intrusion into the crawlspace.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"fa4cdaa","type":"limit","title":"Inaccessible","text":"LMT - The crawlspace was inaccessible. This is an inspection restriction. A complete inspection of the crawlspace after access is provided is recommended.","sev":"minor","choices":[]},{"id":"9b31b28","type":"limit","title":"Partially Inaccessible","text":"LMT -Parts of a crawlspace was inaccessible. This is an inspection restriction. I don't know what's going on inside parts of the crawlspace, because I could not enter. Access needs to be provided in order to inspect and evaluate the crawlspace condition in its entirety.","sev":"minor","choices":[]},{"id":"9fb5384","type":"info","title":"Under-Floor Crawl Access Location","text":"","sev":"minor","choices":["Basement","Exterior","Floor","Closet"]},{"id":"3d91301","type":"defect","title":"Efflorescence Observed","text":"I observed efflorescence from the crawlspace.\n\nEfflorescence is the white chalky powder that you might find on the surface of a concrete or brick wall. It can be a cosmetic issue, or it can be an indication of moisture intrusion that could lead to major structural and indoor air quality issues.\n\nI noted the presence of efflorescence in the inspection report because it generally occurs where there is excess moisture, a condition that also encourages the growth of mold.","sev":"moderate","choices":[]},{"id":"a10076a","type":"defect","title":"Active Water Penetration Observed","text":"I observed indications of active water penetration into the crawlspace.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"04086f0","type":"info","title":"Under-Floor Crawlspace Inspected","text":"The under-floor crawlspace area was inspected according to the Home Inspection Standards of Practice.\n\nThe crawlspace can be a revealing area in the house and often provides a general picture of how the entire structure works. In many crawlspaces, the structure is exposed overhead, as are the HVAC distribution system, plumbing supply and DWV lines, and the electrical branch-circuit wiring. I inspected those systems and components.","sev":"minor","choices":[]},{"id":"e879cc3","type":"defect","title":"Possible Microbial Growth Observed","text":"","sev":"moderate","choices":[]},{"id":"5756825","type":"info","title":"Structural Components Inspected","text":"Structural components were inspected according to the Home Inspection Standards of Practice, including readily observed floor joists.","sev":"minor","choices":[]},{"id":"d016f02","type":"defect","title":"Tie Downs Not Observed","text":"","sev":"major","choices":[]},{"id":"c197398","type":"defect","title":"Foundation Crack - Minor","text":"I observed indications of a crack at the foundation. The crack is hairline with no major displacement or movement.","sev":"minor","choices":[]},{"id":"a4728ae","type":"defect","title":"Outlet Not Inslalled To Professional Standards","text":"","sev":"moderate","choices":[]},{"id":"aa61411","type":"defect","title":"Wood in Contact With or Close to Soil","text":"I observed indications of wooden structural components in contact with soil or in close proximity with soil.  This condition is prone to water penetration into the structural materials resulting in water damage.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"8498cea","type":"defect","title":"Possible Foundation Movement","text":"I observed indications of possible foundation movement, such as sheetrock cracks, brick cracks, out-of-square door frames, and unlevel floors.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"0986f90","type":"defect","title":"Possible Foundation Movement - Drywall Cracks","text":"I observed indications of possible foundation movement at observed sheetrock, drywall or plaster cracks.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"cdcc089","type":"defect","title":"Possible Foundation Movement - Out-of-Square Door Frame","text":"I observed indications of possible foundation movement at an out-of-square door frame.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"78fed27","type":"defect","title":"Possible Foundation Movement - Unlevel Floor","text":"I observed indications of possible foundation movement at an unlevel floor area.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"e4a81d8","type":"defect","title":"Foundation Crack - Major","text":"I observed a major crack at the structural wall of the house foundation.\n\nI am not a structural engineer.  I recommend a structural engineer further evaluate and make recommendations related to this observation.","sev":"moderate","choices":[]},{"id":"4f940c3","type":"defect","title":"Foundation Wall Leaning","text":"I observed indications of a leaning foundation wall. This is a major defect.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"5a1f70d","type":"defect","title":"Heaving & Settling of Concrete Floor","text":"I observed indications of movement/settling of the concrete floor in the crawlspace area. This may be a compromise the structural integrity of the foundation or structure of the house. I am not sure. I am not a structural engineer.\n\nI recommend a qualified structural engineer inspect further and provide a professional opinion related to this observation.","sev":"moderate","choices":[]},{"id":"6fdae81","type":"defect","title":"Improper Notch, Hole, or Cut","text":"I observed indications of cutting, notching and boring of framing members that may, in my opinion, present a structural or safety concern.\n\nThere are structural concerns because of this condition. Major defect.\n\nCorrection and further evaluation is recommended.\n\nNotches in solid lumber joists, rafters and beams can not be greater than 1/6th of the member's depth, must not be longer than 1/3rd of the member depth, and must not be located in the middle 1/3rd of the span.\n\nNotches at the ends must not exceed 1/4th the member depth.\n\nThe tension side of members 4 inches or greater in thickness must not be notched, except at the ends.\n\nThe diameter of holes bored or cut into members must not exceed 1/3rd the member depth.\n\nHoles must not be closer than 2 inches to the top or bottom of the member, or to any other hole located in the member. If the member is notched, the hole must not be closer than 2 inches to the notch.","sev":"moderate","choices":[]},{"id":"ce018b6","type":"defect","title":"Improper Construction Practices","text":"I observed indications of poor workmanship and poor construction techniques. There are structural concerns because of this poor construction and building practice at this area. Major defect.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"b4d244e","type":"defect","title":"GFCI Protection Missing","text":"I observed missing GFCI protection at the receptacle in the crawlspace (underground or grade level crawlspace).","sev":"moderate","choices":[]},{"id":"e5883ef","type":"defect","title":"Sewage Pipe Leaking","text":"Sewage was observed in the crawlspace.  This appears to be coming from the sewage cleanout cap.  Repair by a licensed plumber is recommended","sev":"major","choices":[]}]},{"name":"Insulation in Crawlspace","c":[{"id":"f2202ff","type":"defect","title":"General Absence of Insulation","text":"I observed indications of the general absence of insulation in the unfinished crawlspace area.  The joist cavities should have insulation installed to prevent high energy usage.  To learn more about insulating your crawlspace click here.","sev":"moderate","choices":[]},{"id":"1969860","type":"info","title":"Insulation Was Inspected","text":"During the home inspection, I inspected for insulation in unfinished spaces, including attics, crawlspaces and foundation areas.  I inspected for ventilation of unfinished spaces, including attics, crawlspaces and foundation areas.  And I inspected mechanical exhaust systems in the kitchen, bathrooms and laundry area.\n\nI attempted to describe the type of insulation observed and the approximate average depth of insulation observed at the unfinished attic floor area or roof structure.\n\nI reported as in need of correction the general absence of insulation or ventilation in unfinished spaces.","sev":"minor","choices":[]},{"id":"b004e90","type":"info","title":"Type of Insulation Observed","text":"","sev":"minor","choices":["Batt","Blown","Cellulose","Fiberglass","Foam-board","Foiled-faced","Loose-fill","Mineral Wool","None","Spray Foam","Vermiculite"]},{"id":"5f125ef","type":"limit","title":"Insulation Blocking View of Foundation","text":"LMT - The insulation blocked the view of the foundation.  Hidden damage could exist.","sev":"minor","choices":[]},{"id":"4fe6a0c","type":"defect","title":"Insulation Hanging Loosely","text":"I observed that the insulation installed on the floor joists above the crawlspace is hanging loosely and falling off.","sev":"moderate","choices":[]},{"id":"7c4d690","type":"defect","title":"Signs of Rodents","text":"","sev":"moderate","choices":[]},{"id":"f48619d","type":"info","title":"Approximate Average Depth of Insulation","text":"Determining how much insulation should be installed in a house depends upon where a home is located.   proper amount of insulation should be installed at a particular area of a house is dependent upon which climate zone the house is located.\n\nThis house is located in a climate zone that requires an R-value of","sev":"minor","choices":["missing insulation","insulation thickness varied greatly","1-3 inches","3-6 inches","6-9 inches","9-12 inches","greater than 12 inches"]},{"id":"5de7814","type":"defect","title":"Insulation Installed Upside Down in Crawlspace","text":"I observed that the insulation installed on the floor joists above the crawlspace is installed upside down.","sev":"moderate","choices":[]},{"id":"34de40e","type":"defect","title":"Insulation Installed Improperly","text":"I observed that the insulation installed on the floor joists above the crawlspace is installed improperly.","sev":"moderate","choices":[]},{"id":"46ec457","type":"defect","title":"Mold","text":"","sev":"moderate","choices":[]}]},{"name":"Ventilation in Crawlspace","c":[{"id":"406b0c3","type":"info","title":"Ventilation Inspected","text":"During the home inspection, I inspected for ventilation in unfinished spaces, including attics, crawlspaces and foundation areas. And I inspected mechanical exhaust systems in the kitchen, bathrooms and laundry area.\n\nI report as in need of correction the general absence of ventilation in unfinished spaces.","sev":"minor","choices":[]},{"id":"b28d0ea","type":"defect","title":"Damaged Crawlspace Vents","text":"I observed damaged crawlspace vents.","sev":"moderate","choices":[]},{"id":"c859342","type":"defect","title":"Open Crawlspace Vents Observed","text":"The crawlspace is ventilated with the outside. This type of crawlspace and foundation is equipped with permanent vents to the outdoors that are intended to furnish cross-ventilation to prevent moisture in the space. This conventional ventilated crawlspace tend to have inherent problems including energy loss, decreased comfort, excessive moisture, durability issues, and indoor air quality problems. It might be best to implement a closed-crawlspace strategy that treats the crawlspace essentially as a short room with conditioned air. Recommend having a qualified contractor further evaluate the vented crawlspace.","sev":"minor","choices":[]},{"id":"1838834","type":"info","title":"Attic Insulation Thickness","text":"Determining how much insulation should be installed in a house depends upon where a home is located.   proper amount of insulation should be installed at a particular area of a house is dependent upon which climate zone the house is located.\n\nThis house is located in a climate zone that requires an R-value of","sev":"minor","choices":["missing insulation","insulation thickness varied greatly","1-3 inches","3-6 inches","6-9 inches","9-12 inches","greater than 12 inches"]},{"id":"ce78156","type":"defect","title":"Excessive Humidity","text":"I observed indications of excessive humidity levels and moisture intrusion in the crawlspace. This might have been related to proper ventilation or air conditioning.","sev":"moderate","choices":[]},{"id":"af3d339","type":"info","title":"Insulation Type","text":"","sev":"minor","choices":["Batt","Blown","Cellulose","Fiberglass","Foam-board","Foiled-faced","Loose-fill","Mineral Wool","None","Spray Foam","Vermiculite"]},{"id":"c36e373","type":"info","title":"Approximent R-Value","text":"","sev":"minor","choices":[]}]},{"name":"Emergency Escape and Rescue Openings","c":[{"id":"d916eed","type":"defect","title":"Emergency Escape and Rescue Openings Not Present","text":"A basement shall have a minimum of one emergency escape and rescue opening.   All bedrooms must have their own emergency escape and rescue opening.  Existing structures may be grandfathered in and not be required to meet these standards, however this lies beyond the scope of the inspection.  For safety reasons the inspector recommends emergency escape and recue openings be added to meet current code.","sev":"moderate","choices":[]}]},{"name":"Stairway","c":[{"id":"a1bd812","type":"defect","title":"Stairway Doesn\u2019t Meet Current Standards.","text":"The stairway had many issues including a lack of handrail, low headspace, and improper riser height.  While complete correction is not possible as the stairway leads to a crawlspace the inspector recommends further evaluation by a licensed builder.","sev":"moderate","choices":[]}]},{"name":"Radon System","c":[{"id":"2394b1d","type":"defect","title":"Radon Mitigation Doesn\u2019t Discharge Above Roof","text":"EPA\u2019s Radon Mitigation Standards require vent discharge points to be at least 2 feet above or 10 feet sideways from any windows or vents to interior treated air spaces.  Correction by a licensed radon contractor is recommended.","sev":"minor","choices":[]},{"id":"fbda1b0","type":"info","title":"Radon System Installed","text":"How to Check Your Radon Mitigation System\n\nCheck Your Manometer\n\nA manometer is a U-shaped tube filled with fluid. The fluid is usually red, blue or green. It\u2019s a visual gauge that tells you if your radon fan is running and at what static pressure.  All active radon mitigation systems (this just means your radon system has a fan) are required to have a manometer installed so you can see if the radon fan is working.\n\nHow Does A Manometer Work?\n\nIt\u2019s simple really, the suction created by the radon fan draws the fluid up on one side of the gauge. You\u2019ll notice that there is a small piece of clear tubing that goes from the top of the manometer to a small hole in the radon vent pipe. The other side of the manometer is left open. Think of it as if you are sucking on a straw. When you suck, you draw the fluid up the straw and when you stop sucking the liquid goes back down. The same is true here.\n\nAre the Fluid Levels Different?\n\nU-tube fluid levels are different, indicating that your radon fan is running.\n\nThat\u2019s good, your radon fan is working! You want the oil in the manometer to be higher on one side and lower on the other.\n\nAre the Fluid Levels Equal?\n\nIf the fluid levels in the U- tube are equal, your radon fan is not working.\n\nThis is not good; your radon fan is not operating.\n\nIs Your Radon Fan Really Dead?\n\nMaybe, maybe not. There are several things that may have caused the fan to shut down and you\u2019ll want to check before calling a radon contractor to replace the fan. Let\u2019s look at what some of the culprits could be.\n\n\u2022 Did you lose power?\n\n\u2022 Did the breaker that your radon fan is wired to trip?\n\n\u2022 Is the fan unplugged?\n\n\u2022 Did the switch get turned off? Click here for a video on this.\n\n\u2022 Is the small, clear tube that goes from the U-tube to the radon vent pipe still connected?\n\nNext, if you\u2019ve checked all these things and the oil in the manometer is still equal on both sides it\u2019s time to call a radon mitigation contractor. Your radon fan is likely dead. It\u2019s a moving part, and it won\u2019t last forever.\n\nMake it a Habit!\n\nBe sure to frequently look at your radon system manometer. If you\u2019re not sure if your system is working, call.  There are an estimated half-million dead radon fans in the United States.","sev":"minor","choices":[]}]},{"name":"Odor","c":[{"id":"8ead711","type":"defect","title":"Areas Had A Smell Of Decay","text":"","sev":"moderate","choices":[]},{"id":"299824e","type":"defect","title":"Home Had Pet Odors","text":"The home had a strong smell that is associated with pets.  This is often caused by urine and feces of pets.  The smells can be very hard to get rid of.  Often flooring will need to be removed and sub flooring replaced or treated.  In certain instances the damage can extend to walls, cabinets, or other finished, all which must be removed and replaced.","sev":"major","choices":[]}]}]},{"name":"Heating","subs":[{"name":"Heating System Information","c":[{"id":"d36c0bd","type":"limit","title":"Heating System Inaccessible","text":"LMT - The heating system was inaccessible. The inspection was restricted and limited.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"e155a3d","type":"defect","title":"Delayed Maintenance","text":"I observed indications of delayed maintenance at the heating system. The system should be cleaned and inspected by a HVAC professional every year.","sev":"minor","choices":[]},{"id":"1a27ff4","type":"info","title":"Homeowner's Responsibility","text":"Most HVAC (heating, ventilating and air-conditioning) systems in houses are relatively simple in design and operation. They consist of four components: controls, fuel supply, heating or cooling unit, and distribution system. The adequacy of heating and cooling is often quite subjective and depends upon occupant perceptions that are affected by the distribution of air, the location of return-air vents, air velocity, the sound of the system in operation, and similar characteristics.\n\nIt's your job to get the HVAC system inspected and serviced every year. And if you're system has an air filter, be sure to keep that filter cleaned.","sev":"minor","choices":[]},{"id":"f67c833","type":"info","title":"Energy Source","text":"","sev":"minor","choices":["Gas","Oil","Heat Pump","Electric","Propane","Solar","Wood","Coal"]},{"id":"a06186e","type":"defect","title":"Corrosion & Rust","text":"I observed areas of corrosion and rust at the heating system.","sev":"moderate","choices":[]},{"id":"08cda96","type":"defect","title":"Old System","text":"I observed during my inspection that the system appeared to be old and at the end of its service life. It may not be reliable. Ask the homeowner or occupant about its recent performance. Regular maintenance and monitoring of its condition is recommended. Budgeting for repairs and future replacement is recommended. InterNACHI's Standard Estimate Life Expectancy Chart for Homes","sev":"minor","choices":[]},{"id":"07527c0","type":"info","title":"Heating Source Brand Name","text":"","sev":"minor","choices":["Carrier","Goodman","Lennox","Daikin","Amana","York","Tappan","Luxaire","Trane","Weil McClain","Aire-Flo","Nordyne","Eco-Aire","Airco","Bryant","Frigidaire","Bard","Payne","Comfortmaker","Coleman","Heil","Rheem","Armstrong","Concord","Evcon","Ruud","Janitrol","Miller","International Comfort Products","Burnham","Dunkirk","Lochivar","Temp star","Energi"]},{"id":"351886f","type":"info","title":"Heating Method","text":"","sev":"minor","choices":["Warm-Air Heating System","Hot-Water Heating System","Heat Pump System","Electric Baseboard System","Steam Heating System","Wood-Burning","Solar Panels","Boiler","Electric Wall Furnace"]},{"id":"c157723","type":"defect","title":"Filter Dirty","text":"I observed a dirty air filter at the furnace filter.","sev":"minor","choices":[]},{"id":"9ea21ef","type":"info","title":"Approximent Heating System Age","text":"","sev":"minor","choices":[]},{"id":"ee11fa9","type":"defect","title":"Possible Asbestos Containing Material Observed","text":"White ductwork insulation can contain asbestos.  Further testing is required to confirm the material contains asbestos.  Asbestos is known to cause respiratory illnesses and needs to be handled appropriately in order to avoid contamination.  For more information concerning asbestos click here.  Michigan requires contractors to be certified in order to properly abate asbestos, find a certified professional by clicking here.","sev":"moderate","choices":[]},{"id":"b1bdcd8","type":"limit","title":"Hot Temperature Restriction","text":"LMT -Because the outside temperature was too hot to operate the heating system without the possibility of damaging the system, I did not operate the heating system.  Inspection restriction.  Ask the homeowner about the system, including past performance.","sev":"minor","choices":[]},{"id":"77697dd","type":"info","title":"Heating System BTU","text":"","sev":"minor","choices":[]},{"id":"83b0b6d","type":"defect","title":"Furnace Lacks Working Space","text":"A level working space at least 30 inches deep and 30 inches wide (762 mm by 762 mm) shall be provided in front of the control side to service an appliance. Installation of room heaters shall be permitted with at least an 18-inch (457 mm) working space.","sev":"moderate","choices":[]},{"id":"e927b47","type":"limit","title":"Heating System Restrictions","text":"LMT - The heating system was visually inspected only.  The inspector is not required to use any special tools to inspect the furnace.  The inspector may attempt to take off the access door to the unit but will not disassemble the unit any further.  Due to these restrictions the inspector may not be able to detect everything that is wrong with the furnace including cracked heat exchangers.","sev":"minor","choices":[]},{"id":"531f9e0","type":"info","title":"Furnace Fuel Disconnect","text":"","sev":"minor","choices":[]},{"id":"bffef2c","type":"info","title":"Furnace Electrical Disconnect","text":"","sev":"minor","choices":[]},{"id":"c235ac7","type":"defect","title":"Heating System Did Not Operate","text":"I observed that the heating system did not operate.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"14e7325","type":"defect","title":"Drip Leg Missing Fuel Line","text":"A drip ledge is required to be installed near the furnace to keep debris from entering the gas valve.  Repair by a licensed mechanical or HVAC contractor is recommended.","sev":"minor","choices":[]},{"id":"47bb518","type":"defect","title":"Filter Missing","text":"I observed a missing air filter at the furnace.","sev":"minor","choices":[]},{"id":"eadd790","type":"defect","title":"Corrosion On Flue Discharge Pipe","text":"","sev":"major","choices":[]},{"id":"20eb935","type":"info","title":"Model and Serial Number- Information Tag","text":"","sev":"minor","choices":[]},{"id":"edaf791","type":"defect","title":"Disconnected","text":"The condensate pump was disconnected and leaking at the time of the inspection.","sev":"moderate","choices":[]},{"id":"bbfcddc","type":"defect","title":"Missing screws","text":"","sev":"moderate","choices":[]},{"id":"7877e9f","type":"defect","title":"Furnace ductwork extended","text":"","sev":"moderate","choices":[]},{"id":"5eadd08","type":"defect","title":"Fan Blower Noise","text":"I observed indications of excessive noise from the blower fan during operation.","sev":"moderate","choices":[]},{"id":"b6b6f55","type":"defect","title":"Missing GFCI Protection for Electrically Heated Concrete Floors","text":"I observed missing GFCI protection for the electrically heated concrete floors.\n\nElectric heating cables embedded in concrete floors in bathrooms, kitchens and bathtub areas, spa and hot tub locations must be GFCI protected. (2018 IRC R3902.13)","sev":"moderate","choices":[]},{"id":"e60fd34","type":"defect","title":"Defect at Heating System","text":"I observed a defect at the heating system.","sev":"moderate","choices":[]},{"id":"c2b8976","type":"defect","title":"Duct Defect","text":"I am deserved a defect at the ductwork.","sev":"moderate","choices":[]},{"id":"e742845","type":"defect","title":"Heating System Inadequately Sized","text":"The heating system in the home is inadequately sized for the entire structure resulting in I sufficient heating capacity.  Additional heating units should be added to properly heat the home during the winter.  The inspector recommends consulting a HVAC contractor before your inspection objection deadline.","sev":"major","choices":[]},{"id":"e91b4db","type":"defect","title":"Exhaust and Intake Too Close","text":"","sev":"moderate","choices":[]},{"id":"e4540fa","type":"defect","title":"Door Safety Switch Bypassed/ Not Operational","text":"SFTY- The furnace door safety switch was. It operating at the time of the inspection.  This is a safety hazard.  Repair by a licensed HVAC contractor is recommended.","sev":"major","choices":[]},{"id":"0cfb389","type":"defect","title":"Garage","text":"","sev":"moderate","choices":[]},{"id":"bbac4e5","type":"limit","title":"Boiler Not Inspected","text":"LMT- The boiler was drained and shut down for the season.  The inspector was not able to operate the unit.  This is an inspection limitation.","sev":"minor","choices":[]}]},{"name":"Thermostat and Normal Operating Controls","c":[{"id":"fe1dc24","type":"defect","title":"Loose","text":"The thermostat was to properly connected to the wall and was loose.  Secure properly to prevent damage to the unit.","sev":"minor","choices":[]},{"id":"200b5e0","type":"info","title":"Thermostat Location","text":"","sev":"minor","choices":["Dining room","Living room","First floor","Multiple locations","Multiple thermostats","Hallway","Basement"]},{"id":"de4ad53","type":"defect","title":"Old Thermostat","text":"I observed that the thermostat is very old and should be upgraded to a modern energy-efficient thermostat.","sev":"minor","choices":[]},{"id":"107ec2a","type":"defect","title":"Inoperable Thermostat","text":"I observed that the thermostat was inoperable.  It did not work.","sev":"moderate","choices":[]},{"id":"c0a8042","type":"defect","title":"Service Switch Did Not Work","text":"I observed that the service switch did not work.","sev":"minor","choices":[]},{"id":"ae538cc","type":"defect","title":"Emergency Shut-Off Switch Did Not Work","text":"I observed that the emergency shut-off switch did not work.","sev":"moderate","choices":[]},{"id":"3015876","type":"defect","title":"Blower Panel Safety Switch Did Not Work","text":"The safety switch located at the panel of the circulating blower fan for the furnace did not operate or function when I inspected it.  Safety issue.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Ductwork","c":[{"id":"4558614","type":"defect","title":"Duct Damaged","text":"I observed indications of damage at the ductwork.","sev":"minor","choices":[]},{"id":"a60de4c","type":"defect","title":"Unbalanced Distribution of Conditioned Air","text":"I observed indications of an unbalanced distribution of conditioned air throughout the house.  Not every room as s supply source for conditioned air (heated or cooled air).","sev":"moderate","choices":[]},{"id":"07a72cc","type":"defect","title":"Ducts Not Sealed","text":"Air supply ducts were not sealed. Ideally all ducts are sealed with mastic in order to be more energy-efficient.","sev":"minor","choices":[]},{"id":"528a4c9","type":"defect","title":"Missing Register at Room","text":"I observed a missing heat supply register for a room. Every room should have an air register to supply conditioned air to that room. Not sure why it's not installed. This room may feel uncomfortable or different than the other rooms of the house.","sev":"moderate","choices":[]},{"id":"178ab73","type":"defect","title":"Missing Heat Supply at a Room","text":"I observed an absence of a heating supply register and heat supply source to a room.  Every living space should have a heat source or heat supplied to it.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"bd9955f","type":"defect","title":"Unknown Ductwork/ Exhaust Fan Pipe","text":"A section of ductwork did not appear to be connected to the rest of the HVAC ductwork.  It\u2019s purpose was unknown.  Further evaluation by a licensed HVAC contractor is recommended.","sev":"moderate","choices":[]},{"id":"ffe243f","type":"info","title":"Ductwork Installed","text":"I observed ductwork in the house.  Warm-air heating systems, including heat pump systems, use ductwork to distribute the warm air throughout the house. I will attempt to determine if the each room has a heat source, but I may not be able to find every duct register.","sev":"minor","choices":["Insulated","Non-insulated"]}]},{"name":"Radiators","c":[{"id":"e08054c","type":"defect","title":"Missing Heat Supply at a Room","text":"I observed an absence of a heating supply radiators and heat supply source to a room.  Every living space should have a heat source or heat supplied to it.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"1814059","type":"defect","title":"Damaged Radiator","text":"I observed indications of damage at the radiator.","sev":"moderate","choices":[]},{"id":"594b1c9","type":"info","title":"Observed Radiators","text":"I observed radiators as part of the heating system of the house.","sev":"minor","choices":[]},{"id":"bd2c6da","type":"defect","title":"Defect at Radiator","text":"I observed indications of a defect at a radiator.","sev":"moderate","choices":[]},{"id":"76b6f3c","type":"defect","title":"Radiator Leaking Water","text":"I observed a radiator leaking water.","sev":"moderate","choices":[]},{"id":"7ce95d8","type":"defect","title":"Missing Inside Corner","text":"","sev":"minor","choices":[]}]},{"name":"Humidifier","c":[{"id":"5c00d73","type":"defect","title":"Past Useful Life","text":"","sev":"moderate","choices":[]},{"id":"03a4773","type":"limit","title":"Cover Not Accessible","text":"LMT - The inspector was not able to remove the cover of the humidifier.  This is an inspection restriction.  The humidifier was not completely inspected.","sev":"minor","choices":[]},{"id":"c251eeb","type":"info","title":"Brand","text":"","sev":"minor","choices":["Healthy Climate Solutions","Carrier","Aprilaire"]}]}]},{"name":"Cooling","subs":[{"name":"Cooling System Information","c":[{"id":"25cf09f","type":"info","title":"Homeowner's Responsibility","text":"Most air-conditioning systems in houses are relatively simple in design and operation. The adequacy of the cooling is often quite subjective and depends upon occupant perceptions that are affected by the distribution of air, the location of return-air vents, air velocity, the sound of the system in operation, and similar characteristics.\n\nIt's your job to get the air conditioning system inspected and serviced every year. And if you're system as an air filter, be sure to keep that filter cleaned.","sev":"minor","choices":[]},{"id":"b16f735","type":"limit","title":"Cooling System Inaccessible","text":"LMT - The heating system was inaccessible. The inspection was restricted and limited.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"71ccfe4","type":"defect","title":"Refrigerant Line Insulation Missing or Damaged","text":"During the inspection of the cooling system, the inspector observed missing or damaged foam insulation (commonly referred to as Armaflex insulation) on the refrigerant line. The exposed sections were vulnerable to temperature fluctuations and environmental exposure.\n\nMissing or deteriorated insulation on refrigerant lines presents several efficiency and maintenance concerns:\n\n\u2022 Energy loss, as uninsulated lines reduce system efficiency and increase cooling costs.\n\n\u2022 Condensation buildup, which can lead to moisture damage on adjacent surfaces or components.\n\nCorrective Action\n\nIt is recommended that a qualified HVAC contractor install new foam insulation on the affected refrigerant lines. Proper insulation will help maintain system efficiency, prevent condensation-related issues, and support the long-term performance of the cooling system.","sev":"minor","choices":[]},{"id":"0619dde","type":"limit","title":"Cool Temperature Restriction","text":"LMT - Because the outside temperature was too cool to operate the air conditioner without the possibility of damaging the system, I did not operate the cooling system.  Inspection restriction.  Ask the homeowner about the system, including past performance.","sev":"minor","choices":[]},{"id":"87d5d2f","type":"defect","title":"Condensing Unit- Old System","text":"The inspector observed the condensing unit. the exterior unit of the HVAC system appeared to be old and at the end of its service life. It may not be reliable. Ask the homeowner or occupant about its recent performance.\n\nCorrective Action\n\nRegular maintenance and monitoring of its condition is recommended. Budgeting for repairs and future replacement is recommended. InterNACHI's Standard Estimate Life Expectancy Chart for Homes","sev":"minor","choices":[]},{"id":"7d9ddc5","type":"info","title":"Service Disconnect Inspected","text":"I observed a service disconnect within sight of the cooling system.","sev":"minor","choices":[]},{"id":"5e0b043","type":"defect","title":"Condensing Unit- Below 3\u201d Above Grade","text":"The condensate unit for the HVAC system should be raised up at least 3\" above grade to protect from water, snow, and ice damage.  This unit was too low to the ground.\n\nCorrective Action\n\nThe inspector recommends a licensed HVAC professional raise the unit to the proper height.  This can be accomplished using shims or specially made bases.","sev":"minor","choices":[]},{"id":"f9b9072","type":"defect","title":"Disconnect Box Rusted","text":"The disconnect box was rusted, this can indicate further rust or damage to the devices within the box.  Hidden damage may exist.  Further evaluation by a licensed HVAC contractor is recommended.","sev":"minor","choices":[]},{"id":"fc97442","type":"limit","title":"Label Worn Out","text":"LMT - I observed that the manufacturing label on the system was worn out and illegible. This is an indication of old age. Important information such as the serial number, max breaker size, and size of the unit was not able to be determined.","sev":"minor","choices":[]},{"id":"5d81647","type":"defect","title":"Exterior Compressor Unit is Not Level","text":"I observed indications that the exterior compressor unit was not level and was leaning significantly.  There should be a support base under the unit.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"ed42d54","type":"defect","title":"Condensing Unit- Fins Damaged","text":"The fins on the condensing unit were observed to be damaged during the inspection.  The damaged fins were bent.  This can prevent proper operation of the unit.\n\nRecommendation\n\nThe fins should be straightened.  This can be accomplished using a special tool called a fin brush.","sev":"minor","choices":[]},{"id":"6853590","type":"defect","title":"System Not Operated- Exterior Temperature Too Low","text":"Per the standards of practice the cooling system is not operated when the exterior temperature is below 65 degrees as it could damage the unit.  This is a limitation of the inspection.","sev":"minor","choices":[]},{"id":"3fda062","type":"defect","title":"Cooling System Did Not Operate","text":"During the home inspection, it was noted that the cooling system was not operating properly. The unit failed to cool the space as expected, and unusual noises were observed coming from the condenser, indicating potential internal issues. The cooling system utilized R-22 refrigerant, which has been phased out due to its environmental impact as of January 1, 2020, R-22 production and importation have ceased in the United States. Given the phased-out refrigerant and the probable internal failure of the cooling system, repair may not be cost-effective, and complete replacement may be necessary. The replacement should be carried out by a licensed HVAC contractor, and it may also necessitate the replacement of forced air furnaces if they are interconnected with the cooling system.\n\nReferences:\n\n1. U.S. Environmental Protection Agency (EPA) - \"Phaseout of Ozone-Depleting Substances.\"\n\n2. U.S. Department of Energy (DOE) - \"Heating and Cooling.\"","sev":"major","choices":[]},{"id":"b79ebc9","type":"defect","title":"Defect at Cooling System","text":"I observed a defect at the cooling system.","sev":"moderate","choices":[]},{"id":"6b6038a","type":"defect","title":"Air Flow Restricted by Dirt","text":"I observed that the air flow to the air conditioner unit was restricted because of dirt and debris. This may result in inefficient operation.","sev":"minor","choices":[]},{"id":"93c06c4","type":"defect","title":"Disconnect Not Attatched","text":"The disconnect box was not attached per manufacturer standards.  Repair by a licensed electrician.","sev":"major","choices":[]},{"id":"c53423d","type":"defect","title":"Ground wired and grounded conductor (neutral) wire crossed","text":"","sev":"moderate","choices":[]},{"id":"ee167c9","type":"defect","title":"Foreign Material In Disconnect Box","text":"Foreign material can cause electrical shorts.  Air conditioning systems should be services bi-annually by a professional HVAC service tech which should include cleaning the service disconnect of any debris.","sev":"minor","choices":[]},{"id":"d192944","type":"defect","title":"Breaker Oversized","text":"","sev":"moderate","choices":[]},{"id":"9e42120","type":"info","title":"Condensing Unit Approximent Age","text":"2011","sev":"minor","choices":[]},{"id":"3439dfd","type":"info","title":"Condensing Unit Model Serial Number- Information Tag","text":"","sev":"minor","choices":[]},{"id":"baa66b6","type":"defect","title":"Condensing Unit- Dense Vegetation","text":"Dense vegetation was observed around the exterior condensing unit.  Vegetation was too close to the unit, which can limit heat dissipation and limit effectiveness.\n\nRecommendation\n\nRecommend cutting back vegetation to help improve performance.","sev":"minor","choices":[]},{"id":"ac2db46","type":"defect","title":"Air Flow Restricted by Proximity","text":"I observed that the air flow to the air conditioner unit was restricted. This may result in inefficient operation.","sev":"minor","choices":[]},{"id":"30880b7","type":"defect","title":"Did Not Produce Cooled Air","text":"I observed indications that the cooling system (air conditioner) did not produce conditioned cooled air.  It turned on, but did not operate as expected.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"9232af9","type":"defect","title":"Power Was Shut Off Prior to Inspection","text":"I observed that the cooling system was turned off prior to my home inspection.\n\nCondensing unit can be damaged if it's operated immediately after power is restored. Recommend power be restored for at least 8 hours and unit evaluated by licensed HVAC contractor.","sev":"moderate","choices":[]},{"id":"0a6e3fd","type":"info","title":"Maximum Fuse/ Breaker Size","text":"This is the maximum size breaker or fuse that should be supplying this unit.","sev":"minor","choices":[]},{"id":"da1ca91","type":"defect","title":"Unusual Noise","text":"I observed an unexpected, unusual noise coming from the cooling system when it was operating.","sev":"moderate","choices":[]},{"id":"2b43d90","type":"defect","title":"Disconnect Not Within Sight","text":"I observed that the disconnect means was not within sight and not readily accessible from the equipment.","sev":"moderate","choices":[]},{"id":"ea5bcee","type":"defect","title":"Evaporator Rusted","text":"The evaporator, which is on top of the furnace, was rusted.  This is a sign of a current or past leak.  Further evaluation by a licensed HVAC contractor is recommended.","sev":"major","choices":[]},{"id":"b3a0223","type":"info","title":"Cooling System Type","text":"","sev":"minor","choices":["Central Air","Through-The-Wall","Mini-Split","Window Mounted"]},{"id":"88d954a","type":"info","title":"Evaporator Manufacturers Data Tag","text":"","sev":"minor","choices":[]},{"id":"feaa0f4","type":"defect","title":"Condenser Coils Dirty","text":"The air conditioning condenser was dirty.  This can cause the condenser to work harder and fail sooner than expected.  Cleaning of the condenser coils is recommended at least once per year.","sev":"minor","choices":[]}]},{"name":"Thermostat and Normal Operating Controls","c":[{"id":"bee2ddf","type":"defect","title":"Old Thermostat","text":"I observed that the thermostat is very old and should be upgraded to a modern energy-efficient thermostat.","sev":"minor","choices":[]},{"id":"6d0d771","type":"info","title":"Thermostat Location","text":"","sev":"minor","choices":["Dining room","Living room","First floor","Multiple locations","Multiple thermostats","Hallway"]},{"id":"4bbe184","type":"info","title":"Emergency Shut-Off Switch Partially Inspected","text":"I observed an emergency shut-off switch. I visually inspected it. It was not mounted so I did not operate it during the inspection.","sev":"minor","choices":[]},{"id":"4d9bb8e","type":"defect","title":"Inoperable Thermostat","text":"I observed that the thermostat was inoperable.  It did not work.","sev":"moderate","choices":[]},{"id":"1246d36","type":"info","title":"Service Switch Inspected","text":"I observed a service switch. I inspected it. It worked when I used it during my inspection.","sev":"minor","choices":[]},{"id":"aa0537b","type":"defect","title":"Service Switch Did Not Work","text":"I observed that the service switch did not work.","sev":"minor","choices":[]},{"id":"4c1ddf7","type":"defect","title":"Emergency Shut-Off Switch Did Not Work","text":"I observed that the emergency shut-off switch did not work.","sev":"moderate","choices":[]},{"id":"01d7bfa","type":"defect","title":"Blower Panel Safety Switch Did Not Work","text":"The safety switch located at the panel of the circulating blower fan for the cooling system did not operate or function when I inspected it.  Safety issue.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Condensate","c":[{"id":"e5a9e1a","type":"limit","title":"Did Not Operate","text":"LMT - The condensate pump did not operate during my home inspection.  Forcing the pump to discharge is beyond the scope of my home inspection.  Ask the seller for more information about the condensate pump and its past performance.","sev":"minor","choices":[]},{"id":"bd9c846","type":"defect","title":"Defect at Condensate","text":"I observed a defect at the air conditioner's condensate drainage.","sev":"moderate","choices":[]},{"id":"b4233a6","type":"info","title":"Condensate Discharge Confirmed","text":"I observed a discharge pipe apparently connected to the condensate pump installed at the cooling system.","sev":"minor","choices":[]},{"id":"1970f0f","type":"info","title":"Condensate Pump","text":"I observed a condensate pump installed at the cooling system.  This component collects condensate water that is created when the cooling system is operating.  The condensate pump should collect and discharge the water properly.","sev":"minor","choices":[]},{"id":"d2425c1","type":"limit","title":"Discharge Unconfirmed","text":"LMT - I was unable to confirm where the condensate pump discharges.  It should discharge outside and away from the house foundation properly.  Ask the homeowner for more information.","sev":"minor","choices":[]},{"id":"c80fe91","type":"defect","title":"Condensate Discharge Should Be Extended","text":"The condensate discharge pipe should be extended so that the water is diverted far enough away from the house foundation.","sev":"moderate","choices":[]},{"id":"7a34f49","type":"defect","title":"Missing Condensate Pump","text":"I observed indications that a condensate pump should be installed to properly collect and discharge the condensate water created by the air conditioner cooling system.","sev":"moderate","choices":[]},{"id":"3f53036","type":"info","title":"Condensate Discharges To Floor Drain","text":"","sev":"minor","choices":[]},{"id":"5f0456c","type":"info","title":"Condensate Dishcharges To Sump Cro

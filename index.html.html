body{margin:0;font:15px/1.5 "Segoe UI",Arial,sans-serif;color:#1f2937;background:#eef1f5}

.report a{color:inherit;text-decoration:none}.report a:hover{text-decoration:underline}.report [id]{scroll-margin-top:70px}
.srow{display:flex;gap:8px;padding:4px 0;border-bottom:1px solid #e5e7eb;break-inside:avoid}
.dot{width:12px;height:12px;border-radius:50%;margin-top:6px;flex:none}
.counts{display:flex;gap:10px;margin:8px 0}.counts div{flex:1;color:#fff;text-align:center;border-radius:6px;padding:6px;font-weight:700}

 body{background:#fff}header,.noprint{display:none!important}

const BIZ={name:"Card Inspection Services",owner:"Darrin Card",addr:"13316 Cherry St Lake Odessa, MI",phone:"616-262-1270",email:"darrinscard@gmail.com",
creds:"State of Michigan 2101202878, InterNACHI NACHI14032113, ESCO- EPA Approved 551219438510, IICRC 190634251647, IAC2 Radon Certified"};
const DEFAULT_LIB=[{"name":"General Inspection Information","subs":[{"name":"General Inspection Info","c":[{"id":"38d5ba6","type":"limit","title":"The Client Did Not Attend","text":"We invited the client to attend their home inspection. Unfortunately, my client did not attend the home inspection. The client did not learn what the home inspector desired to teach the client about the house. The client was unable to follow the home inspector through the house and ask questions during the inspection. The client's concerns at the time of the inspection were not addressed. This was a restriction and limitation of the home inspection.","sev":"minor","choices":[]},{"id":"7902019","type":"info","title":"In Attendance","text":"I prefer to have my client with me during my inspection so that we can discuss concerns, and I can answer all questions.","sev":"minor","choices":["Client","Client's Agent","Home Owner","Listing Agent","Family of My Client","Just the Inspector","Tennents"]},{"id":"c0bee37","type":"info","title":"Occupancy","text":"","sev":"minor","choices":["Occupied","Vacant","Furnished","Utilities Off"]},{"id":"75bef35","type":"info","title":"Type of Building","text":"","sev":"minor","choices":["Attached","Detached","Single Family","Townhouse","Condominium","Multi-Family","Mobile Home","Commercial","Apartment"]},{"id":"75aca14","type":"info","title":"Weather Conditions","text":"","sev":"minor","choices":["Sunny","Cloudy","Dry","Light Rain","Heavy Rain","Recent Rain","Snow","Very Cold","Cold","Warm","Hot","Windy"]},{"id":"911a79a","type":"info","title":"Outdoor Air Temperature","text":"","sev":"minor","choices":[]},{"id":"481222b","type":"info","title":"Ground Conditions","text":"","sev":"minor","choices":["Dry","Wet","Snow","Ice"]},{"id":"80545f0","type":"info","title":"Well and Septic Inspection","text":"The inspector recommends hiring a well and septic inspector to inspect these systems on your home.\n\nWell Inspection: A water well inspection is an essential step when purchasing a home, as it provides valuable information about the quality and reliability of the water supply. A thorough examination of the well system helps identify any potential issues that may impact the safety, functionality, and long-term viability of the water source.\n\nA water well inspection assesses the quality of the water being supplied to the property. Testing for contaminants such as bacteria, heavy metals, pesticides, or other pollutants is crucial to ensure that the water meets acceptable health and safety standards. Poor water quality can have detrimental effects on the well-being of the residents, leading to health problems or the need for additional filtration or treatment systems. By conducting a water well inspection, potential risks can be identified, and necessary steps can be taken to ensure the water is safe for consumption and everyday use.\n\nAdditionally, a water well inspection evaluates the condition and functionality of the well system itself. It includes an examination of the well's construction, depth, casing, pump, pressure tank, and other components. This assessment helps determine if the well is in good working order and capable of supplying an adequate amount of water to meet the needs of the household. Identifying any issues, such as leaks, low water yield, or mechanical malfunctions, is vital to avoid unexpected disruptions in the water supply or costly repairs in the future. A comprehensive inspection provides buyers with the necessary information to make informed decisions and negotiate any necessary repairs or upgrades as part of the home purchase agreement.\n\nSeptic Inspection :\n\nA septic inspection is a critical component of the home-buying process as it provides crucial information about the condition and functionality of the property's septic system. A thorough inspection helps identify any potential issues that may affect the proper functioning of the system, ensuring that the homebuyer is aware of any necessary repairs or maintenance requirements before finalizing the purchase.\n\nA septic inspection helps assess the overall condition of the septic system and its components. This includes examining the septic tank, distribution box, drainfield, and any associated pipes and connections. By thoroughly inspecting these elements, potential problems such as leaks, blockages, or structural damage can be detected. Identifying these issues is essential to avoid future disruptions, costly repairs, or even system failure, which could lead to health hazards, environmental contamination, and significant financial burden for the homeowner. With a comprehensive septic inspection, homebuyers can make informed decisions and negotiate any necessary repairs or replacements to ensure the septic system's functionality and longevity.\n\nMoreover, a septic inspection helps evaluate the system's compliance with local regulations and requirements. Local health departments or regulatory agencies often have specific guidelines for septic systems, including sizing, location, and maintenance requirements. By conducting a septic inspection, potential buyers can verify if the system meets these standards, ensuring that the property is in compliance with relevant regulations. This knowledge is crucial as non-compliant or outdated septic systems may require costly upgrades or modifications to meet current regulatory standards. Understanding the system's compliance status enables homebuyers to budget for any necessary improvements and avoid future penalties or legal complications associated with non-compliance.","sev":"minor","choices":[]},{"id":"1685e3c","type":"info","title":"Wood Destroying Organism Inspection","text":"A wood-destroying insect inspection, often referred to as a termite inspection, is a crucial step when purchasing a home as it helps identify any existing or potential damage caused by wood-destroying pests. These pests, including termites, carpenter ants, and wood-boring beetles, can cause significant structural damage to a property, compromising its integrity and resulting in costly repairs. By conducting a thorough wood-destroying insect inspection, potential buyers can uncover any existing infestations or conditions conducive to infestations, allowing them to make informed decisions and take necessary precautions to protect their investment.\n\nDuring the inspection, a qualified professional examines various areas of the property, including the foundation, crawl spaces, attics, and visible wood structures. They assess signs of pest activity, such as mud tubes, discarded wings, or damaged wood, and look for conditions that may attract or support wood-destroying insects. Identifying these issues early on is vital, as it allows buyers to negotiate repairs or treatment with the seller or seek professional advice to mitigate the infestation risk.\n\nMoreover, a wood-destroying insect inspection provides peace of mind to the homebuyer. Knowing that the property is free from current infestations or having the awareness of any issues allows buyers to plan and budget for any necessary treatments or preventative measures. Additionally, some mortgage lenders may require a wood-destroying insect inspection as a condition for loan approval, further emphasizing its importance in the home-buying process. Ultimately, a comprehensive wood-destroying insect inspection is essential in ensuring the structural integrity of the home and safeguarding against potential financial and safety risks associated with wood-destroying pests.","sev":"minor","choices":[]},{"id":"84d635f","type":"info","title":"Survey","text":"A survey is an essential component of the home-buying process as it provides crucial information about the property's boundaries, easements, encroachments, and potential legal issues. By conducting a thorough survey, potential buyers can gain a clear understanding of the property's physical boundaries and ensure that there are no encroachments from neighboring properties or other structures. This knowledge helps protect the buyer's investment and prevents potential boundary disputes or legal complications in the future.\n\nAdditionally, a survey helps identify any easements or rights-of-way that may affect the property. Easements grant others the right to use a portion of the property for specific purposes, such as utility access or shared driveways. It is crucial for homebuyers to be aware of any easements on the property as they may impact the use and enjoyment of the land. Furthermore, a survey can reveal any potential issues such as encroachments from neighboring properties, which occur when structures or improvements extend beyond the property boundaries. Identifying these encroachments early on allows buyers to address the issue with the seller and potentially seek remedies to rectify the situation, ensuring that the property boundaries are accurately represented and avoiding future disputes.","sev":"minor","choices":[]},{"id":"3ad3780","type":"info","title":"Chimney & Fireplace Inspection","text":"A fireplace and chimney inspection is a crucial step when purchasing a home due to the potential safety hazards and costly repairs associated with neglected or damaged fireplaces and chimneys. These inspections help identify any issues or deficiencies that may compromise the functionality and safety of the system. It is highly recommended to engage a Chimney Safety Institute of America (CSIA) certified professional for this inspection, as their expertise ensures a thorough evaluation of the fireplace and chimney.\n\nA professional fireplace and chimney inspection examines the structural integrity, ventilation, and cleanliness of the system. It assesses the condition of the chimney liner, flue, damper, masonry, and any connected components, such as fireplace doors or chimney caps. The inspection can reveal problems such as blockages, creosote buildup, cracks in the masonry, damaged flue tiles, or improper installation. Detecting these issues early on is crucial for the safety of the occupants and the prevention of potential hazards, such as chimney fires or carbon monoxide leaks. By utilizing a CSIA certified professional, homebuyers can have confidence in the accuracy and expertise of the inspection, ensuring a thorough evaluation of the fireplace and chimney's condition.","sev":"minor","choices":[]},{"id":"05dab08","type":"info","title":"Sewer Scope","text":"A sewer camera scope inspection is an essential step when purchasing a home as it helps identify any hidden issues within the sewer lines and provides valuable information about the condition of the plumbing system. This inspection involves inserting a specialized camera into the sewer lines to visually inspect the pipes, identifying any blockages, leaks, or potential problems. By conducting a sewer camera scope inspection, potential buyers can uncover potential issues that may lead to costly repairs or maintenance in the future.\n\nDuring the inspection, a professional plumber or sewer technician will assess the integrity of the sewer lines, looking for cracks, tree root intrusions, pipe misalignments, or other damage. Detecting these issues early on allows buyers to negotiate repairs or replacements with the seller or plan for future maintenance. Furthermore, a sewer camera scope inspection can help identify any blockages or obstructions in the pipes, which can lead to backups, slow drainage, or sewer system failures. By addressing these problems prior to purchasing the home, buyers can avoid the inconvenience and expense associated with sewer line issues.","sev":"minor","choices":[]},{"id":"ec7e69c","type":"info","title":"Sewer Scope- Lake Odessa","text":"Lake Odessa requires a sewer scope be performed on every home purchase.  This also requires a form from the Lake Odessa Sewer Authority be filled out.  Further information and a quote for this scope should be obtained before your inspection objection deadline.\n\nA sewer camera scope inspection is an essential step when purchasing a home as it helps identify any hidden issues within the sewer lines and provides valuable information about the condition of the plumbing system. This inspection involves inserting a specialized camera into the sewer lines to visually inspect the pipes, identifying any blockages, leaks, or potential problems. By conducting a sewer camera scope inspection, potential buyers can uncover potential issues that may lead to costly repairs or maintenance in the future.\n\nDuring the inspection, a professional plumber or sewer technician will assess the integrity of the sewer lines, looking for cracks, tree root intrusions, pipe misalignments, or other damage. Detecting these issues early on allows buyers to negotiate repairs or replacements with the seller or plan for future maintenance. Furthermore, a sewer camera scope inspection can help identify any blockages or obstructions in the pipes, which can lead to backups, slow drainage, or sewer system failures. By addressing these problems prior to purchasing the home, buyers can avoid the inconvenience and expense associated with sewer line issues.","sev":"minor","choices":[]}]},{"name":"Your Job As a Homeowner","c":[{"id":"48d184b","type":"info","title":"What Really Matters in a Home Inspection","text":"Now that you've bought your home and had your inspection, you may still have some questions about your new house and the items revealed in your report.\n\nHome maintenance is a primary responsibility for every homeowner, whether you've lived in several homes of your own or have just purchased your first one. Staying on top of a seasonal home maintenance schedule is important, and your InterNACHI Certified Professional Inspector can help you figure this out so that you never fall behind. Don't let minor maintenance and routine repairs turn into expensive disasters later due to neglect or simply because you aren't sure what needs to be done and when.\n\nYour home inspection report is a great place to start. In addition to the written report, checklists, photos, and what the inspector said during the inspection not to mention the sellers disclosure and what you noticed yourself it's easy to become overwhelmed. However, it's likely that your inspection report included mostly maintenance recommendations, the life expectancy for the home's various systems and components, and minor imperfections. These are useful to know about.\n\nBut the issues that really matter fall into four categories:\n\n\u2022 major defects, such as a structural failure;\n\n\u2022 things that can lead to major defects, such as a small leak due to a defective roof flashing;\n\n\u2022 things that may hinder your ability to finance, legally occupy, or insure the home if not rectified immediately; and\n\n\u2022 safety hazards, such as an exposed, live buss bar at the electrical panel.\n\nAnything in these categories should be addressed as soon as possible. Often, a serious problem can be corrected inexpensively to protect both life and property (especially in categories 2 and 4).\n\nMost sellers are honest and are often surprised to learn of defects uncovered during an inspection. It's important to realize that sellers are under no obligation to repair everything mentioned in your inspection report. No house is perfect. Keep things in perspective as you move into your new home.\n\nAnd remember that homeownership is both a joyful experience and an important responsibility, so be sure to call on your InterNACHI Certified Professional Inspector to help you devise an annual maintenance plan that will keep your family safe and your home in good condition for years to come.","sev":"minor","choices":[]},{"id":"81d9cec","type":"info","title":"Schedule a Home Maintenance Inspection","text":"Even the most vigilant homeowner can, from time to time, miss small problems or forget about performing some routine home repairs and seasonal maintenance. That's why an Annual Home Maintenance Inspection will help you keep your home in good condition and prevent it from suffering serious, long-term and expensive damage from minor issues that should be addressed now.\n\nThe most important thing to understand as a new homeowner is that your house requires care and regular maintenance. As time goes on, parts of your house will wear out, break down, deteriorate, leak, or simply stop working. But none of these issues means that you will have a costly disaster on your hands if you're on top of home maintenance, and that includes hiring an expert once a year.\n\nJust as you regularly maintain your vehicle, consider getting an Annual Home Maintenance Inspection as part of the cost of upkeep for your most valuable investment your home.\n\nYour InterNACHI-Certified Professional Inspector can show you what you should look for so that you can be an informed homeowner. Protect your family's health and safety, and enjoy your home for years to come by having an Annual Home Maintenance Inspection performed every year.\n\nSchedule next year's maintenance inspection with your home inspector today!\n\nEvery house should be inspected every year as part of a homeowner's routine home maintenance plan. Catch problems before they become major defects.","sev":"minor","choices":[]}]},{"name":"Buy Back Guarantee","c":[{"id":"5dac218","type":"info","title":"We'll Buy Your Home Back","text":"If your participating inspector misses a covered item, we'll buy your home.\n\nAdditional terms and conditions apply, including:\n\n\u2022 A home with material defects not present at the time of the inspection, per InterNACHI's Standards of Practice, is not eligible for buy-back.\n\n\u2022 A home with issues not required to be inspected, per InterNACHI's Standards of Practice, is not eligible for buy-back.\n\n\u2022 The Guarantee applies to your primary residence only.\n\n\u2022 The home must be listed for sale with a licensed real estate agent.\n\n\u2022 The Guarantee may be honored for up to 90 days after closing.\n\n\u2022 The inspection must be performed by an InterNACHI\u00ae Certified Professional Inspector\u00ae already participating in the Buy-Back Program.\n\n\u2022 We will pay you the purchase price, but you are responsible for any applicable fees and real estate commissions.\n\nMore Legal Terms:  www.nachi.org/buy-legal (Please read these binding legal terms carefully.)\n\nFor more information, please visit www.nachi.org/buy.","sev":"minor","choices":[]}]},{"name":"$10,000 Honor Guarantee","c":[{"id":"6c2eca3","type":"info","title":"Details","text":"InterNACHI is so certain of the integrity of our members that we back them up with our $10,000 Honor Guarantee.\n\nInterNACHI will pay up to $10,000 USD for the cost of replacement of personal property lost during an inspection and stolen by an InterNACHI-certified member who was convicted of or pleaded guilty to any criminal charge resulting from the member's taking of the client's personal property.\n\nFor details, please visit www.nachi.org/honor.","sev":"minor","choices":[]}]},{"name":"Important Information/ Limitations","c":[{"id":"1abf81c","type":"limit","title":"Personal Belongings Limitations","text":"LMT - Personal belongings were present in the home at the time of inspection. These personal belongings were not moved or altered in any way. These belongings can block visual accessibility of several items throughout the home, including but not limited to wall and floor surfaces, receptacles, air registers, closets, cabinet floor and wall surfaces, under sink plumbing, etc. This inspection is limited to visual portions only, as furniture is not moved, rugs are not lifted, and cabinet and closet storage is not rearranged for the sake of visual accessibility. It is highly recommended that you evaluate areas where personal belongings were present for defects during your final walk-through or at some point after these belongings have been removed. If any concerns are noticed during your final walk-through, feel free to contact me","sev":"minor","choices":[]},{"id":"24dcc20","type":"info","title":"Inspection Overview","text":"Card Inspection Services, LLC strives to perform all inspections in substantial compliance with the Standards of Practice set forth by the International Association of Certified Home Inspectors (InterNACHI) . As such, I inspected the readily accessible, visually observable, installed systems and components of the structure, as designated in these Standards of Practice. When systems or components designated in the Standards of Practice were present but were not inspected, the reason(s) the item was not inspected will be stated. This inspection is neither technically exhaustive nor quantitative.\n\nThere may be comments made in this report that exceed the required reporting standards; these comments (if present) were made as a courtesy to give you as much information as possible about the structure. Exceeding the Standards of Practice will only happen when I feel I have the experience, knowledge, or evidence to do so. There should be no expectation that the Standards of Practice will be exceeded throughout the inspection. Any comments made that exceed the standards will be followed by a recommendation for further evaluation and repairs by applicable tradespeople.\n\nThis report contains observations of those systems and components that were not functioning properly, significantly deficient, or unsafe in my professional judgment. All items in this report that were designated for repair, replacement, maintenance, or further evaluation should be investigated by qualified tradespeople within the clients' contingency period to determine the total cost of said repairs and to learn of any additional problems that may be present during these evaluations that were not visible during a \"visual only\" Inspection.\n\nThis inspection is not equal to extended day-to-day exposure. It will not reveal every concern or issue that may be present, but only those significant defects that were accessible and visible at the time of inspection. This inspection can not predict future conditions or determine if latent or concealed defects exist. The statements made in this report reflect the conditions as existing at the time of the inspection only and expire at the completion of the inspection. The limit of liability of Card Inspections Services, LLC and its employees, officers, etc., does not extend beyond the day the inspection was performed. This is because time and differing weather conditions may reveal deficiencies that were not present at the time of inspection, including but not limited to: roof leaks, water infiltration into areas below grade, leaks beneath sinks, tubs, and toilets, water running at toilets, the walls, doors, and flooring, may be damaged during moving, etc. Refer to the Standards of Practice (linked here) and the Inspection agreement regarding the scope and limitations of this inspection.\n\nThis inspection is NOT intended to be considered a GUARANTEE OR WARRANTY, EXPRESSED OR IMPLIED, regarding the operation, function, or future reliability of the structure and its components. AND IT SHOULD NOT BE RELIED ON AS SUCH. This report is only supplemental to the Sellers Disclosure and Pest (WDI) Inspection Report. It should be used alongside these documents, along with quotes and advice from the tradespeople recommended in this report to understand the condition of the structure better and expected repair costs. Some risk is always involved when purchasing a property, and unexpected repairs should be anticipated, which is, unfortunately, a part of homeownership. One-Year Home Warranties are sometimes provided by the sellers and are highly recommended as they may cover future repairs on major items and components of the home. If a warranty is not provided by the seller(s), your Realtor can advise you of companies that offer them.\n\n\u00a9 Copyright Notice: This report is the property of Card Inspection Services, llc. The Client(s) and their Direct Real Estate Representative named herein have been named licensee(s) of this document. This document is non-transferrable, in whole or in part, to any third parties, including; subsequent buyers, sellers, and listing agents. Copying and pasting deficiencies to prepare the repair request is permitted. THE INFORMATION IN THIS REPORT SHALL NOT BE RELIED UPON BY ANYONE OTHER THAN THE CLIENT NAMED HEREIN. This report is governed by an Inspection agreement that contained the scope of the inspection, including limitations, exclusions, and conditions of the copyright. Unauthorized recipients are advised to contact a qualified Home Inspector of their choosing to provide them with their own Inspection and Report.\n\nThere may be comments made in this report that exceed the required reporting standards; these comments (if present) were made as a courtesy to give you as much information as possible about the structure. Exceeding the Standards of Practice will only happen when I feel I have the experience, knowledge, or evidence to do so. There should be no expectation that the Standards of Practice will be exceeded throughout the inspection. Any comments made that exceed the standards will be followed by a recommendation for further evaluation and repairs by applicable tradespeople.\n\nThis report contains observations of those systems and components that were not functioning properly, significantly deficient, or unsafe in my professional judgment. All items in this report that were designated for repair, replacement, maintenance, or further evaluation should be investigated by qualified tradespeople within the clients' contingency period to determine the total cost of said repairs and to learn of any additional problems that may be present during these evaluations that were not visible during a \"visual only\" Inspection.\n\nThis inspection is not equal to extended day-to-day exposure. It will not reveal every concern or issue that may be present, but only those significant defects that were accessible and visible at the time of inspection. This inspection can not predict future conditions or determine if latent or concealed defects exist. The statements made in this report reflect the conditions as existing at the time of the inspection only and expire at the completion of the inspection. The limit of liability of Card Inspections Services, LLC and its employees, officers, etc., does not extend beyond the day the inspection was performed. This is because time and differing weather conditions may reveal deficiencies that were not present at the time of inspection, including but not limited to: roof leaks, water infiltration into areas below grade, leaks beneath sinks, tubs, and toilets, water running at toilets, the walls, doors, and flooring, may be damaged during moving, etc. Refer to the Standards of Practice (linked here) and the Inspection agreement regarding the scope and limitations of this inspection.\n\nThis inspection is NOT intended to be considered a GUARANTEE OR WARRANTY, EXPRESSED OR IMPLIED, regarding the operation, function, or future reliability of the structure and its components. AND IT SHOULD NOT BE RELIED ON AS SUCH. This report is only supplemental to the Sellers Disclosure and Pest (WDI) Inspection Report. It should be used alongside these documents, along with quotes and advice from the tradespeople recommended in this report to understand the condition of the structure better and expected repair costs. Some risk is always involved when purchasing a property, and unexpected repairs should be anticipated, which is, unfortunately, a part of homeownership. One-Year Home Warranties are sometimes provided by the sellers and are highly recommended as they may cover future repairs on major items and components of the home. If a warranty is not provided by the seller(s), your Realtor can advise you of companies that offer them.\n\n\u00a9 Copyright Notice: This report is the property of Card Inspection Services, llc. The Client(s) and their Direct Real Estate Representative named herein have been named licensee(s) of this document. This document is non-transferrable, in whole or in part, to any third parties, including; subsequent buyers, sellers, and listing agents. Copying and pasting deficiencies to prepare the repair request is permitted. THE INFORMATION IN THIS REPORT SHALL NOT BE RELIED UPON BY ANYONE OTHER THAN THE CLIENT NAMED HEREIN. This report is governed by an Inspection agreement that contained the scope of the inspection, including limitations, exclusions, and conditions of the copyright. Unauthorized recipients are advised to contact a qualified Home Inspector of their choosing to provide them with their own Inspection and Report.","sev":"minor","choices":[]},{"id":"20b4af8","type":"info","title":"Comment Key - Definitions","text":"This report places deficiencies into three categories; Significant/Major Defects, Marginal Defects, and Minor Defects/Maintenance Items/FYI.\n\n1. Significant Defects - These are items or components that are non-functional, pose a serious safety concern, or require significant expenses to rectify. It is recommended that a Qualified Contractor evaluate and bids are received for these items before the end of your inspection contingency period.\n\n2. Marginal Defects - These include items or components with safety hazards, functional deficiencies, or installation-related issues. Although these items may have been functional during the inspection, their performance may be impaired or lead to future problems.  The majority of comments will fall into this catagory.  It is recommended these repairs be evaluated and bids obtained for repair prior to the end of your inspection period.  It is advised to repair or replace these items to ensure optimal performance and prevent adverse conditions. These repair are typically done by a Handyman or Qualified Contractor and are not considered routine maintenance or DIY repairs.\n\n3. Minor Defects/Maintenance Items - This category covers items or components that require minor repairs to enhance functionality. It also includes items in need of recurring or basic general maintenance. Observations, important information, and recommended upgrades may also fall into this category.\n\nThese categorizations are based on professional judgment and observations made during the inspection.  Something that seems minor at the time of the inspection could end up being a major repair and vise-versa. Categorical placement should not be taken to mean that \"Minor defects\" or \"Marginal Defects\" do not require repairs or replacement. The recommendations provided for each item are more important than the category assigned. Your perception, opinions, or personal experience may lead you to assign a different importance to certain defects during your purchasing decision. Neglecting attention, repairs, servicing, and/or maintenance can worsen the condition of items initially designated as less severe.\n\nAdditional Designations:  These designations may be used throughout the report to provide additional clarification on the condition of an item.  Not every comment will contain these designations.\n\nLMT: Limitation: This designation indicates that there were inspection limitations for the item, system, area, or component. These limitations could include visibility restrictions, accessibility issues, or items that were shut off. It is recommended that follow-up evaluations be performed as desired prior to the end of the inspection contingency period.\n\nEXCL: Excluded: This designation means that the item, system, area, or component is outside the scope of the home inspection, was not accessible or visible, or for other reasons specified in the corresponding comment. It is advisable to conduct follow-up evaluations for these designated items or areas as desired before the end of the inspection contingency period.\n\nSFTY: Safety Concern: This designation is used when an item, system, area, or component represents a safety concern or hazard. It is crucial to address these issues promptly by engaging a qualified professional.\n\nAGED: Aged: This designation is given to items, systems, or components that are nearing, at, or past their typical service life. While aged components are not deficiencies in themselves, major repairs or replacements should be anticipated for items designated as being at or past the end of their typical life. Depending on the item, these repairs or replacements can involve significant expenses, such as HVAC systems, water heaters, plumbing pipes, aged wiring, electrical panels, etc.","sev":"minor","choices":[]},{"id":"bcc6c7f","type":"limit","title":"Condominium Limitations","text":"This inspection was conducted for a condominium property. It is important to note that certain areas and systems within a condominium may fall under the responsibility of the condominium association and are not included in this home inspection. These typically include, but are not limited to, the roof, attic spaces, exterior walls, and common or shared systems such as plumbing, electrical, and HVAC components located outside the unit.\n\nAs these areas are generally maintained by the condominium association, they were not inspected. Buyers are advised to review the condominium association\u2019s bylaws, maintenance agreements, and any recent inspection reports for these areas. If concerns exist about these systems, additional evaluation by the condominium association or appropriate professionals is recommended.\n\nThis limitation ensures the inspection remains focused on the areas within the condominium unit itself, which are typically the responsibility of the unit owner.","sev":"minor","choices":[]},{"id":"ba615bc","type":"info","title":"Other Notes- Important Information","text":"INACCESSIBLE AREAS - In the report, there may be specific references to areas and items that were inaccessible or only partly accessible. I can make no representations regarding conditions that may be present in these areas that were concealed or inaccessible for review. With access and an opportunity for inspection, reportable conditions or hidden damage may be found in areas that were not accessible or only partly accessible. These conditions or damage are excluded from this inspection.\n\nQUALITATIVE vs. QUANTITATIVE - A home inspection is not quantitative. When multiple or similar parts of a system, item, or component are found to have a deficiency, the deficiency will be noted in a qualitative manner, such as \"multiple present,\" etc. A quantitative number of deficient parts, pieces, or items will not be given as the repairing contractor will need to evaluate and ascertain the full amount or extent of the deficiency or damage. This is not a technically exhaustive inspection.\n\nREPAIRS VERSUS UPGRADES - I inspect homes to today's safety and building standards. Therefore some recommendations made in this report may not have been required when the home was constructed and could be considered non-conforming. Building standards change and are improved for the safety and benefit of the occupants of the home, and therefore any repairs and/or upgrades mentioned in this report should be considered for safety, performance, and the longevity of the home's items and components. Although I will address some recommended upgrades in the report, this should not be construed as a full listing of items that could potentially be upgraded. To learn of ALL the ways the home could be brought up to today's building and safety standards, full and exhaustive evaluations should be conducted by qualified tradespeople.\n\nCOMPONENT LIFE EXPECTANCY - Components may be listed as having no deficiencies at the time of inspection but may fail at any time due to their age or lack of maintenance, which couldn't be determined by the inspector.  A life expectancy chart of most systems found within a home can be found at InterNACHI's Standard Estimated Life Expectancy Chart for Homes\n\nPHOTOGRAPHS - Several photos are included in your inspection report as a courtesy and are not required by Standards of Practice. These photos are for informational purposes only and do not attempt to show every instance or occurrence of a defect.\n\nTYPOGRAPHICAL ERRORS - This report is proofread before sending it out, but typographical errors may be present. If any errors are noticed, please feel free to contact me for clarification.\n\nPlease acknowledge once you have completed reading this report. At that time, I will be happy to answer any questions you may have or provide clarification. Non-acknowledgement implies that you understood all information contained in this report.","sev":"minor","choices":[]},{"id":"9fff938","type":"info","title":"Recommended Contractors Information","text":"CONTRACTORS/FURTHER EVALUATION Information - It is HIGHLY recommended that licensed professionals are used for repairs or replacement of deficiencies referenced in this report, and copies of their receipts/invoices are provided to you for warranty purposes.\n\nThe use of the term \"Qualified Professional\" or \"Qualified Person\" in this report relates to an individual, company, or contractor who is either licensed or certified in the field of concern. If I recommend evaluation or repairs to be performed by contractors or other licensed professionals, they may discover additional problems since they will be invasive with their evaluation and repairs. Any listed items in this report concerning areas reserved for such experts should not be construed as a detailed, comprehensive, and/or exhaustive list of problems or areas of concern.\n\nCAUSES of DAMAGE / METHODS OF REPAIR: Any suggested causes of damage or defects and methods of repair mentioned in this report are considered a professional courtesy to assist you in better understanding the condition of the home, and in my opinion, only from the standpoint of a visual inspection, and should not be wholly relied upon. Contractors or other licensed professionals will have the final determination on the causes of damage/deficiencies and the best methods of repairs due to being invasive with their evaluation. Their evaluation will supersede the information found in this report.","sev":"minor","choices":[]},{"id":"c85f78a","type":"info","title":"Specialty Tools Information","text":"LMT - Specialty tools, testers, meters, and the like may have been used during this inspection and photographed in this report. The use of any of these tools is beyond the scope of a home inspection and was done as a courtesy to provide you with as much information as possible about the property.\n\nQuantitative readings will not be provided in this report. Although readings or other quantitative values may be represented in photographs, these values should not be wholly relied upon as they can change from day to day, with differing conditions.","sev":"minor","choices":[]}]},{"name":"Utility Disconnect Locations","c":[{"id":"ff2b412","type":"info","title":"Main Electrical Disconnect Location","text":"The electrical disconnect pictured will disconnect power to the home in case of emergency.  Testing should still be completed to be certain power is off to all circuits before repairs are performed.","sev":"minor","choices":["Exterior","Front","Right","Left","Rear","Basement","Closet","Bedroom","Hallway","Kitchen","Bathroom","Living Room","Utility Room","Garage"]},{"id":"4eb2c8d","type":"info","title":"Main Water Valve Location","text":"The water valve pictured will disconnect the water supply in the home in case of an emergency.  While water will be disconnected, there may still be water in pipes, water heaters, etc.  Care should be taken when servicing the system.","sev":"minor","choices":["Exterior","Front","Right","Left","Rear","Basement","Closet","Bedroom","Hallway","Kitchen","Bathroom","Living Room","Utility Room","Crawlspace"]},{"id":"2741187","type":"info","title":"Main Gas/ Fuel Disconnect","text":"The valve in the picture will disconnect the fuel supply to the home in an emergency.  In order to turn off the emergency control valve (ECV) under the meter a 12 to 18 inch pipe wrench is typically needed.","sev":"minor","choices":["Exterior","Front","Right","Left","Rear","Basement","Closet","Bedroom","Hallway","Kitchen","Bathroom","Living Room","Utility Room"]}]}]},{"name":"Roof","subs":[{"name":"Roof Covering","c":[{"id":"dc17c1b","type":"limit","title":"General Roof Inspection Limitations","text":"LMT- This is a visual-only inspection of the roof-covering materials. It does not include an inspection of the entire system. There are components of the roof that are not visible or accessible at all, including the underlayment, decking, fastening, flashing, age, shingle quality, manufacturer installation recommendations, etc.   The inspection is limited to the conditions on the day of the inspection only.  Future conditions and inclement weather may reveal leaks that were not present at the time of the inspection.  Any deficiencies noted in this report with the roof covering or indications of past or present leaks should be evaluated and repaired as needed by a licensed roofing contractor.","sev":"minor","choices":[]},{"id":"c1a12b0","type":"defect","title":"Shingles- Black Staining and/ or Algae or Moss","text":"Black staining is caused be an algae which is growing within the shingle substrate and feeding on the gypsum filler used in shingle manufacturing.  The Moss and algae will damage the shingle structure and reduce the life of the shingle.\n\nCorrective steps\n\nCleaners are available at home centers that can be used to remove the growth.  For areas with heavier growth a soft bristled brush can be used to remove the growth.  Copper flashing can also be installed at the ridge of the roof.  The chemicals in the copper will help to prevent the growth.  Click Here for more information on cleaning your roof.","sev":"minor","choices":[]},{"id":"96180df","type":"info","title":"Type of Roof-Covering Described","text":"","sev":"minor","choices":["Three Tab Asphalt Shingle","Flat Roof Material","Tile","Dimensional Asphalt Shingle","Concrete","Slate","Metal- Exposed Fasteners","Wood","EPDM Rubber Roof","Metal- Standing Seam","Aluminum Coating","Unidentified","90# Rolled Roofing","Asphalt Locking Shingles"]},{"id":"7a9f6c1","type":"defect","title":"Shingles- Lifting or Loose","text":"The inspector noted loose or lifting shingles on the roof.  Shingles that have a weak bond can be easily lifted.  These shingles could become damaged in wind allowing water to penetrate the roof structure.  This is marked as a minor defect as the repair is relatively easy, however it should be completed soon, as left un-repaired the damage will increase and could result in replacement of shingles.\n\nCorrective steps\n\nThe inspector recommends sealing the shingles by applying roofing tar near the leading edge.  All shingles should be tested for broken bonds by gently lifting the leading edge of the shingle.  For more information on sealing the shingles click here.  This is marked as a minor defect as the repair is relatively easy, however it should be completed soon, as left un-repaired the damage will increase and could result in replacement of shingles.","sev":"minor","choices":[]},{"id":"ad4742c","type":"info","title":"Roof Inspection Method(s)","text":"","sev":"minor","choices":["Walked Roof","Ladder","Aerial Drone","From Ground","Binoculars From Ground"]},{"id":"cf69092","type":"limit","title":"Unable to Walk Upon Roof Surface","text":"LMT- According to the Home Inspection Standards of Practice, a home inspector is not required to walk upon any roof surface.  However, as courtesy only, I attempted to walk upon the parts of the roof surface.  Areas may not have been safe to walk or were not accessible. This was a restriction to my inspection of the roof system.  You may want to consider hiring a professional roofer with a lift to check your roof system.","sev":"minor","choices":[]},{"id":"f1d57a4","type":"info","title":"Amount of Roof Safely Walkable","text":"","sev":"minor","choices":[]},{"id":"f404d49","type":"defect","title":"Shingles- Coating Shows Signs Of Wear","text":"The shingle coating, also called aggregate, is showing signs of wear.  This will be labeled orange for moderate if the shingles are showing a moderate loss of aggregate.  It will be labeled red if the shingles are showing a sever loss of aggregate.  This is typical as the shingle ages and is used to determine the age of the shingle.  As shingles age and the aggregate is lost it exposes the substrate of the shingle to weather and uv rays.  This will breakdown the protective layer of the shingle and eventually cause leaks.  At this point the inspector cannot accurately determine the remaining life of the shingles.\n\nCorrective steps\n\nThe inspector recommends inspection of the roof at least once a year by a licensed roofing professional in order to prevent leaks and damage to the structure.","sev":"major","choices":[]},{"id":"f1f25a2","type":"limit","title":"Snow Covering the Roof","text":"LMT- There was snow covering the roof surface.  This was an inspection restriction.  I was unable to observe everything that I needed to see, because of the snow.  This may have also prevented walking all or parts of the roof.  Recommend further evaluation at a later date when the snow has melted.","sev":"minor","choices":[]},{"id":"48bc3a2","type":"defect","title":"Shingles- Exposed Fasteners","text":"During the inspection, indications of exposed fasteners were observed at the roof-covering materials.  Exposed fasteners can create potential water entry points, which may lead to roof leaks and hidden damage. Fasteners should be properly sealed to prevent water infiltration and protect the roof structure.\n\nCorrective steps\n\nIt is recommended that the exposed fasteners be sealed with a roof sealant or tar to prevent water entry and potential damage. Prompt attention to this issue will help maintain the integrity of the roof and prevent further deterioration.","sev":"minor","choices":[]},{"id":"8e6c583","type":"info","title":"Homeowner's Responsibility","text":"Your job as the homeowner is to monitor the roof covering because any roof can leak. To monitor a roof that is inaccessible or that cannot be walked on safely, use binoculars. Look for deteriorating or loosening of flashing, signs of damage to the roof covering and debris that can clog valleys and gutters.\n\nRoofs are designed to be water-resistant. Roofs are not designed to be waterproof. Eventually, the roof system will leak. No one can predict when, where or how a roof will leak.\n\nEvery roof should be inspected every year as part of a homeowner's routine home maintenance plan. Catch problems before they become major defects.","sev":"minor","choices":[]},{"id":"4094011","type":"info","title":"Roof Material- Shingle Stage of Life Estimation","text":"","sev":"minor","choices":["First Third of Life","Second Third of Life","Last Third of Life","Past Useful Life"]},{"id":"869faaa","type":"limit","title":"Inspection Method: Inspected by Drone","text":"LMT - An aerial drone was used for the roof evaluation. It is understood that this method of inspection is not as thorough as if the roof surface was able to be walked, and is considered a limited inspection. Any comments made in this report relating to the roof covering, roof protrusions, gutters, chimneys, etc. are limited to the visible perspective of the drone. If a more thorough inspection is desired I recommend consulting a roofing contractor prior to the end of your inspection contingency.\n\nLMT - An aerial drone was used for the roof evaluation. It is understood that this method of inspection is not as thorough as if the roof surface was able to be walked, and is considered a limited inspection. Any comments made in this report relating to the roof covering, roof protrusions, gutters, chimneys, etc. are limited to the visible perspective of the drone. If a more thorough inspection is desired I recommend consulting a roofing contractor prior to the end of your inspection contingency.","sev":"minor","choices":[]},{"id":"967c06f","type":"defect","title":"Shingles-  Buckling","text":"During the inspection the inspector noted the shingles are buckling.  Buckling shingles appear as if they are being pushed upward from beneath. This condition can occur due to several reasons, including moisture absorption by the roof decking, poor attic ventilation, improper installation, or inadequate spacing between roof deck panels.  Moisture can cause the roof decking to expand and contract, leading to the shingles buckling. Additionally, poor ventilation can trap heat and moisture in the attic, exacerbating the issue.\n\nCorrective steps\n\nTo repair buckling shingles, it is recommended to contact a professional roofing contractor. The contractor can assess the extent of the damage and determine the underlying cause. Repairs may involve improving attic ventilation, replacing damaged shingles, and ensuring proper installation techniques are followed.","sev":"moderate","choices":[]},{"id":"683a839","type":"defect","title":"Shingles- Delamination","text":"During the inspection, shingles that are delaminating were observed on the roof.  Delaminating shingles occur when the layers of the shingles begin to separate or peel apart. This condition can be caused by several factors, including manufacturing defects, prolonged exposure to harsh weather conditions, or improper installation. Delamination compromises the shingles' ability to protect the roof from water infiltration, leading to potential leaks and damage to the underlying roof structure.\n\nCorrective steps\n\nTo address delaminating shingles, it is recommended to contact a professional roofing contractor. The contractor can assess the extent of the damage and determine the best course of action. Repairs may involve replacing the affected shingles and ensuring that the new shingles are properly installed to prevent future delamination.","sev":"moderate","choices":[]},{"id":"4d8a3f7","type":"info","title":"Shingles Stages of Life Information","text":"The inspector will attempt to estimate the stage of life that the shingles appeared to be in at the time of inspection.  Shingle life can be affected by many factors.  This should not be considered a guarantee or warranty of the remaining life of the shingles.\n\n3-tab asphalt composition shingles typically have a 12-15 year life span. This would equate to:\n\n\u2022 First Third of Life: 1-5 years in age\n\n\u2022 Second Third of Life: 5-10 years in age\n\n\u2022 Last Third of Life: 10-15 years in age\n\nArchitectural Composition shingles typically have a 21-24 year life span. This would equate to:\n\n\u2022 First Third of Life: 1-8 years in age\n\n\u2022 Second Third of Life: 8-16 years in age\n\n\u2022 Last Third of Life: 16-24 years in age","sev":"minor","choices":[]},{"id":"a784e3e","type":"defect","title":"Shingles- Patched","text":"Shingle appeared to have been patched.  This could indicate a roof leak existed.  This will be labeled blue when the visible portion of the patchwork appeared to meet current standards, orange when the patchwork appeared to have not met current standards but appeared to be resistant to water infiltration, or red when the patchwork appeared to have been improper, leaking, or in the inspector's opinion could leak.\n\nWhen patching shingles an underlayment must be installed properly to direct water away from the area to prevent leaks.  The underlayment is not visible during a home inspection.  If the underlayment or shingles were not installed properly, it is possible hidden damage may exist.\n\nCorrective steps\n\nThe inspector recommends monitoring this area monthly for leaks or have a licensed roofing professional evaluate the patch.","sev":"minor","choices":[]},{"id":"92e7e73","type":"info","title":"Three Tab Asphalt Shingles","text":"Three-tab asphalt shingles are roofing materials composed of a single layer of asphalt and fiberglass mat. These shingles are commonly used in residential construction due to their cost-effectiveness and practicality.\n\nAdvantages of Three-Tab Asphalt Shingles:\n\n\u2022\nAffordability - Three-tab shingles are generally less expensive compared to architectural shingles, making them a cost-effective option for budget-conscious homeowners.\n\n\u2022\nLightweight - The single-layer construction of three-tab shingles contributes to their lightweight nature, making them easier to install and reducing the overall stress on the roof structure.\n\n\u2022\nTraditional Appearance - Three-tab shingles offer a classic, uniform look with a consistent pattern, which can be appealing for those seeking a more traditional aesthetic for their roof.\n\nDisadvantages of Three-Tab Asphalt Shingles:\n\n\u2022\nLimited Design Options - Compared to architectural shingles, three-tab shingles provide fewer design choices in terms of shape, texture, and color variations, which may restrict homeowners looking for more customization options.\n\n\u2022\nLess Durability - Due to their single-layer design, three-tab shingles are generally less durable and more prone to damage from harsh weather conditions, such as strong winds and hail.\n\n\u2022\nShorter Lifespan - The typical life expectancy of three-tab asphalt shingles ranges from 15 to 20 years, which is shorter than the longer lifespan offered by architectural shingles.","sev":"minor","choices":[]},{"id":"ac78181","type":"defect","title":"Shingles- Multiple Layers Observed","text":"Multiple layers were observed on the roof.  The exact number of layers was not determined as the style of drip edge used prevented a full inspection.  Multiple layers of shingles diminishes the life expectancy of the newest layer and will void the manufacturers warranty.  The shingles will be more susceptible to damage and can make detecting the source of a leak difficult.  It is not recommended to install more than 2 layers of shingles on a roof.  When replacement of the roof becomes necessary it will cost additional money to remove and dispose of the second layer.  Hidden damage can exist under multiple layers of shingles, often damaged roof decking will be covered over with a second layer instead of repaired properly.\n\nCorrective steps\n\n A licensed roofing contractor should be consulted before your inspection objection deadline to determine if any underlying issues may exist and ensure the shingles were properly installed, underlayment was used, and flashing meets current standards.  The inspector recommends budgeting for replacement.","sev":"moderate","choices":[]},{"id":"aae00a1","type":"defect","title":"Shingles- End Of Useful Life","text":"AGED- I observed during my inspection that the system appeared to be old and at the end of its service life. It may not be reliable.  Old shingles can cause water infiltration into the home, some or all of this damage may not be visible during the inspection.\n\nThe inspector will mark this as red if the shingles are in need of replacement within the next 1-2 years, orange if the shingles are in need of replacement in the next 3-5 years, or blue if the shingles are in need of replacement in the next 6-7 years.  These dates are estimates only and should not be considered a warranty or guarantee.  Roof life expectancy can be hard to estimate.  Material can age much faster than expected under many circumstances.\n\nCorrective steps\n\n A licensed roofing contractor should be consulted to make a final determination of the life expectancy of the roof.\n\nAsk the homeowner or occupant about its recent performance. Regular maintenance and monitoring of its condition is recommended. Budgeting for repairs and future replacement is recommended. InterNACHI's Standard Estimate Life Expectancy Chart for Homes","sev":"major","choices":[]},{"id":"5fb044f","type":"info","title":"Exposed Fastener Metal Roof","text":"An exposed fastener metal roof was observed on the property. This roofing system offers distinct advantages over shingled roofs, as well as some disadvantages when compared to both shingled roofs and standing seam metal roofs.\n\nAdvantages over Shingled Roofs:\n\n\u2022\nDurability: Metal roofs with exposed fasteners are known for their exceptional durability. They are highly resistant to weather elements such as rain, wind, hail, and UV radiation. They have a longer lifespan compared to shingled roofs and can withstand extreme weather conditions more effectively.\n\n\u2022\nCost-Effectiveness: Exposed fastener metal roofs are generally more affordable than standing seam metal roofs. They provide the benefits of a metal roof at a lower cost, making them a cost-effective option for homeowners seeking the durability and longevity of metal roofing without the higher price tag.\n\n\u2022\nEase of Installation and Repair: The installation process for exposed fastener metal roofs is typically simpler and faster compared to standing seam metal roofs. Additionally, if a section of the roof gets damaged, repairs or replacements can be carried out more easily and with less labor-intensive work.\n\nDisadvantages over Shingled Roofs:\n\n\u2022\nAesthetics: Exposed fastener metal roofs may not have the same aesthetic appeal as shingled roofs. The visible screws or nails can detract from the overall appearance, giving it a more industrial or utilitarian look, which may not be desirable for some homeowners.\n\n\u2022\nPotential for Leakage: As the fasteners penetrate the metal panels, there is a possibility of water infiltration over time. While proper installation techniques and regular maintenance can mitigate this risk, it is still a consideration compared to shingled roofs, which have a more layered and water-resistant design.\n\n\u2022\nNoise Transmission: Compared to shingled roofs, metal roofs with exposed fasteners can transmit more noise during heavy rain, hail, or other weather events. This noise can be minimized with proper insulation or underlayment, but it may still be a concern for homeowners sensitive to sound.\n\nDisadvantages over Standing Seam Metal Roofs:\n\n\u2022\nEnhanced Leak Resistance: Standing seam metal roofs have concealed fasteners, which provide superior protection against water infiltration compared to exposed fastener systems. The interlocking design of standing seam roofs minimizes the risk of leaks, making them a more reliable option in areas prone to heavy rainfall or extreme weather conditions.\n\n\u2022\nSleek Appearance: Standing seam metal roofs offer a sleek, clean aesthetic due to their concealed fasteners. This streamlined look is often preferred by homeowners seeking a more modern or architectural design.","sev":"minor","choices":[]},{"id":"3bc0147","type":"info","title":"Architectural/ Dimensional Shingles","text":"The roof covering was comprised of architectural composition shingles. Architectural shingles, also called dimensional shingles, are thicker and heavier (often 50% more) than traditional 3-tab shingles. These shingles are manufactured by starting with a fiberglass reinforcement mat, multiple layers of asphalt are added over the mat, and lastly, granules coated with ceramic are added over the upper layer of asphalt for protection against the elements (wind, rain, and UV rays from the sun). Architectural shingles typically have higher wind resistance, resist leaks better, and have a longer warranty than their 3-tab counterparts.\n\nAsphalt shingles must be installed for manufacturers' recommendations to uphold warranty coverage. These installation requirements vary widely from manufacturer to manufacturer and across the multitude of different shingle styles manufactured. An inspection of the roof will be conducted to the best of the inspector's ability, but confirming proper fastening, use and adequacy of underlayment, and adequacy of flashing is impossible as these items are not visible. Damaging and invasive means would have to be carried out to confirm proper installation. Therefore, the inspection of the roof is limited to visual portions only.","sev":"minor","choices":[]},{"id":"b6ba3dc","type":"defect","title":"Shingles- Valley Installation Doesn't Meet Current Professional Standards","text":"During the inspection, it was noted that the shingles in the valley of the roof were not installed properly, current professional building practices were not implemented during installation of these shingles.  Shingles should always be installed to meet manufacturers recommendations.  The valley of the roof is a critical area where two roof slopes meet, directing water flow off the roof. Proper shingle installation in the valley is essential to ensure effective water drainage and prevent leaks. Improper installation in this area can lead to water pooling, increased risk of leaks, and potential damage to the roof structure and interior of the home.\n\nCorrective steps\n\nIt is strongly recommended to contact a professional roofing contractor to inspect and correct the shingle installation in the valley of the roof. Proper installation techniques should be followed to ensure the shingles are securely placed and provide adequate protection against water infiltration. Addressing this issue promptly will help maintain the roof's integrity and prevent further damage.","sev":"major","choices":[]},{"id":"292d507","type":"defect","title":"Tree- In Contact With Roof","text":"During the inspection, it was noted that a tree is in contact with the roof.  Trees in contact with the roof can cause several issues, including physical damage to shingles, gutters, and other roof components. Branches can scrape and puncture the roof surface, leading to leaks and water infiltration. Additionally, debris from the tree, such as leaves and twigs, can accumulate on the roof and in gutters, obstructing water flow and causing further damage.\n\nCorrective steps\n\nIt is recommended to contact a professional arborist or tree service to trim or remove the tree branches in contact with the roof. Ensuring that trees are properly maintained and kept at a safe distance from the roof will help prevent damage and maintain the roof's integrity. Prompt attention to this issue will help protect the roof and prevent further deterioration.","sev":"minor","choices":[]},{"id":"776651a","type":"defect","title":"Shingles- Minor Damage","text":"During the inspection, shingles with minor damage were observed on the roof.  Minor damage to shingles can include issues such as small cracks, slight curling, or minor granule loss. While these issues may seem insignificant, they can compromise the shingles' ability to protect the roof from water infiltration and weather elements. Over time, minor damage can worsen, leading to more severe problems such as leaks and structural damage.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and repair the shingles with minor damage. Addressing these issues promptly will help maintain the roof's integrity and prevent further deterioration. Repairs may involve replacing the damaged shingles or applying sealant to prevent water entry.","sev":"minor","choices":[]},{"id":"c336bbb","type":"defect","title":"Shingles- Cracked and Damaged","text":"During the inspection, cracked or damaged shingles were observed on the roof.  Cracked or damaged shingles can compromise the roof's ability to protect against water infiltration and weather elements. These issues can arise due to various factors such as age, weather exposure, or physical impact. Damaged shingles can lead to leaks, reduced insulation, and potential structural damage to the roof and interior of the home.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and repair the cracked or damaged shingles. Prompt attention to these issues will help maintain the roof's integrity and prevent further deterioration. Repairs may involve replacing the damaged shingles or applying sealant to prevent water entry.","sev":"major","choices":[]},{"id":"7b2d0d6","type":"defect","title":"Shingles- Improper Ridge Cap Used","text":"During the inspection, it was noted that improper cap shingles were used on the roof.  Cap shingles are designed to cover the ridge or hip of the roof, providing a finished look and protecting the underlying roofing materials from water infiltration. Using improper cap shingles can compromise the roof's ability to shed water effectively, leading to potential leaks and damage. Proper cap shingles are essential for ensuring the roof's durability and weather resistance.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and replace the improper cap shingles with the correct materials. Proper installation of cap shingles will help maintain the roof's integrity, prevent water infiltration, and ensure the roof performs as intended.","sev":"minor","choices":[]},{"id":"869f4d1","type":"defect","title":"Shingles- Cap Shingles Show Signs Of Wind Damage","text":"During the inspection, it was noted that the cap shingles show signs of wind damage.  Cap shingles are designed to cover the ridge or hip of the roof, providing a finished look and protecting the underlying roofing materials from water infiltration. Wind damage can cause these shingles to lift, crack, or become dislodged, compromising their ability to protect the roof. This can lead to water infiltration, leaks, and potential damage to the roof structure and interior of the home.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and repair the wind-damaged cap shingles. Proper repair or replacement of the affected shingles will help maintain the roof's integrity, prevent water infiltration, and ensure the roof performs as intended.","sev":"minor","choices":[]},{"id":"ab57067","type":"defect","title":"Shingles- Excessive Wear Of Cap Shingles","text":"During the inspection, excessive wear on the cap shingles was observed.  Cap shingles are designed to cover the ridge or hip of the roof, providing a finished look and protecting the underlying roofing materials from water infiltration. Excessive wear on cap shingles can occur due to prolonged exposure to harsh weather conditions, age, or poor installation. This wear can compromise the shingles' ability to protect the roof, leading to potential leaks and damage to the roof structure and interior of the home.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and repair or replace the excessively worn cap shingles. Proper repair or replacement will help maintain the roof's integrity, prevent water infiltration, and ensure the roof performs as intended.","sev":"minor","choices":[]},{"id":"622170f","type":"defect","title":"Shingles- Installed On Low Sloped Roof","text":"The inspector noted shingles were installed on a roof surface under a 4:12 pitch.  A minimum roof slope of 4:12 is allowable with normal use of single-layer roofing underlayment.  However, a minimum 2:12 roof slope is permissible for composition shingles provided that 15# tarred felt underlayment is doubled and cemented together, or a self-adhering polymer modified bitumen sheet can be used.  If the underlayment, a material that cannot be observed during the inspection, wasn't installed properly it could cause failure and will void the warranty of the shingles.\n\nCorrective steps\n\nThe inspector recommends a roofing contractor review this area for proper installation and repairs be performed if necessary.","sev":"major","choices":[]},{"id":"c832a13","type":"defect","title":"Shingles- Improper Nailing Pattern","text":"The inspector observed the shingles were not nailed to commonly acceptable manufacturer standards.  This could cause the shingles to become loose and blow off the home.  The inspector also questions if the fasteners were the proper length.  Most manufacturers recommend a minimum nail length of 2\u201d on roof overs (see Atlas instructions here).\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and repair or replace the improperly nailed shingles. Proper repair or replacement will help maintain the roof's integrity, prevent water infiltration, and ensure the roof performs as intended","sev":"moderate","choices":[]},{"id":"c374a0d","type":"defect","title":"Roof Covering- Material Defect Observed","text":"Material Defect.  A material defect was observed.  According to the InterNACHI Home Inspection Standards of Practice, a material defect is a specific issue with a system or component of a residential property that may have a significant, adverse impact on the value of the property, or that poses an unreasonable risk to people.  The fact that a system or component is near, at, or beyond the end of its normal, useful life is not, in itself, a material defect.","sev":"major","choices":[]},{"id":"7225f4d","type":"defect","title":"Roof Covering- Missing Material","text":"During the inspection, missing roofing covering material was observed.  Missing roofing covering material can significantly compromise the roof's ability to protect against water infiltration and weather elements. This condition can lead to leaks, water damage, and potential structural issues within the roof and the interior of the home. Missing material can occur due to various factors such as severe weather, age, or improper installation.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and replace the missing roofing covering material. Prompt attention to this issue will help maintain the roof's integrity, prevent water infiltration, and ensure the roof performs as intended. Proper repair will help protect the home from further damage and ensure the longevity of the roof.","sev":"major","choices":[]},{"id":"58fbefe","type":"defect","title":"Roof Covering- Ponding","text":"During the inspection, ponding water was observed on the roof.  Ponding water refers to water that accumulates and remains on the roof surface for an extended period, typically longer than 48 hours.  The inspector can only observe defects at the time of the inspection, so any standing water is called out for evaluation to see if the water stands for more than 48 hours.  This condition can occur due to inadequate roof drainage, improper roof slope, improperly installed roofing material, improperly installed roof decking, or blockages in the drainage system.   Ponding water can lead to significant issues, including increased weight on the roof structure, potential leaks, and accelerated deterioration of roofing materials.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and address the ponding water issue. Solutions may include improving the roof's drainage system, adjusting the roof slope, or installing additional drains","sev":"moderate","choices":[]},{"id":"e050ab7","type":"defect","title":"Roof Covering- Debris On Roof","text":"During the inspection, debris was observed on the roof.  Debris on the roof, such as leaves, twigs, and dirt, can obstruct water flow and drainage, leading to potential water pooling and increased risk of leaks. Accumulated debris can also cause damage to roofing materials and gutters, reducing the roof's overall effectiveness and lifespan.\n\nCorrective steps\n\nIt is recommended to remove the debris and inspect the roof for any underlying issues. Regular maintenance and cleaning of the roof will help ensure proper drainage, prevent water infiltration, and maintain the roof's integrity.","sev":"minor","choices":[]},{"id":"6effe4c","type":"defect","title":"Roof Covering- Installation Defect at Roof Covering","text":"During the inspection, installation defects in the roof covering material were observed.  Installation defects can include issues such as improper alignment of shingles, inadequate sealing, or incorrect fastening. These defects can compromise the roof's ability to protect against water infiltration and weather elements, leading to potential leaks, reduced insulation, and structural damage. Proper installation is crucial to ensure the roof performs as intended and provides long-term protection.  This defect will be labeled in orange if the\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and correct the installation defects in the roof covering material. Proper repair and reinstallation will help maintain the roof's integrity, prevent water infiltration, and ensure the roof performs as intended. Addressing these issues promptly will help protect the home from further damage and ensure the longevity of the roof.","sev":"moderate","choices":[]},{"id":"04f478f","type":"defect","title":"Metal Roof- Improperly Installed","text":"The metal roof was not installed to typical manufacturer recommendations.  Installation defects can include issues such as improper alignment of roofing panels, inadequate sealing, or incorrect fastening. These defects can compromise the roof's ability to protect against water infiltration and weather elements, leading to potential leaks, reduced insulation, and structural damage. Proper installation is crucial to ensure the roof performs as intended and provides long-term protection. Hidden damage may exist.\n\nCorrective steps\n\nRepair by a licensed roofing contractor is recommended.  Please follow this link for a typical manufacturers guide to installing a metal roof.  This is a typical example only, the actual manufacturers guide of the steel roofing should always be consulted before installation or repairs are made.","sev":"moderate","choices":[]},{"id":"7270a65","type":"defect","title":"Metal Roof- Fastening Defect","text":"During the inspection, defects in the metal roof fasteners were observed. Defective metal roof fasteners can include issues such as loose, over-tightened, or improperly aligned fasteners. These defects can compromise the roof's ability to secure the metal panels, leading to potential water infiltration, leaks, and structural damage. Fasteners that are not properly installed can also cause the metal panels to shift or become dislodged, further exacerbating the problem.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and repair the defective metal roof fasteners. Proper repair may involve tightening loose fasteners, replacing damaged ones, and ensuring all fasteners are correctly aligned and sealed to prevent water entry","sev":"moderate","choices":[]},{"id":"443f1ff","type":"defect","title":"Roof Structure- Dips At Eves","text":"During the inspection, the inspector noted that the roof dipped at the eaves. A dip at the eaves can be a result of inadequate ventilation, which can lead to the formation of ice dams. Ice dams occur when snow on the roof melts and refreezes at the eaves, causing water to back up and potentially seep into the roof structure. This can lead to significant damage, including leaks, rot, and structural issues. Proper ventilation is crucial to prevent ice dams and maintain the roof's integrity.\n\nCorrective steps\n\n It is recommended that a licensed roofing contractor evaluate the eaves to determine the extent of the issue and provide appropriate solutions. Ensuring proper ventilation and addressing any damage will help maintain the roof's integrity and prevent further problems.","sev":"moderate","choices":[]},{"id":"51e5b1b","type":"defect","title":"Roof Structure- Sheathing Spongey","text":"During the inspection, the roof sheeting was spongy when walked on in one or more areas.  Spongy roof sheeting can indicate a current or past leak, which may have caused water damage to the underlying roof structure. This condition can lead to hidden damage, such as rot or mold, and may compromise the roof's integrity. Over time, the affected sheathing may need to be replaced to ensure the roof remains safe and functional.\n\nCorrective steps\n\nIt is recommended that a licensed roofing contractor evaluate the spongy areas and perform necessary repairs. A professional contractor can assess the extent of the damage, identify the source of any leaks, and replace the damaged sheathing if needed.","sev":"moderate","choices":[]},{"id":"73a58a2","type":"limit","title":"Condominium Disclaimer","text":"LMT- Condominiums are controlled by an association.  This association is generally responsible for the exterior of the home including the roof, landscaping and grounds, and exterior systems.  Due to the association controlling ownership of the roofing material the inspector doesn\u2019t traverse the roof and only a basic inspection is made of these systems.  Defects of these systems should always be referred back to the association.","sev":"minor","choices":[]}]},{"name":"Flashing","c":[{"id":"763cee5","type":"defect","title":"Flashing- Missing Kickout Flashing","text":"Durring the inspection it was observed the kickout flashing was missing. A kickout flashing \"kicks\" the roof water away from the house structure and diverts it into a gutter. This missing flashing could lead to hidden moisture intrusion and water damage issues that would not be able to be observed during a visual-only home inspection.\n\nCorrective steps\n\nKickout flashing should be installed by a licensed roofing professional.","sev":"minor","choices":[]},{"id":"9812e5d","type":"limit","title":"Roof Flashings: Roof Flashing Information & Limitations","text":"LMT - Visible portions of the flashings were inspected, looking for significant deficiencies (drip edge, sidewall, headwall, counter, step, etc. - as applicable). Most areas of flashings are not visible as they are covered

sentative number railings, guards and handrails that were within the scope of the home inspection.","sev":"minor","choices":[]},{"id":"9ad25a1","type":"defect","title":"Loose Railing Component","text":"I observed a loose railing component.  This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"b18ee71","type":"defect","title":"Missing Handrail","text":"I observed a missing handrail.\n\nThere is more than one step here, and I recommend installing a handrail for safety.","sev":"moderate","choices":[]},{"id":"bea6130","type":"defect","title":"Improper Guardrail Height (Not 36\")","text":"I observed indications of a defect related to the height of a guardrail.\n\nGuardrails are normally required to be 36 inches above standing surface next to the guardrail.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"798b50c","type":"defect","title":"Guard Opening Was Too Large (4\")","text":"I observed improper spacing between intermediate balusters, spindles and rails at a required guard.  This is a safety hazard, especially for small children.\n\nGuards may not allow the passage of a sphere 4 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"0c1e4a1","type":"defect","title":"Handrail is Not Continuous","text":"I observed that the handrail is not continuous. It should be.\n\nHandrails for stairs must be continuous for the full length of the stairway.","sev":"moderate","choices":[]},{"id":"74e185d","type":"defect","title":"Handrail Not Graspable","text":"I observed a handrail that is not grippable or graspable.  This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"aefc16a","type":"defect","title":"Improper Handrail Height","text":"I observed indications of a defect related to the height of a railing.  Handrails are normally required to be 34 to 38 inches above the stair nosing on at least one side of all stairs with three or more risers.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"40db1e6","type":"defect","title":"Improper Stair Guardrail Height (Not 34\")","text":"I observed indications of a defect related to the height of a guardrail at the stairs.\n\nGuards on the open side of a stairway must be at least 34 inches in height above the walking surface or the line connecting the nosings of the stair treads.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"6739520","type":"defect","title":"Stair Guard Opening Was Too Large (4 3/8\")","text":"I observed improper spacing between intermediate balusters, spindles and rails.  This is a safety hazard, especially for small children.\n\nGuardrails are required on open sides of stairways and should have intermediate rails that do not allow the passage of a sphere 4 3/8 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"7046f4b","type":"defect","title":"Stair Guard Opening Was Too Large (6\")","text":"I observed improper spacing between intermediate balusters, spindles and rails.  This is a safety hazard, especially for small children.\n\nAnd opening at the guard on the open side of a stair formed by the riser, the tread and bottom rail of the guard should not allow the passage of a sphere 6 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Presence of Smoke and CO Detectors","c":[{"id":"a7854dd","type":"limit","title":"Unable to Test Every Detector","text":"LMT - I was unable to test every detector. We recommend testing all of the detectors.  Ask the seller about the performance of the detectors and of any issues regarding them.  We recommend replacing all of the detectors (smoke and carbon monoxide) with new ones just for peace of mind and for safety concerns upon taking possession of the home.","sev":"minor","choices":[]},{"id":"c2a7ce0","type":"defect","title":"Improper Location of Smoke Detector","text":"I observed indications of improper location of the smoke detector.\n\nSmoke detectors should be installed on the ceiling, or installed on the wall no more than 12 inches from the ceiling.","sev":"moderate","choices":[]},{"id":"0814e31","type":"defect","title":"Missing CO Detector","text":"I observed indications of a missing carbon monoxide detector. Hazard.  Click here for more information about CO Detectors.","sev":"moderate","choices":[]},{"id":"18e84cd","type":"defect","title":"Smoke Detector - Missing","text":"SFTY- I observed indications of missing smoke detectors. Hazard.","sev":"major","choices":[]},{"id":"7b1216d","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"d28219c","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"5e24905","type":"defect","title":"Old Detectors, New Detectors Recommended","text":"I observed indications of old smoke detectors in the house. Detectors should be replaced every 5-10 years. The should be hard-wired with electricity and have a battery backup feature in case the electricity turns off. New smoke detectors are recommended.","sev":"moderate","choices":[]},{"id":"091d292","type":"defect","title":"Smoke Detector Did Not Test Functional","text":"I observed indications that a smoke detector did not test functional. I pushed the test button, but it did not test as expected.","sev":"moderate","choices":[]},{"id":"ae01e07","type":"info","title":"Inspected for Presence of Smoke and CO Detectors","text":"I inspected for the presence of smoke and carbon-monoxide detectors.\n\nThere should be a smoke detector in every sleeping room, outside of every sleeping room, and one every level of a house.","sev":"minor","choices":[]}]},{"name":"Bar Sink","c":[{"id":"0d1dafa","type":"defect","title":"Missing GFCI at Bar Sink","text":"I observed missing GFCI protection at the bar sink.\n\nGFCI protection is required for receptacles located within 6 feet of a wet bar sink. There are no exceptions for single outlet or dedicated receptacles.","sev":"moderate","choices":[]}]},{"name":"Windows","c":[{"id":"1f491b9","type":"defect","title":"Fogged Windowpane","text":"I observed a fogged windowpane (a lost seal) at a window.\n\nIf multiple-pane windows appear misty or foggy, it means that the seal protecting the window assembly has failed, and condensation has formed in between the two panes of glass.  Condensation in double-paned windows indicates that the glazing assembly has failed and needs repair or replacement.  Visible condensation can damage glazing and is the main indication of sealant failure.  Condensation is not always visible.  If the failure is recent, a failed window may not be obvious, since condensation doesnt usually form until the window is heated by direct sunlight. Windows in the shade may show no evidence of failure, so it is nearly impossible to observe and report all failed double-paned windows.","sev":"minor","choices":[]},{"id":"63d3e6e","type":"limit","title":"Inspection Restricted","text":"LMT - I did not inspect all windows. I did inspect a representative number of them. It's impossible to inspect every window component closely during a home inspection. A home inspection is not an exhaustive evaluation. I did not reach and access closely every window, particularly those above the first floor level.","sev":"minor","choices":[]},{"id":"bf51a1b","type":"info","title":"Windows Inspected","text":"A representative number of windows from the ground surface was inspected.","sev":"minor","choices":[]},{"id":"c7fcff0","type":"defect","title":"Damaged Window Screen","text":"I observed a damaged window screen.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"7877c71","type":"defect","title":"Egress Is Lacking Or Restricted","text":"Any room used for sleeping purposes requires an emergency means of exit meeting current standards.  The egress should exit to the exterior of the home and meet the standards in the below diagram.  This room should not be used as a bedroom unless proper egress is installed.","sev":"major","choices":[]},{"id":"7424fc1","type":"defect","title":"Window Hardware Missing or Damaged","text":"With insufficient hardware, it is difficult or impossible to properly open the window.  Replacement of the hardware is recomended.","sev":"minor","choices":[]},{"id":"738dc89","type":"defect","title":"Cracked Windowpane","text":"I observed a cracked glass windowpane.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"4daab95","type":"defect","title":"Window Will Not Lock","text":"The window won\u2019t lock.  This is a security concern.  The Inspector recomends adjustment of the lock or window to allow for easy operation of the locking hardware.","sev":"minor","choices":[]},{"id":"a746f52","type":"defect","title":"Lift Mechanism Is Damaged","text":"While the window was operational at the time of inspection a part of the mechanism was loose causing the window to fall when unlocked.  This could cause injury and is a serious danger to children.  Repair or replace the lift mechanism or window.  Work should be performed by a licensed contractor.","sev":"major","choices":[]},{"id":"958b9d2","type":"defect","title":"Tempered Safety Glass and Fixed Barricades Not Present","text":"In dwelling units where the opening of an operable window is located more than 72\" above the finished grade and the lowest part of the clear opening of the window is less than 24\" off the finished floor.  The glazing if the window must be made if Tempered Safety Glass and the opening shall have a guard rail installed that will not allow a 4\" sphere to pass.  Repair by a licensed contractor to meet current standards.","sev":"major","choices":[]},{"id":"a2c6546","type":"defect","title":"Window(s) Operates Hards","text":"Window(s) were hard to open and close.  This can be a safety issue in the event of an egress emergency.  Lubrication of the window hardware may alleviate the issue.  If lubrication does not work hardware or the entire window unit may have to be replaced.","sev":"moderate","choices":[]},{"id":"65bf4de","type":"defect","title":"Missing Window Screen","text":"I observed a missing window screen.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"770f453","type":"defect","title":"Paint Or Stain Is Peeling, Weathers, Cracked, Or Faded- Possible Lead Paint","text":"Due to the age of the home and the possibility of lead paint, care should be taken to seal the paint according to EPA standards.  A licensed contractor should encapsulate or abate the lead paint in order to prevent the spread of lead dust throughout the home.  Click Here to learn how the EPA recomends dealing with lead paint.","sev":"minor","choices":[]},{"id":"ad9928a","type":"defect","title":"Window Actively Leaking","text":"The window was observed to be actively leaking.  The cause is unknown, however a lack of caulking was observed. Further evaluation by a licensed contractor to determine if any water damage exists and repair of the underlying cause is recomended.","sev":"major","choices":[]},{"id":"a678a68","type":"defect","title":"Not Optimally Energy Efficient- Single Pane Windows","text":"Heating and cooling costs may be higher.  Consider upgrading to double-pane energy efficient windows.\n\nWindows can be one of your home\u2019s most attractive features. Windows provide views, daylighting, ventilation, and solar heating in the winter. Unfortunately, they can also account for up to 25% of your heating bill. During the summer, your air conditioner must work harder to cool hot air from sunny windows.\n\nEnergy-efficient windows may have two or more panes of glass, warm-edge spacers between the window panes, improved framing materials, and low-e coatings, which are microscopically thin coatings that help keep heat inside during the winter and outside during the summer.\n\nIf your home has single-pane windows, as many U.S. homes do, consider replacing them with new double-pane windows with high-performance low-e (low-emissivity) or spectrally selective glass. In colder climates, choose windows that are gas-filled with low-e coatings on the glass to reduce heat loss. In warmer climates, choose windows with spectrally selective coatings to reduce heat gain.\n\nIf you\u2019re building a new home, the higher cost of energy-efficient windows can actually be offset by allowing you to buy smaller, less expensive heating and cooling equipment. Install ENERGY STAR windows and use curtains and shade to give your air conditioner and energy bill a break. If you live in the Sun Belt, look into low-e windows, which can cut the cooling load by up to 15%.\n\nIf you decide not to replace your windows, the simpler, less costly measures listed here can improve their performance.\n\nCold-Climate Window Tips\n\nCold-climate windows keep heat in.\n\n\u2022 Double-pane windows with low-e coating on the glass reflect heat back into the room during the winter months.\n\n\u2022 During the cold winter months, you can use a heavy-duty, clear plastic sheet on a frame, or tape clear plastic film to the inside of your window frames. Remember, the plastic must be sealed tightly to the frame to help reduce air infiltration.\n\n\u2022 Install tight-fitting, insulating window shades on windows that feel drafty after weatherizing.\n\n\u2022 Close your curtains and shades at night.\n\n\u2022 Open your curtains during the day.\n\n\u2022 If you have windows located on the south side of your house, keep them clean so that they can let in the maximum amount of winter sun.\n\n\u2022 Install exterior or interior storm windows. Storm windows can reduce heat loss through the windows by 25% to 50%. Storm windows should have weatherstripping at all movable joints, be made of strong, durable materials, and have interlocking or overlapping joints. Low-e storm windows save even more energy.\n\n\u2022 Repair and weatherize your current storm windows, if necessary.\n\nWarm-Climate Window Tips\n\nWarm-climate windows keep heat out. In the summertime, the sun shining through your windows heats up the room. Windows with low-e coatings on the glass reflect some of the sunlight, keeping your rooms cooler.\n\nHere are some things you can do to keep comfortable.\n\n\u2022 Install white window shades, drapes or blinds to reflect heat away from the windows.\n\n\u2022 Close curtains on south- and west-facing windows during the day.\n\n\u2022 Install awnings on south- and west-facing windows.\n\n\u2022 Apply sun-control or other reflective films on south-facing windows to reduce solar gain.\n\nLong-Term Savings Tip\n\n\u2022 Installing high-performance windows will improve your home\u2019s energy performance. While it may take years for new windows to pay off in dollar-for-dollar energy savings, the benefits of added comfort and improved aesthetics and functionality make the investment worth it much sooner. Many window technologies are available that should be considered.\n\nShopping Tips for Windows\n\n\u2022 Look for the ENERGY STAR label.\n\n\u2022 Check with your local utility company to see if any rebates or other financial incentives are available for window replacement.\n\n\u2022 High-performance windows have at least two panes of glass and a low-e coating, so make sure the windows you choose have these features, and not just a claim or label that says \u201chigh-performance.\u201d\n\n\u2022 The U-factor for windows is similar to the R-rating for insulation. The U-factor measures the rate of heat transfer and tells you how well the window insulates. The lower the U-factor, the better the insulation. In colder climates, focus on finding windows with a low U-factor.\n\n\u2022 Low solar heat-gain coefficients (SHGCs) reduce heat gain. In warm climates, look for a low SHGC.\n\n\u2022 In temperate climates with both heating and cooling seasons, select windows with both low U-factors and low SHGCs to maximize energy savings.\n\n\u2022 Look for whole-unit U-factors and SHGCs, rather than center-of-glass (or COG) U-factors and SHGCs. Whole-unit numbers more accurately reflect the energy performance of the entire product.\n\n\u2022 Have your windows installed by trained professionals. Be sure they\u2019re installed according to the manufacturer\u2019s instructions; otherwise, your warranty may be voided.","sev":"moderate","choices":[]},{"id":"7fa5e1b","type":"defect","title":"Window Not Fall Protected","text":"The inspector observed the windows did not meet current fall protection standards.  A window that is at least 24\" above the finished floor and more than 6 foot above grade is required to have fall protection devices installed that will not allow the window to open enough to allow a 4\" sphere to pass through.  This is a safety hazard.  Repair by a licensed window contractor is recommended.","sev":"major","choices":[]},{"id":"657bcfa","type":"defect","title":"Glass Pane Missing","text":"The glass pane was missing, replacement is necessary.","sev":"minor","choices":[]},{"id":"05aa1ea","type":"defect","title":"Observed Water Stain On Window Sill","text":"A visible water stain may imply moisture intrusion which, if not corrected, may cause damage.  Monitor for continued signs of moisture intrusion.  If moisture intrusion is evident, have window repaired by a licensed contractor.","sev":"moderate","choices":[]},{"id":"2644bc3","type":"defect","title":"Weatherstripping Pulling Loose","text":"The weather stripping is pulling loose causing the window to open hard.  This can cause issues of egress and diminish the energy efficiency of the window.  Repair the weatherstripping","sev":"minor","choices":[]},{"id":"32e481d","type":"defect","title":"Window Not Operational Because It Was Painted Shut","text":"This could prevent exit in an emergency.  Strip the paint so that the window can move within its frame or have the window replaced to meet current standards.","sev":"minor","choices":[]},{"id":"9561bb0","type":"defect","title":"Window Shows Signs Of Microbial Growth","text":"Microbial growth will worsen overtime, however this is not normally considered a health issues as it presented itself at the time of the inspection.  Suggest removing the effected caulk and clean the area with specialized mold cleaning agent such as Concrobium.   Replace the caulk with a mold resistant caulk.","sev":"minor","choices":[]},{"id":"693146f","type":"defect","title":"Wood Rot at Window","text":"I observed indications of wood rot at the window.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"e74dcf3","type":"defect","title":"Window Will Not Close","text":"The window would not fully close.  This may be due to a mechanical error or an installation area.  In rare circumstances this can be an indication of settling in the area.  Further evaluation by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"1e1ca29","type":"defect","title":"Caulking Cracked and/ or Shrunk","text":"Caulking prevents water infiltration into the structure of the home.  Hidden damage could exist.  The inspector recomends caulking all joints around windows including transitions between windows and siding, windows and flashing, flashing and siding, and joints in the flashing itself.  Caulking should be an exterior grade premium silicone or siliconized acrylic caulk.  Old caulk should be removed before caulking.","sev":"minor","choices":[]},{"id":"00ca414","type":"defect","title":"Caulk Missing","text":"Caulking prevents water infiltration into the structure of the home.  Hidden damage could exist.  The inspector recomends caulking all joints around windows including transitions between windows and siding, windows and flashing, flashing and siding, and joints in the flashing itself.  Caulking should be an exterior grade premium silicone or siliconized acrylic caulk.  Old caulk should be removed before caulking.","sev":"minor","choices":[]},{"id":"85023d6","type":"defect","title":"Clean Track","text":"Window tracks should be kept free from debris and dirt.  Weep holes may become clogged resulting in water damage to the home.  No water damage was observed however hidden damage may exist.","sev":"minor","choices":[]},{"id":"0dc7649","type":"defect","title":"Flashing Is Damaged","text":"Damaged flashing is a conducive condition for moisture penetration and could possibly cause damage.  Repair or replacement of the flashing by a licensed contractor is recomended.","sev":"minor","choices":[]},{"id":"c9a5c19","type":"defect","title":"Flashing Is Missing","text":"Without flashing the water is not diverted away from areas where moisture intrusion could occur.  Hidden damage may exist.  Repair or replacement of the flashing by a licensed contractor is recomended.","sev":"minor","choices":[]},{"id":"a495584","type":"defect","title":"Lack Of Weeping Holes","text":"Water will be trapped between the frames causing damage.  Further evaluation by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"ad5863d","type":"defect","title":"Paint Peeling","text":"","sev":"moderate","choices":[]},{"id":"16f45f1","type":"defect","title":"Possible Insect Damage Observed","text":"Possible evidence of insect damage was observed.  Further evaluation by a pest control company and a licensed contractor should be made before your Inspection Objection Deadline.","sev":"moderate","choices":[]},{"id":"e07aa11","type":"defect","title":"Window Frame Is Out Of Square","text":"An out of square frame can make the window difficult to open.  This could be a sign that hidden damage exists, such as a rotted window sill or structural issue.  Further evaluation and repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"223738f","type":"info","title":"Window Material","text":"","sev":"minor","choices":["Wood","Aluminum","Vinyl","Aluminum Storm Windows"]},{"id":"0a2cfc3","type":"info","title":"Glass Type","text":"","sev":"minor","choices":["Single Pane","Double Pane","Triple Pane"]},{"id":"d54be8a","type":"defect","title":"Window Sill and/or Trim Is Rotted","text":"The wood around the window is rotted and not protected.  Water may be penetrating the structure in this area.  Hidden damage may exist.  Further evaluation, estimates, and repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"6ab1cd8","type":"defect","title":"Window Sill- Mortar Missing/ Deteriorated","text":"Gaps in the sill joint may allow for moisture and insect intrusion.  Replace the mortar with a weather-resistant, color-matched flexible mortar","sev":"moderate","choices":[]},{"id":"df6f9ef","type":"info","title":"Brand","text":"","sev":"minor","choices":["Jeldwen","Kimro","Acorn","Anderson","Alliance","Care Free","Unknown","Pella","Crestline","Certainteed"]},{"id":"18c9f4b","type":"defect","title":"Window Well Cover Broke","text":"The window well cover is broke, this could allow moisture into the window well.  While this area is traditionally drained, the drain may be clogged or not present.  Replacement of the window well cover is recomended.","sev":"minor","choices":[]},{"id":"e295e8b","type":"info","title":"Window Type","text":"","sev":"minor","choices":["Single Hung","Double Hung","Casement","Fixed","Sliding","Awning"]}]}]},{"name":"Laundry","subs":[{"name":"Clothes Washer","c":[{"id":"8ed2120","type":"limit","title":"Did Not Inspect","text":"LMT - I did not inspect the clothes washer and dryer fully. These appliances are beyond the scope of a home inspection. I did not operate the appliances. The clothes dryer exhaust pipe must be inspected and cleaned every year to help prevent house fires.","sev":"minor","choices":[]},{"id":"87143a0","type":"defect","title":"Minor Rust","text":"Minor rust was observed on the washer.  This could indicate the unit it nearing the end of its useful life.","sev":"moderate","choices":[]},{"id":"f6784fa","type":"defect","title":"Missing GFCI Protection in Laundry","text":"I observed missing GFCI protection for all receptacle outlets in the laundry, as it is required by standards.","sev":"moderate","choices":[]},{"id":"5cd8f70","type":"defect","title":"Corrosion At Hose/ Valve","text":"Corrosion was observed at the hose or valve.  This could indicate the hose may fail soon or a leak is present.  Replacement of the damaged components is recommended.","sev":"moderate","choices":[]},{"id":"3e812d2","type":"defect","title":"Nearing End Of Useful Life","text":"","sev":"minor","choices":[]},{"id":"94ddea2","type":"defect","title":"Door Damaged","text":"","sev":"moderate","choices":[]},{"id":"17f1acc","type":"defect","title":"Hoses Not Pressure Tested","text":"I observed hoses that were not reliable. Not pressure tested. Replacement of the hoses is recommended.","sev":"minor","choices":[]},{"id":"5194ee9","type":"defect","title":"Active Water Leak","text":"I observed indications of an active water leak at the clothes washer.","sev":"moderate","choices":[]},{"id":"0363a1d","type":"defect","title":"Stand Pipe Defect","text":"I observed a defect at the standpipe at the clothes washer. This issue could cause problems with the clothes washer when its draining and venting.","sev":"moderate","choices":[]},{"id":"8d607df","type":"info","title":"Brand","text":"","sev":"minor","choices":["GE","Maytag","Samsung","Amana","Kenmore","Whirlpool","Fridgidaire","LG","Estate"]},{"id":"46c424e","type":"defect","title":"Missing Handle at Valve","text":"I observed a missing handle at the water shutoff valve.","sev":"moderate","choices":[]},{"id":"c8a0440","type":"defect","title":"Valve Water Leak","text":"I observed an active water leak at a water shutoff valve at the laundry area.","sev":"moderate","choices":[]},{"id":"83aa792","type":"info","title":"Approximent Manufacture Build Date","text":"","sev":"minor","choices":[]},{"id":"56e0fce","type":"defect","title":"Missing Catch Pan","text":"I observed a missing water catch pan that should be installed under the clothes washer.","sev":"minor","choices":[]},{"id":"3703485","type":"defect","title":"Defect at the Hook Up","text":"I observed a defect at the clothes washer connection hook-up area.","sev":"moderate","choices":[]},{"id":"51f7f15","type":"defect","title":"Drain Pipe Spliced","text":"The drain pipe was spliced and sealed with duct tape.  This could fail overtime resulting in a floor.  Replacement is recommended.","sev":"minor","choices":[]}]},{"name":"Clothes Dryer","c":[{"id":"88b34e0","type":"defect","title":"Flexible Dryer Vent Observed","text":"SFTY- Flexible dryer vents can catch and hold lint which can become flammable.  The inspector recommends replacing the flexible vent with a smooth walled metal vent.","sev":"minor","choices":[]},{"id":"0ec7012","type":"limit","title":"Did Not Inspect","text":"LMT - I did not inspect the clothes washer and dryer fully. These appliances are beyond the scope of a home inspection. I did not operate the appliances. The clothes dryer exhaust pipe must be inspected and cleaned every year to help prevent house fires.","sev":"minor","choices":[]},{"id":"6c3d14b","type":"defect","title":"Defect at Dryer Exhaust Pipe","text":"I observed indications of a defect at the clothes dryer.","sev":"moderate","choices":[]},{"id":"52042dd","type":"defect","title":"Nearing End Of Useful Life","text":"The clothes washer is nearing the end of its useful life.  The estimated useful life for a clothes washer is 13 years.","sev":"moderate","choices":[]},{"id":"dbc51f1","type":"defect","title":"Clogged Dryer Exhaust Pipe","text":"I observed indications of a clogged exhaust pipe of the clothes dryer. Fire hazard.","sev":"moderate","choices":[]},{"id":"44e38e3","type":"defect","title":"Dryer Not Exhausting Outside","text":"I observed indications that the clothes dryer is not exhausting outside.","sev":"moderate","choices":[]},{"id":"77c9829","type":"defect","title":"Safety Switch Doesn\u2019t Operate","text":"","sev":"moderate","choices":[]},{"id":"10884c5","type":"info","title":"Brand","text":"","sev":"minor","choices":["Maytag","Amana","Kenmore","Samsung","GE","Whirlpool","Frodgidaire","Fridgidaire","Magic Chef","LG","Estate","Criterion","Hotpoint"]},{"id":"f69f9b1","type":"info","title":"Approximent Manufacture Build Date","text":"","sev":"minor","choices":[]},{"id":"5d403eb","type":"defect","title":"Damaged Dryer Exhaust Pipe","text":"I observed indications of a damaged exhaust pipe of the clothes dryer.","sev":"moderate","choices":[]},{"id":"fa2b066","type":"info","title":"Approximent Manufactuer Build Date","text":"","sev":"minor","choices":[]},{"id":"c632b10","type":"defect","title":"Incorrect 3-Prong Outlet","text":"I observed an old, 3-prong outlet for the electric dryer.\n\nFor the electric dryer, it is required to have a 4-wire 30-amp circuit and receptacle outlet installed.","sev":"moderate","choices":[]},{"id":"8245e00","type":"defect","title":"Not Working","text":"","sev":"major","choices":[]},{"id":"755db38","type":"info","title":"Vent Material","text":"","sev":"minor","choices":["Plastic","Flexible Metal","Solid Smooth Wall Metal","Not Observed"]},{"id":"456aedc","type":"info","title":"Dryer Venting Location","text":"","sev":"minor","choices":["Exterior","Basement","Crawlspace","Wall","Roof","Interior","Not Observed"]},{"id":"33bd8c6","type":"limit","title":"Dryer Fuel Source","text":"LMT - The dryer fuel source is gas.  Not electrical outlet was installed to service the dryer.","sev":"minor","choices":[]},{"id":"4f7ee2a","type":"info","title":"Fuel Type","text":"","sev":"minor","choices":[]}]},{"name":"Laundry Room, Electric, and Tub","c":[{"id":"5a2fe08","type":"defect","title":"Defect at Laundry Tub Plumbing","text":"I observed indications of a defect at the plumbing of the laundry tub.","sev":"moderate","choices":[]},{"id":"d574dac","type":"defect","title":"Flexible Drain Pipe Observed","text":"","sev":"moderate","choices":[]},{"id":"a73951d","type":"defect","title":"Defect in Laundry Room","text":"I observed a defect in the laundry room.","sev":"moderate","choices":[]},{"id":"4fec3e7","type":"defect","title":"Active Water Leak at Laundry Tub","text":"I observed indications of an active water leak at the laundry tub.","sev":"moderate","choices":[]},{"id":"0a0b594","type":"defect","title":"Missing Door to Laundry Room","text":"I observed that there is a missing door at the laundry room.","sev":"minor","choices":[]},{"id":"49b0ad1","type":"defect","title":"Missing Electric Receptacle","text":"I observed that there is a missing electric receptacle in the laundry room.","sev":"moderate","choices":[]},{"id":"d527500","type":"defect","title":"Missing Heat Source in Laundry Room","text":"I observed that there is no heat source of the laundry room.","sev":"moderate","choices":[]},{"id":"dd83cb6","type":"defect","title":"Missing AFCI Protection","text":"I observed that there is missing AFCI protection at the receptacles in the laundry room.\n\nAll 120-volt, 15- and 20-amp outlets in laundry rooms must be AFCI and GFCI protected. 2014 NEC 210.8(A)(10) & 210.12(A)","sev":"moderate","choices":[]},{"id":"816b6b2","type":"defect","title":"Missing GFCI Protection","text":"I observed that there is missing GFCI protection at the receptacles in the laundry room.\n\nAll 120-volt, 15- and 20-amp outlets in laundry rooms must be AFCI and GFCI protected. 2014 NEC 210.8(A)(10) & 210.12(A)","sev":"moderate","choices":[]},{"id":"ec68725","type":"defect","title":"Missing Tamper Resistant Receptacle Type","text":"I observed receptacles in the laundry room that are not TR (tamper resistant) type.\n\nAll receptacles in the laundry room should be listed as the tamper-resistant type unless they are located higher than 5 feet 6 inches above the laundry room floor.","sev":"moderate","choices":[]},{"id":"c123b5e","type":"defect","title":"Missing Catch Pan Under Washer","text":"I observed that the clothes washer did not have a water leak catch pan. It is recommended.","sev":"minor","choices":[]},{"id":"ad6cb8d","type":"defect","title":"Electrical Outlet Needs Extension","text":"","sev":"minor","choices":[]},{"id":"fa327d8","type":"info","title":"Ran Water At Laundry Tub","text":"","sev":"minor","choices":[]}]}]},{"name":"Kitchen","subs":[{"name":"Kitchen Sink","c":[{"id":"1bc668b","type":"defect","title":"Drain Trap Doesn't Meet Current Standards: S-Trap","text":"I observed indications of a defect at the sink drain trap. It is an S-trap, which are not permitted. It should be a P-trap. Please see illustration for details.","sev":"moderate","choices":[]},{"id":"dbffada","type":"info","title":"Ran Water at Kitchen Sink","text":"I ran water at the kitchen sink.","sev":"minor","choices":[]},{"id":"f47cf76","type":"defect","title":"Trap Leaks At Connection","text":"The drain trap leaks at the slip joint connection.  The connection should be tightened and the gasket replaced to prevent damage to the cabinet.","sev":"minor","choices":[]},{"id":"c13f816","type":"defect","title":"Drain Pipe- Flexible","text":"Flexible drains do not meet current standards as they can allow debris to get trapped between the corrugations and cause backups or leaks.\n\nRecommendation\n\nRepair by a licensed plumbers is recommended.","sev":"minor","choices":[]},{"id":"791c492","type":"defect","title":"Spray Hose Not Working","text":"","sev":"moderate","choices":[]},{"id":"4a7e9e1","type":"defect","title":"Faucet Leaking","text":"","sev":"moderate","choices":[]},{"id":"ff314a8","type":"defect","title":"Flexible Drain Observed","text":"Flexible drains do not meet current standards as they can allow debri ps to get trapped between the corrigations and cause backups or leaks.  Repair by a licensed plumbers is recommended.","sev":"minor","choices":[]},{"id":"8b563c9","type":"defect","title":"Corrosion At Shutoff","text":"","sev":"moderate","choices":[]},{"id":"e8c70d3","type":"defect","title":"Defect at the Kitchen Sink","text":"I observed indications of a defect at the kitchen sink.","sev":"moderate","choices":[]},{"id":"64b65f0","type":"defect","title":"Aerator Needs Replacment","text":"","sev":"moderate","choices":[]},{"id":"ce22d66","type":"defect","title":"Defect at Trap Component","text":"I observed indications of a defect at the sink drain trap.","sev":"moderate","choices":[]},{"id":"fae5d8b","type":"defect","title":"Sink Double Trapped","text":"Two traps were observed on the plumbing discharge pipe.   A double trap is two plumbing traps in tandem, one after the other in line, and this often causes the first trap to get sucked out by the last trap. An example of one sink trap connected to another sink\u2019s trap is shown above. Only one trap is allowed between a plumbing fixture and a trap arm.  Repair by a licensed plumbing contractor is recommended.","sev":"moderate","choices":[]},{"id":"c8ee2f8","type":"defect","title":"No Running Water at Sink","text":"I observed that there was no running water at the kitchen sink.","sev":"moderate","choices":[]},{"id":"e1c22b2","type":"defect","title":"Defect at Sink Fixture","text":"I observed a defect at the kitchen sink fixture.","sev":"moderate","choices":[]},{"id":"97e9563","type":"defect","title":"Polybutylene Piping","text":"Description of Polybutylene Piping:\n\nThe inspector observed that the plumbing system is fitted with polybutylene piping. Polybutylene piping was commonly used in residential plumbing installations during the 1970s to the mid-1990s. However, it has since been found to have significant shortcomings and has been associated with various issues that can compromise the structural integrity and functionality of a property's plumbing system.\n\nIssues with Polybutylene Piping\n\nPolybutylene piping has been widely criticized for several reasons:\n\n1. Susceptibility to Deterioration: Over time, polybutylene piping is prone to deterioration when exposed to oxidants such as chlorine in municipal water supplies. This can lead to brittleness, flaking, and ultimately ruptures or leaks in the pipes.\n\n2. Frequent Leaks: The deterioration of polybutylene pipes often leads to unexpected leaks and ruptures. These leaks can cause water damage to the property's structure, interiors, and personal belongings, resulting in expensive repairs.\n\n3. Subject of Lawsuits: Polybutylene piping has been the subject of multiple lawsuits due to the widespread issues and damages it has caused to homeowners. Manufacturers, builders, and installers faced legal actions related to the failures of these pipes.\n\nRecommendation for Replacement\n\nGiven the inherent problems associated with polybutylene piping, it is strongly recommended that the current plumbing system be replaced with more reliable and durable alternatives, such as PEX (cross-linked polyethylene) or copper piping. These materials offer improved resistance to degradation, corrosion, and leaks, making them more suitable for long-term use.\n\nSources\n\n1. The Plastics Pipe Institute (PPI) \u2013 PEX Plumbing\n\n2. American Society of Home Inspectors (ASHI) \u2013 Common Problems Found During Home Inspections\n\n3. HomeServe \u2013 The Risks of Polybutylene Pipe in Your Home\n\nIt is strongly advised that the homeowner engage a licensed plumber with expertise in modern plumbing systems to conduct a thorough assessment and replacement of the polybutylene piping with PEX or copper materials. This proactive measure will not only mitigate potential water damage risks but also ensure the property's plumbing system operates efficiently and reliably","sev":"major","choices":[]}]},{"name":"Garbage Disposal","c":[{"id":"7a314e9","type":"info","title":"Turned On Garbage Disposal","text":"I turned on the garbage disposal.","sev":"minor","choices":[]},{"id":"d282b7c","type":"defect","title":"Active Water Leak","text":"I observed indications of an active water leak at the garbage disposal.","sev":"moderate","choices":[]},{"id":"214a4b2","type":"defect","title":"Electrical Defect","text":"I observed indications of an electrical defect at the garbage disposal.","sev":"moderate","choices":[]},{"id":"092c851","type":"defect","title":"Did Not Turn On","text":"I observed that the garbage disposal did not turn on.","sev":"minor","choices":[]},{"id":"3ea0abc","type":"defect","title":"Excessive Noise","text":"I observed that there was excessive noise coming from the garbage disposal when it was operating.","sev":"minor","choices":[]},{"id":"de7bd57","type":"defect","title":"Missing Electrical Wire Clamp","text":"I observed indications of a missing electrical wire clamp at the garbage disposal.","sev":"minor","choices":[]},{"id":"c0a2971","type":"defect","title":"Cord Length Too Short (Disposal)","text":"I observed indications of an electrical defect at the garbage disposal.\n\nThe length of the flexible cord at the disposal (not hard-wired) should be 18\" to 36\" inches long.","sev":"moderate","choices":[]},{"id":"36c2782","type":"defect","title":"Old System","text":"I observed during my inspection that the system appeared to be old and at the end of its service life. It may not be reliable. Ask the homeowner or occupant about its recent performance. Regular maintenance and monitoring of its condition is recommended. Budgeting for repairs and future replacement is recommended. InterNACHI's Standard Estimate Life Expectancy Chart for Homes","sev":"minor","choices":[]},{"id":"b20429c","type":"defect","title":"Garbage Disposal- Drain Guard Damaged","text":"The drain guard in a rubber insert that inserts into the drain opening on the garbage disposal.  It protects unwanted items from entering the disposal.\n\nRecommended\n\nReplace the drain guard.","sev":"minor","choices":[]}]},{"name":"AFCI","c":[{"id":"092bef7","type":"defect","title":"Missing AFCI Protection","text":"I observed indications of missing AFCI protection in the kitchen.\n\nAll wall kitchen receptacles should be AFCI protected. Kitchen counter receptacles should be GFCI protected.","sev":"moderate","choices":[]},{"id":"a61f97d","type":"limit","title":"Arc Fault Protection Not Required","text":"While the Michigan Residential Code required Arc Fault protection at one time, it is no longer required as of the 2015 code cycle.  Arc Fault is still required per the National Electrical Code, however Michigan does not require it.  Due to this the inspector does not inspect for arc fault protection.","sev":"minor","choices":[]}]},{"name":"GFCIs & Electrical","c":[{"id":"45570aa","type":"limit","title":"Unable to Inspect Everything","text":"LMT - I was unable to inspect every electrical component or proper installation of the GFCI system according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the electrical system as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"223a20c","type":"info","title":"Inspected GFCIs","text":"I inspected ground-fault circuit interrupter receptacles and circuit breakers observed and deemed to be GFCIs using a GFCI tester, where possible.","sev":"minor","choices":[]},{"id":"ec4ca8e","type":"defect","title":"Missing GFCI","text":"I observed indications that a GFCI is missing in an area that is required to keep people safe. GFCI's should be placed within 6 feet of a water source, on countertops, in garages, and the exterior of the home.  Installation by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"04e5f01","type":"defect","title":"Missing In Service Receptical Cover","text":"In-service covers are the current standard for exterior outlets.  They help prevent moisture from shorting out plugs when in use by providing a protective cover over the outlet even while plugged in.  Replacement of all covers which do not meet this current standard is recommended.","sev":"minor","choices":[]},{"id":"3a8ba42","type":"limit","title":"Unable to Test GFCI","text":"LMT - I was unable to test the GFCI at the exterior. Inspection restriction.","sev":"minor","choices":[]},{"id":"a7676dd","type":"defect","title":"Hot and Neutral Wires Reversed","text":"The inspectors tester shows the hot and neutral wires were reversed on this outlet.  This can cause injury as the hot current will now enter any device plugged into this outlet on the neutral circuit.  This could electrify parts of the device even when the device is off.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"c6f707f","type":"defect","title":"Electrical Defect","text":"I observed indications of an electrical defect at the exterior.","sev":"moderate","choices":[]},{"id":"e46a751","type":"defect","title":"Missing Receptacle","text":"I observed indications that there was a missing electrical receptacle outlet at the house exterior. At a minimum, there should be at least one receptacle in the front and back of the house.","sev":"moderate","choices":[]},{"id":"b3b115e","type":"defect","title":"No Power Detected On GFCI Outlet","text":"The outlet did not have power at the time of the inspection.  This may be due to a loose wire connection, which could cause arcing and a fire or injury.  Recommend evaluation and repair of the outlet by a licensed electrician is recomended.","sev":"moderate","choices":[]},{"id":"79b4e7e","type":"defect","title":"Receptical Loose","text":"The receptacle was loose.  This could be a safety hazard.  Repair is recommended.","sev":"moderate","choices":[]},{"id":"3e59449","type":"defect","title":"GFCI Defect","text":"I observed indications of a defect at a GFCI.","sev":"moderate","choices":[]},{"id":"7a182a9","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.","sev":"moderate","choices":[]},{"id":"554a2e1","type":"defect","title":"Improper Installation of GFCI","text":"I observed indications of improper installation at the GFCI device.","sev":"moderate","choices":[]},{"id":"c6b7e8d","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"67a66c8","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"e881f6a","type":"defect","title":"Outlets Were Not Present On The Exterior Of The Home","text":"The National Electric Code (NEC) now requires a minimum of two exterior receptacles for a home, located at the front and back and usually on the wall of the house, and they must be GFCI-protected for shock prevention and have an in-use or weatherproof cover. The required receptacles cannot be higher than six foot six inches (6\u2019-6\u201d).","sev":"minor","choices":[]},{"id":"6bdca65","type":"defect","title":"Hot and Ground Wires Reversed","text":"The inspectors tester shows the hot and ground wires were reversed on this outlet.  This can cause injury as the outlet and bonding circuit could be electrified.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"befcb19","type":"defect","title":"Weatherproofing Seal Around Outlet Cover Missing","text":"The seal prevents moisture from damaging or coming in contact with the electrical circuit.  Seal gaps with an approved gasketing material.","sev":"minor","choices":[]},{"id":"c7cf3ff","type":"defect","title":"Bulb Is Flickering","text":"The flickering is related to loose wiring.  Ensure the wires are securely connected with a proper connector.  If the bulb is still flickering, have repaired by a qualified electrician.  A flickering bulb may indicate potential loose wiring.","sev":"minor","choices":[]},{"id":"601db8a","type":"defect","title":"Fixture Not Sealed Properly","text":"The lack of a sealant and mounting block allows water to get behind the fixture.  Possible electrical hazard.  Caulk the fixture and install a J-block to prevent water from getting behind the fixture.","sev":"minor","choices":[]},{"id":"5ade776","type":"defect","title":"Improper wiring","text":"","sev":"moderate","choices":[]},{"id":"9bd598b","type":"defect","title":"Light Not Operational","text":"The light was not operational at the time of the inspection.  This is often due to a burned out bulb but could be caused by another deficiency.  Repair is recommended.","sev":"minor","choices":[]}]},{"name":"Kitchen Island","c":[{"id":"a56a226","type":"defect","title":"Island Receptacle Missing","text":"I observed that the kitchen island/peninsula space is missing a receptacle.\n\nThe space is greater than 24\" x 12\".","sev":"moderate","choices":[]},{"id":"b608fcb","type":"defect","title":"Island Not Secure","text":"I observed that the kitchen island is not securely attached. Potential hazard.","sev":"moderate","choices":[]},{"id":"2866405","type":"defect","title":"Defect at Island","text":"I observed indications of a defect at the kitchen island.","sev":"moderate","choices":[]}]},{"name":"Countertops & Cabinets","c":[{"id":"57569d3","type":"info","title":"Inspected Cabinets & Countertops","text":"I inspected a representative number of cabinets and countertop surfaces.","sev":"minor","choices":[]},{"id":"aa120f4","type":"defect","title":"Damaged Cabinet","text":"I observed damage at the kitchen cabinet.","sev":"moderate","choices":[]},{"id":"a663158","type":"defect","title":"Worn Areas at Countertops","text":"I observed worn areas and some damage at the countertops.","sev":"minor","choices":[]},{"id":"1bf3e02","type":"defect","title":"Countertop Damaged","text":"I observed damage at the countertop.","sev":"moderate","choices":[]},{"id":"5eef7dc","type":"defect","title":"Worn Areas at Cabinets","text":"I observed worn areas and some damage at the cabinets.","sev":"minor","choices":[]},{"id":"ab119f5","type":"defect","title":"Cabinet Handle Missing/Loose","text":"I observed a missing/loose cabinet handle.","sev":"minor","choices":[]},{"id":"58daa52","type":"defect","title":"Cabinet Hinge Loose","text":"I observed a loose cabinet door and hinge.","sev":"minor","choices":[]},{"id":"82cc9e2","type":"defect","title":"Caulking Cracked Or Shrunk","text":"The caulking protects the countertop from water damage.  Replace caulking with a premium silicone based caulk.","sev":"minor","choices":[]},{"id":"8aa6bfd","type":"defect","title":"Cabinet Door Missing","text":"I observed one a missing cabinet door.","sev":"minor","choices":[]},{"id":"d672c29","type":"info","title":"Countertop Type","text":"","sev":"minor","choices":["Laminate","Refinished Laminate","Stone","Tile","Butcherblock","Corian","Wood Butcherblock","Epoxy"]},{"id":"9b57db8","type":"defect","title":"Drawer Slides Damaged","text":"","sev":"moderate","choices":[]},{"id":"6d35138","type":"defect","title":"Cabinet Door Sprung","text":"One or more cabinet doors did not operate correctly.  The inspector looked for loose hinges but did not find any.  This could be due to damaged hinges, improperly installed doors, or warped cabinet doors.","sev":"minor","choices":[]},{"id":"2614b75","type":"info","title":"Cabinet Type/ Features","text":"","sev":"minor","choices":["Wood","Lazy Susan","Soft Close Drawer","Roll Out Shelving","Pan Rack","Painted","Laminate","Particle Board"]},{"id":"7f7c606","type":"defect","title":"Water Staining Possible Microbial Growth","text":"Water staining and possible microbial growth was observed in the cupboard.","sev":"major","choices":[]},{"id":"021f591","type":"defect","title":"Cabinet Separating From Wall","text":"I observed a cabinet separated from ceiling or wall. Not secure.","sev":"moderate","choices":[]},{"id":"aba7a0f","type":"defect","title":"Countertop Not Secured","text":"I observed that the countertop was not stable. Not secure. Loose.","sev":"moderate","choices":[]},{"id":"3e21bae","type":"defect","title":"Cabinet Loose","text":"The cabinet is loosely mounted to the wall.  This can limit the capacity of the cabinet.  It may fall from the wall.  Secure the cabinet properly.","sev":"minor","choices":[]}]},{"name":"Floors, Walls, Ceilings","c":[{"id":"5eadf86","type":"defect","title":"Tiles Cracked","text":"","sev":"moderate","choices":[]},{"id":"7f23d5b","type":"info","title":"Floors, Walls, Ceilings Inspected","text":"I inspected the readily visible surfaces of floors, walls and ceilings. I looked for material defects according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"68d69ba","type":"defect","title":"Damaged (General)","text":"The home had general moderate damage visible at the time of the inspection. Recommend service by a qualified contractor.","sev":"moderate","choices":[]},{"id":"2a76775","type":"defect","title":"Minor Damage","text":"Minor damage or deterioration to the ceiling was visible at the time of the inspection.","sev":"moderate","choices":[]},{"id":"325ad22","type":"defect","title":"Moisture Damage","text":"Floors had areas of visible moisture damage. Recommend a qualified flooring contractor evaluate & repair areas of moisture.","sev":"moderate","choices":[]},{"id":"a30c593","type":"defect","title":"Possible Mold","text":"There are possible signs of fungi growth on ceiling. It is unknown if this is a safety hazard. Recommend a qualified mold inspector evaluate.","sev":"moderate","choices":[]},{"id":"c5d6f06","type":"defect","title":"Severe Damage","text":"Severe ceiling damage observed. Recommend a qualified drywall or structural engineer evaluate and advise.","sev":"moderate","choices":[]},{"id":"c0085f4","type":"defect","title":"Stain(s) on Ceiling","text":"There is a stain on ceiling/wall that requires repair and paint.  Source of staining should be determined.","sev":"moderate","choices":[]},{"id":"79aa450","type":"defect","title":"Tiles Missing","text":"One or more floor tiles were missing. Recommend installing/replacing missing tiles.","sev":"moderate","choices":[]},{"id":"81b3405","type":"defect","title":"Door Knob Hole","text":"I observed a hole in the wall caused by a door knob.","sev":"minor","choices":[]},{"id":"554352b","type":"defect","title":"Major Corner Cracks","text":"I observed","sev":"minor","choices":[]},{"id":"5517a84","type":"defect","title":"Minor Corner Cracks","text":"Minor cracks at the corners of doors and windows in walls. Appeared to be the result of long-term settling. Some settling is not unusual in a home of this age and these cracks are not a structural concern.","sev":"moderate","choices":[]},{"id":"9ca5883","type":"defect","title":"Nail Pops","text":"Protruding nail heads visible at the time of the inspection appeared to be the result of contact with moisture. After the source of moisture is located and corrected, protruding nails should be removed, drywall re-fastened and the drywall finished to match the existing wall surfaces. All work should be performed by a qualified drywall or painting contractor.","sev":"moderate","choices":[]},{"id":"85aae6f","type":"defect","title":"Carpet Stains","text":"Carpet had areas of staining or discoloration. Recommend a thorough steam clean by a qualified carpet cleaning company","sev":"moderate","choices":[]},{"id":"4e485f7","type":"defect","title":"Moderate Wear","text":"Floors in the home exhibited moderate surface wear along major paths of travel. Recommend a qualified flooring contractor evaluate for possible re-finish.","sev":"moderate","choices":[]},{"id":"f7a6215","type":"defect","title":"Paint Cracking","text":"Wall paint was cracking in one or more areas. Recommend a qualified painter evaluate and apply a new coat.\n\nHere is a DIY article on treating cracking paint.","sev":"moderate","choices":[]},{"id":"8e07cd1","type":"defect","title":"Recent Roof Leak Damage","text":"Stains on the ceiling appear to be the result of roof leaks. The source of leakage should be identified and corrected, and the ceiling re-painted.","sev":"moderate","choices":[]},{"id":"23df1d7","type":"defect","title":"Sagging Drywall","text":"Ceiling drywall sagged visibly at the time of the inspection. This appears to be due to leakage from above. The source of moisture intrusion should be identified and corrected, and the damaged section of drywall replaced.","sev":"moderate","choices":[]},{"id":"1871e1e","type":"defect","title":"Severe Wear","text":"Floors have severe surface wear in many areas. Recommend a qualified flooring contractor evaluate & remedy.\n\nHere is a DIY article that outlines how to refinish wood floors yourself.","sev":"moderate","choices":[]},{"id":"cffc8ba","type":"defect","title":"Tiles Loose","text":"Loose tiles are present at time of inspection. Recommend a qualified contractor re-attach and seal.","sev":"moderate","choices":[]},{"id":"8655b17","type":"defect","title":"Poor Patching","text":"Sub-standard drywall patching observed at time of inspection. Recommend re-patching.","sev":"moderate","choices":[]}]},{"name":"Windows","c":[{"id":"787ba17","type":"info","title":"Windows Inspected","text":"I inspected a representative number of windows according to the Home Inspection Standards of Practice by opening and closing them. I did not operate window locks and operation features, which is beyond the scope of a home inspection.","sev":"minor","choices":[]},{"id":"c333341","type":"defect","title":"Damaged Hardware at Window","text":"I observed damage to the hardware at a window.","sev":"moderate","choices":[]},{"id":"c735e13","type":"defect","title":"Fogged / Broken Seals","text":"I observed more than one fogged windows and broken seals that caused condensation between window panes.","sev":"moderate","choices":[]},{"id":"0c38a0b","type":"defect","title":"Missing Window Screen","text":"I observed a missing window screen.","sev":"minor","choices":[]},{"id":"5a87557","type":"defect","title":"Moisture at Window","text":"I observed indications of excessive moisture or water intrusion at a window. Further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"13cbe51","type":"defect","title":"Cracked Glass","text":"I observed cracked windowpane glass. Hazardous.","sev":"moderate","choices":[]},{"id":"b399d62","type":"defect","title":"Fogged / Broken Seal","text":"I observed a fogged window and broken seal that caused condensation between the window panes.","sev":"moderate","choices":[]},{"id":"9510840","type":"defect","title":"Damaged Window","text":"I observed damage to a window.","sev":"moderate","choices":[]},{"id":"7af6e29","type":"defect","title":"Missing Hardware at Window","text":"I observed missing hardware at a window.","sev":"minor","choices":[]},{"id":"5387e6c","type":"defect","title":"Missing Lock at Window","text":"I observed a missing lock at a window.","sev":"minor","choices":[]},{"id":"133ec26","type":"defect","title":"Damaged Window Screen","text":"I observed a damaged window screen.","sev":"minor","choices":[]},{"id":"e069ad0","type":"defect","title":"Window Would Not Open","text":"I observed a window that would not open.","sev":"minor","choices":[]},{"id":"188addd","type":"defect","title":"Window Would Not Stay Open","text":"I observed a window that would not stay open. It kept falling down. Hazardous condition.","sev":"moderate","choices":[]},{"id":"aa42d09","type":"defect","title":"Emergency Escape Window Defect","text":"I observed indications of a defect at the emergency escape and rescue opening.\n\nSill height for emergency escape and rescue openings cannot be more than 44 inches from the floor.","sev":"moderate","choices":[]}]},{"name":"Lighting","c":[{"id":"ea28db1","type":"defect","title":"Defect at Kitchen Lighting","text":"I observed a defect at the kitchen lighting.","sev":"moderate","choices":[]}]},{"name":"Range/Oven/Cooktop","c":[{"id":"ceefd90","type":"info","title":"Turned On Stove & Oven","text":"I turned on the kitchen's stove and oven.","sev":"minor","choices":[]},{"id":"69c794c","type":"defect","title":"Stove- Missing Anti-Tip","text":"SFTY- I observed that the stove and oven appliance was not fastened to the wall. Anti-tip device is missing. This poses a safety hazard to children.\n\nRecommendation\n\nManufacturers will supply the proper bracket for their stove if contacted.  The inspector recommends installation of the bracket as soon as possible.","sev":"moderate","choices":[]},{"id":"a795485","type":"limit","title":"No Stove/Oven Appliance","text":"EXCL - There was no stove & oven appliance installed.","sev":"minor","choices":[]},{"id":"6145624","type":"defect","title":"Oven Light Inopperable","text":"The oven light did not work.  This is typically a bad bulb in need of replacement.","sev":"moderate","choices":[]},{"id":"261e491","type":"limit","title":"Very Old Appliance","text":"AGED - I observed indications that the appliance is very old.","sev":"minor","choices":[]},{"id":"714815e","type":"defect","title":"Burner Not Lighting","text":"I observed that one or more heating elements did not heat up when turned on.","sev":"moderate","choices":[]},{"id":"06037e8","type":"defect","title":"Finish Deteriorated","text":"The stove finish was deteriorated.","sev":"moderate","choices":[]},{"id":"c26faab","type":"defect","title":"Oven Not Heating Up","text":"I observed that the oven was not heating up.","sev":"moderate","choices":[]},{"id":"3b2bd1f","type":"defect","title":"Cracked Glasstop","text":"I observed that the glass cooktop was cracked.","sev":"moderate","choices":[]},{"id":"d7f4d92","type":"defect","title":"Missing Control Knobs","text":"I observed missing control knobs at the stove and oven appliance.","sev":"moderate","choices":[]},{"id":"aea1b85","type":"defect","title":"No Gas Shut-off Valve","text":"I observed that there was a missing shutoff valve for the gas supply to the appliance.","sev":"moderate","choices":[]},{"id":"3bc9792","type":"info","title":"Oven Brand","text":"","sev":"minor","choices":["Whirlpool","Caloric","GE","Amana","Kenmore","Maytag","Hotpoint","Frididaire","Unknown","LG","Samsung","Tappan","Wolf","Thermador"]},{"id":"f657f4f","type":"defect","title":"4-Wire Stove/Oven Plug Defect","text":"I observed a defect at the stove/oven plug.\n\nA 4-wire circuit is required for cord and plug connected free standing ranges/stove/oven appliances. It's typically wired with a 50-amp circuit on a #6/3 with ground copper cable.","sev":"moderate","choices":[]}]},{"name":"Exhaust Fan","c":[{"id":"e014273","type":"info","title":"Inspected Exhaust Fan","text":"I inspected the exhaust fan in the kitchen. All mechanical exhaust fans should terminate outside. Confirming that the fan exhausts outside is beyond the scope of a home inspection.","sev":"minor","choices":[]},{"id":"7a953a8","type":"defect","title":"Nearing End Of Life","text":"","sev":"moderate","choices":[]},{"id":"6476c16","type":"defect","title":"Fan Did Not Turn On","text":"I observed that the kitchen exhaust fan did not turn on as expected.","sev":"moderate","choices":[]},{"id":"6daa830","type":"defect","title":"Fan Rattles","text":"I observed indications that the fan rattles unexpectedly.","sev":"minor","choices":[]},{"id":"2ca219c","type":"defect","title":"Exhaust Duct Terminates in Attic","text":"I observed that the exhaust fan terminates into the attic. This can result in moisture damage and mold in the attic.","sev":"moderate","choices":[]},{"id":"2544ad5","type":"defect","title":"Loose Fan","text":"I observed that the exhaust fan is loose.","sev":"minor","choices":[]},{"id":"ea4a4dc","type":"defect","title":"Light Did Not Turn On","text":"I observed that the light did not turn on. Could be a light bulb not working, or it could be something electrical.","sev":"moderate","choices":[]},{"id":"273ef4f","type":"defect","title":"Missing Component at Fan","text":"I observed a missing component or piece of the fan.","sev":"moderate","choices":[]},{"id":"c1ef625","type":"defect","title":"Exhaust Fan Inoperable","text":"I observed that the exhaust fan was inoperable.","sev":"moderate","choices":[]},{"id":"aa797d7","type":"defect","title":"Exhaust Fan Missing","text":"I observed that there was an exhaust system missing.","sev":"moderate","choices":[]},{"id":"fd31ed9","type":"defect","title":"Improperly Exhausting","text":"I observed that the ventilation fan is improperly exhausting air from the space.\n\nExhaust air from bathrooms, toilet rooms, water closet compartments, and other similar rooms shall not be:\n\n\u2022 exhausted into an attic, soffit, ridge vent, crawlspace, or other areas inside the building; or\n\n\u2022 recirculated within a residence or to another dwelling unit.","sev":"moderate","choices":[]},{"id":"114f75e","type":"defect","title":"Excessive Moisture/Condensation","text":"I observed indications of excessive moisture and condensation.\n\nWarm, moist air may condense on cold surfaces. If mold develops, it may cause health problems for sensitive occupants. Condensation could cause damage to the walls or surface materials.","sev":"minor","choices":[]},{"id":"fcfb0dd","type":"defect","title":"Recirculating Fan","text":"","sev":"minor","choices":[]},{"id":"b6785ad","type":"limit","title":"Lack of Mechanical Ventillation","text":"the kitchen does not have an exhaust fan or any form of mechanical ventilation. This absence can lead to several issues, including poor indoor air quality, accumulation of moisture, and potential health risks.\n\nCurrent Condition:\n\nThe kitchen lacks an exhaust fan, which is essential for removing cooking fumes, smoke, and excess moisture from the air. Without proper ventilation, these contaminants can linger, leading to unpleasant odors, grease buildup on surfaces, and increased humidity levels that can promote mold growth and damage to cabinetry and walls.\n\nWhy Ventilation is Required:\n\nProper kitchen ventilation is crucial for maintaining a healthy indoor environment. Cooking releases various pollutants, including carbon monoxide, nitrogen dioxide, and particulate matter, which can pose health risks if not adequately vented. Additionally, ventilation helps to control moisture levels, preventing condensation and the associated risks of mold and mildew.\n\nWhere Ventilation is Required:\n\nWhile specific requirements can vary by local building codes, the International Residential Code (IRC) generally recommends that kitchens have mechanical ventilation to exhaust air to the outside. This is particularly important in modern, energy-efficient homes that are more airtight and thus more prone to indoor air quality issues.\n\n To address the lack of ventilation, it is recommended to install a range vent hood or another type of mechanical ventilation system. A range hood should be installed above the stove and vented to the outside to effectively remove cooking pollutants and moisture. Alternatively, a ductless range hood with a carbon filter can be used, although it is less effective than a vented system3.","sev":"minor","choices":[]}]},{"name":"Built-in Microwave","c":[{"id":"cdae83f","type":"info","title":"Microwave Turned On","text":"I observed that the microwave turned on. I do nothing more than that. Microwaves are beyond the scope of a home inspection.","sev":"minor","choices":[]},{"id":"428dbf0","type":"defect","title":"Defect at the Microwave","text":"I observed indications of a defect at the microwave.","sev":"moderate","choices":[]},{"id":"f7982b3","type":"defect","title":"Unit Past Useful Life","text":"This unit is past or nearing the end of its useful life.  While the unit seemed to function properly at the time of the inspection it is important to understand the it is more prone to fail at any time.  Budget for replacement.","sev":"minor","choices":[]},{"id":"881472e","type":"defect","title":"Louder Than Normal","text":"The built in microwave sounds louder than normal.  This could be an indication the unit is nearing the end of its useful life.","sev":"minor","choices":[]},{"id":"0507a53","type":"defect","title":"Crack at the Microwave","text":"I observed that the microwave had a crack.","sev":"moderate","choices":[]},{"id":"b6e1433","type":"defect","title":"Did Not Turn On","text":"I observed that the microwave did not turn on.","sev":"moderate","choices":[]},{"id":"082dcaf","type":"defect","title":"Improper Mounting","text":"I observed indications that the microwave was improperly mounted above range.","sev":"moderate","choices":[]},{"id":"57919a8","type":"info","title":"Microwave Brand","text":"","sev":"minor","choices":["Whirlpool","Kenmore","Amana","GE","Magic Chef","Fridgidaire","Criterion","E-wave","Samsung","LG","Sharp","Lutron","Mc Appliance","Kitchenaid"]}]},{"name":"Refrigerator","c":[{"id":"8b6344e","type":"info","title":"Refrigerator Was On","text":"I checked to see if the refrigerator was on. It was. That's all I inspected in relation to a refrigerator. Refrigerators are beyond the scope of a home inspection.","sev":"minor","choices":[]},{"id":"ffd4820","type":"defect","title":"Door Seal Damaged","text":"The refrigerator door seal was damaged.  This can increase utility bills.  The seal is repairable.  Repair by an appliance service contractor is recommended.","sev":"minor","choices":[]},{"id":"48228e3","type":"defect","title":"Water Line Disconnected at Fridge","text":"I observed that the water line was apparently disconnected at the refrigerator.","sev":"minor","choices":[]},{"id":"3b3a4a3","type":"defect","title":"Refrigerator- Inoperable","text":"I observed that the refrigerator was inoperable at time of inspection. It was unplugged.  Not Tested.","sev":"moderate","choices":[]},{"id":"c2511d6","type":"limit","title":"Not Installed","text":"LMT - I observed that a refrigerator was not installed.","sev":"minor","choices":[]},{"id":"ac92969","type":"limit","title":"Unplugged","text":"LMT - I observed that the refrigerator was unplugged. Inspection restriction.","sev":"minor","choices":[]},{"id":"499b3f4","type":"info","title":"Refridgerator Brand","text":"","sev":"minor","choices":["Samsung","GE","Whirlpool","Kenmore","Fridgidaire","LG","Amana","Maytag","Hotpoint","Haier","Kitchenaid","Estate","Insignia"]}]},{"name":"Dishwasher","c":[{"id":"cbe17ff","type":"info","title":"Inspected Dishwasher","text":"I inspected the dishwasher by turning it on and letting it run a short cycle.","sev":"minor","choices":[]},{"id":"666d1c3","type":"defect","title":"Missing High Loop","text":"","sev":"moderate","choices":[]},{"id":"ed42851","type":"limit","title":"Dishwasher Was Not Operated","text":"LMT - I did not operate the dishwasher.","sev":"minor","choices":[]},{"id":"d703e78","type":"defect","title":"Did Not Turn On","text":"I observed that the dishwasher did not turn. Inoperative. Defect.","sev":"moderate","choices":[]},{"id":"56c6d96","type":"info","title":"GFCI for Dishwasher Was Observed","text":"I observed apparent GFCI protection at the outlet that serves the dishwasher. Good.\n\nGround-fault circuit-interrupter protection must be provided for outlets that supply dishwashers installed in the house (NEC 2014 210.8.D). GFCI devices must be readily accessible.","sev":"minor","choices":[]},{"id":"2680856","type":"limit","title":"Dishwasher Very Old","text":"LMT - I observed that the dishwasher was very old.","sev":"minor","choices":[]},{"id":"b3ffd60","type":"defect","title":"Missing GFCI Protection","text":"I observed a defect at the GFCI for the dishwasher. There is missing GFCI protection for the dishwasher.\n\nGround-fault circuit-interrupter (GFCI) protection must be provided for outlets that supply dishwashers installed in a house (NEC 2014 210.8.D).\n\nGFCI devices must be readily accessible.","sev":"moderate","choices":[]},{"id":"2975f39","type":"defect","title":"Defect at Controls","text":"I observed an indication of a defect at the controls and control panel of the dishwasher.","sev":"minor","choices":[]},{"id":"b35af2e","type":"defect","title":"Defect at Door Springs","text":"I observed indications of a defect at the door springs.","sev":"minor","choices":[]},{"id":"ac6e8b0","type":"defect","title":"Defect at Backflow Prevention","text":"I observed indications of a defect at the backflow prevention mechanism.\n\nThe water supply to a residential dishwashing machine should be protected against backflow by an air gap within the machine or backflow preventer. The machine must be equipped with an integral backflow mechanism, or the potable water supply must have either a backflow preventer or an air gap. The air gap is actually the open space within the dishwasher interior itself.\n\nThe ASSE 1006 standard for residential and domestic-type dishwashing machines is the requirement for the protection of the potable water supply against backflow. If the unit conforms to the standard, there is an internal integral backflow prevention device installed, and additional precautions are unnecessary. Prior to installing, the installer should confirm that the machine conforms to the standard.","sev":"moderate","choices":[]},{"id":"56be55e","type":"defect","title":"Improper Installation","text":"I observed an improper installation of the dishwasher.","sev":"moderate","choices":[]},{"id":"934a0fe","type":"defect","title":"Dishwasher Rack Broke","text":"The dishwasher rack is loose or damaged.  Replacement or repair is recommended.","sev":"minor","choices":[]},{"id":"1d15b53","type":"defect","title":"Rust on Interior Components","text":"I observed indications of rust on the interior cabinet and components of the dishwasher.","sev":"moderate","choices":[]},{"id":"5da7875","type":"defect","title":"Did Not Drain Properly","text":"I observed indications that the dishwasher failed to drain properly.","sev":"moderate","choices":[]},{"id":"3711b7e","type":"defect","title":"Active Water Leak","text":"I observed indications of an active water leak at the dishwasher.","sev":"moderate","choices":[]},{"id":"3fa950a","type":"defect","title":"Defect at Door Gasket","text":"I observed a defect at the dishwasher door gasket.","sev":"minor","choices":[]},{"id":"a92dcc9","type":"defect","title":"Defect at Dish Rack","text":"I observed indications of a defect at the dish rack of the dishwasher.","sev":"minor","choices":[]},{"id":"c9790ca","type":"defect","title":"Defect at Rollers","text":"I observed indications of a defect at the rollers.","sev":"minor","choices":[]},{"id":"2e66360","type":"defect","title":"Defect at Spray Arms","text":"I observed indications of a defect at the spray arms.","sev":"minor","choices":[]},{"id":"c3e8533","type":"defect","title":"Defect at Soap Dispenser","text":"I observed indications of a defect at the soap dispenser.","sev":"minor","choices":[]},{"id":"1d7fd2e","type":"defect","title":"Defect at Dryer Element","text":"I observed indications of a defect at the dryer element of the dishwasher.","sev":"minor","choices":[]},{"id":"ca67785","type":"defect","title":"Defect at Door Latch","text":"I observed indications of a defect at the dishwasher door latch and lock.","sev":"minor","choices":[]},{"id":"0dd3ed3","type":"defect","title":"Defect at Mounting of Unit","text":"I observed indications of a defect at the mounting or securing of the dishwasher unit to the cabinet and or counter top.","sev":"minor","choices":[]},{"id":"87c3903","type":"defect","title":"Improperly Installed Drain Pipe","text":"I observed indications of a defect at the dishwasher drain pipe. Appeared to be installed improperly.","sev":"moderate","choices":[]},{"id":"ca6f642","type":"defect","title":"Dishwasher Not On Dedicated Circuit","text":"I observed indications that the dishwasher is not on its own dedicated electrical circuit.\n\nThe dishwasher appliance should be on its own dedicated electrical circuit. I recommend checking the main electrical panel for a dedicated and identified breaker.","sev":"moderate","choices":[]},{"id":"e801260","type":"info","title":"Dishwasher Brand","text":"","sev":"minor","choices":["Whirlpool","Kitchenaid","Fridgidaire","Americana","Bosch","Maytag","Edgestar","Adora","Samsung","Kenmore","Gar","GE"]},{"id":"f59a3b6","type":"defect","title":"Defect at Discharge Hose","text":"I observed a defect at the dishwasher discharge hose.\n\nThe dishwasher discharge hose should be connected to the waste tee or disposer inlet above the drain trap. It is recommended that the drain hose either be looped up and securely fastened to the underside of the counter, or be connected to an air gap.\n\nDishwasher must be connected to waste line with a 32\" minimum high drain loop or an air gap above the counter top surface, depending on local codes, to prevent back flow into the dishwasher.\n\nAir gap must be used if the waste tee or disposer connection is less than 18\" above the floor to prevent siphoning.","sev":"moderate","choices":[]},{"id":"6c41e90","type":"defect","title":"Defect at Air Gap at Counter","text":"I observed indications of a defect at the air gap component at the counter top.\n\nThe alternative component to the high loop is the air gap. The air gap is a device that is actually mounted above the counter top surface. In your area, an air gap device may be required by the authority having jurisdiction.","sev":"moderate","choices":[]},{"id":"1a8a354","type":"limit","title":"Dishwasher Not Installed","text":"LMT - The dishwasher was not installed at the time of the inspection.  It was not inspected.","sev":"minor","choices":[]},{"id":"c21c2f1","type":"defect","title":"Dishwasher installed improperly","text":"","sev":"major","choices":[]},{"id":"859a3c1","type":"defect","title":"Dishwasher Unusualy Noisy","text":"The dishwasher was was louder than is typical.  This could be a sign the unit is nearing the end of its useful life.  The inspector recommends an appliance repair person evaluate the unit. Budget for Replacment.","sev":"moderate","choices":[]}]}]},{"name":"Radon System","subs":[{"name":"General","c":[{"id":"3f89aa1","type":"info","title":"Manometer Observed","text":"","sev":"minor","choices":[]}]}]},{"name":"Attached Garage","subs":[{"name":"Garage Floor","c":[{"id":"177a4b1","type":"defect","title":"Floor Surface is Not Noncombustible","text":"I observed indications that the floor surface of the garage is not of an approved noncombustible material. Fire hazard.\n\nThe garage floor must be made of noncombustible material.","sev":"moderate","choices":[]},{"id":"98223f4","type":"limit","title":"Can't See Everything","text":"LMT - I can not observe everything. Inspection restrictions. My inspection was limited.","sev":"minor","choices":[]},{"id":"ffd70d7","type":"info","title":"Garage Floor Inspected","text":"I inspected the floor of the attached garage.","sev":"minor","choices":[]},{"id":"108080e","type":"defect","title":"Floor Surface is Not Sloped","text":"I observed indications that the floor surface of the garage is not sloped properly.\n\nThe area of floor used for parking of automobiles or other vehicles must be sloped. It should slope toward the vehicle door opening. The sloped surface will help the movement of liquids to a drain or toward the main vehicle doorway of the carport.","sev":"minor","choices":[]},{"id":"0da6b18","type":"defect","title":"Structural Defect at Garage","text":"I observed indications of a structural defect at the garage.","sev":"moderate","choices":[]},{"id":"6fe8891","type":"defect","title":"Defect at Floor Drain","text":"I observed indications of a defect at the drain in the garage.","sev":"moderate","choices":[]},{"id":"6fdb2b5","type":"defect","title":"Spalling Concrete at Garage Floor","text":"The garage floor concrete was observed to have spalling, a condition where the surface layer has flaked or chipped away. Spalling is commonly caused by repeated freeze-thaw cycles, often accelerated by the use of ice melt salts. These salts can penetrate the concrete, increasing water absorption and leading to surface degradation over time.\n\nTo address the issue, have the damaged areas repaired by a qualified contractor. Repairs typically involve cleaning the surface, removing loose concrete, and applying a resurfacing compound or patching material designed for concrete. To prevent further spalling, consider sealing the repaired floor with a concrete sealant and minimizing the use of ice melt salts in the garage. Use alternatives, such as sand or non-corrosive de-icers, to reduce future damage.","sev":"minor","choices":[]},{"id":"99d8a0a","type":"defect","title":"Major Cracked Concrete at Garage Floor","text":"I observed indications of major cracks in the garage concrete floor indicating settlement, heaving or structural problems. Further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Garage Vehicle Door","c":[{"id":"8ea18cf","type":"limit","title":"Unable to Inspect Garage Door","text":"LMT - I was unable to inspect the garage door. Inspection restriction.","sev":"minor","choices":[]},{"id":"422099c","type":"defect","title":"Weather Stripping at Garage Door in Poor Condition","text":"I observed indications that the weather stripping at the garage door is in poor condition.","sev":"minor","choices":[]},{"id":"303c9ba","type":"defect","title":"Wood Rot Damage to Garage Door","text":"I observed indications of water damage to the garage door itself. Wood rot.","sev":"moderate","choices":[]},{"id":"7159349","type":"defect","title":"Weathered Condition at Garage Door","text":"I observed weathered conditions at the garage door. Indi

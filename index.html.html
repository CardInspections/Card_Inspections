by the roof covering material and/or the wall cladding (as applicable), and these areas are excluded from this inspection. Therefore, functionality has to be determined by looking for moisture intrusion on ceilings where the flashing was presumed to be in place or on the roof decking from within the attic (as accessible). No reportable conditions were observed at visible portions at the time of inspection unless otherwise noted in this report.","sev":"minor","choices":[]},{"id":"569078a","type":"defect","title":"Flashing- Drip Edge and/ or Flashing Installed Incorrectly","text":"During the inspection it was observed that drip edge and/or fascia we incorrectly installed.  Drip edge and fascia flashings are both often installed incorrectly per manufacturers specifications.  Gaps can allow water infiltration and damage the underlying structure.  There could be hidden damage that was not able to be observed during the visual only inspection.\n\nCorrective steps\n\nCaulking can be used to seal gaps, however this will require annual maintenance.  Replacement of the flashing is the recommended long term solution.\n\nSee below for proper installation diagrams:","sev":"minor","choices":[]},{"id":"e858f24","type":"info","title":"Wall Intersections","text":"I looked for flashing where the roof covering meets a wall or siding material.  There should be step and counter flashing installed in these locations.  This is not an exhaustive inspection of all flashing areas.","sev":"minor","choices":[]},{"id":"236bd63","type":"info","title":"Eaves and Gables","text":"I looked for flashing installed at the eaves (near the gutter edge) and at the gables (the diagonal edge of the roof).  There should be metal drip flashing material installed in these locations.  The flashing helps the surface water on the roof to discharge into the gutter.  Flashing also helps to prevent water intrusion under the roof-covering.","sev":"minor","choices":[]},{"id":"ae8a9bf","type":"defect","title":"Flashing- Missing","text":"During the inspection areas where flashing was missing were observed.  Flashing is a critical component of the roofing system, installed to provide protection against roof leaks and to divert water away from vulnerable areas such as chimneys, vents, skylights, and roof valleys. Missing flashing leaves these areas exposed to water penetration, which can lead to several issues:\n\n\u2022 Roof Leaks: Without flashing, water can seep into gaps around roof penetrations, leading to leaks. Over time, these leaks can cause water damage to ceilings, walls, and insulation\n\n\u2022 Mold and Mildew Growth: Moisture from roof leaks can create an environment conducive to mold and mildew growth, which can damage the home's structure and pose health risks to occupants\n\n\u2022 Structural Damage: Prolonged water exposure can weaken the roof's underlying structure, including rafters and roof decking, potentially leading to sagging or structural failure\n\n\u2022 Decreased Energy Efficiency: Water intrusion can damage insulation, reducing the effectiveness of the home's thermal barrier and increasing energy consumption\n\nCorrective steps\n\n It is recommended to contact a professional roofing contractor to inspect and install proper flashing in the areas where it is missing. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"major","choices":[]},{"id":"0221d59","type":"defect","title":"Flashing- Step Flashing Missing","text":"During the inspection areas where step flashing was missing were observed.  Step flashing is a critical component of the roofing system, installed to provide protection against roof leaks and to divert water away from sidewalls in areas such as chimneys, vents, skylights, and sidewalls. Missing step flashing leaves these areas exposed to water penetration, which can lead to several issues:\n\n\u2022 Roof Leaks: Without flashing, water can seep into gaps around roof penetrations, leading to leaks. Over time, these leaks can cause water damage to ceilings, walls, and insulation\n\n\u2022 Mold and Mildew Growth: Moisture from roof leaks can create an environment conducive to mold and mildew growth, which can damage the home's structure and pose health risks to occupants\n\n\u2022 Structural Damage: Prolonged water exposure can weaken the roof's underlying structure, including rafters and roof decking, potentially leading to sagging or structural failure\n\n\u2022 Decreased Energy Efficiency: Water intrusion can damage insulation, reducing the effectiveness of the home's thermal barrier and increasing energy consumption\n\nCorrective steps\n\n It is recommended to contact a professional roofing contractor to inspect and install proper step flashing in the areas where it is missing. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage.","sev":"major","choices":[]},{"id":"a14f567","type":"defect","title":"Flashing- Installation Doesn\u2019t Meet Common Professional Standards","text":"During the inspection it was observed that flashing was not installed per common professional standards.  Proper installation of flashing is important to prevent water intrusion and damage to the underlying structure. Possible hidden damaged could exist.\n\nImproperly installed flashing leaves these areas exposed to water penetration, which can lead to several issues:\n\n\u2022 Roof Leaks: Without flashing, water can seep into gaps around roof penetrations, leading to leaks. Over time, these leaks can cause water damage to ceilings, walls, and insulation\n\n\u2022 Mold and Mildew Growth: Moisture from roof leaks can create an environment conducive to mold and mildew growth, which can damage the home's structure and pose health risks to occupants\n\n\u2022 Structural Damage: Prolonged water exposure can weaken the roof's underlying structure, including rafters and roof decking, potentially leading to sagging or structural failure\n\n\u2022 Decreased Energy Efficiency: Water intrusion can damage insulation, reducing the effectiveness of the home's thermal barrier and increasing energy consumption\n\nCorrective steps\n\n It is recommended to contact a professional roofing contractor to inspect and properly install flashing in the areas where it is missing. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"moderate","choices":[]},{"id":"010e7f7","type":"defect","title":"Flashing- Counter Flashing Loose","text":"During the inspection loose counter flashing was observed.  Counter flashing overs the step flashing areas.  Loose flashing can cause roof leaks in these areas.  All flashing is supposed to be water-tight or designed to divert water away from certain areas.  Hidden damage could exist.\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and properly install flashing in the areas where it is missing or loose. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"moderate","choices":[]},{"id":"4ee4a65","type":"defect","title":"Flashing- Loose Step Flashing","text":"I observed loose step flashing.  All flashing is supposed to be water-tight or designed to divert water away from certain areas.  This can cause roof leaks in these areas which can lead to several issues:\n\n\u2022 Roof Leaks: Without flashing, water can seep into gaps around roof penetrations, leading to leaks. Over time, these leaks can cause water damage to ceilings, walls, and insulation\n\n\u2022 Mold and Mildew Growth: Moisture from roof leaks can create an environment conducive to mold and mildew growth, which can damage the home's structure and pose health risks to occupants\n\n\u2022 Structural Damage: Prolonged water exposure can weaken the roof's underlying structure, including rafters and roof decking, potentially leading to sagging or structural failure\n\n\u2022 Decreased Energy Efficiency: Water intrusion can damage insulation, reducing the effectiveness of the home's thermal barrier and increasing energy consumption\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and properly install flashing in the areas where it is missing or loose. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"moderate","choices":[]},{"id":"7579082","type":"defect","title":"Flashing- Minor Corrosion","text":"During the inspection roof flashing showed signs of corrosion.  Corroded flashing can cause leaks in the roofing system damaging the structure\n\nwhich can lead to several issues:\n\n\u2022 Roof Leaks: Without flashing, water can seep into gaps around roof penetrations, leading to leaks. Over time, these leaks can cause water damage to ceilings, walls, and insulation\n\n\u2022 Mold and Mildew Growth: Moisture from roof leaks can create an environment conducive to mold and mildew growth, which can damage the home's structure and pose health risks to occupants\n\n\u2022 Structural Damage: Prolonged water exposure can weaken the roof's underlying structure, including rafters and roof decking, potentially leading to sagging or structural failure\n\n\u2022 Decreased Energy Efficiency: Water intrusion can damage insulation, reducing the effectiveness of the home's thermal barrier and increasing energy consumption\n\nCorrective steps\n\nIt is recommended to contact a professional roofing contractor to inspect and properly install flashing in the areas where it is corroded. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"minor","choices":[]},{"id":"00ff539","type":"defect","title":"Flashing- Major Corrosion","text":"Roof flashing showed signs of severe corrosion, which can lead to moisture intrusion and/or mold.  The roof is most likely leaking in this area even if it was not visible during the visual only inspection.  This is a major issue.\n\nCorrective steps\n\nImmediate repair by a licensed roofing contractor is recommended.  It is recommended to contact a professional roofing contractor to inspect and properly install new flashing. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"major","choices":[]},{"id":"0bdd897","type":"defect","title":"Flashing- Headwall and/or Step Flashing Corroded","text":"Roof flashing showed signs of severe corrosion, which can lead to moisture intrusion and/or mold.  The roof is most likely leaking in this area even if it was not visible during the visual only inspection.  This is a major issue.\n\nCorrective steps\n\nImmediate repair by a licensed roofing contractor is recommended.  It is recommended to contact a professional roofing contractor to inspect and properly install new flashing. Ensuring that flashing is correctly installed will help maintain the roof's integrity, prevent water infiltration, and protect the home from further damage","sev":"major","choices":[]},{"id":"2788a2d","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Gutters & Downspouts","c":[{"id":"47731c5","type":"defect","title":"Gutters- Debris","text":"During the inspection accumulated debris in the gutter were observed.  Debris in the gutter can clog downspout and allow water to run over the gutters.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.\n\nCorrective steps\n\nCleaning and maintenance are recommended.  For instructions on how to clean gutters click here.","sev":"minor","choices":[]},{"id":"09cdc14","type":"limit","title":"Couldn't Reach the Gutters","text":"LMT - I was unable to closely reach and closely inspect the installation of some or all of the gutter system.  This is an inspection limitation.  The inspector recommends further evaluation by a gutter contractor.","sev":"minor","choices":[]},{"id":"293e1cd","type":"info","title":"Homeowner's Responsibility","text":"Your job is to monitor the gutters and be sure that they function during and after a rainstorm. Look for loose parts, sagging gutter ends, and water leaks. The rain water should be diverted far away from the house foundation.","sev":"minor","choices":[]},{"id":"be07c68","type":"defect","title":"Gutters- Nail And Ferrell Fastening System","text":"During the inspection it was noted the gutters are fastened with a nail and ferrell fastening system.  The fasteners of this system are known for pulling loose.  This can cause the gutters to disconnect and collapse.\n\nCorrective steps\n\n Monitor the gutters and replace the fasteners as necessary.  Follow this link to learn more about gutter fastening systems.","sev":"minor","choices":[]},{"id":"77edfc0","type":"info","title":"Gutters Were Inspected","text":"I inspected the gutters.  I wasn't able to inspect every inch of every gutter.  But I attempted to check the overall general condition of the gutters during the inspection and look for indications of major defects.\n\nMonitoring the gutters during a heavy rain (without lightening) is recommended.  In general, the gutters should catch rain water and direct the water towards downspouts that discharge the water away from the house foundation.","sev":"minor","choices":[]},{"id":"318e1f2","type":"defect","title":"Gutters- Damaged","text":"During the inspection damage to the gutter was observed.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.  A lack of a properly working gutter system can cause water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended the gutters be repaired by a qualified gutter contractor.  Gutters should be evaluated for proper slope, sealed joints, and secured hangers.","sev":"moderate","choices":[]},{"id":"7f0abc9","type":"info","title":"Gutter Material/ Construction","text":"","sev":"minor","choices":["Metal","Eve Mounted","Hidden Hangers","Nail and Ferrell","Plastic","Gutter Guard"]},{"id":"166a4b0","type":"info","title":"Downspout Material","text":"","sev":"minor","choices":["Metal","Plastic","Not Present"]},{"id":"07f4ea2","type":"defect","title":"Gutters- Loose","text":"SFTY- The inspector noted the gutters were loose in one or more areas.  This could cause the gutters to become disconnected from the house and fall.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.  A lack of a properly working gutter system can cause water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended the gutters be repaired by a qualified gutter contractor.  Gutters should be evaluated for proper slope, sealed joints, and secured hangers.","sev":"major","choices":[]},{"id":"0d73021","type":"info","title":"Downspout Discharge","text":"Downspouts should discharge a minimum of 6 feet from the structure.  Downspout that discharge underground are virtually impossible to determine the distance they discharge from the home.","sev":"minor","choices":["Above Ground","Below Ground","N/A"]},{"id":"c9e59f0","type":"defect","title":"Gutters Missing","text":"During the inspection the inspector noted gutters were missing from the home.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.  A lack of a properly working gutter system can cause water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended the gutters be installed by a qualified gutter contractor.","sev":"moderate","choices":[]},{"id":"37f4d13","type":"defect","title":"Gutters- Improperly Sloped","text":"The inspector observed that the gutter showed indications of improper slope.  Gutters are supposed to be sloped down toward the downspout of the gutter at a rate of 1/2\" for every 10 feet.  Improperly sloped gutters can accumulate debris and allow water to run over the gutter near the foundation.  This can cause water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended the gutters be evaluated and reinstalled by a qualified gutter contractor.   Gutters should be evaluated for proper slope, sealed joints, and secured hangers.","sev":"minor","choices":[]},{"id":"7db9427","type":"info","title":"Gutter Maintenance","text":"Regularly clearing debris from the gutter channels is advised to avoid the blockage of downspouts. Clogged downspouts can result in overflowing gutters, leading to potential harm to the roof sheathing, fascia boards, and saturation of the foundation area.","sev":"minor","choices":[]},{"id":"62d7c23","type":"defect","title":"Gutters- Missing End Cap","text":"During the inspection gutter end caps were missing from the gutters.  Missing end caps will allow the water to run out the end of the gutter and collect near the foundation.  This can cause water infiltration into the home.\n\nCorrective steps\n\nIt is recommended the end caps be properly installed and sealed by a qualified gutter contractor.","sev":"minor","choices":[]},{"id":"e54e823","type":"defect","title":"Gutters- Leaking","text":"During the inspection the inspector observed a water leak from a gutter, which could result in water not being properly collected and drained away. Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.\n\nCorrective steps\n\nThe gutters should be sealed with a specialized gutter sealant (I like to use Dap 3.0 Gutter and Flashing).","sev":"minor","choices":[]},{"id":"fde9b86","type":"defect","title":"Gutters- Lacks Protection Against Accumulating Debris","text":"During the inspection it was observed the gutters do not have protection against accumulating debris.  Protection of the gutters, often called gutter guards, protect the gutters from accumulating debris, without protection the gutters may clog.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.\n\nCorrective steps\n\nConsider the addition of gutter covers or, at minimum, a downspout strainer.","sev":"minor","choices":[]},{"id":"f668d89","type":"defect","title":"Gutters- Guards Not Attached Properly","text":"The gutter guards are not attached properly.  This could allow them to fall off or may not catch debris as designed.\n\nCorrective steps\n\nThe inspector recommends a gutter contractor reattach the gutter guards to meet manufacturers specifications.","sev":"minor","choices":[]},{"id":"8d8d590","type":"defect","title":"Gutters- Guards Blocked","text":"The inspector noted the gutter guards are full of debris.  This will block water from entering the gutter, causing water to overspill and collect near the foundation of the home.  This can result in water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended to remove debris from gutter guards and evaluate the surrounding vegetation to prevent future blockages.","sev":"minor","choices":[]},{"id":"20859ab","type":"defect","title":"Gutters- Straps Installed Over Shingles","text":"During the inspection it was observed the supports for the gutter, often called gutter straps, were installed on top of the shingles.  Gutter straps are designed to be installed under the shingles to reduce the possibility of a leak.\n\nCorrective steps\n\nThese gutters should be installed properly by a professional gutter installation contractor. Follow this link to learn more about gutter fastening systems.","sev":"minor","choices":[]},{"id":"499cefb","type":"defect","title":"Gutters- Not Properly Supported","text":"The inspector noted the gutters were not properly supported.  Gutters hanging systems each have specific requirement that need to be met in order to properly support the gutter.  These vary by gutter type and size.  Improperly supported gutters could become detached from the structure and fall.\n\nCorrective steps\n\n A professional gutter contractor should be contacted to repair the improperly supported gutters.","sev":"minor","choices":[]},{"id":"911fe5b","type":"defect","title":"Gutters- Fastening Defect","text":"The inspector observed the gutters were not properly secured at the time of the inspection.  This can cause the gutters to fail.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.\n\nCorrective steps\n\nIt is recommended the gutters be properly fastened by a gutter contractor.","sev":"minor","choices":[]},{"id":"1458d23","type":"defect","title":"Gutters- Lack of Downspouts","text":"The inspector noted the downspouts in the gutter system were not properly placed.  Gutters should not be more than 30 feet long without a downspout.  Long runs of gutter without a downspout can cause the gutters to overflow.  Gutters are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.\n\nCorrective steps\n\nIt is recommended the gutter system be evaluated for proper downspout locations by a gutter contractor and repairs be made as needed.","sev":"moderate","choices":[]},{"id":"7289796","type":"defect","title":"Downspouts- Drain Near House","text":"The inspector observed one or more downspouts drain too close to the home's foundation.  This can result in excessive moisture in the soil at the foundation, which can lead to foundation/structural movement and water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended a qualified contractor adjust downspout extensions to drain at least 6 feet from the foundation.  A handy homeowner should be able to do this project.  For more information click here.","sev":"moderate","choices":[]},{"id":"873bae6","type":"defect","title":"Downspouts- Detached","text":"The inspector observed one or more disconnected and detached downspout pipes.  Downspouts are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.  Without proper discharge away from the foundation rain water can collect near the foundation and cause water infiltration into the home.\n\nCorrective steps\n\nIt is recommended to reattach downspouts and ensure proper drainage away from the foundation.","sev":"moderate","choices":[]},{"id":"742b7bc","type":"defect","title":"Downspouts- Discharges Onto Roof Covering","text":"During the inspection it was noted the downspout discharges onto the roof covering.  This can cause damage to the roof covering and allow water to infiltrate the sheeting underneath.\n\nCorrective steps\n\nRecommend a qualified gutter contractor route the downspout so the discharge will not come in contact with the roof covering.","sev":"moderate","choices":[]},{"id":"13d6aa7","type":"defect","title":"Downspouts- Missing","text":"The inspector observed a missing downspout at the house.  Downspouts are necessary to properly collect rainwater from the roof, control it, divert it, and discharge that water away from the house and its foundation.   A lack of downspouts can allow water to collect near the foundation causing water infiltration into the structure.\n\nCorrective steps\n\nIt is recommended a gutter contractor install downspouts to properly direct water away from the structure.","sev":"moderate","choices":[]},{"id":"49637f7","type":"defect","title":"Downspouts- Splash Block Need Adjusted","text":"The inspector observed indications that the water diverter tray or splash block at the downspout end were not positioned correctly.  Splash blocks are necessary to properly control rainwater, divert it, and discharge that water away from the house and its foundation.  Splash blocks are a temporary fix to divert water away from the foundation, but they do not tend to divert them far enough from the foundation.\n\nCorrective steps\n\n The inspector recommends correctly positioning the diverter blocks until the downspouts can be correctly diverted by a qualified gutter contractor.","sev":"minor","choices":[]},{"id":"53c7b86","type":"limit","title":"Snow","text":"LMT - The gutters were partially or completely covered with snow and/ or ice.  This is an inspection limitation.  The gutters were not completely inspected.","sev":"minor","choices":[]},{"id":"2bc6799","type":"limit","title":"Gutters Not Present On Home","text":"A few inches of rain falling on the roof of a house can produce several thousand gallons of water runoff. This runoff must be channeled away from the home's foundation. Otherwise, the excess water can quickly saturate the soil surrounding the building and wick through the foundation to the interior.  Once inside, this moisture can lead to a variety of problems, including mold and wood rot. Excess moisture can also cause indoor air quality problems.\n\nI recommend installing gutters on the home.  For more information click here.","sev":"minor","choices":[]},{"id":"58e8a00","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]},{"id":"a3c3d55","type":"limit","title":"Downspout Discharge Not Verified","text":"EXCL - The inspector could not verify the location of the downspout discharge.  It was hidden from view of the visual only inspection.  If the downspout discharges within 6 feet of the foundation we recommend repair by a gutter professional.","sev":"minor","choices":[]}]},{"name":"Plumbing Vent Pipes","c":[{"id":"d4b24ef","type":"info","title":"Homeowner's Responsibility","text":"Your job is to monitor the flashing around the plumbing vent pipes that pass through the roof surface.  Sometimes they deteriorate and cause a roof leak.\n\nBe sure that the plumbing vent pipes do not get covered, either by debris, a toy, or snow.","sev":"minor","choices":[]},{"id":"00a6bd5","type":"limit","title":"Snow Covering Blocked Visability","text":"LMT - The snow on the roof blocked visibility of all the flashings.  This is an inspection limitation.  Plumbing Vents and flashings were not inspected.","sev":"minor","choices":[]},{"id":"be5892b","type":"info","title":"Plumbing Vent Pipes Inspected","text":"I looked at DWV (drain, waste and vent) pipes that pass through the roof covering.  There should be watertight flashing (often black rubber material) installed around the vent pipes.  These plumbing vent pipes should extend far enough above the roof surface.","sev":"minor","choices":[]},{"id":"27355a1","type":"limit","title":"Unable to Reach All the Pipes","text":"LMT - I was unable to closely reach and observe all of the vent pipes that pass through the roof-covering materials.  This was an inspection restriction.","sev":"minor","choices":[]},{"id":"f28d082","type":"defect","title":"Vent Pipe Flashing- Material Was Cracked","text":"The inspector observed the rubber membrane flashing material around the vent pipe was cracked and damaged.  This is prone to water penetration.  Hidden damage may exist if water has entered the structure.\n\nCorrective steps\n\nReplacement by a licensed roofing professional recommended.  For a temporary fix the inspector recommends installing a rain collar such as this one sold by Oatey.","sev":"major","choices":[]},{"id":"5e9b335","type":"defect","title":"Vent Pipe Flashing- Defect","text":"The inspector observed indications of a defect at the vent pipe flashing. This flashing prevents water from entering the structure.  Improper flashing is prone to water penetration or roof leak which can allow water to enter the structure.\n\nCorrective steps\n\nRecommend replacement or repair of the vent pipe flashing by a licensed roofing contractor.","sev":"moderate","choices":[]},{"id":"867c8e6","type":"defect","title":"Vent Pipe Flashing- Improperly Fastened","text":"The fastening around the vent pipe was not properly installed. The vent pipe flashing could be loose, allowing water to penetrate the structure.\n\nCorrective steps\n\nThe inspector recommends correction by a licensed roofing professional.","sev":"minor","choices":[]},{"id":"d563149","type":"defect","title":"Vent Pipe Flashing- Missing","text":"The inspector observed missing flashing at the vent pipe.  Vent pipe flashing prevents water from entering the structure.  This is prone to water penetration.  Hidden damage may exist.\n\nCorrective steps\n\nCorrection by a licensed roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"16b5f70","type":"defect","title":"Vent Pipe Flashing- Installed Backwards","text":"During the inspection it was observed the pipe flashing is installed backwards.  Installation of the vent pipe flashing in this manner can allow water to penetrate the structure as it may not properly seal and divert the water away from the roof penetration.\n\nCorrective steps\n\nRepair by a licensed roofing contractor is recommended.","sev":"minor","choices":[]},{"id":"2dba531","type":"defect","title":"Vent Pipe Flashing- Loose","text":"The inspector observed loose flashing at the vent pipe.  Vent pipe flashing prevents water from entering the structure.  Loose flashing can indicate the flashing was not properly secured or is deteriorating in an unobserved location.\n\nCorrective steps\n\nCorrection by a licensed roofing professional is recommended.","sev":"minor","choices":[]},{"id":"8ee814c","type":"defect","title":"Vent Pipe Flashing- Gap","text":"During the inspection a small gap was observed at the vent pipe flashing.  This type of flashing needs to be sealed to the roofing to prevent leaks.  There may have been sealant that was not visible.\n\nCorrective steps\n\nThe inspector recommends sealing the gap with premium exterior grade sealant or repair of the flashing by a licensed roofing contractor.","sev":"minor","choices":[]},{"id":"310973d","type":"info","title":"Plumbing Vent Material","text":"","sev":"minor","choices":["PVC","Cast Iron","Copper","ABS"]},{"id":"cd6c6b0","type":"info","title":"Plumbing Vent Flashing Material","text":"If tar or caulking were used on the flashing annual maintenance will be required to prevent water infiltration and damage.","sev":"minor","choices":["Plastic","Aluminum","Galvanized","Metal","Lead","Tar","Caulk","Unknown","Rubber"]},{"id":"040b543","type":"defect","title":"Vent Pipe- Too Short","text":"During the inspection it was observed the vent pipe that extends above the roof surface is short.  The vent pipe must extend at least 6 inches above the roof surface of a sloped roof.  This prevents snow from entering the pipe and prevents moisture from penetrating the structure.  If moisture has entered the structure hidden damage may exist.\n\nCorrective steps\n\nIt is recommended the pipe be extended to meet current standards by a licensed roofing or plumbing contractor","sev":"minor","choices":[]},{"id":"238844d","type":"defect","title":"Vent Pipe- Defect **MISC **","text":"During the inspection a defect for of the vent pipe was observed.\n\nCorrective steps","sev":"minor","choices":[]},{"id":"7a9947c","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Ventilation","c":[{"id":"4587898","type":"defect","title":"Lack of Ventillation","text":"It was observed that the current setup does not meet the recommended standards for proper attic ventilation. This deficiency can lead to several issues, including increased energy costs, moisture buildup, and potential damage to the roof structure.\n\nCurrent Condition:\n\nThe existing roof ventilation system lacks adequate intake and exhaust vents. Specifically, the number of vents present is insufficient to provide the necessary airflow to maintain a balanced ventilation system. This imbalance can cause hot air and moisture to become trapped in the attic, leading to potential problems such as mold growth, wood rot, and decreased efficiency of the home\u2019s heating and cooling systems.\n\nRecommended Standards:\n\nProper roof ventilation is crucial for maintaining the health and longevity of the roof and attic space. According to the U.S. Federal Housing Authority, a balanced ventilation system should provide a minimum of 1 square foot of ventilation (evenly split between intake and exhaust) for every 300 square feet of attic floor space1. This typically involves installing vents at the soffits (intake) and at or near the roof ridge (exhaust) to ensure a continuous flow of air through the attic12.\n\nCorrective steps\n\nIt is recommended to consult with a professional roofing contractor to add more ventilation. The contractor should assess the specific needs of the attic space and install additional soffit vents and ridge vents as necessary to achieve a balanced ventilation system. This will help to ensure proper airflow, reduce the risk of moisture-related issues, and improve the overall energy efficiency of the home.","sev":"moderate","choices":[]},{"id":"e23fbb2","type":"info","title":"Ventillation Type","text":"","sev":"minor","choices":["Eve","Baffles Installed","Ridgevent","Gable Vent","Box Vent"]},{"id":"8cb3fb8","type":"defect","title":"Box Vent- Damaged","text":"During the inspection it was noted the box vent was damaged.  Box vents allow air to exit the attic in order to provide proper ventilation in the attic.  The damage can allow water intrusion into the structure.\n\nCorrective steps\n\nReplacement of the box vent by a licensed roofing contractor is recommended.\n\nBox Vent","sev":"minor","choices":[]}]},{"name":"Flue Gas Vent Pipes","c":[{"id":"62192a0","type":"defect","title":"Flue Gas Vent Pipe Flashing- Damaged","text":"The metal flashing material around the flue gas vent pipe was damaged.  This flashing prevents water from entering the structure.  This is prone to water penetration.\n\nCorrective steps\n\nRepair by a licensed roofing contractor is recommended.","sev":"moderate","choices":[]},{"id":"e38c73c","type":"info","title":"Homeowner's Responsibility","text":"Your job is to monitor the flashing around the flue gas vent pipes that pass through the roof surface.  Sometimes they deteriorate and cause a roof leak.","sev":"minor","choices":[]},{"id":"44055e4","type":"limit","title":"Unable to Reach All the Flue Gas Vent Pipes","text":"LMT - I was unable to closely reach and observe all of the flue gas vent vent pipes that pass through the roof-covering materials.  This was an inspection restriction.","sev":"minor","choices":[]},{"id":"e272185","type":"defect","title":"Flue Gas Vent Pipe Flashing- Missing","text":"During the inspection it was observed missing flashing at the gas vent pipe.  This flashing prevents water from entering the structure which could cause water damage to the structure.\n\nCorrective steps\n\n Correction by a licensed roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"88d7d53","type":"info","title":"Flue Gas Vent Pipe Inspected","text":"I looked at flue gas vent pipes that pass through the roof covering.\n\nAll gas-fired appliances must be connected to venting systems. There should be watertight metal flashing installed around the flue gas vent pipes.  The vent pipes should extend far enough above the roof surface.","sev":"minor","choices":[]},{"id":"24b4488","type":"info","title":"Flue Gas Vent Pipe Material","text":"Flue gas vent pipes could service furnaces, boilers, water heaters, or other appliances.  These pipes let the noxious flue gases out of the home safely.  Annual inspections are important.  It is virtually impossible for the inspector to determine which appliances vent into the flue.  Parts of the flue may be hidden behind walls, ceilings, or other inaccessible places.","sev":"minor","choices":["PVC","Metal"]},{"id":"e57ea8a","type":"defect","title":"Flue Gas Vent Pipe Flashing- Improperly Installed","text":"During the inspection it was observed the fastening around the vent pipe was not properly installed. This flashing prevents water from entering the structure which could lead to water damage to the structure.\n\nCorrective steps\n\nRepair by a licensed roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"0c19150","type":"defect","title":"Flue Gas Vent Pipe Flashing- Was Loose","text":"The inspector observed loose flashing at the vent pipe.  Vent pipe flashing prevents water from entering the structure.  Loose flashing can indicate the flashing was not properly secured or is deteriorating in an unobserved location.\n\nCorrective steps\n\nCorrection by a licensed roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"3be1dc4","type":"defect","title":"Flue Gas Vent- Lack of Clearance","text":"The gas vent pipe that extends above the roof surface was observed to be too close to the house structure.  Vent pipes must have clearance from items to provide proper ventilation of the flue gasses and provide proper clearance from combustibles.  The following is a partial list of clearances needed:\n\nDistance above roof decking- 12\"\n\nDistance above or below balcony, deck, or porch- 12\"\n\nDistance to a window or door that is operable- 12\"\n\nDistance to permanently closed window- 12\"\n\nDistance to ventilated soffit- 24\"\n\nDistance to un-ventilated soffit- 24\"\n\nDistance to outside corner of building- 24\"\n\nDistance to inside corner of building- 3 feet\n\nCorrective steps\n\nRepair by a licensed roofing contractor is recommended.","sev":"moderate","choices":[]},{"id":"579df82","type":"defect","title":"Flue Gas Vent Pipe- Damage","text":"The inspector observed indications of damage at the flue gas vent pipe.  Damages to the vent pipe can cause the furnace to improperly vent or could cause water infiltration into the structure.  This can be a safety hazard.\n\nCorrective steps\n\nRepair by a licensed HVAC professional is recommended.","sev":"moderate","choices":[]},{"id":"2356531","type":"defect","title":"Flue Gas Vent Pipe- Defect **MISC**","text":"I observed an indication of a defect at the flue gas vent pipe.\n\nCorrective steps","sev":"moderate","choices":[]}]},{"name":"Skylight","c":[{"id":"49e0433","type":"defect","title":"Skylight Flashing- Defect","text":"The inspector observed a defect at the skylight flashing area.  Proper flashing of the skylight is imperative to keeping water from infiltrating the structure.  If the skylight is already leaking hidden damage may exist.\n\nCorrective steps\n\nRepair by a licensed roofing contractor is recommended.","sev":"major","choices":[]},{"id":"0e5b5cf","type":"limit","title":"Couldn't Reach Skylight Closely","text":"LMT - I could not reach and access the skylight closely.  I did my best to visual inspect the skylight, but access was an inspection restriction.  I recommend asking the seller for information about the skylight, its age, and any problems with the skylight in the past.","sev":"minor","choices":[]},{"id":"94ad349","type":"info","title":"Skylight Was Inspected","text":"Skylights are notoriously problematic and a common point of leaks.  It is important to keep the area around the skylight free of debris and to monitor it for evidence of water leaks during heavy rains and/or winter snow melts.\n\nFrom outside, watch the glazing for cracks or breaks, loosening of the flashing, and rusting or decaying frames.  Skylights should be checked from the interior, too.  Don't be surprised if your skylight develops a leak.","sev":"minor","choices":[]},{"id":"e49b519","type":"defect","title":"Skylight Assembly- Damaged","text":"The inspector observed damage to the skylight assembly.  This condition is prone to water leakage at the skylight.\n\nCorrective steps\n\nReplacement of the skylight by a licensed roofing contractor is recommended.","sev":"major","choices":[]},{"id":"743abef","type":"defect","title":"Skylight Assembly- Glass Fogged Observation","text":"Observation- The inspector observed a fogged windowpane (a lost seal) at the skylight.\n\nMisty or foggy windows typically means that the seal protecting the window assembly has failed, and condensation has formed in between the two panes of glass.  Condensation in double-paned windows indicates that the glazing assembly has failed and needs repair or replacement.  Visible condensation can damage glazing and is the main indication of sealant failure.  Condensation is not always visible.  If the failure is recent, a failed window may not be obvious, since condensation doesn't usually form until the window is heated by direct sunlight. Windows in the shade may show no evidence of failure, so it is nearly impossible to observe and report all failed double-paned windows.","sev":"minor","choices":[]},{"id":"08d0210","type":"defect","title":"Skylight Assembly- Glass Cracked","text":"The inspector observed cracked and damaged glass at the skylight.  This can be a safety hazard and could allow water to penetrate the structure.\n\nCorrective steps\n\nReplacement by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"fc03c09","type":"info","title":"Skylight Type","text":"","sev":"minor","choices":["Dome","Fixed"]}]},{"name":"Chimney","c":[{"id":"c2a1cb6","type":"defect","title":"Chimney Brick- Spalling","text":"SFTY- The chimney brick is experiencing spalling. Spalling is a condition where the surface of the brick flakes, peels, or crumbles away. This typically occurs due to moisture infiltration, which can cause the brick to deteriorate over time. Factors such as freeze-thaw cycles, poor-quality mortar, and exposure to harsh weather conditions can accelerate this process. This not only affects the appearance of the chimney but can also lead to more severe issues, such as water damage to the interior of the home and potential collapse of the chimney structure.\n\nCorrective stepsIt is strongly recommended that a professional chimney mason be contacted to inspect and repair the spalling bricks. A qualified mason can assess the extent of the damage, determine the underlying cause, and perform necessary repairs to restore the chimney's integrity. Prompt attention to this issue will prevent further deterioration and ensure the safety and functionality of the chimney.","sev":"major","choices":[]},{"id":"a01c9a1","type":"defect","title":"Chimney- Crowned Cap Defect","text":"During the inspection of the chimney, it was noted that the concrete chimney cap had visible defects.  The chimney cap is designed to shed water away from the brick chimney, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney cap poses several risks:\n\n\u2022\nWater Penetration: The cap is designed to properly shed water away from the chimney.  Minor cracks can cause water to deteriorate the brick, allowing water to penetrate the structure.  Minor cracks can also spread into larger cracks overtime as\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the chimney's masonry, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the chimney can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney cap be repaired or replaced by a licensed masonry contractor. The new cap should include a properly installed drip edge to ensure water is effectively shed away from the chimney structure. This will help to protect the chimney from water damage and extend its lifespan.","sev":"moderate","choices":[]},{"id":"c132ea3","type":"limit","title":"Chimney: Chimney - Flashing Limitations","text":"LMT - The chimney flashing was inspected for significant defects at visible portions. At the time of inspection, no reportable conditions were visibly present unless otherwise noted in this report. Unfortunately, the full installation of the flashing was not visible due to being covered by the shingles on a masonry chimney, while cladding can obscure all visibility on framed chases. The inspection of this flashing is limited to visible portions only, along with an inspection of ceilings in the area looking for moisture staining and/or the roof decking in the attic (as accessible). Going forward, I recommend monitoring the ceilings in the chimney area, looking for moisture staining, and having an initial (pre-purchase) or annual evaluation of this flashing performed by a qualified roofing contractor as desired to ensure it is performing as intended. This is the most common area for roof leaks, which can allow for substantial damage if not caught early.","sev":"minor","choices":[]},{"id":"d26700d","type":"defect","title":"Chimney Brick- Grout Loose","text":"The grout on the chimney is loose or deteriorated. Grout is essential for filling the gaps between the bricks or stones in the chimney, providing structural support and preventing water infiltration. Grout plays a crucial role in maintaining the integrity of the chimney by holding the bricks together and sealing out moisture. Over time, grout can become loose or deteriorate due to various factors such as weather exposure, freeze-thaw cycles, and general wear and tear. When grout deteriorates, it can lead to gaps and cracks, allowing water to seep into the chimney structure. This can cause further damage, including brick spalling and potential structural issues.\n\nCorrective steps\n\nIt is recommended that a licensed chimney repair contractor or mason be contacted to tuck point the chimney and repair the loose grout. Tuck pointing involves removing the damaged grout and replacing it with new mortar, ensuring the chimney remains structurally sound and protected from moisture.","sev":"moderate","choices":[]},{"id":"389992d","type":"defect","title":"Chimney Leaning","text":"During the inspection, it was noted that the masonry chimney is leaning.  A leaning masonry chimney can be a serious indicator of structural failure. This condition often arises due to foundation issues, such as settling or shifting soil, which can cause one side of the chimney to sink and result in a noticeable tilt. Other contributing factors may include poor construction, erosion, water damage, or seismic activity.  A leaning chimney poses several risks, including:\n\n\u2022 Collapse Risk: As the tilt worsens, the chimney's structural integrity weakens, increasing the likelihood of collapse\n\n\u2022 Fire Hazard: Gaps between the chimney and the house can allow heat, smoke, and flames to escape into areas they shouldn't, potentially leading to fires\n\n\u2022  Carbon Monoxide Leaks: A compromised chimney may not effectively vent harmful gases like carbon monoxide, posing a serious health risk\n\nCorrective steps\n\nIt is strongly recommended to contact a licensed chimney repair contractor to evaluate the leaning chimney. Given the severity of the issue, replacement of the chimney may be necessary to ensure the safety and structural integrity of the home.  A professional contractor can assess the extent of the damage, determine the best course of action, and perform the necessary repairs or replacement.","sev":"moderate","choices":[]},{"id":"e656cb6","type":"defect","title":"Chimney Brick- Missing","text":"The inspector noted bricks were missing and/ or deteriorated from the chimney at the time of the inspection.  This typically occurs due to moisture infiltration, which can cause the brick and mortar to deteriorate over time.  Factors such as freeze-thaw cycles, poor quality mortar, and exposure to harsh weather conditions can accelerate this process.  Missing bricks is a sign of significant structural deficiencies within the chimney and need to be addressed immediately.\n\nMissing bricks are a sign that the chimney's structural integrity is compromised. When water enters the brick, it can freeze and expand, leading to the brick's surface breaking apart, loss of mortar, and bricks becoming dislodged. This not only affects the appearance of the chimney but can also lead to more severe issues, such as water damage to the interior of the home and potential collapse of the chimney structure.\n\nCorrective steps\n\nIt is strongly recommended that a professional chimney mason be contacted to inspect and repair the chimeny. A qualified mason can assess the extent of the damage, determine the underlying cause, and perform necessary repairs to restore the chimney's integrity. Prompt attention to this issue will prevent further deterioration and ensure the safety and functionality of the chimney.","sev":"major","choices":[]},{"id":"e79f05b","type":"defect","title":"Chimney Flashing Defect","text":"The inspector noted the flashing at the chimney was defective.  Defective flashing can cause water infiltration and subsequent deterioration.\n\nThe current condition of the chimney flashing poses several risks:\n\n\u2022\nWater Penetration: The flashing designed to properly shed water away from the chimney.  Loose flashing can cause water to deteriorate the brick, allowing water to penetrate the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the flashing can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nRepair of the flashing by a licensed chimney contractor or roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"7b15d01","type":"defect","title":"Chimney Flashing- Installation Defect","text":"During the inspection of the chimney, it was noted that the chimney flashing was not installed properly or is damaged.  The flashing is designed to shed water away from the structure, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney flashing poses several risks:\n\n\u2022\nWater Penetration: Improperly installed or damaged flashing will allow water to enter the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the home, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the structure can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney flashing be repaired or replaced by a licensed masonry contractor. The new flashing should be properly installed by a licensed contractor.","sev":"moderate","choices":[]},{"id":"57211f1","type":"defect","title":"Chimney Flashing- Loose","text":"The inspector noted the flashing at the chimney weas loose.  Loose flashing can cause water infiltration and subsequent deterioration.\n\nThe current condition of the chimney flashing poses several risks:\n\n\u2022\nWater Penetration: The flashing designed to properly shed water away from the chimney.  Loose flashing can cause water to deteriorate the brick, allowing water to penetrate the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the flashing can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nRepair of the flashing by a licensed chimney contractor or roofing professional is recommended.","sev":"minor","choices":[]},{"id":"ff90edc","type":"defect","title":"Chimney Flashing- Tar Observed- Possible Leak","text":"Tar was observed on or near the chimney. Tar is often applied when the roof structure has experienced leaks in the past. While it can serve as a temporary fix, tar can shrink and crack over time, necessitating regular maintenance.  The presence of tar indicates that there may have been previous issues with water infiltration around the chimney. As tar ages, it becomes less effective at sealing leaks and can lead to further deterioration of the chimney structure. Regular maintenance is required to ensure that the tar remains effective, but it is not a permanent solution.\n\nCorrective steps\n\nIt is recommended to contact the homeowner for any information regarding known past leaks near the chimney. Understanding the history of leaks can provide valuable insights into the extent of the issue and guide future repairs.\n\nTo ensure a long-term solution, the tar should be removed and replaced with proper flashing that meets current professional building standards. Proper flashing will provide a more durable and effective barrier against water infiltration, preserving the integrity of the chimney and roof structure","sev":"moderate","choices":[]},{"id":"10f5f4c","type":"defect","title":"Chimney Flashing- Rusted Metal Cap","text":"The inspector noted the metal chimney cap flashing was rusted.  The chimney cap should be maintained to be free from rust.  Rust will eventually cause holes in the cap, allowing water to intrude into the structure.\n\nCorrective steps\n\nRepair by a licensed contractor or refinishing of the steel is recommended.","sev":"minor","choices":[]},{"id":"e3d88d0","type":"defect","title":"Chimney Cap- Drip Edge Missing","text":"During the inspection of the chimney, it was noted that the concrete chimney cap is missing a drip edge.  The drip edge is designed to shed water away from the brick chimney, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney cap poses several risks:\n\n\u2022\nWater Penetration: The drip edge is deisgned to properly shed water away from the chimney.  A lack of a drip edge can cause water to deteriorate the brick, allowing water to pentrate the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the chimney's masonry, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the chimney can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney cap be repaired or replaced by a licensed masonry contractor. The new cap should include a properly installed drip edge to ensure water is effectively shed away from the chimney structure. This will help to protect the chimney from water damage and extend its lifespan.","sev":"minor","choices":[]},{"id":"3cb1d6a","type":"defect","title":"Chimney Cap- Minor Cracks","text":"During the inspection of the chimney, it was noted that the concrete chimney cap had minor cracks.  The chimney cap is designed to shed water away from the brick chimney, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney cap poses several risks:\n\n\u2022\nWater Penetration: The cap is designed to properly shed water away from the chimney.  Minor cracks can cause water to deteriorate the brick, allowing water to penetrate the structure.  Minor cracks can also spread into larger cracks overtime as\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the chimney's masonry, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the chimney can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney cap be repaired or replaced by a licensed masonry contractor. The new cap should include a properly installed drip edge to ensure water is effectively shed away from the chimney structure. This will help to protect the chimney from water damage and extend its lifespan.","sev":"minor","choices":[]},{"id":"0028ee9","type":"defect","title":"Missing Interior Flue Liner","text":"SFTY- The inspector observed a missing interior flue liner at the chimney.  All chimney stacks require a flue liner.  This is a fire hazard and a material defect, as defined by the Home Inspection Standards of Practice.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"fc83298","type":"defect","title":"Chimney- Saddles Missing","text":"The chimney did not have a saddle installed on the upslope side of the roof.  A chimney saddle is a device built on the upslope side of a chimney used to direct water around the chimney, so it doesn't backup against the back of the chimney.  Current building practices state to install a saddle on any chimney greater than 30\" in width but the inspector notes the advantage to a saddle on any flat sided chimney.  Without a saddle debris are likely to accumulate at the back of the chimney also.\n\nCorrective steps\n\nThe inspector recommends installation of saddles by a licensed chimney repair or roofing contractor on all chimneys but especially on chimneys over 30\" in width.","sev":"moderate","choices":[]},{"id":"40c8725","type":"limit","title":"Snow/ Ice Prevented Full Inspection","text":"LMT - Snow and/or ice prevented the full inspection of the chimney.  Flashing, grout lines, and other parts of the chimney may not have been visible.","sev":"minor","choices":[]},{"id":"5d61a62","type":"defect","title":"Chimney- Cleanout Door Damaged","text":"SFTY- The chimney cleanout door is damaged. The cleanout door is a crucial component of the chimney system, providing access to the base of the chimney for the removal of debris, such as ash and soot.  The cleanout door allows homeowners and chimney professionals to easily access and clean out accumulated debris, ensuring the chimney remains clear and functional. A damaged cleanout door can compromise this access, leading to potential blockages and reduced airflow. Over time, this can result in poor chimney performance, increased risk of chimney fires, and structural damage.\n\nCorrective steps\n\nIt is recommended that a professional chimney repair contractor be contacted to inspect and repair the damaged cleanout door. A qualified contractor can assess the extent of the damage, replace the door if necessary, and ensure it is properly sealed to prevent future issues. Prompt repair will help maintain the chimney's efficiency and safety","sev":"major","choices":[]},{"id":"8f513cb","type":"info","title":"Chimney Material","text":"","sev":"minor","choices":["Brick","Metal","Concrete Masonry Unit","Stone veneer"]},{"id":"592d30e","type":"defect","title":"Chimney- Clearance Defect 3-2-10","text":"The inspector observed indications of inadequate clearances for the masonry chimney stack. The 3-2-10 Rule for masonry chimneys states that a masonry chimney should extend at least 3 feet above the highest point where the chimney passes through the roof, and 2 feet above any portion of a building that is within a 10-foot distance horizontally.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"a3bfd2a","type":"defect","title":"Loose Interior Flue Liner","text":"SFTY- The inspector observed indications of loose components of the chimney interior flue liner. Fire hazard.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]}]},{"name":"Cupola","c":[{"id":"ae9194d","type":"defect","title":"Siding- Peeling paint","text":"The cupola was observed to have peeling paint and was partially covered in snow which may have hidden other defects.  The peeling paint is exposing wood which may become damaged.\n\nCorrective steps\n\nScrape and paint the peeling areas to prevent further damage.  Due to the age of the home the paint may contain lead and should be handled according to EPA recommendations.  For more information on how to handle lead paint and the health effects it can cause visit www.EPA.gov/lead.","sev":"moderate","choices":[]}]},{"name":"Roof Structure","c":[{"id":"463572f","type":"defect","title":"Roof not built to current standards **MISC**","text":"Corrective steps","sev":"major","choices":[]},{"id":"394d00d","type":"defect","title":"Look Outs Loose ** MISC**","text":"","sev":"moderate","choices":[]},{"id":"efec55e","type":"defect","title":"Roof Structural Defect Observed ** MISC **","text":"From a readily accessible area, I observed a major structural defect related to the general roof structure.  Major defect.  Correction and further evaluation is recommended.","sev":"major","choices":[]}]}]},{"name":"Chimney, Fireplace, or Stove","subs":[{"name":"Masonry Chimney","c":[{"id":"f89e7ae","type":"limit","title":"Chimney Interior is Beyond the Scope","text":"LMT - Inspecting the chimney interior and flue is beyond the scope of a home inspection.  An inspector is not required to inspect the flue or vent system, and is not required to inspect the interior of chimneys or flues, fire doors or screens, seals or gaskets, or mantels.  Out of courtesy only, the inspector may take a look at readily accessible and visible parts of the chimney flue.  Any comments made should not be construed as a complete inspection of the fireplace.","sev":"minor","choices":[]},{"id":"6f237fa","type":"info","title":"Masonry Chimney Exterior Was Inspected","text":"The visible portions of the chimney exterior was inspected during my home inspection.  Areas of the chimney may not have been visible during the home inspection.  No deficiencies were visibly present at the time of inspection unless otherwise noted in this report.","sev":"minor","choices":[]},{"id":"6b29dea","type":"defect","title":"Chimney- Leaning","text":"During the inspection, it was noted that the masonry chimney is leaning.  A leaning masonry chimney can be a serious indicator of structural failure. This condition often arises due to foundation issues, such as settling or shifting soil, which can cause one side of the chimney to sink and result in a noticeable tilt. Other contributing factors may include poor construction, erosion, water damage, or seismic activity.  A leaning chimney poses several risks, including:\n\n\u2022 Collapse Risk: As the tilt worsens, the chimney's structural integrity weakens, increasing the likelihood of collapse\n\n\u2022 Fire Hazard: Gaps between the chimney and the house can allow heat, smoke, and flames to escape into areas they shouldn't, potentially leading to fires\n\n\u2022  Carbon Monoxide Leaks: A compromised chimney may not effectively vent harmful gases like carbon monoxide, posing a serious health risk\n\nCorrective steps\n\nIt is strongly recommended to contact a licensed chimney repair contractor to evaluate the leaning chimney. Given the severity of the issue, replacement of the chimney may be necessary to ensure the safety and structural integrity of the home.  A professional contractor can assess the extent of the damage, determine the best course of action, and perform the necessary repairs or replacement.","sev":"moderate","choices":[]},{"id":"2076f02","type":"defect","title":"Chimney- Material Defect Observed **MISC**","text":"I observed indications of a material defect at the chimney.\n\nCorrective steps","sev":"major","choices":[]},{"id":"45e2cf1","type":"info","title":"Masonry Chimney Flashing Was Inspected","text":"I inspected for flashing installed at the chimney.  Flashing is installed in areas where the chimney stack meets another system or component of the house.  And the flashing is supposed to divert water away from those areas to prevent water intrusion.","sev":"minor","choices":[]},{"id":"da118ab","type":"limit","title":"Couldn't Reach Chimney","text":"LMT - The inspector could not reach the chimney closely. There was an inspection restriction.  Efforts were made to inspect from the inspector's location and point of observation from a distance. I could not see everything; damage may have been hidden from sight of the inspector.","sev":"minor","choices":[]},{"id":"a53d50b","type":"info","title":"Masonry Chimney Hood or Cap Installed","text":"A hood or cap was installed at the masonry chimney.  Good.\n\nMasonry chimneys without hoods should have stone or reinforced concrete caps at the top.  Some masonry chimneys have hoods over the flues.  Hoods on masonry chimneys consist of stone or reinforced concrete caps supported on short masonry columns at the perimeter of chimney tops, or sheet metal caps supported on short sheet metal columns.","sev":"minor","choices":[]},{"id":"9cbaaa3","type":"defect","title":"Chimney Flashing- Defect","text":"The inspector noted the flashing at the chimney was defective.  Defective flashing can cause water infiltration and subsequent deterioration.\n\nThe current condition of the chimney flashing poses several risks:\n\n\u2022\nWater Penetration: The flashing designed to properly shed water away from the chimney.  Loose flashing can cause water to deteriorate the brick, allowing water to penetrate the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the flashing can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nRepair of the flashing by a licensed chimney contractor or roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"8693310","type":"defect","title":"Chimney- Crowned Cap Defect","text":"During the inspection of the chimney, it was noted that the concrete chimney cap had visible defects.  The chimney cap is designed to shed water away from the brick chimney, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney cap poses several risks:\n\n\u2022\nWater Penetration: The cap is designed to properly shed water away from the chimney.  Minor cracks can cause water to deteriorate the brick, allowing water to penetrate the structure.  Minor cracks can also spread into larger cracks overtime as\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the chimney's masonry, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the chimney can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney cap be repaired or replaced by a licensed masonry contractor. The new cap should include a properly installed drip edge to ensure water is effectively shed away from the chimney structure. This will help to protect the chimney from water damage and extend its lifespan.","sev":"moderate","choices":[]},{"id":"7c3d5e9","type":"defect","title":"Chimney Rain Cap- Missing","text":"The inspector noted the metal chimney cap flashing was missing.  The chimney cap keeps debris and pests out of the chimney.\n\nCorrective steps\n\nRepair by a licensed contractor or refinishing of the steel is recommended.","sev":"moderate","choices":[]},{"id":"549eb50","type":"defect","title":"Chimney Cap- Damaged","text":"The inspector noted damage at the chimney wash or crowned cap. This is the top of the chimney that is shaped or \"crowned\" to divert water away from the top of the chimney stack.\n\nCorrective steps\n\nIf a wash or crown on top of the chimney is not properly sloped or is extensively cracked, defective, spalled, or displays rust stains, it should be replaced. Sheet metal caps/crowns with minor rust or corrosion should be repaired, but if rust or corrosion is extensive, replacement is recommended.","sev":"moderate","choices":[]},{"id":"7bcca85","type":"defect","title":"Chimney Cap- Drip Edge Missing","text":"During the inspection of the chimney, it was noted that the concrete chimney cap is missing a drip edge.  The drip edge is designed to shed water away from the brick chimney, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney cap poses several risks:\n\n\u2022\nWater Penetration: The drip edge is deisgned to properly shed water away from the chimney.  A lack of a drip edge can cause water to deteriorate the brick, allowing water to pentrate the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the chimney's masonry, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the chimney can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney cap be repaired or replaced by a licensed masonry contractor. The new cap should include a properly installed drip edge to ensure water is effectively shed away from the chimney structure. This will help to protect the chimney from water damage and extend its lifespan.","sev":"minor","choices":[]},{"id":"13d8af6","type":"defect","title":"Crowned Cap Not Diverting Water Away","text":"The inspector observed that the chimney crown cap was not diverting water away.  The chimney crown cap should provide a downward slope that will direct water from the flue to the edge of the cap. The crown should be formed or \"crowned\" so as to shed water. This crown is not diverting water away from the top of the chimney stack.\n\nCorrective steps\n\nIt is recommended the crowned cap be replaced by a qualified chimney repair contractor.","sev":"moderate","choices":[]},{"id":"05666d8","type":"defect","title":"Chimney Screen - Fire Hazard","text":"SFTY- The inspector observed indications of soot and creosote at the chimney spark screen.  Creosote in this area is a fire hazard.\n\nMetal spark screens are sometimes used on wood and coal-burning fireplace chimneys.  Maintain the condition and fit of spark screens.  Dirty or clogged screens adversely affect draft and could be a fire hazard.\n\nCorrective steps\n\nThe inspector recommends the screen be cleaned of creosote or replaced by a qualified chimney repair contractor.","sev":"major","choices":[]},{"id":"0c8c966","type":"defect","title":"Chimney Flashing- Metal Cap Damaged","text":"The metal chimney cap was observed to be damaged at the time of the inspection. The chimney cap is designed to shed water away from the brick chimney, preventing water infiltration and subsequent deterioration.\n\nThe current condition of the chimney cap poses several risks:\n\n\u2022\nWater Penetration: The cap is designed to properly shed water away from the chimney.  A damaged cap can allow water to penetrate the structure.\n\n\u2022\nStructural Damage: Continuous exposure to moisture can cause significant damage to the chimney's masonry, potentially leading to costly repairs or even structural failure.\n\n\u2022\nMold and Mildew: Moisture entering through the chimney cap can lead to mold and mildew growth, which can negatively affect indoor air quality and pose health risks to the home's occupants.\n\nCorrective steps\n\nIt is recommended to have the chimney cap be repaired or replaced by a licensed chimney contractor. The new cap should include a properly installed drip edge to ensure water is effectively shed away from the chimney structure. This will help to protect the chimney from water damage and extend its lifespan.","sev":"moderate","choices":[]},{"id":"1d1bc8d","type":"defect","title":"Chimney- Missing Interior Flue Liner","text":"SFTY- The inspector observed a missing interior flue liner at the chimney.  All chimney stacks require a flue liner.  This is a fire hazard and a material defect, as defined by the Home Inspection Standards of Practice.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"6364e57","type":"defect","title":"Chimney- Water Deterioration of Interior Flue Liner","text":"SFTY- During the inspection the inspector observed water damage and deterioration apparently caused by moisture intrusion and condensation to the interior flue liner of the chimney.  The flue liner is designed to properly convey flue gasses out of the chimney.  This is a fire hazard.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"39c097e","type":"defect","title":"Chimney- Clearance Defect 3-2-10","text":"The inspector observed indications of inadequate clearances for the masonry chimney stack. The 3-2-10 Rule for masonry chimneys states that a masonry chimney should extend at least 3 feet above the highest point where the chimney passes through the roof, and 2 feet above any portion of a building that is within a 10-foot distance horizontally.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"0efbacd","type":"defect","title":"Chimney- Flue Liner Not Extended High Enough","text":"SFTY- The inspector observed indications that the flue liner did not extend high enough. Flues should extend a minimum of 4 inches above the top of a masonry chimney. This can cause improper drafting of the combustion gasses.  This is a safety issue.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"8518058","type":"defect","title":"Chimney- Loose Interior Flue Liner","text":"SFTY- The inspector observed indications of loose components of the chimney interior flue liner. Fire hazard.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair this chimney as required to meet current standards.","sev":"major","choices":[]},{"id":"3019be5","type":"defect","title":"Chimney- Damper Missing","text":"SFTY- During the inspection it was noted that the fireplace damper was missing or damaged.  This can cause improper drafting of the fireplace, drafts leading to higher energy costs, and pest infiltration into the home.\n\nCorrective steps\n\nIt is recommended a qualified chimney repair contractor inspect and repair the flue damper as required to meet current standards.","sev":"major","choices":[]}]},{"name":"Factory-Built Chimney","c":[{"id":"c6d36c9","type":"info","title":"Factory-Built Chimney Exterior Was Inspected","text":"The chimney exterior was inspected during my home inspection.","sev":"minor","choices":[]},{"id":"dad63be","type":"defect","title":"Exhaust Pipe- Hot Surface Not Protected","text":"The gas insert exhaust was on the deck without any protection.  This can get very hot during the operation of the fireplace and could cause an injury.\n\nCorrective steps\n\nInstallation of a protection is recommended.\n\n\u2022 Mesh Chimney Guards: Stainless steel mesh guards can be installed around the chimney to create a buffer zone. They\u2019re heat-resistant and help prevent direct contact.\n\n\u2022 Safety Barriers for Fireplaces: Some manufacturers offer custom-fit barriers designed for specific fireplace models. These are often powder-coated metal screens that block access to hot surfaces.\n\n\u2022 Slip-In Chimney Guards: These are tension-fit metal guards that slide over the chimney and prevent wildlife and people from touching the hot flue.\n\n\u2022 Heat-Resistant Enclosures: Build a non-combustible enclosure (e.g., stone or masonry) around the chimney pipe. This adds a layer of insulation and physical separation.\n\n\u2022 Deck Railing Extensions: If the chimney exits close to a deck railing, consider extending the railing or adding a vertical screen to block access.\n\n\u2022 Maintain minimum clearance from combustible materials as per local building codes.\n\n\u2022 Use signage or visual cues to alert guests to hot surfaces.\n\n\u2022 Always consult a licensed installer or contractor to ensure compliance with fire safety regulations.","sev":"minor","choices":[]},{"id":"8305353","type":"limit","title":"Chimney Interior is Beyond the Scope","text":"LMT - Inspecting the chimney interior and flue is beyond the scope of a home inspection.  An inspector is not required to inspect the flue or vent system, and is not required to inspect the interior of chimneys or flues, fire doors or screens, seals or gaskets, or mantels.  Out of courtesy only, the inspector may take a look at readily accessible and visible parts of the chimney flue.","sev":"minor","choices":[]},{"id":"3ff311e","type":"info","title":"Factory-Built Chimney Flashing Was Inspected","text":"I inspected for flashing installed at the chimney.\n\nFlashing is installed in areas where the chimney stack meets another system or component of the house.  And the flashing is supposed to divert water away from those areas to prevent water intrusion.","sev":"minor","choices":[]},{"id":"540fffb","type":"defect","title":"Chimney Flashing- Defect","text":"I observed a defect at the chimney flashing.   The flashing was not installed correctly. The area is now prone to water leaking.  Hidden damage may exist.\n\nCorrective steps\n\nProper flashing meeting current building standards should be installed by a licensed contractor.","sev":"moderate",

cations of delayed maintenance.","sev":"minor","choices":[]},{"id":"c2fd7a5","type":"defect","title":"Garage Door Opener Aging","text":"The garage door opener is nearing the end of its useful life replacement is recommended.","sev":"minor","choices":[]},{"id":"9e3db12","type":"defect","title":"Cracked Glass at Garage Door","text":"I observed cracked windowpane glass at the garage door.","sev":"moderate","choices":[]},{"id":"91d204b","type":"defect","title":"Damage to Garage Door","text":"I observed indications of damage to the garage door itself.","sev":"moderate","choices":[]},{"id":"21f7893","type":"info","title":"Type of Door Operation","text":"","sev":"minor","choices":["Manual","Opener","Sliding"]},{"id":"1e8bb1c","type":"defect","title":"Loose Attachment / Support of Garage","text":"The structural support and attachment of the garage door to the house structure is inadequate. Safety hazard.","sev":"moderate","choices":[]},{"id":"1210ed9","type":"defect","title":"Door Lock Does Not Work","text":"The locking mechanism at the garage door does not work.","sev":"minor","choices":[]},{"id":"e287a4b","type":"info","title":"Opener Type","text":"","sev":"minor","choices":["Chain Drive","Screw Drive","Belt Drive"]},{"id":"3f1e957","type":"info","title":"Opener Brand","text":"","sev":"minor","choices":["Chamberlain","Craftsman","Genie","Python","Liftmaster","Stanley","Linear","Overhead Door"]},{"id":"0ee63be","type":"defect","title":"Missing Infrared Reversal Feature","text":"SFTY- The garage door opener was missing a safety device.  Installation of an opener that meets todays safety standards is recommended.","sev":"major","choices":[]}]},{"name":"Garage Vehicle Door Opener","c":[{"id":"6bde146","type":"defect","title":"Defect at Warning Label","text":"There is a defect at a warning label.\n\nThe garage door should have the following warning labels:\n\n\u2022 a spring warning label attached to the spring assembly or the back of the door panel;\n\n\u2022 a general warning label attached to the back of the door panel;\n\n\u2022 a warning label near the wall control button; and\n\n\u2022 two warning labels attached to the door in the vicinity of the bottom corner brackets. Some newer doors have tamper-resistant bottom corner brackets that do not require these warning labels.","sev":"minor","choices":[]},{"id":"31183c4","type":"info","title":"Manual Release","text":"I checked for a manual release handle--a means of manually detaching the door from the door opener.\n\nThe handle should be colored red so that it can be seen easily. The handle should be easily accessible and no more than 6 feet above the garage floor. The handle should not be in contact with the top of a vehicles.","sev":"minor","choices":[]},{"id":"69bf25f","type":"limit","title":"Unable to Inspect Garage Door Opener","text":"I was unable to inspect the garage door opener. Inspection restriction.","sev":"minor","choices":[]},{"id":"b251e29","type":"defect","title":"Photo-Electric Eyes Were Not Present","text":"I observed that the photo-electric eyes were not present.  This is a safety issue as the door may cause injury.  This model of opener may not have been supplied with the safety device. Replacement of the opener is recommended.","sev":"moderate","choices":[]},{"id":"83531cc","type":"info","title":"Garage Door Panels Were Inspected","text":"I inspected the garage door panels.","sev":"minor","choices":[]},{"id":"46a35e7","type":"defect","title":"Photo-electric eyes not alligned properly","text":"The photo-electric eyes are not properly aligned.  This prevents the garage door from closing properly.  Adjustment is recomended.","sev":"moderate","choices":[]},{"id":"d43ba67","type":"info","title":"Spring Warning Label Was Inspected","text":"I observed a spring warning label attached to the spring assembly or the back of the door panel. Good.","sev":"minor","choices":[]},{"id":"2a5601d","type":"info","title":"General Warning Label Was Inspected","text":"I observed a general warning label attached to the back of the door panel. Good.","sev":"minor","choices":[]},{"id":"8393def","type":"defect","title":"Manual Release Not Red","text":"I observed that the manual release handle of the garage door opener was not colored red so that it can be seen easily. Defect.","sev":"moderate","choices":[]},{"id":"77e3ac2","type":"info","title":"Bottom Bracket Label Was Inspected","text":"I observed two warning labels attached to the door in the vicinity of the bottom corner brackets. Some newer doors have tamper-resistant bottom corner brackets that do not require these warning labels.","sev":"minor","choices":[]},{"id":"acc7530","type":"defect","title":"Manual Release In Contact with Car","text":"I observed that the handle of the manual release was so low that it could be in contact with the top of a vehicle.","sev":"moderate","choices":[]},{"id":"13e82ff","type":"defect","title":"Manual Release Not Accessible","text":"I observed that the handle of the manual release was not easily accessible and more than 6 feet above the garage floor. Defect.","sev":"moderate","choices":[]},{"id":"4a7c6f2","type":"info","title":"Wall Control Button Label Was Inspected","text":"I observed a warning label near the wall control button. Good.","sev":"minor","choices":[]},{"id":"e907594","type":"defect","title":"Defect at Door Panel","text":"I observed indications of a defect at the garage door panel.","sev":"moderate","choices":[]},{"id":"00dea09","type":"info","title":"Springs, Bracket & Hardware Were Inspected","text":"I closed the door and checked the springs for damage. If a spring was broken, operating the door can cause serious injury or death. I would not operate the door if there was damage.\n\nI visually checked the doors hinges, brackets and fasteners. If the door had an opener, the door must have an opener-reinforcement bracket that is securely attached to the doors top section. The header bracket of the opener rail must be securely attached to the wall or header using lag bolts or concrete anchors.","sev":"minor","choices":[]},{"id":"4932dac","type":"defect","title":"Broken Spring","text":"I observed that a garage door spring was broken and in need of replacement.","sev":"major","choices":[]},{"id":"95e06ea","type":"info","title":"Door Was Manually Opened and Closed","text":"I closed the door. If the door had an opener, I pulled the manual release to disconnect the door from the opener. I lifted and operated the door. If the door was hard to lift, then it is out of balance. This is an unsafe condition.\n\nI raised the door to the fully-open position, then closed the door. The door should move freely, and it should open and close without difficulty. As the door operates, I make sure that the rollers stay in the track. The door should stay in the fully open position. The door should also stay in a partially opened position about three to four above the garage floor level.\n\nI reconnected the door to the opener, if present.\n\nI checked the door handles or gripping points.","sev":"minor","choices":[]},{"id":"47afaa4","type":"defect","title":"Non-Contact Auto-Reverse Failed","text":"I observed that the garage door did not automatically reverse after a non-contact auto-reverse test. This is a safety defect.","sev":"moderate","choices":[]},{"id":"c355c5c","type":"info","title":"Spring Containment Was Inspected","text":"If the door has extension springs, I inspect for spring containment. Extension springs should be contained by a cable that runs through the center of the springs. If a spring breaks, containment helps to prevent broken parts from flying around dangerously in the garage.","sev":"minor","choices":[]},{"id":"66af6db","type":"defect","title":"Wall Button Did Not Function","text":"I observed that the wall push button did not work.","sev":"moderate","choices":[]},{"id":"53e72f1","type":"info","title":"Wall Push Button Was Inspected","text":"I inspected the wall button. The wall button should be at least 5 feet above the standing surface, and high enough to be out of reach of small children. I pressed the push button to see if it successfully operated the door.","sev":"minor","choices":[]},{"id":"8553464","type":"info","title":"Photo-Electric Eyes Were Inspected","text":"I inspected the photo-electric eyes.\n\nFederal law states that residential garage door openers manufactured after 1992 must be equipped with photo-electric eyes or some other safety-reverse feature that meets UL 325 standards.\n\nI checked to see if photo-electric eyes are installed. The vertical distance between the photo-eye beam and the floor should be no more than 6 inches.","sev":"minor","choices":[]},{"id":"351a611","type":"info","title":"Non-Contact Reversal Was Inspected","text":"I observed the auto-reverse feature during a non-contact test.\n\nStanding inside the garage but safely away from the path of the door, I used the remote control or wall button to close the door. As the door was closing, I waved an object in the path of the photoelectric eye beam. The door should automatically reverse.","sev":"minor","choices":[]},{"id":"172062c","type":"defect","title":"Improper Installation of Opener","text":"I observed that the garage door opener was improperly installed. Defect.","sev":"moderate","choices":[]},{"id":"51c52d2","type":"defect","title":"Extension Cord Used at Garage Door Opener Defect","text":"I observed an extension cord being used at the garage door opener. Extension cords are for temporary use only.","sev":"minor","choices":[]},{"id":"5fbfa6e","type":"defect","title":"Photoelectric Eyes Too High","text":"","sev":"moderate","choices":[]}]},{"name":"Electric in Garage","c":[{"id":"662819d","type":"defect","title":"Missing GFCI-Protection in Garage","text":"I observed a receptacle in the attached garage without GFCI (or ground fault circuit interrupter) protection.\n\nGFCI protection is required for all 15- and 20-amp receptacles, including outlets for refrigerators, garage door openers, and washing machines.","sev":"moderate","choices":[]},{"id":"5d717ef","type":"defect","title":"Missing Receptical Cover","text":"","sev":"minor","choices":[]},{"id":"8c7a683","type":"defect","title":"Ungrounded Outlet","text":"The outlet was not grounded.  Grounding of electrical receptacles (which some laypeople refer to as outlets) is an important safety feature that has been required in new construction since 1962, as it minimizes the risk of electric shock and protects electrical equipment from damage. Modern, grounded 120-volt receptacles in the United States have a small, round ground slot centered below two vertical hot and neutral slots, and it provides an alternate path for electricity that may stray from an appliance. Older homes often have ungrounded, two-slot receptacles that are outdated and potentially dangerous.\n\nWhile homeowners may be made aware of the limitations of ungrounded electrical receptacles, upgrades are not necessarily required. Many small electrical appliances, such as alarm clocks and coffee makers, are two-pronged and are thus unaffected by a lack of grounding in the building\u2019s electrical system.\n\nUpgrading the system will bring it closer to modern safety standards, however, and this may be accomplished in the following ways:\n\n\u2022 Install three-slot receptacles and wire them so that they\u2019re correctly grounded.\n\n\u2022 Install ground-fault circuit interrupters (GFCIs). These can be installed upstream or at the receptacle itself. GFCIs are an accepted replacement because they will protect against electric shocks even in the absence of grounding, but they may not protect the powered appliance. Also, GFCI-protected ungrounded receptacles may not work effectively with surge protectors. Ungrounded GFCI-protected receptacles should be identified with labels that come with the new receptacles that state:  \u201cNo Equipment Ground.\u201d\n\n\u2022 Replace three-slot receptacles with two-slot receptacles. Two-slot receptacles correctly represent that the system is ungrounded, lessening the chance that they will be used improperly.","sev":"moderate","choices":[]},{"id":"454201d","type":"defect","title":"Electrical Defect in Garage","text":"I observed an electrical defect in the attached garage.","sev":"moderate","choices":[]},{"id":"9c97d2d","type":"defect","title":"Power Not Present at Receptacle","text":"I observed indications that power was not present at a receptacle outlet in the garage. Further evaluation is recommended.","sev":"minor","choices":[]},{"id":"3045c4d","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.","sev":"moderate","choices":[]},{"id":"b05986d","type":"defect","title":"Missing Receptacle for Each Car Space in Garage","text":"I observed that there is a missing receptacle for each car space in the attached garage.\n\nOne receptacle outlet must be installed for each car space in the garage. 2014 NEC 210.52(G)","sev":"moderate","choices":[]},{"id":"b9f1cb9","type":"defect","title":"Missing Receptacle in Garage","text":"I observed a missing receptacle in the garage.\n\nThere must be at least one receptacle outlet in the attached garage.","sev":"moderate","choices":[]},{"id":"ffcb8b1","type":"defect","title":"Missing Tamper-Resistance Protection in Garage","text":"I observed an electric receptacle outlet (located below 5' 6\" height above the floor) that was not listed as a tamper resistant (TR) type.\n\nAll receptacle outlets below 5' 6\" must be tamper resistant (TR).\n\nLearn more about TR receptacles.","sev":"moderate","choices":[]},{"id":"d965132","type":"defect","title":"Loose Electrical Lines in Garage","text":"I observed loose electrical lines, exposed and unprotected, in the garage. Not professionally installed. Potentially hazardous.","sev":"moderate","choices":[]},{"id":"07e87fa","type":"defect","title":"Defect at Lighting in Garage","text":"I observed a defect at the lighting in the garage.","sev":"moderate","choices":[]},{"id":"ec3fc03","type":"defect","title":"Defect at Wall Switch in Garage","text":"I observed a defect at a wall switch in the garage. Not installed properly.","sev":"moderate","choices":[]}]},{"name":"Ceiling, Walls & Firewalls in Garage","c":[{"id":"d194ce9","type":"info","title":"Garage Ceiling & Walls Were Inspected","text":"I inspected the ceiling and walls of the garage according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"e850e09","type":"defect","title":"Firewall Not Up To Code","text":"SFTY- Firewall separating the home and garage is not compliant with modern building standards. Firewalls should be built with materials to prevent the spreading of a fire into the home living space.\n\nCorrective Action\n\nRecommend a qualified contractor evaluate and bring firewall up to standards. For more information on the proper materials and installation please see this Link for more info.","sev":"moderate","choices":[]},{"id":"7b814f8","type":"limit","title":"Can't See Everything","text":"LMT - I can not observe everything. Inspection restrictions. My inspection was limited.","sev":"minor","choices":[]},{"id":"08e2d94","type":"info","title":"Door Between Garage and House Was Inspected","text":"I inspected the door between the attached garage and the house.\n\nThe door should be a solid wood door at least 1-3/8 inches thick, a solid or honeycomb-core steel door at least 1-3/8 inches thick, or a 20-minute fire-rated door.\n\nThe door should be equipped with a self-closing or an automatic-closing device.","sev":"minor","choices":[]},{"id":"0696fd2","type":"defect","title":"Door- Missing Self-Closing Device","text":"I observed that the door between the garage and the house is not equipped with a self-closing or an automatic-closing device. This is a fire hazard.\n\nRecommendation\n\nThe inspector recommends installing a self closing device.","sev":"major","choices":[]},{"id":"fc26f20","type":"defect","title":"Door Was Not a Fire-Rated Door","text":"I observed that the door between the garage and the house is not a fire-rated door. This is a fire hazard.\n\nThe door between the garage and the house should be a solid wood door at least 1-3/8 inches thick, a solid or honeycomb-core steel door at least 1-3/8 inches thick, or a 20-minute fire-rated door.","sev":"major","choices":[]},{"id":"4e0d9ec","type":"defect","title":"Attic Access Panel in Garage Ceiling Defect","text":"I observed an attic access panel in the ceiling of the garage. Firewall breach. Hazard. Defect.\n\nThere must not be any openings in the drywall of the garage. All openings must be patched and repaired properly.\n\nThere must be at least 1/2-inch thick gypsum board or equivalent applied to the garage side to separate the garage and the house or attic space.\n\nThere must be at least 5/8-inch thick Type X gypsum board or equivalent applied to the garage side to separate the garage from the habitable room above the garage.","sev":"moderate","choices":[]},{"id":"8dfa16f","type":"defect","title":"Opening in Drywall Defect","text":"I observed an opening in the drywall or gypsum board of the garage. Defect.\n\nThere must not be any openings in the drywall of the garage. All openings must be patched and repaired properly.\n\nThere must be at least 1/2-inch thick gypsum board or equivalent applied to the garage side to separate the garage and the house or attic space.\n\nThere must be at least 5/8-inch thick Type X gypsum board or equivalent applied to the garage side to separate the garage from the habitable room above the garage.","sev":"moderate","choices":[]},{"id":"f9d2fe0","type":"defect","title":"Damaged Drywall","text":"Garage wall had damaged drywall.\n\nThere must not be any openings in the drywall of the garage. All openings must be patched and repaired properly.\n\nThere must be at least 1/2-inch thick gypsum board or equivalent applied to the garage side to separate the garage and the house or attic space.\n\nThere must be at least 5/8-inch thick Type X gypsum board or equivalent applied to the garage side to separate the garage from the habitable room above the garage.\n\n Recommend drywall contractor repair.","sev":"moderate","choices":[]},{"id":"c4ae17a","type":"defect","title":"Moisture Intrusion","text":"Garage walls showed signs of moisture intrusion. Recommend a qualified contractor evaluate and find source of moisture to prevent further damage and/or mold.","sev":"moderate","choices":[]},{"id":"062f9a0","type":"defect","title":"Ductwork Opening in Garage Hazardous","text":"I observed a ductwork in the garage.\n\nThere must not be any openings of the ductwork into the garage. This is hazardous.","sev":"moderate","choices":[]},{"id":"cd1f617","type":"defect","title":"Defect at Door Between Garage and House","text":"I observed a defect at the door between the garage and the house.","sev":"moderate","choices":[]},{"id":"d8d2753","type":"defect","title":"Defect at Opening from Garage to Bedroom","text":"I observed an opening from the garage directly to a room used for sleeping purposes. This is a material defect. Safety hazard. Fire hazard.","sev":"major","choices":[]},{"id":"6f90f22","type":"defect","title":"Ductwork in Garage Defective","text":"I observed a ductwork in the garage.\n\nDucts in the garage and ducts penetrating the walls or ceilings separating the garage and the house must be made of 26-gauge sheet steel or other approved material.","sev":"moderate","choices":[]},{"id":"9bdf3e7","type":"defect","title":"Insufficient Drywall Thickness","text":"Drywall separating home and garage is 1/2-inch in thickness. Not less than 5/8-inch drywall is required by modern building code.\n\n\r\nLink for more info.","sev":"moderate","choices":[]}]},{"name":"Moisture Intrusion in Garage","c":[{"id":"fcbcc12","type":"defect","title":"Active Moisture Intrusion / Water Penetration Observed","text":"I observed indications of active moisture intrusion (water penetration) into the garage.","sev":"moderate","choices":[]},{"id":"16e291f","type":"defect","title":"Water Marks Observed","text":"Water staining and possible microbial growth were observed on the garage ceiling. This condition may indicate a past or ongoing moisture issue. While the roof has been replaced, it is essential to confirm that the source of the moisture was properly identified and repaired to prevent further damage or recurrence of microbial growth.\n\nRecommendations:\n\n    1.    Consult a certified mold remediation contractor to evaluate and safely remove the suspected microbial growth. The contractor should hold certification through an organization such as the Institute of Inspection, Cleaning and Restoration Certification (IICRC). For more information, visit www.iicrc.org.\n\n    2.    For additional details on mold and its effects, visit the Environmental Protection Agency\u2019s website at www.epa.gov/mold.\n\n    3.    Investigate the source of the moisture that caused the staining. Ensure the issue was resolved during the roof replacement and verify there are no active leaks or drainage concerns.\n\nPrompt action is advised to maintain a healthy indoor environment and protect the structural integrity of the garage.","sev":"minor","choices":[]},{"id":"5c3195c","type":"defect","title":"Efflorescence in Garage","text":"I observed indications of efflorescence in the garage.\n\nEfflorescence is the white chalky powder that might be found on the surface of a concrete or brick wall. It can be a cosmetic issue, or it can be an indication of moisture intrusion that could lead to major structural and indoor air quality issues.","sev":"minor","choices":[]}]},{"name":"Heat Source","c":[{"id":"6875ea3","type":"info","title":"Furnace Brand Name","text":"","sev":"minor","choices":["Ducane"]},{"id":"48c5786","type":"info","title":"Furnace Inspected","text":"","sev":"minor","choices":[]}]},{"name":"Hose Bib","c":[{"id":"9ce5d2e","type":"limit","title":"Hose Bib Wimterizwd","text":"","sev":"minor","choices":[]}]}]},{"name":"Detached Garage","subs":[{"name":"General","c":[{"id":"92ae319","type":"limit","title":"Door Locked","text":"LMT - The door was locked and prevented entry to the garage.  The interior of the garage was not inspected.","sev":"minor","choices":[]},{"id":"1637470","type":"defect","title":"General Condition Very Poor","text":"The inspector observed many conditions in the structure which are unsafe or do not meet currently accepted building standards including structural supporting framing members which exhibited rot, electrical deficiencies, lack of proper footings in sure rural supporting posts, deficient roofing materials, and more.  Further evaluation by a structural engineer or licensed builder is recommended.  Without repair this building exists a safety hazard.","sev":"major","choices":[]}]},{"name":"Roof Covering","c":[{"id":"08acfbf","type":"defect","title":"Cracked and Damaged Roof Covering","text":"I observed areas of cracked/splitting and damaged roof-covering materials.  This is a major defect.  Prone to water leaking into the house.  I recommend that a qualified roofing contractor to further evaluate and make repairs to the roof system,.","sev":"moderate","choices":[]},{"id":"4900134","type":"limit","title":"Unable to See Everything","text":"LMT - This is a visual-only inspection of the roof-covering materials. It does not include an inspection of the entire system. There are components of the roof that are not visible or accessible at all, including the underlayment, decking, fastening, flashing, age, shingle quality, manufacturer installation recommendations, etc.","sev":"minor","choices":[]},{"id":"0d22171","type":"info","title":"Homeowner's Responsibility","text":"Your job as the homeowner is to monitor the roof covering because any roof can leak. To monitor a roof that is inaccessible or that cannot be walked on safely, use binoculars. Look for deteriorating or loosening of flashing, signs of damage to the roof covering and debris that can clog valleys and gutters.\n\nRoofs are designed to be water-resistant. Roofs are not designed to be waterproof. Eventually, the roof system will leak. No one can predict when, where or how a roof will leak.","sev":"minor","choices":[]},{"id":"13fba21","type":"info","title":"Type of Roof-Covering Described","text":"I observed the roof-covering material and attempted to identify its type.\n\nThis inspection is not a guarantee that a roof leak in the future will not happen. Roofs leak.  Even a roof that appears to be in good, functional condition will leak under certain circumstances. We will not take responsibility for a roof leak that happens in the future.  This is not a warranty or guarantee of the roof system.","sev":"minor","choices":["Asphalt","Flat Roof Material","Tile","Concrete","Slate","Wood","Metal","Unidentified","3-tab asphalt shingles","Dimensional Asphalt Shingles","Steel- Exposed Fasteners"]},{"id":"9ad8afd","type":"limit","title":"Unable to Walk Upon Roof Surface","text":"LMT - According to the Home Inspection Standards of Practice, a home inspector is not required to walk upon any roof surface.  However, as courtesy only, I attempted to walk upon the roof surface, but was unable.  It was not safe.  It was not accessible.  This was a restriction to my inspection of the roof system.  You may want to consider hiring a professional roofer with a lift to check your roof system.","sev":"minor","choices":[]},{"id":"25d05fc","type":"defect","title":"Black Staining and/ or Algae or Moss was observed on the roof.","text":"Black staining is caused be an algae which is growing within the shingle substrate and feeding on the gypsum filler used in shingle manufacturing.  The Moss and algae will damage the shingle structure and reduce the life of the shingle.  Cleaners are available at home centers that can be used to remove the growth.  For areas with heavier growth a soft bristled brush can be used to remove the growth.  Copper flashing can also be installed at the ridge of the roof.  The chemicals in the copper will help to prevent the growth.  Click Here for more information on cleaning your roof.","sev":"minor","choices":[]},{"id":"465ba00","type":"limit","title":"Snow Covering the Roof","text":"LMT - There was snow covering the roof surface.  This was an inspection restriction.  I was unable to observe everything that I needed to see, because of the snow.  Recommend further evaluation at a later date when the snow has melted.","sev":"minor","choices":[]},{"id":"5e888d3","type":"info","title":"Roof Was Inspected","text":"We attempted to inspect the roof from various locations and methods, including from the ground and a ladder.\n\nThe inspection was not an exhaustive inspection of every installation detail of the roof system according to the manufacturer's specifications or construction codes.  It is virtually impossible to detect a leak except as it is occurring or by specific water tests, which are beyond the scope of our inspection.  We recommend that you ask the sellers to disclose information about the roof, and that you include comprehensive roof coverage in your home insurance policy.","sev":"minor","choices":["Ground","Ladder","Roof","Drone"]},{"id":"69aa64c","type":"defect","title":"Missing Roof-Covering Material","text":"I observed missing roof-covering material.  Prone to leaking.  Correction and further evaluation by a roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"58f5a1c","type":"defect","title":"Leaking","text":"","sev":"moderate","choices":[]},{"id":"74af24b","type":"defect","title":"Installation Defect at Roof Covering","text":"I observed indications of improperly installed roof-covering materials. This is not according to best practices or common standards. Defect. Prone to water intrusion and roof leaks. Further evaluation and correction by a roofer is recommended.","sev":"moderate","choices":[]},{"id":"f229747","type":"defect","title":"Discoloration Stain from Algae","text":"I observed indications of staining and discoloration on the roof-covering materials.  This condition seemed to be caused from algae.  What we commonly call algae is actually not algae, but a type of bacteria capable of photosynthesis. Algae appears as dark streaks, which are actually the dark sheaths produced by the organisms to protect themselves from UV radiation. When environmental conditions are right, the problem can spread quickly across a roof.\n\nAlgae attaches itself to the shingle by secreting a substance that bonds it tightly to the surface. Growth can be difficult to remove without damaging the roof. The best method is prevention. Algae stains can sometimes be lightened in color by using special cleaners.\n\nPower-washing and heavy scrubbing may loosen or dislodge granules. Chemicals used for cleaning shingles may damage landscaping. Also, the cleaning process makes the roof wet and slippery, so such work should be performed by a qualified professional.","sev":"minor","choices":[]},{"id":"d7781ee","type":"defect","title":"Material Defect Observed","text":"Material Defect.  A material defect was observed.  According to the InterNACHI Home Inspection Standards of Practice, a material defect is a specific issue with a system or component of a residential property that may have a significant, adverse impact on the value of the property, or that poses an unreasonable risk to people.  The fact that a system or component is near, at, or beyond the end of its normal, useful life is not, in itself, a material defect.","sev":"major","choices":[]},{"id":"b2fe36b","type":"defect","title":"Cracked Roof-Covering Material","text":"I observed cracked and damaged shingles.  Prone to leaking.  Correction and further evaluation by a professional roofer is recommended.","sev":"moderate","choices":[]},{"id":"d21dd8d","type":"defect","title":"Exposed Fasteners","text":"I observed indications of exposed fasteners at the roof-covering materials. Fasteners should not be exposed. Potential water entry points. Roof could leak. Further evaluation and correction is recommended.","sev":"moderate","choices":[]},{"id":"96bb78a","type":"defect","title":"Fastening Defect at Roof Covering","text":"I observed improper fastening at the roof-covering materials.  Prone to leaking.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"68c18d2","type":"defect","title":"Delamination","text":"The asphalt shingle roof shows signs of delamination.  Delamination is separation of the surface layer of asphalt.  Recommend a qualified roofing contractor evaluate and repair to prevent further deterioration that results in leaking and moisture intrusion.","sev":"moderate","choices":[]},{"id":"9290021","type":"defect","title":"Ponding","text":"I observed indications of ponding in one or more areas of roof.  Ponding or puddling of water concentrated in a particular area of the roof can lead to the deterioration and the roof leaking water.  Recommend a qualified roofing contractor evaluate further and make any repairs deemed necessary.","sev":"moderate","choices":[]},{"id":"c445f95","type":"defect","title":"Roof Structural Defect Observed","text":"From a readily accessible area, I observed a major structural defect related to the general roof structure.  Major defect.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"94efbcd","type":"defect","title":"Tree Too Close","text":"I observed indications that a tree and or tree branch where overhanging the roof and maybe in contact with it.","sev":"minor","choices":[]},{"id":"e1b7f01","type":"limit","title":"Condominium Disclaimer","text":"LMT - Condominiums are controlled by an association.  This association is generally responsible for the exterior of the home including the roof, landscaping and grounds, and exterior systems.  Due to the association controlling ownership of the roofing material the inspector doesn\u2019t traverse the roof and only a basic inspection is made of these systems.  Defects of these systems should always be referred back to the association.","sev":"minor","choices":[]},{"id":"f30340b","type":"defect","title":"Loose Shingles","text":"The inspector observed loose roofing material.  This can allow water intrusion and cause damage.  Repair is recommended.","sev":"minor","choices":[]}]},{"name":"Roof Flashing","c":[{"id":"8a3609d","type":"limit","title":"Difficult to See Every Flashing","text":"LMT - I attempted to inspect the flashing related to the vent pipes, wall intersections, eaves and gables, and the roof-covering materials.  In general, there should be flashing installed in certain areas where the roof covering meets something else, like a vent pipe or siding.  Most flashing is not observable, because the flashing material itself is covered and hidden by the roof covering or other materials.  So, it's impossible to see everything.  A home inspection is a limited visual-only inspection.","sev":"minor","choices":[]},{"id":"2344db3","type":"defect","title":"Missing Flashing","text":"I observed areas where flashing was missing.  Not installed.  Improper installation of flashing.  These areas of missing flashing are prone to water penetration.  Flashing is installed to provide protection against roof leaks and to divert water away from certain areas.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"ddac41b","type":"info","title":"Wall Intersections","text":"I looked for flashing where the roof covering meets a wall or siding material.  There should be step and counter flashing installed in these locations.  This is not an exhaustive inspection of all flashing areas.","sev":"minor","choices":[]},{"id":"8b6c70d","type":"defect","title":"Loose Counter Flashing","text":"I observed loose counter flashing.  Counter flashing overs the step flashing areas.  Loose flashing can cause roof leaks in these areas.  All flashing is supposed to be water-tight or designed to divert water away from certain areas.","sev":"moderate","choices":[]},{"id":"3fca363","type":"defect","title":"Loose Step Flashing","text":"I observed loose step flashing.  This can cause roof leaks in these areas.  All flashing is supposed to be water-tight or designed to divert water away from certain areas.","sev":"moderate","choices":[]},{"id":"ac6ecba","type":"info","title":"Eaves and Gables","text":"I looked for flashing installed at the eaves (near the gutter edge) and at the gables (the diagonal edge of the roof).  There should be metal drip flashing material installed in these locations.  The flashing helps the surface water on the roof to discharge into the gutter.  Flashing also helps to prevent water intrusion under the roof-covering.","sev":"minor","choices":[]},{"id":"b42bbaa","type":"defect","title":"Corroded - Minor","text":"Roof flashing showed signs of corrosion, but seemed to not be a major defect.  Flashing should be monitored to prevent severe corrosion leading to moisture intrusion.","sev":"moderate","choices":[]},{"id":"daa5112","type":"limit","title":"Codominium Disclaimer","text":"LMT - Condominiums are controlled by an association.  This association is generally responsible for the exterior of the home including the roof, landscaping and grounds, and exterior systems.  Due to the association controlling ownership of the roofing material the inspector doesn\u2019t traverse the roof and only a basic inspection is made of these systems.  Defects of these systems should always be referred back to the association.","sev":"minor","choices":[]},{"id":"120eb70","type":"defect","title":"Corroded - Severe","text":"Roof flashing showed signs of severe corrosion, which can lead to moisture intrusion and/or mold.  Recommend a qualified roofing contractor evaluate and repair.","sev":"moderate","choices":[]}]},{"name":"Gutters & Downspouts","c":[{"id":"ebfb092","type":"limit","title":"Difficult to Reach the Gutters","text":"LMT - I was unable to closely reach and closely inspect the installation of all of the gutter components and systems.","sev":"minor","choices":[]},{"id":"793c5ba","type":"defect","title":"Downspouts Drain Near Structure","text":"One or more downspouts drain too close to the structures foundation.  This can result in excessive moisture in the soil at the foundation, which can lead to foundation/structural movement.  Recommend a qualified contractor adjust downspout extensions to drain at least 6 feet from the foundation.  A handy homeowner should be able to do this project.","sev":"minor","choices":[]},{"id":"5d0e7b6","type":"info","title":"Homeowner's Responsibility","text":"Your job is to monitor the gutters and be sure that they function during and after a rainstorm. Look for loose parts, sagging gutter ends, and water leaks. The rain water should be diverted far away from the house foundation.","sev":"minor","choices":[]},{"id":"abf4e7e","type":"info","title":"Gutters Were Inspected","text":"I inspected the gutters.  I wasn't able to inspect every inch of every gutter.  But I attempted to check the overall general condition of the gutters during the inspection and look for indications of major defects.\n\nMonitoring the gutters during a heavy rain (without lightening) is recommended.  In general, the gutters should catch rain water and direct the water towards downspouts that discharge the water away from the house foundation.","sev":"minor","choices":[]},{"id":"0896b45","type":"defect","title":"Gutter Fastening Defect","text":"I observed indications of a defect at the gutter fastening.","sev":"moderate","choices":[]},{"id":"c80734f","type":"defect","title":"Gutter Damaged","text":"I observed damage to the gutter.  This is a defect that should be corrected by a professional contractor.","sev":"moderate","choices":[]},{"id":"587f609","type":"defect","title":"Gutters Missing","text":"Gutters are necessary to properly collect rain water from the roof, control it, divert it, and discharge that water away from the house and its foundation.  A missing gutter is a defect.  This is a defect that should be corrected by a professional contractor.","sev":"moderate","choices":[]},{"id":"46c3809","type":"defect","title":"Gutter Loose","text":"I observed a gutter that was loosely attached to the house.  This is a defect that should be corrected by a professional contractor.","sev":"moderate","choices":[]},{"id":"41ebb38","type":"defect","title":"Debris in Gutters","text":"I observed debris in the gutter.  Cleaning and maintenance is recommended.","sev":"minor","choices":[]},{"id":"de81814","type":"defect","title":"Gutter Improperly Sloped","text":"I observed that the gutter showed indications of improper slope.  Gutters are supposed to be sloped down toward the downspout of the gutter.  That would be proper drainage of the gutter.  This is a defect that should be corrected by a professional contractor.","sev":"moderate","choices":[]},{"id":"f35938a","type":"defect","title":"Gutter Leakage","text":"I observed a water leak from a gutter, which could result in water not being properly collected and drained away.  This is a defect that should be corrected by a professional contractor.","sev":"moderate","choices":[]},{"id":"3a37bb0","type":"defect","title":"Diverter Trays Need Adjusted","text":"I observed indications that the water diverter tray or splash block at the downspout end needed improvement. Easy to do.","sev":"minor","choices":[]},{"id":"685a11f","type":"defect","title":"Downspout Detached","text":"I observed indications of a disconnected and detached downspout pipe. Easy fix.","sev":"minor","choices":[]},{"id":"f23dbeb","type":"limit","title":"Gutters Not Present","text":"LMT - Gutters are an important system on any structure.  Gutters and downspouts direct water away from the foundation of the building.  An excess of water near the foundation of a structure can cause the foundation to fail, water issues inside the structure, and other issues.  The inspector recommends installation of a gutter system.","sev":"minor","choices":[]},{"id":"19d93d5","type":"defect","title":"Downspout Missing","text":"I observed a missing downspout at the house.  This can cause major moisture intrusion into the house and foundation, which could cause settlement of the structure.  Recommend a qualified contractor install downspouts where needed.  The downspout discharge needs to be extended away from the foundation too.","sev":"moderate","choices":[]},{"id":"1dddc33","type":"limit","title":"Condominium Disclaimer","text":"LMT - Condominiums are controlled by an association.  This association is generally responsible for the exterior of the home including the roof, landscaping and grounds, and exterior systems.  Due to the association controlling ownership of the roofing material the inspector doesn\u2019t traverse the roof and only a basic inspection is made of these systems.  Defects of these systems should always be referred back to the association.","sev":"minor","choices":[]}]},{"name":"Eaves, Soffits & Fascia","c":[{"id":"2db0f2d","type":"limit","title":"Inspection Was Restricted","text":"LMT - I did not inspect all of the eaves, soffit, and facia.  It's impossible to inspect those areas closely during a home inspection.  A home inspection is not an exhaustive evaluation.  My inspection of the exterior was limited.  I did not reach and access closely every part of the eaves, soffit, and fascia.","sev":"minor","choices":[]},{"id":"bc4b675","type":"info","title":"Eaves, Soffits and Fascia Were Inspected","text":"I inspected the eaves, soffits and fascia.  I was not able to inspect every detail, since a home inspection is limited in its scope.","sev":"minor","choices":[]},{"id":"330be51","type":"defect","title":"Damage Observed at Eaves","text":"I observed indications that one or more areas of the eaves were damaged.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"9865948","type":"defect","title":"Damage Observed at Fascia","text":"I observed indications that one or more areas of the fascia were damaged.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"526fbce","type":"defect","title":"Damage Observed at Soffit","text":"I observed indications that one or more areas of the soffit were damaged.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"d066ef7","type":"defect","title":"Paint Surface in Poor Condition","text":"I observed indications of paint or staining in poor condition.  Flaking, cracking, and worn areas.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Vegetation, Surface Drainage, Retaining Walls & Grading","c":[{"id":"a3feae8","type":"defect","title":"Negative Grading","text":"Grading is sloping towards the home in some areas. This could lead to water intrusion and foundation issues.\n\nThe ground around a house should slope away from all sides. Downspouts, surface gutters and drains should also be directing water away from the foundation.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"a160b0c","type":"info","title":"Vegetation, Drainage, Walls & Grading Were Inspected","text":"I inspected the vegetation, surface drainage, retaining walls and grading of the property, where they may adversely affect the structure due to moisture intrusion.","sev":"minor","choices":[]},{"id":"52ccd91","type":"defect","title":"Dense Vegetation","text":"I observed dense vegetation around the house in areas.  This condition limited and restricted my visual inspection.  Dense vegetation and landscaping up against or near the house foundation and exterior walls may be prone to water penetration and insect infestation.\n\nTrimming, pruning and some landscaping is recommended.","sev":"moderate","choices":[]},{"id":"5610555","type":"defect","title":"Water Puddles","text":"I observed water puddles on the ground surface near the house foundation.  There shouldn't be any puddles. The ground surface should be properly sloped in order to drain away the surface water.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"6dbcd99","type":"defect","title":"Retaining Wall Damage","text":"I observed indication of damage at the retaining wall.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"fb44e1d","type":"limit","title":"Snow","text":"LMT - Snow limited the inspection.","sev":"minor","choices":[]},{"id":"ed21574","type":"defect","title":"Retaining Wall Defect","text":"I observed indication of a defect at the retaining wall.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Wall-Covering, Flashing & Trim","c":[{"id":"4da7f12","type":"defect","title":"Damaged Wall-Covering Material","text":"I observed indications of a defect at the exterior wall-covering material.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"7ba6c4f","type":"limit","title":"Inspection Was Restricted","text":"LMT - I did not inspect all of the exterior wall-covering material.  A home inspection is not an exhaustive evaluation.  My inspection of the exterior was limited.  I did not reach and access closely every part of the exterior wall-covering.","sev":"minor","choices":[]},{"id":"5afe5f3","type":"info","title":"Worn Out Areas of Exterior Wall-Covering","text":"I observed indications of worn out areas, delayed maintenance, or aging.","sev":"minor","choices":[]},{"id":"4a72230","type":"info","title":"Type of Wall-Covering Material Described","text":"The exterior of your home is slowly deteriorating and aging.  The sun, wind, rain and temperatures are constantly affecting it.  Your job is to monitor the house's exterior for its condition and weathertightness.\n\nCheck the condition of all exterior wall-covering materials and look for developing patterns of damage or deterioration.","sev":"minor","choices":["Various Materials","Brick","Stucco","Vinyl","Stone Veneer","Masonry","Stone","Wood","Aluminum","Asbestos","Asphalt","Concrete","Engineered Wood","Fiber Cement","Logs","Metal","Plastic","Shingles","Brick Veneer","Unfinished","Concrete Masory Unit CMU"]},{"id":"ed34d49","type":"defect","title":"Siding Not Rated For Exterior Use- OSB","text":"","sev":"moderate","choices":[]},{"id":"21b0d53","type":"defect","title":"Loose Wall-Covering Material","text":"I observed indications of loose areas of the exterior wall-covering material.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"aa19023","type":"defect","title":"Rotted Trim","text":"","sev":"moderate","choices":[]},{"id":"0c55be5","type":"defect","title":"Cracking - Major at Masonry Exterior","text":"I observed indications of major structural cracking at the time of my inspection of the exterior.  Cracking was observed at one or more areas.\n\nMonitoring the masonry walls of the house is needed. Although masonry can deform elastically over long periods of time to accommodate small amounts of movement, large movements normally cause cracking. Cracking can result from a variety of problems: differential settlement of the foundation; drying shrinkage; expansion and contraction due to ambient thermal and moisture variations; improper support over openings; the effects of freeze-thaw cycles; the corrosion of iron and steel wall reinforcement; differential movement between building materials; expansion of salts; and the bulging or leaning of walls.\n\nFurther evaluation is recommended.","sev":"moderate","choices":[]},{"id":"82929c5","type":"defect","title":"Cracking - Minor","text":"Siding showed cracking in one or more places. Recommend monitoring.","sev":"minor","choices":[]},{"id":"c0e8cec","type":"defect","title":"Flashing Defect","text":"I observed a defect at the flashing at the exterior.  This condition could result in moisture intrusion into the house.","sev":"moderate","choices":[]},{"id":"a45083e","type":"defect","title":"Inadequate Ground Clearance","text":"I checked the distance between the bottom of wood components and the ground surface (or grade). In locations that have little or no snow, the distance should be no less than 8 inches. In locations with significant lasting snow, the bottom of wood elements should be no less than 8 inches above the average snow depth.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"c9e716b","type":"defect","title":"Melted Vinyl Siding","text":"I observed indications of melted vinyl siding.  Maybe from a grill that contacted the vinyl material.","sev":"minor","choices":[]},{"id":"78b5468","type":"defect","title":"Hail Damage","text":"I observed indications of major hail damage.","sev":"moderate","choices":[]}]},{"name":"Exterior Door","c":[{"id":"31bb6ec","type":"defect","title":"Wood Rot at Door","text":"I observed wood rot at the exterior door.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"cd4c606","type":"info","title":"Exterior Doors Inspected","text":"I inspected the exterior doors of the detached garage.","sev":"minor","choices":[]},{"id":"63b93bd","type":"defect","title":"Door Hardware Damaged","text":"I observed damage at the exterior door hardware.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"7b0ac02","type":"defect","title":"Doorbell Does Not Ring","text":"I observed wood rot at the exterior door.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"74503e7","type":"defect","title":"Door Tread Defect","text":"I observed a defect at the door tread.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"a684941","type":"defect","title":"Exterior Door Surface in Poor Condiion","text":"I observed that the surface of the exterior door was in poor condition.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"6771854","type":"defect","title":"Screen Door Defect","text":"I observed a defect at the screen door.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"5d58479","type":"defect","title":"Slider Door Defect","text":"I observed indications of a defect at the slider door.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"729c0c9","type":"info","title":"Exterior Door Material","text":"","sev":"minor","choices":["Wood","Steel","Finerglass","Metal"]}]},{"name":"Windows","c":[{"id":"90660fa","type":"info","title":"Windows Inspected","text":"A representative number of windows from the ground surface was inspected at the detached garage.","sev":"minor","choices":[]},{"id":"a10190c","type":"limit","title":"Inspection Restricted","text":"LMT - I did not inspect all windows. I did inspect a representative number of them. It's impossible to inspect every window component closely during a home inspection. A home inspection is not an exhaustive evaluation. I did not reach and access closely every window, particularly those above the first floor level.","sev":"minor","choices":[]},{"id":"accfbec","type":"defect","title":"Fogged Windowpane","text":"I observed a fogged windowpane (a lost seal) at a window.\n\nIf multiple-pane windows appear misty or foggy, it means that the seal protecting the window assembly has failed, and condensation has formed in between the two panes of glass.  Condensation in double-paned windows indicates that the glazing assembly has failed and needs repair or replacement.  Visible condensation can damage glazing and is the main indication of sealant failure.  Condensation is not always visible.  If the failure is recent, a failed window may not be obvious, since condensation doesnt usually form until the window is heated by direct sunlight. Windows in the shade may show no evidence of failure, so it is nearly impossible to observe and report all failed double-paned windows.","sev":"minor","choices":[]},{"id":"290f9d3","type":"defect","title":"Missing Glass","text":"The window was missing glass therefore it was not providing protection from the weather.  Replacement is necessary.","sev":"major","choices":[]},{"id":"1736f08","type":"defect","title":"Wood Rot at Window","text":"I observed indications of wood rot at the window.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"4ebcd21","type":"defect","title":"Cracked Windowpane","text":"I observed a cracked glass windowpane.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"966b720","type":"defect","title":"Damaged Window Screen","text":"I observed a damaged window screen.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"37ba874","type":"defect","title":"Missing Window Screen","text":"I observed a missing window screen.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]}]},{"name":"Electric/GFCI Outside Garage","c":[{"id":"fbc5b38","type":"limit","title":"Unable to Inspect Everything","text":"LMT - I was unable to inspect every electrical component or proper installation of the GFCI system according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the electrical system as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"b59f4d2","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"a8b54a5","type":"defect","title":"Missing Receptical Cover","text":"","sev":"minor","choices":[]},{"id":"f9c20da","type":"defect","title":"Missing Receptacle","text":"I observed indications that there was a missing electrical receptacle outlet at the garage exterior.","sev":"moderate","choices":[]},{"id":"1f938fc","type":"defect","title":"Missing GFCI","text":"I observed indications that a GFCI is missing in an area that is required to keep people safe.","sev":"moderate","choices":[]},{"id":"e624047","type":"defect","title":"Improper Installation of GFCI","text":"I observed indications of improper installation at the GFCI device.","sev":"moderate","choices":[]},{"id":"b478191","type":"defect","title":"GFCI Defect","text":"I observed indications of a defect at a GFCI.","sev":"moderate","choices":[]},{"id":"cccb964","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.","sev":"moderate","choices":[]},{"id":"386a182","type":"defect","title":"Electrical Defect","text":"I observed indications of an electrical defect at the exterior.","sev":"moderate","choices":[]},{"id":"65a16ce","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"00c9ca3","type":"info","title":"Inspected GFCIs","text":"I inspected ground-fault circuit interrupter receptacles and circuit breakers observed and deemed to be GFCIs using a GFCI tester, where possible.","sev":"minor","choices":[]},{"id":"9c35a2b","type":"defect","title":"Ungrounded Outlets","text":"","sev":"moderate","choices":[]},{"id":"7a16657","type":"defect","title":"Improper installation of electrical circuit","text":"","sev":"major","choices":[]}]},{"name":"Structure","c":[{"id":"70cba82","type":"defect","title":"Structural Brackets Not Installed Properly","text":"The structural brackets were installed with a lack of and/or improper fasteners.  Manufacturer recommendations state all holes of the brackets should be filled with a minimum of a #10 joist hanger nail or another approved fastener.  The lack of or improper fasteners can cause structural failure.  Repair by a licensed builder is recommended.","sev":"moderate","choices":[]},{"id":"1bea4fe","type":"info","title":"Old System","text":"","sev":"minor","choices":[]},{"id":"bf4159b","type":"limit","title":"Door Locked-  Not Accessible","text":"LMT - The door was locked to the garage.  None of the interior was inspected.  Inspection restriction.","sev":"minor","choices":[]}]},{"name":"Exterior Wall Coverings","c":[{"id":"348a28f","type":"defect","title":"Paint Peeling, Faded, Or Cracked","text":"The paint on the siding is deteriorated.  This exposes the siding to weather and can cause damage.  Possible damage.  Repair by a painting contractor is recommended.","sev":"minor","choices":[]},{"id":"b2009a9","type":"defect","title":"Wood Rotted or Damaged","text":"","sev":"moderate","choices":[]},{"id":"23c4abf","type":"limit","title":"Condimuinum Disclaimer","text":"LMT - Condominiums are controlled by an association.  This association is generally responsible for the exterior of the home including the roof, landscaping and grounds, and exterior systems.  Due to the association controlling ownership of the roofing material the inspector doesn\u2019t traverse the roof and only a basic inspection is made of these systems.  Defects of these systems should always be referred back to the association.","sev":"minor","choices":[]}]},{"name":"Ceiling & Walls in Garage","c":[{"id":"97ec941","type":"defect","title":"Moisture Intrusion","text":"Garage walls showed signs of moisture intrusion. Recommend a qualified contractor evaluate and find source of moisture to prevent further damage and/or mold.","sev":"moderate","choices":[]},{"id":"55ecaac","type":"limit","title":"Can't See Everything","text":"LMT - I can not observe everything. Inspection restrictions. My inspection was limited.","sev":"minor","choices":[]},{"id":"d10b09a","type":"info","title":"Garage Ceiling & Walls Were Inspected","text":"I inspected the ceiling and walls of the detached garage according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"89807f2","type":"defect","title":"Defect at Ceiling in Garage","text":"I observed a defect at the ceiling of the detached garage.","sev":"moderate","choices":[]},{"id":"194d737","type":"defect","title":"Defect at Wall in Garage","text":"I observed a defect at the wall of the detached garage.","sev":"moderate","choices":[]},{"id":"e466910","type":"defect","title":"Opening in Drywall Defect","text":"I observed an opening in the drywall or gypsum board of the garage. Defect.\n\nThere must not be any openings in the drywall of the garage. All openings must be patched and repaired properly.\n\nThere must be at least 1/2-inch thick gypsum board or equivalent applied to the garage side to separate the garage and the house or attic space.\n\nThere must be at least 5/8-inch thick Type X gypsum board or equivalent applied to the garage side to separate the garage from the habitable room above the garage.","sev":"moderate","choices":[]},{"id":"ddf56cf","type":"defect","title":"Damaged Drywall","text":"Garage wall had damaged drywall. Recommend drywall contractor repair.","sev":"moderate","choices":[]},{"id":"4b5151a","type":"info","title":"Ceiling/ Wall Material","text":"","sev":"minor","choices":["Wood","OSB","Drywall","Steel","Unfinished"]},{"id":"9cafc50","type":"info","title":"Unfinished","text":"","sev":"minor","choices":[]}]},{"name":"Garage Vehicle Door","c":[{"id":"c3ab91a","type":"limit","title":"Unable to Inspect Garage Door","text":"LMT - I was unable to inspect the garage door. Inspection restriction.","sev":"minor","choices":[]},{"id":"43cdb29","type":"defect","title":"Wood Rot Damage to Garage Door","text":"I observed indications of water damage to the garage door itself. Wood rot.","sev":"moderate","choices":[]},{"id":"2a7e62d","type":"defect","title":"Weather Stripping at Garage Door in Poor Condition","text":"I observed indications that the weather stripping at the garage door is in poor condition.","sev":"minor","choices":[]},{"id":"e3fca8c","type":"defect","title":"Weathered Condition at Garage Door","text":"I observed weathered conditions at the garage door. Indications of delayed maintenance.","sev":"minor","choices":[]},{"id":"deb3a7e","type":"defect","title":"Cracked Glass at Garage Door","text":"I observed cracked windowpane glass at the garage door.","sev":"moderate","choices":[]},{"id":"1b694a9","type":"defect","title":"The Garage Door Spring Containment Not Present","text":"The garage door spring did not have a containment system installed.  If the spring breaks it can become very dangerous.  A new opening system should be installed.","sev":"moderate","choices":[]},{"id":"6cc3918","type":"info","title":"Type of Door Operation","text":"","sev":"minor","choices":["Manual","Opener","Sliding"]},{"id":"f4b2ddd","type":"defect","title":"Damage to Garage Door","text":"The inspector observed indications of damage to the garage door itself.  Multiple panels were bent or dented.  This can cause issues with the door properly opening, closing, or sealing.\n\nCorrective Action\n\nThe panels or complete doors may need to be replaced.","sev":"moderate","choices":[]},{"id":"240d2b1","type":"defect","title":"Loose Attachment / Support of Garage","text":"The structural support and attachment of the garage door to the house structure is inadequate. Safety hazard.","sev":"moderate","choices":[]},{"id":"22322e6","type":"defect","title":"Door Lock Does Not Work","text":"The locking mechanism at the garage door does not work.","sev":"minor","choices":[]},{"id":"85aa259","type":"defect","title":"Opener Disconnected- Not Inspected","text":"The garage door opener was disconnected therefore it was not inspected.","sev":"minor","choices":[]},{"id":"0029a31","type":"defect","title":"Personal Belongings Blocked Access To Garage Door","text":"Personal belongings blocked access to the garage door, it was not manually operated.","sev":"moderate","choices":[]},{"id":"2298f28","type":"defect","title":"Overhead Door Flashing- Missing","text":"The garage overhead door was missing head flashing.  This diverts water away from the framing.  Water intrusion is possible and hidden damage may exist.  Repair by a licensed contractor is recommended.","sev":"moderate","choices":[]}]},{"name":"Garage Vehicle Door Opener","c":[{"id":"14a7437","type":"limit","title":"Unable to Inspect Garage Door Opener","text":"LMT - I was unable to inspect the garage door opener. Inspection restriction.","sev":"minor","choices":[]},{"id":"c61786a","type":"info","title":"Manual Release","text":"I checked for a manual release handle--a means of manually detaching the door from the door opener.\n\nThe handle should be colored red so that it can be seen easily. The handle should be easily accessible and no more than 6 feet above the garage floor. The handle should not be in contact with the top of a vehicles.","sev":"minor","choices":[]},{"id":"e92a4d1","type":"defect","title":"Defect at Warning Label","text":"There is a defect at a warning label.\n\nThe garage door should have the following warning labels:\n\n\u2022 a spring warning label attached to the spring assembly or the back of the door panel;\n\n\u2022 a general warning label attached to the back of the door panel;\n\n\u2022 a warning label near the wall control button; and\n\n\u2022 two warning labels attached to the door in the vicinity of the bottom corner brackets. Some newer doors have tamper-resistant bottom corner brackets that do not require these warning labels.","sev":"minor","choices":[]},{"id":"6e927ea","type":"defect","title":"Photo-Electric Eyes Were Too High","text":"I observed that the photo-electric eyes are installed too high from the garage floor surface.\n\nThe vertical distance between the photo-eye beam and the floor should be no more than 6 inches.","sev":"moderate","choices":[]},{"id":"8a1cbac","type":"info","title":"Garage Door Panels Were Inspected","text":"I inspected the garage door panels.","sev":"minor","choices":[]},{"id":"1c6b32b","type":"info","title":"Spring Warning Label Was Inspected","text":"I observed a spring warning label attached to the spring assembly or the back of the door panel. Good.","sev":"minor","choices":[]},{"id":"84587ef","type":"defect","title":"Broken Spring","text":"I observed that a garage door spring was broken and in need of replacement.","sev":"major","choices":[]},{"id":"1dd37eb","type":"defect","title":"Non-Contact Auto-Reverse Failed","text":"I observed that the garage door did not automatically reverse after a non-contact auto-reverse test. This is a safety defect.","sev":"moderate","choices":[]},{"id":"060142b","type":"info","title":"General Warning Label Was Inspected","text":"I observed a general warning label attached to the back of the door panel. Good.","sev":"minor","choices":[]},{"id":"cbb0049","type":"info","title":"Bottom Bracket Label Was Inspected","text":"I observed two warning labels attached to the door in the vicinity of the bottom corner brackets. Some newer doors have tamper-resistant bottom corner brackets that do not require these warning labels.","sev":"minor","choices":[]},{"id":"c117e72","type":"defect","title":"Manual Release Not Red","text":"I observed that the manual release handle of the garage door opener was not colored red so that it can be seen easily. Defect.","sev":"moderate","choices":[]},{"id":"d0046f8","type":"defect","title":"Manual Release In Contact with Car","text":"I observed that the handle of the manual release was so low that it could be in contact with the top of a vehicle.","sev":"moderate","choices":[]},{"id":"80893ab","type":"info","title":"Wall Control Button Label Was Inspected","text":"I observed a warning label near the wall control button. Good.","sev":"minor","choices":[]},{"id":"e8c77cd","type":"defect","title":"Manual Release Not Accessible","text":"I observed that the handle of the manual release was not easily accessible and more than 6 feet above the garage floor. Defect.","sev":"moderate","choices":[]},{"id":"81a7117","type":"info","title":"Springs, Bracket & Hardware Were Inspected","text":"I closed the door and checked the springs for damage. If a spring was broken, operating the door can cause serious injury or death. I would not operate the door if there was damage.\n\nI visually checked the doors hinges, brackets and fasteners. If the door had an opener, the door must have an opener-reinforcement bracket that is securely attached to the doors top section. The header bracket of the opener rail must be securely attached to the wall or header using lag bolts or concrete anchors.","sev":"minor","choices":[]},{"id":"f94cb47","type":"defect","title":"Defect at Door Panel","text":"I observed indications of a defect at the garage door panel.","sev":"moderate","choices":[]},{"id":"bed0fbe","type":"info","title":"Door Was Manually Opened and Closed","text":"I closed the door. If the door had an opener, I pulled the manual release to disconnect the door from the opener. I lifted and operated the door. If the door was hard to lift, then it is out of balance. This is an unsafe condition.\n\nI raised the door to the fully-open position, then closed the door. The door should move freely, and it should open and close without difficulty. As the door operates, I make sure that the rollers stay in the track. The door should stay in the fully open position. The door should also stay in a partially opened position about three to four above the garage floor level.\n\nI reconnected the door to the opener, if present.\n\nI checked the door handles or gripping points.","sev":"minor","choices":[]},{"id":"7d6dd64","type":"info","title":"Spring Containment Was Inspected","text":"If the door has extension springs, I inspect for spring containment. Extension springs should be contained by a cable that runs through the center of the springs. If a spring breaks, containment helps to prevent broken parts from flying around dangerously in the garage.","sev":"minor","choices":[]},{"id":"c6fb15a","type":"defect","title":"Wall Button Did Not Function","text":"I observed that the wall push button did not work.","sev":"moderate","choices":[]},{"id":"6c55f41","type":"defect","title":"Improper Installation of Opener","text":"I observed that the garage door opener was improperly installed. Defect.","sev":"moderate","choices":[]},{"id":"7b274c1","type":"info","title":"Wall Push Button Was Inspected","text":"I inspected the wall button. The wall button should be at least 5 feet above the standing surface, and high enough to be out of reach of small children. I pressed the push button to see if it successfully operated the door.","sev":"minor","choices":[]},{"id":"56cbea7","type":"info","title":"Photo-Electric Eyes Were Inspected","text":"I inspected the photo-electric eyes.\n\nFederal law states that residential garage door openers manufactured after 1992 must be equipped with photo-electric eyes or some other safety-reverse feature that meets UL 325 standards.\n\nI checked to see if photo-electric eyes are installed. The vertical distance between the photo-eye beam and the floor should be no more than 6 inches.","sev":"minor","choices":[]},{"id":"dec8283","type":"defect","title":"Extension Cord Used at Garage Door Opener Defect","text":"I observed an extension cord being used at the garage door opener. Extension cords are for temporary use only.","sev":"minor","choices":[]},{"id":"effd4c2","type":"info","title":"Non-Contact Reversal Was Inspected","text":"I observed the auto-reverse feature during a non-contact test.\n\nStanding inside the garage but safely away from the path of the door, I used the remote control or wall button to close the door. As the door was closing, I waved an object in the path of the photoelectric eye beam. The door should automatically reverse.","sev":"minor","choices":[]},{"id":"a0f29bb","type":"defect","title":"Electric eyes mounted too high","text":"","sev":"moderate","choices":[]}]},{"name":"Electric in the Garage","c":[{"id":"cd521cd","type":"defect","title":"Missing GFCI-Protection in Garage","text":"SFTY- The inspector observed receptacle(s) in the attached garage without GFCI (or ground fault circuit interrupter) protection.\n\nGFCI protection is required for all 15- and 20-amp receptacles, including outlets for refrigerators, garage door openers, and washing machines.\n\nCorrective Action\n\nThe inspector recommends a licensed electrician evaluate the garage circuits and install GFCI protection as necessary to properly protect all circuits.","sev":"moderate","choices":[]},{"id":"aec3732","type":"defect","title":"Electrical Defect in Garage","text":"I observed an electrical defect in the attached garage.","sev":"moderate","choices":[]},{"id":"90b0e72","type":"defect","title":"Junction Box Missing Cover","text":"","sev":"minor","choices":[]},{"id":"c425681","type":"defect","title":"Power Not Present at Receptacle","text":"I observed indications that power was not present at a receptacle outlet in the garage. Further evaluation is recommended.","sev":"minor","choices":[]},{"id":"68026a7","type":"defect","title":"Loose Electrical Lines in Garage","text":"I observed loose electrical lines, exposed and unprotected, in the garage. Not professionally installed. Potentially hazardous.","sev":"moderate","choices":[]},{"id":"a753277","type":"defect","title":"Defect at Lighting in Garage","text":"I observed a defect at the lighting in the garage.","sev":"moderate","choices":[]},{"id":"c3449b0","type":"defect","title":"Disconnect Box Nearing End Of Useful Life","text":"The disconnect box may Need to be upgraded.","sev":"moderate","choices":[]},{"id":"3477a32","type":"info","title":"General Pics","text":"","sev":"minor","choices":[]},{"id":"70dd504","type":"defect","title":"Improper Gounded Conductor to Ground Connection","text":"","sev":"major","choices":[]},{"id":"84c5d63","type":"defect","title":"Ungrounded Receptacle","text":"The outlet was not grounded.  Grounding of electrical receptacles (which some laypeople refer to as outlets) is an important safety feature that has been required in new construction since 1962, as it minimizes the risk of electric shock and protects electrical equipment from damage. Modern, grounded 120-volt receptacles in the United States have a small, round ground slot centered below two vertical hot and neutral slots, and it provides an alternate path for electricity that may stray from an appliance. Older homes often have ungrounded, two-slot receptacles that are outdated and potentially dangerous.\n\nWhile homeowners may be made aware of the limitations of ungrounded electrical receptacles, upgrades are not necessarily required. Many small electrical appliances, such as alarm clocks and coffee makers, are two-pronged and are thus unaffected by a lack of grounding in the building\u2019s electrical system.\n\nUpgrading the system will bring it closer to modern safety standards, however, and this may be accomplished in the following ways:\n\n\u2022 Install three-slot receptacles and wire them so that they\u2019re correctly grounded.\n\n\u2022 Install ground-fault circuit interrupters (GFCIs). These can be installed upstream or at the receptacle itself. GFCIs are an accepted replacement because they will protect against electric shocks even in the absence of grounding, but they may not protect the powered appliance. Also, GFCI-protected ungrounded receptacles may not work effectively with surge protectors. Ungrounded GFCI-protected receptacles should be identified with labels that come with the new receptacles that state:  \u201cNo Equipment Ground.\u201d\n\n\u2022 Replace three-slot receptacles with two-slot receptacles. Two-slot receptacles correctly represent that the system is ungrounded, lessening the chance that they will be used improperly.","sev":"moderate","choices":[]},{"id":"9b8e302","type":"defect","title":"Missing Receptacle in Garage","text":"I observed a missing receptacle in the garage.\n\nThere must be at least one receptacle outlet in the attached garage.","sev":"moderate","choices":[]},{"id":"ec8aa9e","type":"defect","title":"Disconnect Box Missing Knockout Covers","text":"","sev":"minor","choices":[]},{"id":"fc748c8","type":"defect","title":"Debris In Box","text":"","sev":"moderate","choices":[]},{"id":"5503510","type":"defect","title":"Receptacle Improperly Installed","text":"The receptacle was improperly installed.  This is a safety hazard.  Repair by a licensed electrical contractor is recommended.","sev":"moderate","choices":[]},{"id":"f72d44b","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.","sev":"moderate","choices":[]},{"id":"19385fb","type":"defect","title":"Missing Receptacle for Each Car Space in Garage","text":"I observed that there is a missing receptacle for each car space in the attached garage.\n\nOne receptacle outlet must be installed for each car space in the garage. 2014 NEC 210.52(G)","sev":"moderate","choices":[]},{"id":"eb7a3ac","type":"limit","title":"Power Not On To Garage","text":"","sev":"minor","choices":[]},{"id":"51a8afb","type":"defect","title":"Missing Tamper-Resistance Protection in Garage","text":"I observed an electric receptacle outlet (located below 5' 6\" height above the floor) that was not listed as a tamper resistant (TR) type.\n\nAll receptacle outlets below 5' 6\" must be tamper resistant (TR).\n\nLearn more about TR receptacles.","sev":"moderate","choices":[]},{"id":"10a4f46","type":"defect","title":"Defect at Wall Switch in Garage","text":"I observed a defect at a wall switch in the garage. Not installed properly.","sev":"moderate","choices":[]},{"id":"edf7a29","type":"limit","title":"Garage Door Locked","text":"The door to the garage was locked.  Inspection Limitation","sev":"minor","choices":[]},{"id":"965f96a","type":"defect","title":"Improper Grounding At Subpanel","text":"","sev":"moderate","choices":[]},{"id":"127b8b1","type":"defect","title":"Knob and Tube Wiring Observed","text":"","sev":"major","choices":[]},{"id":"405f264","type":"defect","title":"Disconnect Not Present","text":"","sev":"moderate","choices":[]}]},{"name":"Garage Floor","c":[{"id":"e392e8a","type":"limit","title":"Can't See Everything","text":"LMT - I can not observe everything. Inspection restrictions. My inspection was limited.","sev":"minor","choices":[]},{"id":"0a56077","type":"info","title":"Garage Floor Inspected","text":"I inspected the floor of the garage.","sev":"minor","choices":[]},{"id":"c4b3ed8","type":"defect","title":"Floor Surface is Not Sloped","text":"I observed indications that the floor surface of the garage is not sloped properly.\n\nThe area of floor used for parking of automobiles or other vehicles must be sloped. It should slope toward the vehicle door opening. The sloped surface will help the movement of liquids to a drain or toward the main vehicle doorway of the carport.","sev":"minor","choices":[]},{"id":"2bab59d","type":"defect","title":"Floor Slopes","text":"","sev":"moderate","choices":[]},{"id":"2c035e7","type":"defect","title":"Floor Surface is Not Noncombustible","text":"I observed indications that the floor surface of the garage is not of an approved noncombustible material. Fire hazard.\n\nThe garage floor must be made of noncombustible material.","sev":"moderate","choices":[]},{"id":"2b9ff1c","type":"defect","title":"Structural Defect at Garage","text":"I observed indications of a structural defect at the garage.","sev":"moderate","choices":[]},{"id":"701f925","type":"defect","title":"Defect at Floor Drain","text":"I observed indications of a defect at the drain in the garage.","sev":"moderate","choices":[]},{"id":"7c897f9","type":"defect","title":"Cracked Concrete at Garage Floor","text":"I observed indications of cracks in the garage concrete floor.","sev":"minor","choices":[]},{"id":"3129c39","type":"defect","title":"Major Cracked Concrete at Garage Floor","text":"I observed indications of major cracks in the garage concrete floor indicating settlement, heaving or structural problems. Further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Stairs, Steps, Stoops, Stairways & Ramps","c":[{"id":"6cc42df","type":"info","title":"Stairs, Steps, Stoops, Stairways & Ramps Were Inspected","text":"I inspected the stairs, steps, stoops, stairways and ramps that were within the scope of my home inspection.\n\nAll treads should be level and secure. Riser heights and tread depths should be as uniform as possible. As a guide, stairs must have a maximum riser of 7-3/4 inches and a minimum tread of 10 inches.","sev":"minor","choices":[]},{"id":"88b67c5","type":"defect","title":"Width of Stairway Too Narrow (36\")","text":"I observed that the width of the stairway (above the handrail) is less than the standard minimum of 36 inches.","sev":"minor","choices":[]},{"id":"b446d87","type":"defect","title":"Riser Height Too Tall (Greater Than 7 3/4\")","text":"I observed a defect at the stair riser height.\n\nThe riser height maximum is 7 3/4 inches measured vertically between the stair treads. This poses a trip hazard.","sev":"moderate","choices":[]},{"id":"7076bc0","type":"defect","title":"Tread Depth Too Short (Smaller Than 10\")","text":"I observed a defect at the stair riser depth. It's too short.\n\nThe minimum tread depth is 10 inches, measured between the projected nosings of adjacent treads. This poses a trip hazard.","sev":"moderate","choices":[]},{"id":"d5ffc47","type":"defect","title":"Stairway Illumination","text":"I observed inadequate illumination (lighting) for the stairway.\n\nAll stairs should have adequate lighting to see where you're stepping. There should be lighting for the stairway, steps, treads, and landings. For the exterior stairs, there should be a light at the top land

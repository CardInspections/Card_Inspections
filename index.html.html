e electrical circuit.  Seal gaps with an approved gasketing material.","sev":"minor","choices":[]},{"id":"5e241cd","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.   This could indicate the GFCI receptacle is damaged or a wiring issue exists.  Further evaluation and repair by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"ed707cf","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"d746805","type":"defect","title":"Hot and Ground Reversed On Receptical","text":"The inspectors tester shows the hot and ground wires were reversed on this outlet.  This can cause injury as the outlet and bonding circuit could be electrified.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"4568edc","type":"defect","title":"Bulb Is Flickering","text":"The flickering is related to loose wiring.  Ensure the wires are securely connected with a proper connector.  If the bulb is still flickering, have repaired by a qualified electrician.  A flickering bulb may indicate potential loose wiring.","sev":"minor","choices":[]},{"id":"224c26c","type":"defect","title":"Box Extension Required","text":"","sev":"moderate","choices":[]},{"id":"6eb682b","type":"defect","title":"Wiring Not Rated For Exterior Use","text":"Wire was observed hat was not rated for exterior use.  This could cause the wire to deteriorate.  Replacement by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"69c40a5","type":"defect","title":"In Use Cover","text":"During the exterior inspection of the property, it was noted that the exterior electrical receptacle(s) did not have an in-use cover installed. An in-use cover is a protective cover designed to safeguard outdoor electrical outlets from environmental elements such as rain, snow, dust, and debris, while still allowing for the use of the outlet.\n\nThe absence of an in-use cover exposes the electrical receptacle to potential moisture ingress, which can lead to corrosion, short circuits, and electrical hazards. Furthermore, the lack of protection increases the risk of accidental contact with live electrical components, posing a safety concern for the property occupants and visitors.\n\nIt is recommended to install an in-use cover on all exterior electrical receptacles to ensure compliance with safety standards and to mitigate the risk of electrical hazards. In-use covers are relatively inexpensive and readily available at hardware stores, making them an essential addition to outdoor electrical outlets.\n\nBy installing an in-use cover, the electrical receptacle will be adequately protected against environmental factors, prolonging its lifespan and reducing the likelihood of electrical malfunctions or accidents. Property owners are advised to have a licensed electrician install the appropriate in-use cover to ensure proper installation and compliance with local electrical codes.","sev":"minor","choices":[]}]},{"name":"Walkways & Driveways","c":[{"id":"ef05e56","type":"info","title":"Walkways & Driveways Were Inspected","text":"I inspected the walkways and driveways that were adjacent to the house.  The walkways, driveways, and parking areas that were far away from the house foundation were not inspected.","sev":"minor","choices":[]},{"id":"be618d4","type":"defect","title":"Trip Hazard","text":"The inspector noted an uneven transition between cement slabs on the sidewalk.  This creates a trip hazard.   This can be repaired in one of three ways:\n\n1) Grinding the lip of the sidewalk down to make the transition less abrupt.\n\n2) The slab can be \"mud jacked\".  Mud jacking is performed by a qualitied contractor by drilling a hole in the slab and pumping cement or foam under the slab raising it up.\n\n3) The slab can be removed and replaced with new concrete.","sev":"moderate","choices":[]},{"id":"81100b2","type":"defect","title":"Major Cracking at Driveway","text":"I observed indications of major cracking at the driveway.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"faa1871","type":"defect","title":"Minor Cracking at Driveway","text":"I observed minor cracking and no major damage at the driveway.\n\nMonitoring is recommended.  To find out about how to repair driveway cracks click here.","sev":"minor","choices":[]},{"id":"a16c512","type":"defect","title":"Major Cracking at Walkway","text":"I observed major cracking at the walkway.  This condition could be a trip hazard.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"8ea26e4","type":"defect","title":"Concrete Settled With Trap Hazard","text":"Changes in elevations of sidewalks greater than 1/4\" can cause a tripping hazard.  Sidewalk should be \"mud jacked\" or replaced to bring it level with the surrounding concrete pads.","sev":"major","choices":[]},{"id":"0865065","type":"defect","title":"Improperly Sloped Driveway Surface","text":"I observed that the driveway has a negative slope and drains towards the house. This condition is prone to water penetration into the house structure.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"87dd7a1","type":"defect","title":"Asphalt Settling With Major Cracks","text":"SFTY- The inspector noted the asphalt driveway had settled and featured major cracks.  The cracks allow for water intrusion, which may cause the surrounding surfaces to also deteriorate and settle further, possibly requiring a complete driveway replacement.\n\nRecommendation\n\nThe inspector recommends to replace the damaged portion of the driveway with fresh asphalt. Sealcoat the remaining driveway with an oil-based asphalt sealer and consult with a sealcoating contractor for a regular maintenance program based on the traffic and weather conditions.","sev":"minor","choices":[]},{"id":"9c88a70","type":"defect","title":"Gap Observed Between Concrete Walkway and Building, Stoop, Or Other Structure","text":"Gaps provide an environment for moisture intrusion with the possibility of expansion during the winter months.  Fill all gaps with a pliable weather-resistant concrete sealer.","sev":"moderate","choices":[]},{"id":"2244510","type":"defect","title":"Brick or Concrete Is Spalling","text":"The spalling provides an environment for moisture intrusion which may lead to deterioration.  Repair should be made by a qualified mason or concrete contractor.","sev":"minor","choices":[]},{"id":"26f39ba","type":"defect","title":"Observed Concrete Pop Outs","text":"A pop out is a conical fragment that breaks out of the surface of the concrete leaving a hole that may vary in size.  If left unrepaired, pop outs can accelerate pavement deterioration.  Patch the damaged area with appropriate patch material.","sev":"minor","choices":[]},{"id":"cacc0e0","type":"info","title":"Walkway Material","text":"","sev":"minor","choices":["Concrete","Wood","Pavers","Brick","Gravel","Asphalt"]},{"id":"0755da9","type":"info","title":"Driveway Material","text":"","sev":"minor","choices":["Concrete","Gravel","Crushed Asphalt","Asphalt"]},{"id":"d8ee583","type":"limit","title":"Snow Prevented Complete Inspection","text":"LMT - Snow covered parts or all of the walkways and driveways at the time of the inspection.  This is an inspection limitation.  Further evaluation of these areas is recommended once the areas are cleared.","sev":"minor","choices":[]},{"id":"96dfa90","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Stairs, Steps, Stoops, Stairways & Ramps","c":[{"id":"40971e6","type":"defect","title":"Handrail Doesn't Meet Current Standards","text":"","sev":"moderate","choices":[]},{"id":"9e78647","type":"info","title":"Stairs, Steps, Stoops, Stairways & Ramps Were Inspected","text":"I inspected the stairs, steps, stoops, stairways and ramps that were within the scope of my home inspection.\n\nAll treads should be level and secure. Riser heights and tread depths should be as uniform as possible. As a guide, stairs must have a maximum riser of 7-3/4 inches and a minimum tread of 10 inches.","sev":"minor","choices":[]},{"id":"8125106","type":"defect","title":"Loose Handrail","text":"I observed a loose handrail.  This is a safety hazard.  The railing must be installed to meet current standards.  Repair by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"bf53140","type":"defect","title":"Big Differences Between Treads (3/8\")","text":"I observed that there's a difference between the stair treads from one to another that is greater than 3/8 of an inch.\n\nThis poses as a trip hazard. The difference between one step and other is at most 3/8 of an inch.","sev":"moderate","choices":[]},{"id":"dd6fbc6","type":"defect","title":"Missing Handrail","text":"I observed a missing handrail at the exterior steps.\n\nThere is more than one step here, and I recommend a licensed contractor install a handrail for safety.","sev":"major","choices":[]},{"id":"a31f397","type":"defect","title":"Concrete Spalling/ Cracked","text":"","sev":"moderate","choices":[]},{"id":"638076e","type":"defect","title":"Damage at Step","text":"I observed a damage at a step. This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"ebb19f8","type":"defect","title":"Trip Hazard at Step","text":"I observed a trip hazard at a step. This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"845411e","type":"defect","title":"Slippery Steps","text":"I observed indications at the stair treads or steps are slippery.","sev":"minor","choices":[]},{"id":"3c9e4c9","type":"defect","title":"Riser Height Too Tall (Greater Than 7 3/4\")","text":"I observed a defect at the stair riser height.\n\nThe riser height maximum is 7 3/4 inches measured vertically between the stair treads. This poses a trip hazard.","sev":"moderate","choices":[]},{"id":"69ba109","type":"defect","title":"Stairway Illumination","text":"I observed inadequate illumination (lighting) for the stairway.\n\nAll stairs should have adequate lighting to see where you're stepping. There should be lighting for the stairway, steps, treads, and landings. For the exterior stairs, there should be a light at the top landing.","sev":"moderate","choices":[]},{"id":"a21837e","type":"defect","title":"Width of Stairway Too Narrow (36\")","text":"I observed that the width of the stairway (above the handrail) is less than the standard minimum of 36 inches.","sev":"minor","choices":[]},{"id":"f89e744","type":"defect","title":"Handrail Loose","text":"The handrail is loose.  Safety hazard.  Secure handrail.","sev":"minor","choices":[]},{"id":"1c59f2c","type":"defect","title":"Headroom at Stairway Too Low (6' 8\")","text":"I observed that the headroom at the stairs is too low. The minimum is 6 feet and 8 inches.","sev":"moderate","choices":[]},{"id":"d691a00","type":"info","title":"Stairway Material","text":"","sev":"minor","choices":["Concrete","Wood","Pavers","Composite","Plastic","CMU"]},{"id":"0400e28","type":"info","title":"Railing Material","text":"","sev":"minor","choices":["Wood","Vinyl","Composite","Wroght Iron","Metal","Not Present"]},{"id":"875c665","type":"defect","title":"Problem with 3-Way Switch at Stairs","text":"I observed indications of a problem with the 3-way lighting switch at the stairs.","sev":"minor","choices":[]},{"id":"3d197f9","type":"defect","title":"Tread Depth Too Short (Smaller Than 10\")","text":"I observed a defect at the stair riser depth. It's too short.\n\nThe minimum tread depth is 10 inches, measured between the projected nosings of adjacent treads. This poses a trip hazard.","sev":"moderate","choices":[]},{"id":"dd8818a","type":"defect","title":"Deteriorated Wood","text":"","sev":"major","choices":[]},{"id":"d01d05d","type":"defect","title":"Stairway Construction Doesn\u2019t Meet Current Standards","text":"SFTY- the stairway was not attached to the deck properly.  This could cause the stairway to fail resulting in injury.  Safety Hazard.  Repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"f7f5794","type":"defect","title":"Missing Deck","text":"SFTY- The front entry door is missing a step and/ or porch.  This is a safety hazard.","sev":"major","choices":[]},{"id":"fcff025","type":"defect","title":"Step not level","text":"SFTY- The stairway exhibited a notable deviation from level, which poses a significant tripping hazard.  The stair treads exhibited a noticeable slope. The uneven alignment of the stairs may be attributed to various factors, including settlement, improper installation, or deterioration over time.\n\nThe lack of levelness in the stairway represents a clear safety hazard. Uneven steps can lead to instability and increase the risk of accidents, particularly tripping incidents.\n\n it is strongly recommended that a licensed contractor or qualified professional be engaged to conduct a thorough evaluation of the stairway. The corrective measures may include:\n\n- Adjustment or replacement of the stair treads to ensure a level surface.\n\n- Examination of the deck's structural integrity to identify and rectify any underlying issues contributing to the unevenness.\n\n- Application of appropriate safety measures, such as the addition of handrails or other stability-enhancing features.","sev":"major","choices":[]}]},{"name":"Porches, Patios, Decks, Balconies & Carports","c":[{"id":"07eb7e1","type":"limit","title":"https://inspectapedia.com/Stairs/Handrail_Graspability.php","text":"","sev":"minor","choices":[]},{"id":"eb98f15","type":"defect","title":"Decking Finish is Deterriorated","text":"The finish of the decking material protects the wood from deterioration and decay.  Decking will need to be stripped and sanded to remove the existing finish.  Once completely removed a new stain can be applied.  The inspector recommends using a premium oil based stain.  Click here for more information on staining your deck.","sev":"minor","choices":[]},{"id":"593f842","type":"info","title":"Porches, Patios, Decks, Balconies & Carports Were Inspected","text":"I inspected the porches, patios, decks, balconies and carports at the house that were within the scope of the home inspection.","sev":"minor","choices":[]},{"id":"6d480e9","type":"limit","title":"Decks: Structural Assembly - Not Visible (Clearance)","text":"LMT - The structural assembly for the referenced deck was not visible due to the deck's proximity to the ground. The condition of this deck is excluded from this inspection.","sev":"minor","choices":[]},{"id":"e87cf4e","type":"defect","title":"Deteriorated Condition at Deck","text":"I observed indications of deteriorated conditions at the deck components.","sev":"moderate","choices":[]},{"id":"1eff2af","type":"defect","title":"Deck - Fastener Defect","text":"The structural brackets, such as joist hangers, were observed to be improperly secured. Specifically, not all holes in the brackets were filled with the appropriate fasteners, as required by the manufacturer\u2019s recommendations. This condition compromises the bracket\u2019s ability to provide adequate support to the structural members, potentially leading to sagging, shifting, or structural failure under load.\n\nHave a qualified contractor evaluate and properly secure the structural brackets by installing the appropriate fasteners in all designated holes. This is critical to ensure the brackets perform as intended and maintain the structural integrity of the framing.\n\nProperly installed joist hangers and other structural brackets are essential for evenly distributing loads and preventing stress concentrations, which can lead to long-term damage or failure of the structure. Addressing this issue promptly will help ensure safety and longevity.","sev":"major","choices":[]},{"id":"a48d533","type":"limit","title":"Deck Covered In Snow","text":"LMT - The deck was covered in snow.  This prevented a full inspection of the deck.  Recommend further inspection of this system once the area is cleared.","sev":"minor","choices":[]},{"id":"e03e37b","type":"limit","title":"Ledger Board Not VIsible","text":"LMT - The ledger board was not visible during the inspection.  It was not inspected.","sev":"minor","choices":[]},{"id":"342b140","type":"defect","title":"Flashing Between Ledger Board And House Is Missing","text":"Without flashing, moisture can accumulate between the ledger board and the building, potentially leading to rotting or deterioration.  The deterioration may cause the ledger board to be less secure.  A licensed contractor should install flashing.","sev":"moderate","choices":[]},{"id":"e333457","type":"defect","title":"Improper Fasteners Securing Brackets","text":"Manufacturers of building brackets such as joist hangers recommend a minimum 10d joist hanger nail be used to provide proper support.  The fasteners used in this construction could cause structural failure.  Unapproved fasteners do not have the shear strength to handle the loads put on their shafts.  This can cause the hangers to fail and the deck to collapse.  Replace existing fasteners with a minimum 10d double dipped galvanized joist hanger or other fastener approved by the manufacturer.  Click here for examples of approve fasteners.\n\nThis is a safety hazard.  Repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"04f7008","type":"defect","title":"Support Posts Rotted At Bottom","text":"Failure of these posts could cause major structural damage.  Further evaluation by a licensed contractor and repair as necessary.","sev":"major","choices":[]},{"id":"9454bfe","type":"defect","title":"Worn Out Surfaces","text":"I observed indications of worn out surfaces at the deck.","sev":"minor","choices":[]},{"id":"a1bdec3","type":"defect","title":"Ledger Board Defect","text":"I observed indications of a defect at the ledger board of the deck.\n\nThe ledger board is not properly attached to the building. This can cause the deck to pull away from the building and possibly collapse. Material defect.\n\nCorrection and further evaluation is recommended.","sev":"major","choices":[]},{"id":"e60410e","type":"defect","title":"Missing Handrail","text":"The handrail doesn't meet current standards and could present a safety issue.\n\nAll required handrails shall be of one of the following types or provide equivalent graspability.\n\n1.  Handrails with a circular cross section shall have an outside diameter of at least 11/4 inches not greater than 2 inches. If  the handrail is not circular, it shall have a perimeter dimension of at least 4 inches and not greater than 61/4 inches with a maximum cross section of dimension of 2 1/4 inches.  Edges shall have a minimum radius of 0.01 inch.\n\n2. The minimum clearance between handrails and other objects is 2.25 inches.\n\n3. Handrails have the shape and dimension necessary to grasp firmly.\n\n4. Ends of handrail and systems do not present any projection hazards.\n\n5. Load Requirement: withstand a 200 pound load applied in a downward or outward direction within 2 inches of the top edge of the top rail.\n\nFor more information follow this link.","sev":"moderate","choices":[]},{"id":"f7719dc","type":"defect","title":"Deck Railing Doesn't Meet Current Standards","text":"Although the deck guardrails may have complied with the building safety standards in effect at the time of original construction, they do not meet generally-accepted current standards and may be hazardous to small children.  Current standards include the following:\n1. A 4 inch sphere may not pass through the guardrail at any point\n2. The guardrail should not be climbable (especially by children).\n3. Minimum guardrail height is 36 inches\n4. Any walking surface 30 inches or more above grade should have a guardrail.\n\n5. The guardrail should be properly supported by a post and able to support a 200lb concentrated load applied at the top of the railing.\n\nThis is a safety hazard.  All corrections should be made by a qualified contractor.","sev":"major","choices":[]},{"id":"c976e61","type":"defect","title":"Ledger Board Not Installed To Current Standards- Fasteners Not Approved","text":"The ledger board should be attached using 3/8 galvanized carriage bolts or another approved fastening system.  Lack of fasteners could cause the deck to collapse.  This is a safety hazard.  Repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"4d8b5e8","type":"defect","title":"Stair Risers Are Not Uniform Height","text":"Current standards do not allow more than 1/8\" difference in stair tread height.  The height difference causes a tripping hazard.  Consult with a licensed contractor to determine options for repair or replacement.","sev":"minor","choices":[]},{"id":"5a47b0a","type":"defect","title":"Stairway Guardrail & Handrail Do Not Meet Current Standards","text":"The handrail is not properly supported and will not support the required loads.  Stairway handrail and railings should always be installed with minimum 4x4 posts or a system that allows for support of 200 lbs of pressure applied at the midpoint of the span of the top rail.  This is a safety hazard.  Repair by a licensed contractor to meet current standards.  Click Here To Learn More.\n\nHandrail are required to be graspable.  The following are the requirements for a graspable handrail:\n\n\u2022 Railing grip size and shape: (must be able to be grasped)\n\n\u2022 Round rails: between 1.25\" and 2\" in diameter\n\n\u2022 Metal ogee shaped: <= 2.25\" across widest dimension\n\n\u2022 Wood oblate shaped: <= 2.25\" across widest dimension\n\n\u2022 Rectangular shaped: perimeter must be between 4\" and 6.25\"\n\n\u2022 Perimeter larger than 6\" must have a graspable finger recess","sev":"moderate","choices":[]},{"id":"bb61e66","type":"defect","title":"Deck - Wood Rot","text":"I observed wood rot at the deck.  This condition is a structural defect.\n\nCorrection and further evaluation of the deck is recommended.","sev":"moderate","choices":[]},{"id":"174fe4c","type":"defect","title":"Deck - Inadequate Structural Component","text":"I observed a structural defect at the deck.  The deck's structural condition is inadequate. This is a major defect.\n\nCorrection and further evaluation of the deck is recommended.","sev":"moderate","choices":[]},{"id":"7499689","type":"defect","title":"Deck - Cracked Boards","text":"I observed a cracked boards at the deck.  This condition is a structural defect and potential safety hazard.\n\nCorrection and further evaluation of the deck is recommended.","sev":"moderate","choices":[]},{"id":"221c791","type":"defect","title":"Concrete Has Significant Cracks","text":"The concrete porch has significant cracks which could be the result of damaged or insufficient footings or foundation.  Further evaluation, estimates, and repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"ebc6cad","type":"defect","title":"Wood In Contact With Ground","text":"The wood framing members of the deck were in contact with the ground.  This can cause rot and deterioration.  Further review and repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"109897c","type":"defect","title":"Deck - Loose Board","text":"I observed a loose board component at the deck.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"8110a63","type":"defect","title":"Deck - Flashing Defect","text":"I observed indications of a flashing defect. This flashing problem may allow water to enter into the wall cavity or building components.","sev":"moderate","choices":[]},{"id":"a04391f","type":"defect","title":"Joist Hanger Defect","text":"I observed a defect at the joist hangers of the deck.  This condition is a major structural defect.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"def3ff1","type":"defect","title":"Concrete Has Settled Creating A Tripping Hazard","text":"The concrete has settled more than 3/4\", creating a tripping hazard.  This could be due to improper site preparation at the time of construction or due to hydraulic pressures.  The concrete may be able to be \"mud jacked\", a type of repair that involves drilling holes in the concrete and pumping mud under the slab in order to raise it back to level in reference to the other slabs.  Another option is to remove and repour the slab.  A licensed concrete contractor should be consulted to obtain options and pricing.","sev":"major","choices":[]},{"id":"83975f1","type":"defect","title":"Possible Signs of Wood Destroying Organisms (WDO) Observed","text":"The inspector observed possible signs of damage to structural members caused by wood destroying organisms.  Hidden damage could exist and the extent of the damage was not determined as a complete WDO inspection lies beyond the scope of a standard home inspection.  Further evaluation by a pest control company and possibly a licensed contractor should be made before your Inspection Objection Deadline.","sev":"major","choices":[]},{"id":"fd6a3ae","type":"defect","title":"Wood Bees","text":"","sev":"moderate","choices":[]},{"id":"f773d54","type":"defect","title":"Deck- Missing Board","text":"","sev":"moderate","choices":[]},{"id":"624571e","type":"defect","title":"Concrete Is Deteriorated","text":"The deterioration may worsen overtime, causing the concrete to crack and break.  Replace the deteriorated portions.","sev":"minor","choices":[]},{"id":"92bc2f6","type":"defect","title":"Concrete Steps Settled","text":"Concrete Steps are uneven due to settling.  This is a safety concern.  The settling could be caused be improper compaction of the soil at the time of construction or instable soils, sometime caused by hydraulic interference.  Steps should be replaced by a licensed contractor.","sev":"moderate","choices":[]},{"id":"da80c0a","type":"defect","title":"Deck Ledger Bolt Is Loose","text":"One loose bolt will not effect the structural integrity of the deck, however multiple loose bolts could cause structural failure.  Tighten the loose bolt and check all other bolts on the deck.","sev":"minor","choices":[]},{"id":"c58e054","type":"defect","title":"Decking Has Organic Growth","text":"The moss is a sign that the deck is regularly exposed to moisture.  With excessive exposure to moisture, the wood may prematurely deteriorate.  Remove the moss and ensuring the water source is remediated.","sev":"minor","choices":[]},{"id":"1be3e89","type":"defect","title":"Flashing Between Ledger Board and House Is Damaged","text":"Damaged flashing can cause moisture to accumulate between the ledger board and the building, potentially leading to rotting or deterioration.  The deterioration may cause the ledger board to fail causing the deck to collapse.  Repair by a licensed contractor to meet current standards.","sev":"moderate","choices":[]},{"id":"c1a9007","type":"defect","title":"Flashing Between Ledger Board and House Is Short","text":"Without flashing, moisture can accumulate between the ledger board and the building, potentially leading to rotting or deterioration.  The deterioration may cause the ledger board to be less secure.  Install new flashing per current standards.  Click Here For More Information.","sev":"moderate","choices":[]},{"id":"14b7422","type":"defect","title":"Ledger Board Not Installed To Current Standards","text":"The deck ledger board was found to be improperly installed, as it was attached directly over the siding of the house and was not fastened properly, presenting safety hazards.\n\n1. Improper Installation Over Siding:\n\nThe deck ledger board, which connects the deck to the house, was found to be improperly installed directly over the siding of the house. This installation method is not in accordance with industry best practices and building codes, posing a serious safety concern. The ledger board should have been mounted directly to the house's structural framing.\n\n2. Inadequate Fastening:\n\nThe fastening of the ledger board to the house was found to be substandard. The lack of proper fastening compromises the structural integrity of the deck and increases the risk of detachment from the house, potentially leading to deck collapse or structural damage.\n\nHazards of Installing Over Siding:\n\n1. Moisture Intrusion: The installation over siding allows water to seep between the ledger board and the siding, leading to moisture accumulation and potential rot in both the deck ledger and the house's exterior.\n\n2. Structural Instability: Siding is not designed to support the weight and load of a deck. Over time, the added stress from foot traffic and other loads can weaken the siding and cause the deck to become unstable.\n\n3. Wood Decay: Moisture trapped between the ledger board and siding creates an ideal environment for wood decay, which can compromise the structural integrity of the deck and pose a safety risk.\n\nProper Fastening Pattern:\n\nTo ensure the safety and stability of the deck, the proper fastening pattern is essential. The deck ledger board should be directly attached to the house's rim joist using appropriate corrosion-resistant lag screws or through-bolts. The fasteners must penetrate through the siding and sheathing, securely anchoring the ledger to the structural framing of the house.  Proper fastener placement, using local code references, should be followed.\n\nRepair Recommendations:\n\nBased on the findings, it is highly recommended that the homeowner seeks immediate repair of the deck ledger board by a licensed and experienced contractor. The repair should follow the following steps:\n\n1. Removal of Deck Ledger: The improperly installed deck ledger board should be carefully removed from the siding, taking care not to cause further damage.\n\n2. Inspection of Siding and House Framing: After removing the ledger, the contractor should thoroughly inspect the siding and house framing for any signs of water damage, rot, or structural weaknesses.\n\n3. Proper Installation: The deck ledger board should be reinstalled following the appropriate fastening pattern and anchored securely to the house's structural framing using approved fasteners.\n\n4. Remediation of Damage: Any damages to the siding, sheathing, or framing should be repaired or replaced as necessary.\n\nReferences:\n\n1. The American Wood Council (AWC) - \"Prescriptive Residential Wood Deck Construction Guide.\"\n\n 2. International Code Council (ICC) - \"International Residential Code (IRC).\"\n\n 3. International Association of Certified Home Inspectors (InterNACHI)- \"Placement of Deck Ledger Board Fastners\"","sev":"major","choices":[]},{"id":"539b220","type":"defect","title":"Proper Cross Bracing Is Not Present","text":"Decks greater than 6 feet above grade should have diagonal bracing from posts to girder, and from posts to joists.  Free-standing decks (not supported by the home or building) should have diagonal bracing on all sides.  Decks greater than 6 feet above grade that do not have diagonal decking should have diagonal bracing across the bottoms of the joists to keep the deck square.  A deck that is not held square could permit the outer posts to lean to the right or left, parallel to the ledger board, and thus twist the ledger away from the home or building.  Repair by a licensed contractor to meet current standards.","sev":"major","choices":[]},{"id":"71aa001","type":"defect","title":"Proper Underside Diagonal Bracing Is Not Present","text":"For proper support decks should have underside diagonal bracing installed.  Repair by a licensed contractor recomended.","sev":"moderate","choices":[]},{"id":"f586dd7","type":"defect","title":"Stairtread Bracing Is Loose","text":"Without proper bracing, the stair treads are loose.  The metal brackets or boards may be loose.  This is a safety hazard and should be repaired to prevent a fall.","sev":"minor","choices":[]},{"id":"1ada935","type":"defect","title":"Joists Spaced Too Far Apart For Composite Decking","text":"Composite decking can warp overtime and may not hold their shape overtime with joists that are spanned over 12\".  While Trex and other manufacturers do allow 16\" on center spacing on specific lines of composite decking,  the boards may still sag overtime.  This may worsen overtime.  Add joists in between existing joists to prevent further sag.","sev":"moderate","choices":[]},{"id":"f76a857","type":"defect","title":"Post Footing Not Below Frost Line","text":"The post footing should be at least 42\" below grade to avoid movement by frost.  Frost could cause the post to move, damaging the deck.  Repair by a licensed contractor to meet current standards.","sev":"major","choices":[]},{"id":"50b5b13","type":"defect","title":"Stair Stringers Not Properly Attached","text":"The stringers were not installed per current standards.  Evaluation and repair by a licensed contractor.","sev":"major","choices":[]},{"id":"1535e67","type":"defect","title":"Stair Treads Show Signs Of Rot","text":"The treads could give way and the stairs could collapse.  Evaluation and repair by a licensed contractor.","sev":"moderate","choices":[]},{"id":"7777d37","type":"defect","title":"Support Joists Missing Hangers","text":"Over time, as nails loosen, the deck could become unstable.  Further evaluation, estimates, and repair by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"9bccbf6","type":"defect","title":"The Inspector Observed Possible Signs of Wood Destroying Organism (WDO) Damage to Structural Members","text":"Wood Destroying Organisms can cause structural members to become unstable.  Much of the damage can be hidden.  A complete WDO inspection lies beyond the scope of a standard home inspection.  Further evaluation by a pest control company and possibly a licensed contractor should be made before your Inspection Objection Deadline.","sev":"moderate","choices":[]},{"id":"0a438ea","type":"defect","title":"Beam Not Properly Fastened To Posts","text":"The deck beam is not properly attached to the posts.  The inspector noted only two deck screws installed supporting the beam.  The inspector recommends repair to meet current standards.  Two 3/8\" galvanized carriage bolts should be installed through the beam and posts or proper structural brackets installed.","sev":"major","choices":[]},{"id":"c57093f","type":"defect","title":"Missing Cross Bracing","text":"","sev":"major","choices":[]}]},{"name":"Railings, Guards & Handrails","c":[{"id":"b9e009d","type":"info","title":"Railings, Guards & Handrails Were Inspected","text":"I inspected the railings, guards and handrails that were within the scope of the home inspection.","sev":"minor","choices":[]},{"id":"cf0b1b7","type":"defect","title":"Guard Opening Was Too Large (4\")","text":"SFTY- During the inspection, I noted a safety concern pertaining to the spacing between intermediate balusters, spindles, and rails of a necessary guard in the property. This issue presents a potential hazard, particularly for small children.  As per building safety standards, guards should be designed to prevent the passage of a sphere with a 4-inch diameter.\n\nSources\n\n1. International Residential Code (IRC): The IRC is a widely adopted building code used in many regions. Specifically, Section R312.1 of the IRC outlines the requirements for guards, including the specifications for baluster spacing and the limitation of a 4-inch sphere passage.\n\n2. American Society of Home Inspectors (ASHI) Standards of Practice: ASHI provides industry standards for home inspections. The guidelines set by ASHI emphasize the importance of identifying safety hazards, like improper guard spacing, and recommend further evaluation by qualified professionals to address such concerns.\n\nIt is highly recommended that the improper spacing issue is rectified promptly, ensuring compliance with safety regulations and safeguarding the well-being of the property's occupants, especially children. Further evaluation by a qualified expert is advised to ensure the correction meets the necessary safety standards.","sev":"major","choices":[]},{"id":"ab955aa","type":"defect","title":"Handrail Not Graspable","text":"SFTY- I observed a handrail that is not graspable.  The intent of a handrail is to provide a handgrip for people using a stairway. If a railing cannot be securely gripped it is unsafe.\n\nWhile graspability of handrails naturally focuses on the profile or shape and dimensions of a handrailing, the spacing of the handrail from the wall, its height, continuity, and other features also will interfere with the ability of a person to securely grasp a handrailing when she wants to or needs to in an effort to prevent or arrest a fall.\n\nDimension Specifications for Graspable Handrails\n\nRailing grip size and shape: (must be able to be grasped)\n\n\u2022 Round rails: between 1.25\" and 2\" in diameter\n\n\u2022 Metal ogee shaped: <= 2.25\" across widest dimension\n\n\u2022 Wood oblate shaped: <= 2.25\" across widest dimension\n\n\u2022 Rectangular shaped: perimeter must be between 4\" and 6.25\"\n\n\u2022 Perimeter larger than 6\" must have a graspable finger recess\n\nThis condition is a safety hazard.  Correction and further evaluation by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"089d7e3","type":"defect","title":"Missing Handrail","text":"SFTY- The inspector observed that a handrail is missing. According to building safety standards, handrails are essential for stairways, particularly those with three or more risers, to prevent falls and injuries.  Safety Hazard Without a handrail, there is an increased risk of falls and injuries, especially for individuals who may require additional support, such as children, the elderly, or those with mobility issues. Current building standards mandate the installation of handrails on stairways with three or more risers.\n\nIt is strongly recommended to install a handrail on the exterior porch stairs to enhance safety and ensure compliance with current building standards. The handrail should be designed to be easily graspable and meet all relevant building codes and regulations, including:\n\nHeight Requirements: The handrail should be installed at a height that allows it to be easily and comfortably grasped by most users.\n\nGraspability: The handrail should have a shape and size that allows it to be firmly and securely held.\n\nThe inspector recommends the installation be completed by a licensed contractor.","sev":"major","choices":[]},{"id":"bfabe3b","type":"defect","title":"Loose Railing Component","text":"I observed a loose railing component.  This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"7ae3a80","type":"defect","title":"Guardrail Missing","text":"A deck is required to have a railing when over 30\u201d in height from grade to the floor of the deck.  Safety hazard.  A railing should be installed that meets current standards by a licensed contractor.","sev":"major","choices":[]},{"id":"3af68ab","type":"defect","title":"Balluster Damaged","text":"","sev":"moderate","choices":[]},{"id":"4eb85c3","type":"defect","title":"Stair Guard Opening Was Too Large (4 3/8\")","text":"I observed improper spacing between intermediate balusters, spindles and rails.  This is a safety hazard, especially for small children.\n\nGuardrails are required on open sides of stairways and should have intermediate rails that do not allow the passage of a sphere 4 3/8 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"4e91b6f","type":"defect","title":"Stair Guard Opening Was Too Large (6\")","text":"I observed improper spacing between intermediate balusters, spindles and rails.  This is a safety hazard, especially for small children.\n\nAnd opening at the guard on the open side of a stair formed by the riser, the tread and bottom rail of the guard should not allow the passage of a sphere 6 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"4b1ae8a","type":"defect","title":"Improper Guardrail Height (Not 36\")","text":"I observed indications of a defect related to the height of a guardrail.\n\nGuardrails are normally required to be 36 inches above standing surface next to the guardrail.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"1b79779","type":"defect","title":"Improper Stair Guardrail Height (Not 34\")","text":"I observed indications of a defect related to the height of a guardrail at the stairs.\n\nGuards on the open side of a stairway must be at least 34 inches in height above the walking surface or the line connecting the nosings of the stair treads.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"f1fcfb8","type":"defect","title":"Improper Handrail Height","text":"I observed indications of a defect related to the height of a railing.  Handrails are normally required to be 34 to 38 inches above the stair nosing on at least one side of all stairs with three or more risers.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"914c29d","type":"defect","title":"Handrail is Not Continuous","text":"I observed that the handrail is not continuous. It should be.\n\nHandrails for stairs must be continuous for the full length of the stairway.","sev":"moderate","choices":[]},{"id":"14dc37f","type":"defect","title":"Guardrail Not Installed To Current Standards","text":"The guardrail system currently in place does not meet current safety standards and is not adequately supported to handle expected lateral loads.\n\n1. Inadequate Support and Lateral Load Capacity:\n\nUpon inspection, it was observed that the deck guardrail lacked proper support, making it incapable of withstanding the lateral loads it may encounter. The guardrail appeared to be loosely attached and unstable, presenting a significant safety hazard to anyone using the deck.\n\n2. Non-Compliance with Current Standards:\n\nThe current deck guardrail does not meet the safety standards outlined by reputable building codes and organizations. The lack of proper support and stability can compromise the guardrail's ability to protect against falls, leading to potential injuries or accidents.\n\nDangers of an Unstable Guardrail System:\n\n1. Fall Hazards: An unsteady or poorly supported guardrail increases the risk of falls, especially for children, the elderly, or anyone leaning on the railing for support.\n\n2. Structural Failure: In the event of lateral loads, such as leaning or pressure from a person, the guardrail may fail, leading to the collapse of the deck or resulting in severe injuries.\n\n3. Legal and Insurance Concerns: Non-compliance with safety standards may lead to legal liabilities and insurance complications if an accident occurs on the property.\n\nCurrent Proper Construction Standards:\n\n1. Proper Support: The guardrail should be securely attached to the deck's structural framing using approved fasteners, ensuring it can handle both vertical and lateral loads without compromising its stability.\n\n2. Height Requirements: The guardrail's height should conform to local building codes, typically ranging from 36 to 42 inches, measured vertically from the deck surface.\n\n3. Baluster Spacing: The spacing between balusters or intermediate rails should not exceed 4 inches to prevent small children from getting stuck or slipping through.\n\n4. Post Placement: Posts supporting the guardrail should be spaced appropriately to provide sufficient structural integrity.\n\nRecommended Repair by a Licensed Deck Contractor:\n\nBased on the findings, it is strongly advised that the homeowner hires a licensed deck contractor to address the issues with the guardrail promptly. The contractor should:\n\n1. Inspect the Existing Guardrail: The deck contractor should thoroughly inspect the current guardrail system, identifying weaknesses and points of instability.\n\n2. Reinforce or Replace the Guardrail: The contractor should either reinforce the existing guardrail with proper support or replace it entirely, ensuring compliance with current safety standards.\n\n3. Ensure Code Compliance: During the repair process, the contractor should follow local building codes and industry best practices to create a safe and stable guardrail system.\n\nSources:\n\n1. International Code Council (ICC) - \"International Residential Code (IRC).\"\n\n2. The North American Deck and Railing Association (NADRA) - \"Deck Evaluation Checklist.\"","sev":"major","choices":[]}]},{"name":"Windows","c":[{"id":"c66aa16","type":"limit","title":"Inspection Restricted","text":"LMT - I did not inspect all windows. I did inspect a representative number of them. It's impossible to inspect every window component closely during a home inspection. A home inspection is not an exhaustive evaluation. I did not reach and access closely every window, particularly those above the first floor level.","sev":"minor","choices":[]},{"id":"9c14ab4","type":"defect","title":"Damaged Window Screen","text":"I observed a damaged window screen.  Screens can be repaired easily or most hardware stores offer a service to rebuild the screens.","sev":"minor","choices":[]},{"id":"1b4c4af","type":"info","title":"Windows Inspected","text":"A representative number of windows from the ground surface was inspected.","sev":"minor","choices":[]},{"id":"49e7c11","type":"defect","title":"Caulking Cracked and/ or Shrunk","text":"Caulking prevents water infiltration into the structure of the home.  Hidden damage could exist.  The inspector recomends caulking all joints around windows including transitions between windows and siding, windows and flashing, flashing and siding, and joints in the flashing itself.  Caulking should be an exterior grade premium silicone or siliconized acrylic caulk.  Old caulk should be removed before caulking.","sev":"minor","choices":[]},{"id":"1e167cc","type":"limit","title":"Window Screens Information","text":"EXCL - Window screens are not required to be reported on during a home inspection and their presence and/or condition is excluded from this inspection. If the window screens are of concern, it is recommended that you consult with the seller(s) as to their presence and condition.","sev":"minor","choices":[]},{"id":"c6ce8e9","type":"defect","title":"Fogged Windowpane","text":"I observed a fogged windowpane (a lost seal) at a window.\n\nIf multiple-pane windows appear misty or foggy, it means that the seal protecting the window assembly has failed, and condensation has formed in between the two panes of glass.  Condensation in double-paned windows indicates that the glazing assembly has failed and needs repair or replacement.  Visible condensation can damage glazing and is the main indication of sealant failure.  Condensation is not always visible.  If the failure is recent, a failed window may not be obvious, since condensation doesnt usually form until the window is heated by direct sunlight. Windows in the shade may show no evidence of failure, so it is nearly impossible to observe and report all failed double-paned windows.","sev":"minor","choices":[]},{"id":"93e79bd","type":"defect","title":"Paint Or Stain Is Peeling, Weathers, Cracked, Or Faded- Possible Lead Paint","text":"Due to the age of the home and the possibility of lead paint, care should be taken to seal the paint according to EPA standards.  A licensed contractor should encapsulate or abate the lead paint in order to prevent the spread of lead dust throughout the home.  Click Here to learn how the EPA recomends dealing with lead paint.","sev":"minor","choices":[]},{"id":"fc99e56","type":"defect","title":"Not Optimally Energy Efficient- Single Pane Windows","text":"Heating and cooling costs may be higher.  Consider upgrading to double-pane energy efficient windows.\n\nWindows can be one of your home\u2019s most attractive features. Windows provide views, daylighting, ventilation, and solar heating in the winter. Unfortunately, they can also account for up to 25% of your heating bill. During the summer, your air conditioner must work harder to cool hot air from sunny windows.\n\nEnergy-efficient windows may have two or more panes of glass, warm-edge spacers between the window panes, improved framing materials, and low-e coatings, which are microscopically thin coatings that help keep heat inside during the winter and outside during the summer.\n\nIf your home has single-pane windows, as many U.S. homes do, consider replacing them with new double-pane windows with high-performance low-e (low-emissivity) or spectrally selective glass. In colder climates, choose windows that are gas-filled with low-e coatings on the glass to reduce heat loss. In warmer climates, choose windows with spectrally selective coatings to reduce heat gain.\n\nIf you\u2019re building a new home, the higher cost of energy-efficient windows can actually be offset by allowing you to buy smaller, less expensive heating and cooling equipment. Install ENERGY STAR windows and use curtains and shade to give your air conditioner and energy bill a break. If you live in the Sun Belt, look into low-e windows, which can cut the cooling load by up to 15%.\n\nIf you decide not to replace your windows, the simpler, less costly measures listed here can improve their performance.\n\nCold-Climate Window Tips\n\nCold-climate windows keep heat in.\n\n\u2022 Double-pane windows with low-e coating on the glass reflect heat back into the room during the winter months.\n\n\u2022 During the cold winter months, you can use a heavy-duty, clear plastic sheet on a frame, or tape clear plastic film to the inside of your window frames. Remember, the plastic must be sealed tightly to the frame to help reduce air infiltration.\n\n\u2022 Install tight-fitting, insulating window shades on windows that feel drafty after weatherizing.\n\n\u2022 Close your curtains and shades at night.\n\n\u2022 Open your curtains during the day.\n\n\u2022 If you have windows located on the south side of your house, keep them clean so that they can let in the maximum amount of winter sun.\n\n\u2022 Install exterior or interior storm windows. Storm windows can reduce heat loss through the windows by 25% to 50%. Storm windows should have weatherstripping at all movable joints, be made of strong, durable materials, and have interlocking or overlapping joints. Low-e storm windows save even more energy.\n\n\u2022 Repair and weatherize your current storm windows, if necessary.\n\nWarm-Climate Window Tips\n\nWarm-climate windows keep heat out. In the summertime, the sun shining through your windows heats up the room. Windows with low-e coatings on the glass reflect some of the sunlight, keeping your rooms cooler.\n\nHere are some things you can do to keep comfortable.\n\n\u2022 Install white window shades, drapes or blinds to reflect heat away from the windows.\n\n\u2022 Close curtains on south- and west-facing windows during the day.\n\n\u2022 Install awnings on south- and west-facing windows.\n\n\u2022 Apply sun-control or other reflective films on south-facing windows to reduce solar gain.\n\nLong-Term Savings Tip\n\n\u2022 Installing high-performance windows will improve your home\u2019s energy performance. While it may take years for new windows to pay off in dollar-for-dollar energy savings, the benefits of added comfort and improved aesthetics and functionality make the investment worth it much sooner. Many window technologies are available that should be considered.\n\nShopping Tips for Windows\n\n\u2022 Look for the ENERGY STAR label.\n\n\u2022 Check with your local utility company to see if any rebates or other financial incentives are available for window replacement.\n\n\u2022 High-performance windows have at least two panes of glass and a low-e coating, so make sure the windows you choose have these features, and not just a claim or label that says \u201chigh-performance.\u201d\n\n\u2022 The U-factor for windows is similar to the R-rating for insulation. The U-factor measures the rate of heat transfer and tells you how well the window insulates. The lower the U-factor, the better the insulation. In colder climates, focus on finding windows with a low U-factor.\n\n\u2022 Low solar heat-gain coefficients (SHGCs) reduce heat gain. In warm climates, look for a low SHGC.\n\n\u2022 In temperate climates with both heating and cooling seasons, select windows with both low U-factors and low SHGCs to maximize energy savings.\n\n\u2022 Look for whole-unit U-factors and SHGCs, rather than center-of-glass (or COG) U-factors and SHGCs. Whole-unit numbers more accurately reflect the energy performance of the entire product.\n\n\u2022 Have your windows installed by trained professionals. Be sure they\u2019re installed according to the manufacturer\u2019s instructions; otherwise, your warranty may be voided.","sev":"moderate","choices":[]},{"id":"ed66a44","type":"defect","title":"Cracked Windowpane","text":"I observed a cracked glass windowpane.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"dc2b626","type":"defect","title":"Caulk Missing","text":"Caulking prevents water infiltration into the structure of the home.  Hidden damage could exist.  The inspector recomends caulking all joints around windows including transitions between windows and siding, windows and flashing, flashing and siding, and joints in the flashing itself.  Caulking should be an exterior grade premium silicone or siliconized acrylic caulk.  Old caulk should be removed before caulking.","sev":"minor","choices":[]},{"id":"a73fd37","type":"defect","title":"Missing Window Screen","text":"I observed a missing window screen.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"f38fab3","type":"defect","title":"Window Hardware Missing or Damaged","text":"With insufficient hardware, it is difficult or impossible to properly open the window.  Replacement of the hardware is recomended.","sev":"minor","choices":[]},{"id":"a561228","type":"defect","title":"Window Sill and/or Trim Is Rotted","text":"The wood around the window is rotted and not protected.  Further evaluation, estimates, and repair by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"e7b03fb","type":"defect","title":"Installation Doesn\u2019t Meet Current Professionaly Acceptable Standards","text":"The basement window was not properly installed.  Flashing was not installed and the wood was not properly protected.  Installation of the window should be evaluated and repairs made by a licensed contractor.","sev":"moderate","choices":[]},{"id":"e25edfd","type":"defect","title":"Flashing Is Missing","text":"Without flashing the water is not diverted away from areas where moisture intrusion could occur.  Hidden damage may exist.  Repair or replacement of the flashing by a licensed contractor is recomended.","sev":"minor","choices":[]},{"id":"9453982","type":"defect","title":"Glass Pane Missing","text":"The glass pane was missing, replacement is necessary.","sev":"minor","choices":[]},{"id":"47bd193","type":"defect","title":"Window(s) Operates Hards","text":"Window(s) were hard to open and close.  This can be a safety issue in the event of an egress emergency.  Lubrication of the window hardware may alleviate the issue.  If lubrication does not work hardware or the entire window unit may have to be replaced.","sev":"moderate","choices":[]},{"id":"bf90fcc","type":"defect","title":"Glazing Putty Deteriorated","text":"Deteriorated glazing putty will allow moisture intrusion into the structure and could damage the frame of the window.  The inspector recomends re-glazing the window.  Click here for more information of how to re-glaze the window.","sev":"moderate","choices":[]},{"id":"b1fd870","type":"defect","title":"Wood Rot at Window","text":"I observed indications of wood rot at the window.  This rot is not\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"5e26ecf","type":"defect","title":"Window Shows Signs Of Microbial Growth","text":"Microbial growth will worsen overtime, however this is not normally considered a health issues as it presented itself at the time of the inspection.  Suggest removing the effected caulk and clean the area with specialized mold cleaning agent such as Concrobium.   Replace the caulk with a mold resistant caulk.","sev":"minor","choices":[]},{"id":"c42b688","type":"defect","title":"Egress Is Lacking Or Restricted","text":"Any room used for sleeping purposes requires an emergency means of exit meeting current standards.  The egress should exit to the exterior of the home and meet the standards in the below diagram.  This room should not be used as a bedroom unless proper egress is installed.","sev":"major","choices":[]},{"id":"b61c168","type":"defect","title":"Flashing Is Damaged","text":"Damaged flashing is a conducive condition for moisture penetration and could possibly cause damage.  Repair or replacement of the flashing by a licensed contractor is recomended.","sev":"minor","choices":[]},{"id":"6db0408","type":"defect","title":"Weatherstripping Pulling Loose","text":"The weather stripping is pulling loose causing the window to open hard.  This can cause issues of egress and diminish the energy efficiency of the window.  Repair the weatherstripping","sev":"minor","choices":[]},{"id":"46d9a2c","type":"defect","title":"Window Not Operational Because It Was Painted Shut","text":"This could prevent exit in an emergency.  Strip the paint so that the window can move within its frame or have the window replaced to meet current standards.","sev":"minor","choices":[]},{"id":"c57f29f","type":"defect","title":"Window Frame Is Out Of Square","text":"An out of square frame can make the window difficult to open.  This could be a sign that hidden damage exists, such as a rotted window sill or structural issue.  Further evaluation and repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"093d030","type":"defect","title":"Lack Of Weeping Holes","text":"Water will be trapped between the frames causing damage.  Further evaluation by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"d3ee32e","type":"defect","title":"Lift Mechanism Is Damaged","text":"While the window was operational at the time of inspection a part of the mechanism was loose causing the window to fall when unlocked.  This could cause injury and is a serious danger to children.  Repair or replace the lift mechanism or window.  Work should be performed by a licensed contractor.","sev":"major","choices":[]},{"id":"0715fe8","type":"defect","title":"Possible Insect Damage Observed","text":"Possible evidence of insect damage was observed.  Further evaluation by a pest control company and a licensed contractor should be made before your Inspection Objection Deadline.","sev":"moderate","choices":[]},{"id":"4330b2b","type":"defect","title":"Tempered Safety Glass and Fixed Barricades Not Present","text":"In dwelling units where the opening of an operable window is located more than 72\" above the finished grade and the lowest part of the clear opening of the window is less than 24\" off the finished floor.  The glazing if the window must be made if Tempered Safety Glass and the opening shall have a guard rail installed that will not allow a 4\" sphere to pass.  Repair by a licensed contractor to meet current standards.","sev":"major","choices":[]},{"id":"9e6817f","type":"defect","title":"Observed Water Stain On Window Sill","text":"A visible water stain may imply moisture intrusion which, if not corrected, may cause damage.  Monitor for continued signs of moisture intrusion.  If moisture intrusion is evident, have window repaired by a licensed contractor.","sev":"moderate","choices":[]},{"id":"9476f67","type":"defect","title":"Window Sill- Improper Slope","text":"The window sill slopes back toward the window.  This can allow moisture to penetrate under the window.  This could cause moisture intrusion into the structure.    Hidden damage may exist.  Further evaluation and repair by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"98ed0b8","type":"defect","title":"Window Will Not Lock","text":"The window won\u2019t lock.  This is a security concern.  The Inspector recomends adjustment of the lock or window to allow for easy operation of the locking hardware.","sev":"minor","choices":[]},{"id":"36414ef","type":"info","title":"Window Material","text":"","sev":"minor","choices":["Wood","Aluminum","Vinyl"]},{"id":"c31db85","type":"defect","title":"Window Actively Leaking","text":"The window was observed to be actively leaking.  The cause is unknown, however a lack of caulking was observed. Further evaluation by a licensed contractor to determine if any water damage exists and repair of the underlying cause is recomended.","sev":"major","choices":[]},{"id":"b3035db","type":"defect","title":"Window Well Cover Broke","text":"The window well cover is broke, this could allow moisture into the window well.  While this area is traditionally drained, the drain may be clogged or not present.  Replacement of the window well cover is recomended.","sev":"minor","choices":[]},{"id":"b6c7cee","type":"info","title":"Glass Type","text":"","sev":"minor","choices":["Single Pane","Double Pane","Triple Pane"]},{"id":"1d36073","type":"info","title":"Your Job As A Homeowner","text":"Window caulking needs to be inspected annually for cracks or shrinkage.  If caulking is cracked or shrunk water can infiltrate the structure causing damage.","sev":"minor","choices":[]}]},{"name":"Exterior Doors","c":[{"id":"759933c","type":"info","title":"Exterior Doors Inspected","text":"I inspected the exterior doors.","sev":"minor","choices":[]},{"id":"e87e4eb","type":"defect","title":"Exterior Door- Wood Rot","text":"The brickmold surrounding the exterior door was noted to have water damage or rot.  Wood rot is a condition caused by the prolonged exposure of wood to moisture, resulting in the deterioration of its fibers and structural integrity.\n\nThe brickmold plays a vital role in providing weather resistance to the door, creating a barrier between the door frame and the exterior wall sheeting.\n\nRecommenation\n\nIt is recommended a qualified door contractor replace the damaged trim.","sev":"minor","choices":[]},{"id":"a2f2cbd","type":"defect","title":"Weatherseal Damaged","text":"The door weatherseal was damaged.  This can lead to higher utility bills.  Replacement is recommended.","sev":"minor","choices":[]},{"id":"925593d","type":"defect","title":"Storm Door Hardware Broken/ Missing","text":"","sev":"moderate","choices":[]},{"id":"75b2975","type":"defect","title":"Doorbell Does Not Ring","text":"I observed wood rot at the exterior door.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"d8c1df4","type":"defect","title":"Storm Door Damaged","text":"","sev":"minor","choices":[]},{"id":"19a369b","type":"defect","title":"Exterior Door Surface in Poor Condiion","text":"I observed that the surface of the exterior door was in poor condition.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"cb634e1","type":"defect","title":"Screen Door Defect","text":"I observed a defect at the screen door.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"28dea96","type":"defect","title":"Door Jamb Cracked","text":"The jamb is cracked and could compromise the security of the door.  A licensed contractor should replace the door jamb.","sev":"minor","choices":[]},{"id":"e07be75","type":"defect","title":"Door Latches Hard","text":"Could prevent escape in an emergency, door doesn't stay shut without the use of the deadbolt.  Adjustment to allow the door to latch.","sev":"minor","choices":[]},{"id":"b9215c8","type":"defect","title":"Door Lock Inopperable.","text":"The door lock/ deadbolt will not operate at the same time on multiple doors in the home.  This can be a security issue.  Repair or adjustment of the door is recommended.","sev":"minor","choices":[]},{"id":"2aed03d","type":"defect","title":"Door Hardware Damaged","text":"I observed damage at the exterior door hardware.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"9d72bae","type":"defect","title":"Binding","text":"Door will not operate properly.  Adjustment of the door is recommended.","sev":"minor","choices":[]},{"id":"ffa560c","type":"defect","title":"Caulking Cracked Or Shrunk","text":"Caulking that has cracked or shrunk can cause moisture intrusion and damaged to the structure.  Caulking that has cracked or shrunk can cause moisture intrusion and damaged to the structure.","sev":"minor","choices":[]},{"id":"43113be","type":"defect","title":"Head Flashing Missing","text":"Head flashing above the door directs water away from the top of the door.  Rot was noticed due to the lack of flashing.  Installation of flashing by a licensed contractor is recommended.","sev":"major","choices":[]},{"id":"67405e8","type":"defect","title":"Threshold Flashing Is Missing Under Door","text":"Threshold flashing is important to keep water from backing up underneath the door causing rot and water damage to the surrounding structure.  Installation will include removing and resetting the door.  Repair by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"f43998a","type":"defect","title":"Weatherstripping Improperly Installed","text":"The weatherstripping on the front door was improperly installed.  This could lead to high energy bills.  Repair by a door contractor is recommended.","sev":"minor","choices":[]},{"id":"84517ff","type":"defect","title":"Door Tread Defect","text":"I observed a defect at the door tread.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"f1250cb","type":"info","title":"Exterior Door Material","text":"","sev":"minor","choices":["Wood","Fiberglass","Vinyl","Steel","Aluminum"]},{"id":"f74984c","type":"defect","title":"Slider Door Defect","text":"I observed indications of a defect at the slider door.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"cad42e6","type":"defect","title":"Door Sweep is Damaged","text":"The door will not seal properly, increasing energy costs.  Replace door sweep.","sev":"minor","choices":[]},{"id":"82a5492","type":"defect","title":"Door Threshold Damaged","text":"The door threshold keeps rain and pests from entering the building.  Replacement of the threshold by a licensed contractor is recommended.","sev":"minor","choices":[]},{"id":"6a5ca3e","type":"defect","title":"Window Seals Broken","text":"This may effect the energy efficiency of the windows.  Cosmetic.  Have evaluated by a licensed contractor, the door may need to be replaced.","sev":"minor","choices":[]},{"id":"04f9804","type":"defect","title":"Door Not Fire Resistant","text":"The door leading from the garage to the home should be fire rated to prevent the spread of fire from the garage to the home.  The door doesn't meet current standards.  This is a safety hazard.  Replacement is recomended.","sev":"major","choices":[]},{"id":"2677e26","type":"defect","title":"Door Jamb Not Protected from Weather","text":"","sev":"minor","choices":[]}]},{"name":"Exhaust Hoods","c":[{"id":"142439b","type":"limit","title":"Unidentified Hoods","text":"I observed some exterior exhaust hoods, but I was unable to identify them as to what their purpose was.","sev":"minor","choices":[]},{"id":"a71de67","type":"defect","title":"Damaged Exhaust Hood","text":"I observed an exhaust hood that was damaged.","sev":"minor","choices":[]},{"id":"d03a277","type":"defect","title":"Missing Exhaust Hood","text":"I observed an exhaust hood that was missing.","sev":"minor","choices":[]},{"id":"467dbb4","type":"defect","title":"Clogged Dryer Exhaust Hood","text":"I observed an exhaust hood that seemed to be connected to the clothes dryer, and it was clogged. Fire hazard.","sev":"moderate","choices":[]},{"id":"451818d","type":"defect","title":"Loose Exhaust Hood","text":"I observed an exhaust hood that was loose.","sev":"minor","choices":[]},{"id":"95d6206","type":"defect","title":"Dryer Exhaust Hood Has a Screen","text":"I observed that the clothes dryer exhaust hood has a screen. This will clog and create a fire hazard.","sev":"moderate","choices":[]},{"id":"509de4f","type":"defect","title":"Inadequate Clearance","text":"I observed indications that the exhaust hood or exhaust duct outlet vent had inadequate clearance from an air inlet.\n\nThe hood at the exterior of the home should be at least 10 feet away from any air inlet.\n\nThe wall cap should include a damper that closes when the fan is not exhausting. The wall cap may come with a screen or grille to keep out birds and other animals. The exhaust air should not be directed onto a walkway.","sev":"moderate","choices":[]}]},{"name":"Fence and Gates","c":[{"id":"f4e51ca","type":"defect","title":"Fence Leaning","text":"A leaning fence could cause injury or property damage if it fails.  Repair is recommended.","sev":"minor","choices":[]},{"id":"dbbff1f","type":"info","title":"Not Fully Inspected","text":"Fencing is not part of the scope of a general inspection and falls outside of the InterNACHI Standards Of Practice for a general home inspection.  Comments in this section are only general observations, the system was not fully inspected.","sev":"minor","choices":[]},{"id":"9db5c3d","type":"limit","title":"Fence: Fences Not Inspected","text":"EXCL - A fence was present at the home. Fences and gates are not inspected per the standards of practice, and the fence's condition is excluded from this inspection. Any comments made in relation to the fence should be viewed as a courtesy, and not be construed as an all-inclusive listing of deficiencies present.","sev":"minor","choices":[]}]}]},{"name":"Carport","subs":[{"name":"Roof at Carport","c":[{"id":"4f1770d","type":"defect","title":"Black Staining and/ or Algae or Moss was observed on the roof.","text":"Black staining is caused be an algae which is growing within the shingle substrate and feeding on the gypsum filler used in shingle manufacturing.  The Moss and algae will damage the shingle structure and reduce the life of the shingle.  Cleaners are available at home centers that can be used to remove the growth.  For areas with heavier growth a soft bristled brush can be used to remove the growth.  Copper flashing can also be installed at the ridge of the roof.  The chemicals in the copper will help to prevent the growth.  Click Here for more information on cleaning your roof.","sev":"minor","choices":[]},{"id":"66b1ad3","type":"limit","title":"Unable to Walk Upon Roof Surface","text":"LMT - According to the Home Inspection Standards of Practice, a home inspector is not required to walk upon any roof surface.  However, as courtesy only, I attempted to walk upon the roof surface, but was unable.  It was not safe.  It was not accessible.  This was a restriction to my inspection of the roof system.  You may want to consider hiring a professional roofer with a lift to check your roof system.","sev":"minor","choices":[]},{"id":"1643d88","type":"info","title":"Homeowner's Responsibility","text":"Your job as the homeowner is to monitor the roof covering because any roof can leak. To monitor a roof that is inaccessible or that cannot be walked on safely, use binoculars. Look for deteriorating or loosening of flashing, signs of damage to the roof covering and debris that can clog valleys and gutters.\n\nRoofs are designed to be water-resistant. Roofs are not designed to be waterproof. Eventually, the roof system will leak. No one can predict when, where or how a roof will leak.","sev":"minor","choices":[]},{"id":"d41e038","type":"limit","title":"Snow Covering the Roof","text":"LMT - There was snow covering the roof surface.  This was an inspection restriction.  I was unable to observe everything that I needed to see, because of the snow.  Recommend further evaluation at a later date when the snow has melted.","sev":"minor","choices":[]},{"id":"839b5e0","type":"defect","title":"Cracked Roof-Covering Material","text":"I observed cracked and damaged shingles.  Prone to leaking.  Correction and further evaluation by a professional roofer is recommended.","sev":"moderate","choices":[]},{"id":"df304a7","type":"info","title":"Carport Roof Was Inspected","text":"I attempted to inspect the roof from various locations and methods, including from the ground and a ladder.\n\nThe inspection was not an exhaustive inspection of every installation detail of the roof system according to the manufacturer's specifications or construction codes.  It is virtually impossible to detect a leak except as it is occurring or by specific water tests, which are beyond the scope of our inspection.  We recommend that you ask the sellers to disclose information about the roof, and that you include comprehensive roof coverage in your home insurance policy.","sev":"minor","choices":["Ground","Ladder","Roof","Drone"]},{"id":"be8e743","type":"defect","title":"Missing Roof-Covering Material","text":"I observed missing roof-covering material.  Prone to leaking.  Correction and further evaluation by a roofing professional is recommended.","sev":"moderate","choices":[]},{"id":"2b7e6ff","type":"info","title":"Type of Roof-Covering Described","text":"I observed the roof-covering material and attempted to identify its type.\n\nThis inspection is not a guarantee that a roof leak in the future will not happen. Roofs leak.  Even a roof that appears to be in good, functional condition will leak under certain circumstances. We will not take responsibility for a roof leak that happens in the future.  This is not a warranty or guarantee of the roof system.","sev":"minor","choices":["Asphalt","Flat Roof Material","Tile","Concrete","Slate","Wood","Metal","Unidentified"]},{"id":"872dd81","type":"defect","title":"Improper Fastening of Roof Covering","text":"I observed improper fastening at the roof-covering materials.  Prone to leaking.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"4de8342","type":"info","title":"Estimated Age of Roof Covering","text":"The exact age of the observed roof-covering materials was undetermined.  I guessed the age as a courtesy for you.  Please ask the owner or seller about actual, documented age of the roof, its past performance, history of problems, and roof warranties.","sev":"minor","choices":[]},{"id":"2d4e1c8","type":"defect","title":"Delamination","text":"The asphalt shingle roof shows signs of delamination.  Delamination is separation of the surface layer of asphalt.  Recommend a qualified roofing contractor evaluate and repair to prevent further deterioration that results in leaking and moisture intrusion.","sev":"moderate","choices":[]},{"id":"e0bbbbd","type":"defect","title":"Discoloration Stain from Algae","text":"I observed indications of staining and discoloration on the roof-covering materials.  This condition seemed to be caused from algae.  What we commonly call algae is actually not algae, but a type of bacteria capable of photosynthesis. Algae appears as dark streaks, which are actually the dark sheaths produced by the organisms to protect themselves from UV radiation. When environmental conditions are right, the problem can spread quickly across a roof.\n\nAlgae attaches itself to the shingle by secreting a substance that bonds it tightly to the surface. Growth can be difficult to remove without damaging the roof. The best method is prevention. Algae stains can sometimes be lightened in color by using special cleaners.\n\nPower-washing and heavy scrubbing may loosen or dislodge granules. Chemicals used for cleaning shingles may damage landscaping. Also, the cleaning process makes the roof wet and slippery, so such work should be performed by a qualified professional.","sev":"minor","choices":[]},{"id":"cc77a0f","type":"defect","title":"Ponding","text":"I observed indications of ponding in one or more areas of roof.  Ponding or puddling of water concentrated in a particular area of the roof can lead to the deterioration and the roof leaking water.  Recommend a qualified roofing contractor evaluate further and make any repairs deemed necessary.","sev":"moderate","choices":[]},{"id":"b658ffb","type":"defect","title":"Missing Roof-Covering Materials","text":"I observed areas of missing roof-covering materials.  This is a major defect.  Prone to water leaking into the house.  I recommend that a qualified roofing contractor to further evaluate and make repairs to the roof system,.","sev":"moderate","choices":[]},{"id":"cb12856","type":"defect","title":"Splitting","text":"I observed indications of splitting or cracking of the roof-covering material.  This is a major defect.  Prone to water leaking into the house.  I recommend that a qualified roofing contractor to further evaluate and make repairs to the roof system,.","sev":"moderate","choices":[]},{"id":"fb393eb","type":"defect","title":"Tiles Cracked and Damaged","text":"I observed areas of cracked and damaged roof-covering materials.  This is a major defect.  Prone to water leaking into the house.  I recommend that a qualified roofing contractor to further evaluate and make repairs to the roof system,.","sev":"moderate","choices":[]},{"id":"778471d","type":"defect","title":"Material Defect Observed","text":"Material Defect.  A material defect was observed.  According to the InterNACHI Home Inspection Standards of Practice, a material defect is a specific issue with a system or component of a residential property that may have a significant, adverse impact on the value of the property, or that poses an unreasonable risk to people.  The fact that a system or component is near, at, or beyond the end of its normal, useful life is not, in itself, a material defect.","sev":"major","choices":[]},{"id":"42d7e6e","type":"defect","title":"Roof Structural Defect Observed","text":"From a readily accessible area, I observed a major structural defect related to the general roof structure.  Major defect.  Correction and further evaluation is recommended.","sev":"moderate","choices":[]}]},{"name":"Floor Surface of Carport","c":[{"id":"c74c934","type":"defect","title":"Floor Surface is Not Noncombustible","text":"I observed indications that the carport floor surface is not of an approved noncombustible material. It must be made of noncombustible material.\n\nAsphalt surfaces are permitted at ground level in carports.","sev":"moderate","choices":[]},{"id":"8eb69ab","type":"info","title":"Carport Floor Inspected","text":"I inspected the floor of the carport.","sev":"minor","choices":[]},{"id":"197abf6","type":"defect"

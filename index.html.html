"choices":[]},{"id":"b3dc171","type":"limit","title":"Couldn't Reach Chimney","text":"LMT - I could not reach the chimney closely. There was an inspection restriction. I did my best to inspect from my location and point of observation from a distance. I could not see everything, including possibly some defects.","sev":"minor","choices":[]},{"id":"c9c80a6","type":"defect","title":"Chimney Rain Cap- Damaged","text":"I observed damage at the chimney rain cap. The rain cap covers the top opening of the chimney flue liner. Without a proper cap water can infiltrate into the chimney.\n\nThe cap performs the following functions:\n\n\u2022 Prevents rain, snow, and sleet from entering the chimney flue.\n\n\u2022 Protects the masonry and flue liner from moisture damage, rust, and cracking.\n\n\u2022 Acts as a barrier against birds, squirrels, raccoons, and other critters.\n\n\u2022 Stops leaves, twigs, and other debris from clogging the flue and causing fire hazards\n\n\u2022 Helps deflect wind to prevent cold air and smoke from blowing back into your home.\n\n\u2022 Improves draft efficiency, making your fireplace safer and more comfortable.\n\n\u2022 Contains sparks and embers, reducing the risk of roof fires.\n\n\u2022 Keeps flammable debris out of the chimney, lowering the chance of chimney fires\n\n\u2022 Shields the chimney crown and flue liner from weathering and erosion.\n\n\u2022 Reduces long-term maintenance costs and prolongs the life of your chimney system\n\nCorrective steps\n\nThe inspector recommends installation of a proper chimney cap by a qualified contactor.","sev":"moderate","choices":[]},{"id":"d75f5c2","type":"info","title":"Factory-Built Chimney Hood or Cap Installed","text":"A hood or cap was installed at the masonry chimney.  Good.\n\nMasonry chimneys without hoods should have stone or reinforced concrete caps at the top.  Some masonry chimneys have hoods over the flues.  Hoods on masonry chimneys consist of stone or reinforced concrete caps supported on short masonry columns at the perimeter of chimney tops, or sheet metal caps supported on short sheet metal columns.","sev":"minor","choices":[]},{"id":"7f9d919","type":"defect","title":"Chimney Rain Cap- Missing","text":"A factory-built chimney was found without a rain cap during the inspection. The rain cap covers the top opening of the chimney flue liner.\n\nThe cap performs the following functions:\n\n\u2022 Prevents rain, snow, and sleet from entering the chimney flue.\n\n\u2022 Protects the masonry and flue liner from moisture damage, rust, and cracking.\n\n\u2022 Acts as a barrier against birds, squirrels, raccoons, and other critters.\n\n\u2022 Stops leaves, twigs, and other debris from clogging the flue and causing fire hazards\n\n\u2022 Helps deflect wind to prevent cold air and smoke from blowing back into your home.\n\n\u2022 Improves draft efficiency, making your fireplace safer and more comfortable.\n\n\u2022 Contains sparks and embers, reducing the risk of roof fires.\n\n\u2022 Keeps flammable debris out of the chimney, lowering the chance of chimney fires\n\n\u2022 Shields the chimney crown and flue liner from weathering and erosion.\n\n\u2022 Reduces long-term maintenance costs and prolongs the life of your chimney system\n\nCorrective steps\n\nThe inspector recommends installation of a proper chimney rain cap by a qualified contractor.","sev":"moderate","choices":[]},{"id":"9a8659d","type":"defect","title":"Crowned Cap- Damaged","text":"I observed indications of damage at the chimney wash or crowned cap. This is the top of the chimney that is shaped or \"crowned\" to divert water away from the top of the chimney stack.\n\nIf a wash or crown on top of the chimney is not properly sloped or is extensively cracked, defective, spalled, or displays rust stains, it should be replaced. Sheet metal caps/crowns with minor rust or corrosion should be repaired, but if rust or corrosion is extensive, replacement is recommended.","sev":"moderate","choices":[]},{"id":"c3a7ec3","type":"defect","title":"Crowned Cap Defect","text":"I observed indications of a defect at the chimney crowned cap.\n\nThe chimney crowned cap covers the top of the chimneystack.","sev":"moderate","choices":[]},{"id":"e10dcec","type":"defect","title":"Crowned Cap Not Diverting Water Away","text":"I observed that the chimney crown cap was not diverting water away.\n\nThe chimney crown cap should provide a downward slope that will direct water from the flue to the edge of the cap. The crown should be formed or \"crowned\" so as to shed water. This crown is not diverting water away from the top of the chimney stack.","sev":"moderate","choices":[]},{"id":"fe7ed98","type":"defect","title":"Creosote at Chimney Screen - Fire Hazard","text":"I observed indications of soot and creosote at the chimney spark screen.  Creosote in this area is a fire hazard.\n\nMetal spark screens are sometimes used on wood and coal-burning fireplace chimneys.  Maintain the condition and fit of spark screens.  Dirty or clogged screens adversely affect draft and could be a fire hazard.","sev":"moderate","choices":[]},{"id":"c8090ab","type":"defect","title":"Missing Drip Edge at Crowned Cap","text":"I observed indications of a missing drip edge at the chimney crowned cap area.\n\nThere should be a drip edge installed at the chimney crowned cap. By directing the runoff from the crowned cap away from the chimney, the overhanging drip edge helps prevent water from damaging the exterior of the chimneys exterior vertical surfaces.","sev":"moderate","choices":[]},{"id":"1a22c6b","type":"defect","title":"Missing Interior Flue Liner","text":"I observed a missing interior flue liner at the chimney.\n\nAll chimney stacks require a flue liner.  This is a fire hazard and a material defect, as defined by the Home Inspection Standards of Practice.","sev":"major","choices":[]},{"id":"d62c23f","type":"defect","title":"Chimney Stack Too Short","text":"I observed indications that the chimney stack appeared to be too short.","sev":"moderate","choices":[]},{"id":"305ef74","type":"defect","title":"Flue Liner Not Extended High Enough","text":"I observed indications that the flue liner did not extend high enough.\n\nFlues should extend a minimum of 4 inches above the top of a masonry chimney.","sev":"moderate","choices":[]},{"id":"79f722a","type":"defect","title":"Loose Interior Flue Liner","text":"I observed indications of loose components of the chimney interior flue liner. Fire hazard.","sev":"major","choices":[]},{"id":"904ee0e","type":"defect","title":"Material Defect Observed","text":"I observed indications of a material defect at the chimney.\n\nAccording to the InterNACHI Home Inspection Standards of Practice, a material defect is a specific issue with a system or component of a residential property that may have a significant, adverse impact on the value of the property, or that poses an unreasonable risk to people.  The fact that a system or component is near, at, or beyond the end of its normal, useful life is not, in itself, a material defect.","sev":"major","choices":[]},{"id":"de07051","type":"defect","title":"Defect at Chimney Exterior","text":"I am deserved indications of a defect at the chimney exterior materials. Prone to water penetration.","sev":"moderate","choices":[]}]},{"name":"Heating System Masonry Chimney","c":[{"id":"e4e6e4f","type":"limit","title":"Chimney Interior is Beyond the Scope","text":"LMT - Inspecting the chimney interior and flue is beyond the scope of a home inspection.  An inspector is not required to inspect the flue or vent system, and is not required to inspect the interior of chimneys or flues, fire doors or screens, seals or gaskets, or mantels.  Out of courtesy only, the inspector may take a look at readily accessible and visible parts of the chimney flue.","sev":"minor","choices":[]},{"id":"ac93df4","type":"info","title":"Heating Chimney Exterior Was Inspected","text":"The chimney exterior was inspected during my home inspection.","sev":"minor","choices":[]},{"id":"098ac34","type":"defect","title":"Chimney Flashing Defect","text":"I observed a defect at the chimney flashing. Prone to water leaking at this area.  Hidden damage may exist.  Further review and repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"e750a16","type":"defect","title":"Chimney Rain Cap Damaged","text":"I observed damage at the chimney rain cap.\n\nThe rain cap covers the top opening of the chimney flue liner.","sev":"moderate","choices":[]},{"id":"6a53009","type":"info","title":"Heating Chimney Flashing Was Inspected","text":"I inspected for flashing installed at the chimney.\n\nFlashing is installed in areas where the chimney stack meets another system or component of the house.  And the flashing is supposed to divert water away from those areas to prevent water intrusion.","sev":"minor","choices":[]},{"id":"f627cd1","type":"limit","title":"Couldn't Reach Chimney","text":"LMT - I could not reach the chimney closely. There was an inspection restriction. I did my best to inspect from my location and point of observation from a distance. I could not see everything, including possibly some defects.","sev":"minor","choices":[]},{"id":"eab0d7a","type":"defect","title":"Chimney Rain Cap Defect","text":"I observed indications of a defect at the chimney rain cap.\n\nThe rain cap covers the top opening of the chimney flue liner.","sev":"moderate","choices":[]},{"id":"f4a988b","type":"info","title":"Heating Chimney Hood or Cap Installed","text":"A hood or cap was installed at the masonry chimney.  Good.\n\nMasonry chimneys without hoods should have stone or reinforced concrete caps at the top.  Some masonry chimneys have hoods over the flues.  Hoods on masonry chimneys consist of stone or reinforced concrete caps supported on short masonry columns at the perimeter of chimney tops, or sheet metal caps supported on short sheet metal columns.","sev":"minor","choices":[]},{"id":"051a676","type":"defect","title":"Chimney Rain Cap Missing","text":"I observed a missing chimney rain cap.\n\nThe rain cap covers the top opening of the chimney flue liner.","sev":"moderate","choices":[]},{"id":"31f2e9e","type":"defect","title":"Crowned Cap Was Damaged","text":"I observed indications of damage at the chimney wash or crowned cap. This is the top of the chimney that is shaped or \"crowned\" to divert water away from the top of the chimney stack.\n\nIf a wash or crown on top of the chimney is not properly sloped or is extensively cracked, defective, spalled, or displays rust stains, it should be replaced. Sheet metal caps/crowns with minor rust or corrosion should be repaired, but if rust or corrosion is extensive, replacement is recommended.","sev":"moderate","choices":[]},{"id":"97b848b","type":"defect","title":"Crowned Cap Defect","text":"I observed indications of a defect at the chimney crowned cap.\n\nThis is the top of the chimney that is shaped or \"crowned\" to divert water away from the top of the chimney stack.","sev":"moderate","choices":[]},{"id":"cbc5e1a","type":"defect","title":"Crowned Cap Not Diverting Water Away","text":"I observed that the chimney crown cap was not diverting water away.\n\nThe chimney crown cap should provide a downward slope that will direct water from the flue to the edge of the cap. The crown should be formed or \"crowned\" so as to shed water. This crown is not diverting water away from the top of the chimney stack.  Hidden damage may exist.\n\nFurther review of the area and repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"2daeb55","type":"defect","title":"Creosote at Chimney Screen - Fire Hazard","text":"I observed indications of soot and creosote at the chimney spark screen.  Creosote in this area is a fire hazard.\n\nMetal spark screens are sometimes used on wood and coal-burning fireplace chimneys.  Maintain the condition and fit of spark screens.  Dirty or clogged screens adversely affect draft and could be a fire hazard.\n\nRecommend cleaning and further inspection by a CSIA certified chimney sweep (Find One Here).","sev":"moderate","choices":[]},{"id":"99114c7","type":"defect","title":"Missing Drip Edge at Crowned Cap","text":"I observed indications of a missing drip edge at the chimney crowned cap area.\n\nThere should be a drip edge installed at the chimney crowned cap. By directing the runoff from the crowned cap away from the chimney, the overhanging drip edge helps prevent water from damaging the exterior of the chimneys exterior vertical surfaces.","sev":"moderate","choices":[]},{"id":"64998cc","type":"defect","title":"Missing Interior Flue Liner","text":"I observed a missing interior flue liner at the chimney.\n\nAll chimney stacks require a flue liner.  This is a fire hazard and a material defect.  Further review and repair by a licensed contractor is recomended.","sev":"major","choices":[]},{"id":"e1312c1","type":"defect","title":"Water Deterioration of Interior Flue Liner","text":"I observed a water damage and deterioration apparently caused by moisture intrusion and condensation.   Hidden damage may exist.  Further review and repair by a licensed contractor is recomended.","sev":"major","choices":[]},{"id":"24dd5c9","type":"defect","title":"Chimney Clearance Defect 3-2-10","text":"I observed indications of inadequate clearances for the masonry chimney stack. The 3-2-10 Rule for masonry chimneys states that a masonry chimney should extend at least 3 feet above the highest point where the chimney passes through the roof, and 2 feet above any portion of a building that is within a 10-foot distance horizontally.","sev":"moderate","choices":[]},{"id":"f894f21","type":"defect","title":"Chimney Stack Too Short","text":"I observed indications that the chimney stack appeared to be too short.  The 3-2-10 Rule for masonry chimneys states that a masonry chimney should extend at least 3 feet above the highest point where the chimney passes through the roof, and 2 feet above any portion of a building that is within a 10-foot distance horizontally.","sev":"moderate","choices":[]},{"id":"532c570","type":"defect","title":"Flue Liner Not Extended High Enough","text":"I observed indications that the flue liner did not extend high enough.\n\nFlues should extend a minimum of 4 inches above the top of a masonry chimney.","sev":"moderate","choices":[]},{"id":"ab0ebef","type":"defect","title":"Loose Interior Flue Liner","text":"I observed indications of loose components of the chimney interior flue liner. Fire hazard.","sev":"major","choices":[]},{"id":"28e76a9","type":"defect","title":"Material Defect Observed","text":"I observed indications of a material defect at the chimney.\n\nAccording to the InterNACHI Home Inspection Standards of Practice, a material defect is a specific issue with a system or component of a residential property that may have a significant, adverse impact on the value of the property, or that poses an unreasonable risk to people.  The fact that a system or component is near, at, or beyond the end of its normal, useful life is not, in itself, a material defect.","sev":"major","choices":[]},{"id":"9a398f9","type":"defect","title":"Less Than 2\" Clearance From Combustable Material","text":"Combustible material near too near the chimney could start fire.  Recommend a licensed builder remove any combustible material away from chimney at least 2\"","sev":"moderate","choices":[]},{"id":"11ac457","type":"defect","title":"Debris Observed In Chimney","text":"Debris could ignite and start a fire within the chimney.  Recommend cleaning of the chimney by a CSIA certified Chimney Sweep (Find One Here)","sev":"moderate","choices":[]},{"id":"3af0afd","type":"defect","title":"Chimney BrickIis Deteriorated","text":"This may allow water or moisture to enter the chimney chase causing damage.  Have repaired or replaced by a qualified brick mason.","sev":"moderate","choices":[]},{"id":"c65d72d","type":"defect","title":"Chimney Missing Saddle","text":"Modern standards require a chimney saddle to be installed on chimneys that are over 30\" wide.  The lack of a saddle could cause premature failure of the flashing and allow water intrusion into the home.  Hidden damage may exist.  Installation of a chimney saddle by a licensed contractor.","sev":"major","choices":[]},{"id":"081e141","type":"defect","title":"Chimney Saddle Is Missing- Under 30\"","text":"Modern standards require a chimney saddle to be installed on chimneys that are over 30\" wide.  Although this chimney was under 30\" wide the inspector still recomends installation.  The lack of a saddle could cause premature failure of the flashing and allow water intrusion into the home.  Installation of a chimney saddle by a licensed contractor if leaks are formed.","sev":"minor","choices":[]},{"id":"b214975","type":"defect","title":"Daylight Observed Through Flashing","text":"The gap will allow moisture or pest intrusion.  Flashing should be replaced and counter flashing added to meet current best practices by a licensed contractor.","sev":"major","choices":[]},{"id":"74ea609","type":"defect","title":"Chimney Leaning or Displaced","text":"The displacement may worsen leading to more extensive repair up to and including rebuilding of the fireplace chase.  Monitor for further movement.  Should it worsen, have evaluated by a qualified brick mason for repair.","sev":"moderate","choices":[]},{"id":"2170265","type":"defect","title":"Flue Is Cracked","text":"The flue is designed to control and direct noxious gas up to a safe height to dispel.  A cracked flue may allow gasses to escape through the flue crack and the chimney material potentially creating an unsafe living environment.  Have repaired by a licensed contractor.","sev":"major","choices":[]},{"id":"289bd99","type":"defect","title":"Moss Growth Observed On Chimney","text":"Moss will damage the mortar overtime causing premature failure and water infiltration.  Remove the moss using special formulated cleaners and a soft bristled brush.  Learn more here.","sev":"minor","choices":[]},{"id":"233b777","type":"defect","title":"Spark Arrestor or Weather Cap Missing","text":"A spark arrestor or weather cap is meant to prevent water from entering the chimney flue and into the firebox, which is built to be a dry environment.  A missing spark arrestor /weather cap allows the potential for moisture intrusion into the fireplace flue, onto the damper door, and into the firebox. Excessive moisture in this area of the fireplace may lead to long-term damage.  Install a spark arrestor/weather cap to guard against water entry into the firebox.","sev":"moderate","choices":[]},{"id":"22c3987","type":"defect","title":"The Chimney Is Pulling Away From The House.","text":"Without correction the chimney will continue to separate from the house and could cause more damage and/ or collapse.  Without correction the chimney will continue to separate from the house and could cause more damage and/ or collapse.","sev":"major","choices":[]},{"id":"6759714","type":"defect","title":"Flashing Sealant Is Deteriorated","text":"The sealant is cracked and could allow water intrusion into the home.  Re-sealing the joint using a premium exterior grade silicone (Find the Best Here) is recomended.  Bi-annual maintenance of the sealant will be necessary.","sev":"minor","choices":[]},{"id":"82ed9c7","type":"defect","title":"Repointing Needed","text":"Repointing is repairing weathered or damaged joints in masonry.  Failure to repoint the mortar joints in the chimney can result in water infiltration into the home. Repointing should be performed by a qualified masonry contractor.","sev":"minor","choices":[]}]},{"name":"Fireplace","c":[{"id":"66bf4bb","type":"info","title":"Type of Fireplace","text":"I tried to describe the type of fireplace.","sev":"minor","choices":["Masonry","Factory-Built","Gas Fireplace Insert","Stove Insert","Pellet","Fake (Not Real or Usable)","Wood Burning Fireplace"]},{"id":"fe2f367","type":"defect","title":"Defect at Glass Doors at Fireplace","text":"I observed a defect at the glass doors of the fireplace. Glass door keep objects that may be on fire from leaving the firebox.  This could be a very dangerous situation.  Repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"6b6a38a","type":"limit","title":"Fireplace and Stack Inspection Limitations","text":"LMT - Not everything of the fireplace and chimney stack system and components are inspected because they are not part of the Home Inspection Standards of Practice. I inspected only what I am required to inspect and only what was visible during the home inspection. I recommend hiring a certified chimney sweep to inspect, sweep, and further evaluate the interior of the fireplace system immediately and every year as part of a homeowner's routine maintenance plan.","sev":"minor","choices":[]},{"id":"988ca82","type":"info","title":"Lintel","text":"I observed the lintel above the fireplace opening.","sev":"minor","choices":[]},{"id":"139d751","type":"limit","title":"Gas Insert - Did Not Inspect","text":"LMT - I did not inspect the gas fireplace insert unit. This was beyond the scope of my home inspection. I recommend the homeowner or a professional inspect further and confirm it's safe operation and functionality.","sev":"minor","choices":[]},{"id":"943e896","type":"defect","title":"Defect at Damper Door","text":"I observed a defect at the fireplace damper door. Repair by a certified CSIA contractor is recomended (Find One Here).","sev":"moderate","choices":[]},{"id":"711e7fd","type":"info","title":"Cleanout Door and Frame","text":"I inspected the fireplace cleanout doors and frames","sev":"minor","choices":[]},{"id":"6515933","type":"defect","title":"Gas Fireplace Not Operated","text":"The gas fireplace would not light.  The inspector recommends asking the homeowners to ensure the fireplace works.","sev":"moderate","choices":[]},{"id":"86d9a36","type":"info","title":"Damper Door","text":"I inspected the fireplace damper doors by opening and closing them, if they were readily accessible and manually operable.","sev":"minor","choices":[]},{"id":"a0115d6","type":"defect","title":"Joint Separation","text":"I observed indications of joint separation inside the fireplace. Hazard.","sev":"moderate","choices":[]},{"id":"85daf4b","type":"defect","title":"Damage to Hearth","text":"I observed indications of damage to the hearth. Hazard. Repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"1477116","type":"defect","title":"Not Enough Clearance To Combustibles","text":"The National Fire Code requires all combustible material to be at least 6\u201d from the opening of the firebox.  This could cause a fire, fire hazard.  Repair by a licensed contractor Is recommended.","sev":"major","choices":[]},{"id":"0f4722d","type":"defect","title":"Blower Not Working","text":"","sev":"minor","choices":[]},{"id":"c0eba0a","type":"defect","title":"Damage to Fireplace Interior Chamber","text":"I observed indications of damage to the interior chamber. Hazard.","sev":"moderate","choices":[]},{"id":"8a290c1","type":"defect","title":"Damage to Hearth Extension","text":"I observed indications of damage to the hearth extension. Hazard.  Repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"7f2369a","type":"defect","title":"Inadequate Hearth Extension","text":"I observed indications of inadequate clearance at the hearth extension component in front of the fireplace opening. This is a hazard.  Repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"a4724b8","type":"defect","title":"Defect at Lintel","text":"I observed a defect at the fireplace lintel.","sev":"moderate","choices":[]},{"id":"324f2ca","type":"defect","title":"Defect at Cleanout","text":"I observed a defect at the fireplace cleanout.  Without a proper cleanout the fireplace may exhaust flue gasses into the house or cleaning the chimney may be difficult.  Further repair by a certified CSIA contractor (Find One Here)","sev":"moderate","choices":[]},{"id":"28a88c0","type":"defect","title":"Defect at Chains of Fireplace","text":"I observed a defect at the chains of the fireplace.   The chains keep object in the fireplace.  This could be a dangerous situation.  Repair by a licensed contractor is recomended.","sev":"moderate","choices":[]},{"id":"c206f14","type":"defect","title":"Rusted Chimney Cap Observed","text":"The chimney cap prevents moisture from entering the structure. Possible hidden damage.  Replace cap.","sev":"minor","choices":[]},{"id":"2570da9","type":"limit","title":"Wood Burning Fireplace Limitation","text":"LMT- The wood-burning fireplace was not tested as part of this inspection. It is recommended that all wood-burning fireplaces be inspected and maintained regularly to ensure safe operation. A thorough inspection should be performed by a certified chimney sweep before use.\n\nFor the highest standards of safety and service, consult a chimney sweep certified by the Chimney Safety Institute of America (CSIA). Certified professionals can assess the fireplace and chimney for structural integrity, creosote buildup, and other potential hazards. For more information or to locate a certified professional, visit www.csia.org.","sev":"minor","choices":[]}]},{"name":"Wood-Burning Stove","c":[{"id":"54d37bb","type":"defect","title":"Defect at Stove","text":"I observed a defect at the stove.","sev":"moderate","choices":[]},{"id":"ee03c64","type":"info","title":"Not Inspected","text":"The home inspection did not include the wood-burning stove and its components. A stove is not part of a home inspection. Please ask the homeowner or occupant about the stove, how it works, how to maintain it, and what problems may exist.","sev":"minor","choices":[]},{"id":"ffec93e","type":"defect","title":"Cracked","text":"The crack exposes surrounding area to excessive heat.  Have the crack repaired by a woodburning stove specialist","sev":"minor","choices":[]},{"id":"314f3d1","type":"defect","title":"Door Gasket Damaged","text":"The lack of the gasket could cause flue gases to enter home.  Repair by a Qualified contractor recommended","sev":"minor","choices":[]},{"id":"3df2886","type":"defect","title":"Door(s) Damaged","text":"The damged door exposes surrounding area to hot embers.  Repair or replace door(s).","sev":"major","choices":[]},{"id":"506c544","type":"defect","title":"Fan Noisy","text":"The blower fan is louder than normal operation.  The bearings in the fan could be failing.  Have serviced by a qualified contractor.","sev":"moderate","choices":[]}]},{"name":"Pellet Stove","c":[{"id":"b7eec41","type":"defect","title":"Hearth Pad May Be Too Small- Pellet Stove","text":"A hearth pad is installed as a safety device to prevent a fire in the home.  The typical pad should extend at least 6 inches in front of the stove and several inches out on each side, however manufacturer installation instructions should always be consulted and followed.","sev":"moderate","choices":[]}]}]},{"name":"Exterior","subs":[{"name":"General","c":[{"id":"d25b17a","type":"info","title":"Homeowner's Responsibility","text":"The exterior of your home is slowly deteriorating and aging. The sun, wind, rain and temperatures are constantly affecting it. Your job is to monitor the buildings exterior for its condition and weathertightness.\n\nCheck the condition of all exterior materials and look for developing patterns of damage or deterioration.\n\nDuring a heavy rainstorm (without lightning), grab an umbrella and go outside. Walk around your house and look around at the roof and property. A rainstorm is the perfect time to see how the roof, downspouts and grading are performing. Observe the drainage patterns of your entire property, as well as the property of your neighbor. The ground around your house should slope away from all sides. Downspouts, surface gutters and drains should be directing water away from the foundation.","sev":"minor","choices":[]},{"id":"ed032b6","type":"limit","title":"Inspection Was Restricted","text":"LMT - The inspection of the exterior of the house was restricted, and the visual-only inspection was limited.","sev":"minor","choices":["Limited access","Vegetation","Snow","Fence","Dog","Construction"]},{"id":"6404643","type":"info","title":"Exterior Was Inspected","text":"I inspected the exterior of the house.","sev":"minor","choices":[]},{"id":"048ca62","type":"limit","title":"Exterior Not Inspected","text":"I was unable to inspect the exterior of the house.  Inspection restriction.","sev":"minor","choices":[]},{"id":"83dc8b4","type":"limit","title":"Condominium Limitations","text":"Condominiums are controlled by an association.  This association is generally responsible for the exterior of the home including the roof, landscaping and grounds, and exterior systems.  Due to the association controlling ownership of the roofing material the inspector doesn\u2019t traverse the roof and only a basic inspection is made of these systems.  Defects of these systems should always be referred back to the association.","sev":"minor","choices":[]}]},{"name":"Vegetation, Surface Drainage, Retaining Walls & Grading","c":[{"id":"575b02f","type":"defect","title":"Grading - Not Designed to Manage Rain Water","text":"The current configuration of the grading will not allow rainwater to run away from the structure properly in the referenced area(s) or portions of the referenced area(s). Grading is either wrong or right, with no gray areas in between. The grading either slopes away from the structure (Right-Positive Grading), is flat (Wrong), or slopes towards the structure (Wrong-Negative Grade). Even though no repercussions may be present at the time of inspection due to improper grading, moisture infiltration through foundation walls is always possible during heavy rainfall events.\n\nFlat grading and negative grading allow the soil in these areas to become saturated. Once saturated, the porous, permeable masonry foundation walls can wick this water out of the soil via capillary action. This can allow the masonry to become saturated and either evaporate this moisture into areas below grade in the form of water vapor, creating high humidity or allowing for moisture or water infiltration into areas below grade.\n\nAs mentioned in the \"Grading / Drainage Information\" comment above, the soil is recommended to slope away from the structure, with a 6-inch drop in elevation, in the first 10 feet away (5% grade). When the proper grade can not be achieved, a swale or drain should be installed as needed to manage rainwater runoff. An evaluation of the grading around the home with repairs made as needed to allow for the proper runoff of rainwater is recommended to be conducted by a grading contractor, foundation contractor, or other qualified contractors.\n\nThis deficiency will be labeled in Red (significant concern) when active moisture infiltration or related deficiencies were observed, labeled in Orange (moderate concern) when indications of past moisture infiltration or related deficiencies were observed, or Blue when no indications of water infiltration were observed.\n\nA video about proper grading can be seen here: https://m.youtube.com/watch?v=5hYIda7tWqA\n\nHere's a link to a HUD document discussing how common this defect is, along with some current building standards: https://www.hud.gov/sites/documents/41451X8HSGH","sev":"major","choices":[]},{"id":"b1c04fa","type":"info","title":"Vegetation, Drainage, Walls & Grading Were Inspected","text":"I inspected the vegetation, surface drainage, retaining walls and grading of the property, where they may adversely affect the structure due to moisture intrusion.","sev":"minor","choices":[]},{"id":"9100796","type":"limit","title":"Retaining Wall: Retaining Wall Information","text":"LMT: Retaining walls are inspected in respect to their effect on the structure of the home. The structural integrity or load bearing capacities of retaining walls are beyond the scope of a home inspection. No significant deficiencies were observed in the walls relation to the structure unless otherwise noted in this report.","sev":"minor","choices":[]},{"id":"6e4cd07","type":"defect","title":"Vegetation- Tree Too Close","text":"The inspector observed indications that a tree was overhanging the roof and maybe in contact with it.  This can damage the roofing material.\n\nRecommendation\n\nThe inspector recommends trimming the branches or removing the tree.  Work should be performed by a licensed arborist to ensure safe removal and retain the integrity of the tree.","sev":"minor","choices":[]},{"id":"962e417","type":"limit","title":"Dense Vegetation","text":"LMT - I observed dense vegetation around the house in areas.  This condition limited and restricted my visual inspection.  Dense vegetation and landscaping up against or near the house foundation and exterior walls may be prone to water penetration and insect infestation.  Dense vegetation can also cause structural issues overtime.  These issues may not be visible at the time of the inspection.\n\nTrimming, pruning and some landscaping is recommended.","sev":"minor","choices":[]},{"id":"73d2b61","type":"defect","title":"Vegetation- Tree Close To Foundation","text":"Tree roots can cause damage to the foundation which may be hidden at the time of the inspection.  The tree should be removed by a qualified arborist to prevent damage or further damage to the foundation.","sev":"minor","choices":[]},{"id":"259dac1","type":"defect","title":"Retaining Wall Damage- Leaning","text":"The inspector observed indication of damage at the retaining wall. The wall was leaning and washout was observed.  This could be an indication of failure.  This deficiency will be labeled in Red (significant concern) when active structural deficiencies to the home or related deficiencies were observed, labeled in Orange (moderate concern) when structural deficiencies to the home were not observed.\n\nRecommendation\n\nIt is recommended the retaining wall be evaluated by a qualified contractor to determine the best course of action for repair or if complete replacement is needed.","sev":"major","choices":[]},{"id":"352ef9c","type":"limit","title":"Gas Meter/LP Tank Information: LP Tank Information","text":"EXCL - An LP tank was present at the home, and these are not inspected during a home inspection per the Standards of Practice. I recommend consulting with the LP filling company as to any safety checks they may conduct on the storage tanks, valves, etc.","sev":"minor","choices":[]},{"id":"f63fd48","type":"defect","title":"Retaining Wall- Cracking and Displacement","text":"Vertical cracking was observed in the retaining wall during the course of the inspection.  This could be due to various issues such as a lack of proper drainage behind the wall causing hydraulic pressure or improper footings.  If the underlying issues is not addressed it could cause structural failure.\n\nRecommendation\n\nAs a temporary measure the inspector recommends filling the crack with latex concrete crack filler or another type of crack repair.  Monitor the area for further movement.  If movement is detected further evaluation by a qualified contractor or structural engineer is recommended.  The inspector does recommend further evaluation and repair by an excavator or landscaping contractor to properly repair the retaining wall.","sev":"moderate","choices":[]},{"id":"b199f14","type":"defect","title":"Retaining Wall- Washed Out","text":"The inspector noted the soil under the retaining wall was washed out.  This is an indication of a lack of positive grade around the structure.  This could cause the retaining wall to fail overtime.  Fill should be added to increase the level of grade and sloped away from the structure.\n\nThis could cause the retaining wall to fail overtime.  This deficiency will be labeled in Red (significant concern) when active structural deficiencies to the home or related deficiencies were observed, labeled in Orange (moderate concern) when structural deficiencies to the home were not observed.\n\nRecommendation\n\nFill should be added to increase the level of grade around the home and sloped away from the home at the rate of 1 foot vertical per 6 foot horizontal.  Work should be performed by a qualified contractor to ensure proper footings are maintained under the retaining wall.  Based on the severity of the issue the wall could have to be replaced.","sev":"moderate","choices":[]},{"id":"53d595e","type":"defect","title":"Retaining Wall- Missing Fall Protection","text":"SFTY- The inspector observed a retaining wall over 32\" tall was missing a fall protection.  The lack of a guardrail is a safety issue.\n\nRecommendation\n\nA guardrail should be added to provide fall protection.  Guardrails should always be installed by a licensed contractor to be sure they comply with current standards.","sev":"major","choices":[]},{"id":"4dbfe48","type":"defect","title":"Landscaping- Possible Animal Burrow","text":"Animals can burrow next to footings, causing destabilization and failure in rare circumstances.  Removal of the animal and repair the burrow.","sev":"minor","choices":[]},{"id":"d06c54d","type":"limit","title":"Snow Covering","text":"LMT - The snow covered much of the ground.  This is a limitation of the inspection.","sev":"minor","choices":[]}]},{"name":"Eaves, Soffits & Fascia","c":[{"id":"ce7ead0","type":"limit","title":"Inspection Was Restricted","text":"LMT - I did not inspect all of the eaves, soffit, and facia.  It's impossible to inspect those areas closely during a home inspection.  A home inspection is not an exhaustive evaluation.  My inspection of the exterior was limited.  I did not reach and access closely every part of the eaves, soffit, and fascia.","sev":"minor","choices":[]},{"id":"06b6a86","type":"defect","title":"Fascia/ Drip Edge- Not Installed To Manufacturers Recommendation","text":"The inspector noted the fascia and/ or drip edge was not installed to typical manufacturers recommendations.  Improperly installed fascia and drip edge can allow water intrusion which can damage the structure.\n\nRecommendation\n\nAs a temporary measure the inspector recommends the areas be sealed with a premium exterior grade caulking.  The areas should be re-installed to meet manufacturers recommendations.  See below for proper installation practices.","sev":"minor","choices":[]},{"id":"1eb6ba6","type":"info","title":"Eaves, Soffits and Fascia Were Inspected","text":"I inspected the eaves, soffits and fascia.  I was not able to inspect every detail, since a home inspection is limited in its scope.","sev":"minor","choices":[]},{"id":"6b21499","type":"info","title":"Fascia Material","text":"","sev":"minor","choices":["Aluminum","Wood","VInyl","Metal"]},{"id":"df4015e","type":"defect","title":"Soffit- Damaged","text":"I observed indications that one or more areas of the soffit were damaged.  Soffit protects the eves of the home from pests entering the home.\n\nRecommendation\n\nThe inspector recommends the soffit be repaired or replaced as necessary.  This can be performed by either a siding or roofing professional.","sev":"moderate","choices":[]},{"id":"4ad43a8","type":"defect","title":"Soffit - Loose","text":"I observed indications that one or more areas of the soffit were loose.  Soffit protects the eves of the home from pests entering the home.\n\nRecommendation\n\nThe inspector recommends the soffit be repaired or replaced as necessary.  This can be performed by either a siding or roofing professional.","sev":"minor","choices":[]},{"id":"4867a74","type":"info","title":"Soffit Material","text":"","sev":"minor","choices":["Aluminum","Wood","Vinyl","No Soffit"]},{"id":"578f3d4","type":"defect","title":"Soffit- Buckling Or Warping","text":"I observed indications that one or more areas of the soffit were buckling.  Soffit protects the eves of the home from pests entering the home.\n\nRecommendation\n\nThe inspector recommends the soffit be repaired or replaced as necessary.  This can be performed by either a siding or roofing professional.","sev":"minor","choices":[]},{"id":"66dfa53","type":"defect","title":"Soffit- Missing","text":"The inspector noted one or more areas were missing soffit.  The missing soffit exposes the wood to the elements potentially causing premature aging and can allow pests to enter the structure.\n\nRecommendation\n\nThe inspector recommends replacing the missing section of soffit.","sev":"minor","choices":[]},{"id":"a83b00e","type":"defect","title":"Soffit- Vents Missing","text":"The inspector noted the soffit did not include sufficient ventillation.  Without insufficient ventilation is timely moisture evaporation will not occur.\n\nRecommendation\n\nIt is recommended to add soffit vents to improve ventilation, work should be performed by a qualified siding or roofing contractor.","sev":"minor","choices":[]},{"id":"fc51cd7","type":"defect","title":"Fascia- Loose","text":"The inspector noted fascia was loose.  Loose fascia exposes the wood to the elements which can cause damage to the structure.\n\nRecommendation\n\nIt is recommended the fascia be either repaired or replaced to properly seal the structure.","sev":"minor","choices":[]},{"id":"37d1b17","type":"defect","title":"Fascia- Damaged","text":"The inspector observed indications that one or more areas of the fascia were damaged. This can include buckling, improper fastening, or loose fascia.  If not repaired water damage to the area could worsen and damage the structure.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends the fascia be repaired by a licensed siding contractor to ensure the area is water tight.","sev":"moderate","choices":[]},{"id":"d2eca99","type":"defect","title":"Fascia- Missing","text":"The inspector noted one or more areas were missing fascia covering.  The missing fascia exposes the wood fascia board to the elements potentially causing premature aging.  The lumber used was not treated and therefore needs to be protected.\n\nRecommendation\n\nThe inspector recommends replacing the missing sections of fascia.","sev":"moderate","choices":[]},{"id":"82d2fc7","type":"defect","title":"Fascia- Finish Is Damaged","text":"The inspector noted the finish on the fascia was damaged.  The damaged paint exposes the metal and could cause further damage to the remaining coating.\n\nRecommendation\n\nThe inspector recommends replacing the run of fascia that is damaged or paint to match using appropriate paint for the surface and setting.","sev":"minor","choices":[]},{"id":"4e2cee8","type":"defect","title":"Fascia - Damaged Or Rotted Wood","text":"The inspector noted wood fascia that was damaged or rotted at the time of the inspection.  These areas lack protection from insects, animals and the elements.  Failure to address these issues can lead to further damaged.\n\nRecommendation\n\nThe inspector recommends replacement of the damaged/ rotted areas.","sev":"minor","choices":[]},{"id":"92d7d3d","type":"defect","title":"Eves- Damaged","text":"The inspector observed one or more areas of the eaves were damaged.  This can include rot of the fascia board, improper framing of the eves, or damage and/or rot of the wood.  If the areas are not repaired the damage can worsen overtime.\n\nRecommendation\n\nIt is recommended a licensed contractor evaluate the eves for damage and repair as necessary.","sev":"moderate","choices":[]},{"id":"453adcf","type":"defect","title":"Paint- Chipped, Faded, Or Worn","text":"The inspector noted areas of wood were exposed to the elements.  The paint, which protects the wood, has chipped, faded, or worn in one or more areas.  If not repaired this will worsen overtime and can cause damage and/or rot of the wood.\n\nRecommendation\n\nIt is recommended that the area be properly scraped and prepped, followed by repainting with a premium outdoor paint.  The areas could also be flashed with metal flashing.  Depending on the age of the home the paint chips could contain lead.  Please review the EPA procedures by following this link.","sev":"minor","choices":[]},{"id":"4aca64c","type":"defect","title":"Flashing- Caulking Shrunk, Cracked, Worn","text":"The inspector noted the caulking around the flashing was shrunk, cracked, and/or worn.  A lack of caulk between the aluminum flashing can result in water infiltration behind the flashing, causing rot to the underlying wood.\n\nRecommendation\n\nInstallation of a premium exterior grade caulk in the gap is recommended.  Find the best caulks here.","sev":"minor","choices":[]},{"id":"d66a9a5","type":"defect","title":"Flashing- Improper/ Missing","text":"The inspector noted flashing in one or more areas is not fully protecting the structure from water damage.  If this isn't addressed water will continue to damage the structure.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends a licensed siding contactor repair or replace the flashing as needed to ensure the area is watertight, not allowing water to enter the structure.","sev":"moderate","choices":[]},{"id":"6904a60","type":"limit","title":"Condominium Limiation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Siding, Flashing & Trim","c":[{"id":"fce9c41","type":"limit","title":"Inspection Was Restricted","text":"LMT - I did not inspect all of the exterior wall-covering material.  A home inspection is not an exhaustive evaluation.  My inspection of the exterior was limited.  I did not reach and access closely every part of the exterior wall-covering.","sev":"minor","choices":[]},{"id":"8d02849","type":"defect","title":"Paint- Peeling, Worn, Faded, Or Missing","text":"The inspector noted areas of wood were exposed to the elements.  The paint/ stain, which protects the wood, has chipped, faded, or worn in one or more areas.  If not repaired this will worsen overtime and can cause damage and/or rot of the wood.\n\nRecommendation\n\nIt is recommended that the area be properly scraped and prepped, followed by repainting with a premium outdoor paint.  The areas could also be flashed with metal flashing.\n\nDepending on the age of the home the paint chips could contain lead.  Please review the EPA procedures by following this link.","sev":"minor","choices":[]},{"id":"5f68ba1","type":"info","title":"Worn Out Areas of Exterior Wall-Covering","text":"I observed indications of worn out areas, delayed maintenance, or aging.","sev":"minor","choices":[]},{"id":"f38ff35","type":"defect","title":"Wall Covering- Damaged","text":"The inspector observed indications of damage to the exterior wall\u2011covering material. Conditions of this type can allow moisture to penetrate the building envelope, potentially leading to structural deterioration, rot, or other concealed damage that may already exist behind the wall surface.\n\nRecommendation- The inspector recommends that a licensed contractor further evaluate the exterior wall covering and complete all necessary repairs or replacement to ensure the structure is properly sealed and protected from water intrusion. There is also a possibility that the existing wall material contains asbestos\u2014a hazardous substance that, when disturbed, can release fibers known to increase the risk of serious respiratory illnesses. Proper testing and, if needed, abatement of asbestos\u2011containing materials can be costly and must be handled with strict safety procedures. For safety and compliance with applicable regulations, the inspector recommends that sampling and testing be performed by a certified asbestos contractor prior to any disturbance or repair work.  For further information including specific health risks and abatement advice please visit www.epa.gov/asbestos","sev":"minor","choices":[]},{"id":"e68ccdb","type":"info","title":"Type of Wall-Covering Material Described","text":"The exterior of your home is slowly deteriorating and aging.  The sun, wind, rain and temperatures are constantly affecting it.  Your job is to monitor the house's exterior for its condition and weathertightness.\n\nCheck the condition of all exterior wall-covering materials and look for developing patterns of damage or deterioration.","sev":"minor","choices":["Various Materials","Brick","Stucco","Vinyl","Stone Veneer","Masonry","Stone","Wood","Aluminum","Asbestos","Asphalt","Concrete","Engineered Wood","Fiber Cement","Logs","Metal","Plastic","Shingles","Brick Veneer"]},{"id":"90c3137","type":"info","title":"Probing of Wood","text":"Any areas of wooden trim, siding, or other wood components will be probed if water damage (wood rot) was suspected. Any photos of a screwdriver stuck into wood represents water damage/wood rot to some extent. Hidden damage is always a possibility at these areas. These areas of damage will require further evaluation to determine the extent of the damage, along with repairs made as deemed necessary by a qualified contractor.","sev":"minor","choices":[]},{"id":"5971a46","type":"defect","title":"Siding- Damaged: Holes, Cracks","text":"The inspector noted one or more areas of the siding were damaged with holes or cracks.  Damaged siding lacks protection from insects, animals and the elements and it may negatively affect the thermal boundary of the home.  Holes in siding can allow water intrusion into the home.  Hidden damage may exist.\n\nRecommendation\n\nAs a temporary measure the inspector recommends caulking of the holes or cracks in the siding using a premium exterior grade silicon caulk or similar product.  A permanent fix will require the damaged siding to be replaced by a licensed siding contractor.","sev":"minor","choices":[]},{"id":"fe1bede","type":"info","title":"Aluminum Siding: Aluminum Siding Information","text":"Aluminum siding is inspected by looking for damage, proper flashings, and the overall installation concentrating on significant deficiencies.\n\nAluminum siding is not a watertight cladding and is expected to allow some degree of moisture behind it as it heavily relies on the performance of the weather-resistive barrier (if present), or if installed over an existing wall cladding it relies on that cladding and its WRB or felt paper to manage and prevent water infiltration into the wall cavity. Prior to 2003 vinyl siding was allowed to be installed directly over OSB wall sheathing with no WRB in place as the unsealed nature of aluminum siding will allow air to dry the underlying components.\n\nRegardless measures should be taken to prevent bulk moisture from entering behind the cladding with proper flashings and sealants.","sev":"minor","choices":[]},{"id":"a955abf","type":"defect","title":"Siding- Seal Penetrations","text":"The inspector noted penetrations through the siding were not properly sealed.  Penetrations can allow insect, pest, and water intrusion into the structure which can all cause more damage.\n\nRecommendation\n\nAll penetrations through the siding should be sealed with a premium exterior grade silicone caulking or similar product.  Annual evaluation of the caulking should be performed.  If cracks or shrinkage is observed the caulk should be removed and replaced with a premium exterior grade silicone.","sev":"minor","choices":[]},{"id":"d8a6007","type":"defect","title":"Siding- Loose","text":"The inspector noted the siding was lose, not properly secured to the structure, at the time of the inspection.  This can cause water and pest intrusion into the home which can lead to damage to the structure.  Hidden damaged is possible.\n\nRecommendation\n\nThe inspector recommends the siding be repaired by a licensed siding contractor.","sev":"minor","choices":[]},{"id":"ffe582f","type":"defect","title":"Siding- Overlap Is Separating","text":"The inspector noted the overlap at the joint of the vinyl siding has separated.  The gaps provide no protection against insect intrusion and adversely affect the thermal barrier of the home, potentially increasing utility costs.  Hidden damage may exist.\n\nRecommendation\n\nTypically, the siding can be moved back into place, however it may continue to move and separate at the joint.  This usually occurs when the overlap was not cut correctly and is not long enough to allow for the expansion and contraction of the siding during temperature swings.  If the siding was cut short it may need to be replaced.","sev":"minor","choices":[]},{"id":"cb0845e","type":"defect","title":"Siding- Missing Snap Locks","text":"The inspector noted the vinyl siding was not installed correctly, it was missing snap locks.  Vinyl siding is locked into place using snap locks, little tabs that have been pressed into the siding.  These tabs lock into the next piece of siding or a special trim piece called utility or undersill trim.  If the snap locks are missing or no undersill trim is installed the siding will become loose and allow water intrusion to damage the structure.  Hidden damage may exist.\n\nRecommendation\n\nRepair by a licensed siding contractor is recommended.","sev":"minor","choices":[]},{"id":"0ce9181","type":"defect","title":"Siding- Missing","text":"The inspector noted one or more areas were missing siding.  This exposed the structure to moisture and can damage the underlying structure.  Hidden damage possible.\n\nRecommendation\n\nThe inspector recommends replacing the missing siding.  Work should be performed by a licensed siding contractor to ensure water is directed away from the structure.","sev":"moderate","choices":[]},{"id":"b0ddd1b","type":"defect","title":"Siding- Melted","text":"The inspector observed areas of the vinyl siding were melted.  This could be the result of a grill that contacted the vinyl material, reflection of the sun off a reflective surface such as a window, or another heat source.  Typically this is a cosmetic issue only, however if the siding is warped enough it could allow water penetration into the structure resulting in damaged to the underlying structure.\n\nRecommendation\n\nThe inspector recommends the source of the melted siding be investigated and the siding be repaired by a licensed siding contractor.","sev":"minor","choices":[]},{"id":"07e01fb","type":"defect","title":"Siding- Inadequate Clearance From Shingles","text":"The inspector noted the vinyl siding was installed to close to the roofing shingles.  Siding should have a minimum of 1\" clearance from the shingles to allow for expansion and contraction of the materials.  Siding too close to the shingles can allow water penetration into the structure as water backs up behind the siding.  It can also cause the roofing material to deteriorate quicker than is typical.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends the siding be re-installed to manufacturers specifications.  Flashing should be evaluated to ensure it meets current construction standards and is directing water away from the home.  A licensed siding contractor should perform the work to ensure the siding is properly installed.","sev":"minor","choices":[]},{"id":"5a49fb3","type":"defect","title":"Siding- Improperly Nailed","text":"During the inspection it was observed that the siding is face nailed.  The siding is improperly installed and could have damage behind it as it allows water infiltration into the structure.\n\nRecommendation\n\nIt is recommended the siding be properly installed by a siding contractor.  This could involve replacement of multiple sheets of siding.","sev":"minor","choices":[]},{"id":"6e97271","type":"defect","title":"Siding- Installation Defect","text":"The inspector noted a repair of the siding was not installed per typical manufacturer recommendations.  Siding is installed to protect the structure from damage including water infiltration.  Moisture intrusion could exist.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends the vinyl siding installation be evaluated to ensure it was installed properly.  Repair or replacement by a licensed siding contractor is recommended.","sev":"minor","choices":[]},{"id":"1e9f661","type":"defect","title":"Siding- J-Channel Missing","text":"The inspector noted there were one or more areas that were missing J-channel.  The siding should be installed in j-channel to pproperly direct water away from the structure and to secure the bottom of the siding to prevent wind damage.  Installation of j-channel by a licensed siding contractor is recommended.  Click here for more information.","sev":"minor","choices":[]},{"id":"c0008f0","type":"defect","title":"Siding- Damaged and/or Loose Aluminum Siding Corners","text":"The inspector observed the siding corners were damaged or lose.  This can allow water and pest intrusion into the home.\n\nRecommendation\n\nThe inspector recommends the siding corners be repaired or replaced by a licensed siding contractor.\n\nFollow this link for instructions on how to replace the corners.","sev":"minor","choices":[]},{"id":"f0b21f3","type":"defect","title":"Siding- Wood Damaged","text":"During the inspection it was noted that the wood siding was damaged, cracked, worn, or rotted in one or more areas.  This can allow moisture and pest intrusion into the home causing damage to the structure.  Hidden damage may currently exist.\n\nRecommendation\n\nThe inspector recommends replacement of the damaged wood siding by a licensed contractor, ensuring proper installation to direct water away from the structure.","sev":"minor","choices":[]},{"id":"16e1916","type":"defect","title":"Siding- Wood in Contact with Ground","text":"The inspector noted wood siding in contact with the ground could cause moisture to wick up into the building material or could damage the siding.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends the siding be removed and proper flashing be installed.  Work to be performed by a licensed contractor.","sev":"minor","choices":[]},{"id":"7f8327b","type":"defect","title":"Wall Covering Material- Loose","text":"The inspector observed one or more areas of the wall covering material were loose.  This can allow water penetration into the structure causing damage.  Hidden damage may currently exist.\n\nRecommendation\n\nThe inspector recommends the material be repaired or replaced by a licensed contractor, ensuring proper flashing is installed, if needed, to direct water away from the structure.","sev":"minor","choices":[]},{"id":"cd3902e","type":"defect","title":"Brick- Deteriorated","text":"The inspector noted the exterior masonry wall covering was deteriorated.  If not repaired, the deterioration may worsen resulting in moisture intrusion further deteriorating the brick.  If not repaired, the deterioration may worsen resulting in moisture intrusion further deteriorating the brick.\n\nRecommendation\n\nThe inspector recommends the masonry be repaired or replaced as necessary by a qualified masonry contractor.","sev":"moderate","choices":[]},{"id":"806b81e","type":"defect","title":"Flashing- Headwall Improperly Installed","text":"The inspector noted the headwall flashing was not installed properly at the junction between the roof and wall.  This can may allow water infiltration into the structure.  Hidden damage may exist.\n\nRecommendation\n\nInstallation of proper flashing by a licensed roofing contractor is recommended.","sev":"moderate","choices":[]},{"id":"d64d8e5","type":"defect","title":"Flashing- Installation Defect","text":"During the inspection an installation defect at the exterior flashing was observed.  This condition could result in moisture intrusion into the house.  Hidden damage could exist.\n\nRecommendation\n\nThe inspector recommends a licensed siding contractor evaluated the flashing for proper installation and repaired or replaced as needed","sev":"minor","choices":[]},{"id":"7a61930","type":"defect","title":"Flashing- Loose Not Sealed","text":"The inspector noted an area of flashing that was loose.  It is not properly sealed to prevent water infiltration into the structure.  Flashing should be properly secured and sealed to prevent water from entering the structure.  Hidden damage may exist.\n\nRecommendation\n\nIt is recommended the flashing be evaluated and repaired or replaced as necessary to prevent water infiltration into the structure.  Work should be performed by a licensed siding contractor.","sev":"minor","choices":[]},{"id":"e291c34","type":"defect","title":"Caulk- Cracked Or Shrunk","text":"The inspector noted one or more areas with caulking that is aging and cracked, shrunk, or peeling.  Caulking that has cracked or shrunk can cause moisture intrusion and damaged to the structure.\n\nRecommendation\n\nThe caulking should be replaced with a premium exterior grade caulk to prevent water intrusion into the home.","sev":"minor","choices":[]},{"id":"2e12c6a","type":"defect","title":"Caulk- Missing","text":"The inspector noted one or more areas where caulking was missing.  Caulking seals gaps in areas to prevent water from entering the structure.  A lack of caulk could be an indication there may be hidden damage in the area.\n\nRecommendation\n\nThe inspector recommends caulking all areas where water could enter the structure.  Manufacturer directions should be followed and large gaps should be properly backed before caulking to prevent shrinking.  Caulking should be a premium exterior grade caulk.","sev":"minor","choices":[]},{"id":"93ef325","type":"defect","title":"Wall Sheathing- Exposed","text":"The inspector noted the wall sheathing was exposed, not covered with a wall covering material such as siding.  Water could damage the wall sheathing and enter the structure.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends installation of a water-resistant wall covering material, such as vinyl siding, by a licensed siding contractor.","sev":"moderate","choices":[]},{"id":"b88c415","type":"defect","title":"Wood Framing- Inadequate Ground Clearance","text":"The inspector checked the distance between the bottom of wood components and the ground surface (or grade).  In locations that have little or no snow, the distance should be no less than 8 inches. In locations with significant lasting snow, the bottom of wood elements should be no less than 8 inches above the average snow depth.  The inspector observed wood that was too close to grade.  This could cause the wood to rot overtime and cause water to leach into the structure.\n\nRecommendation\n\nThe inspector recommends the wood be removed and replaced with an adequate material or it be flashed to prevent water, snow, and ice from coming in contact with it.  Work should be performed by a licensed siding contractor.","sev":"minor","choices":[]},{"id":"ab30e1e","type":"defect","title":"Insulation- Spray Foam Exposed to Weather","text":"The inspector noted spray foam was exposed to the elements.  The foam may deteriorate and/ or hold moisture against the structure.  This can cause water infiltration into the structure or damage wood framing members.\n\nRecommendation\n\nThe inspector recommends removal of the foam and properly flashing this area.  Work to be performed by a licensed contractor.","sev":"minor","choices":[]},{"id":"45caedd","type":"defect","title":"Wall Covering- Stone Veneer Loose","text":"Parts of the Stone Veneer were observed to be loose during the inspection.  This can be due to a lack of proper support, failing mortar, or improper installation of the material.  This can cause the veneer to fail overtime or all water to infiltrate the structure causing damage or mold growth.  Hidden damage may exist.\n\nRecommendation\n\nThe inspector recommends a licensed contractor evaluate the veneer and repair or properly install the material to prevent further damage.","sev":"moderate","choices":[]},{"id":"9880ce4","type":"defect","title":"Siding- Vinyl Painted","text":"Vinyl siding must be properly prepared in order to properly paint.  This coating may deteriorate or could cause the vinyl siding to buckle.\n\nRecommendation\n\nThe inspector recommends a licensed siding contractor evaluate the painted siding.","sev":"minor","choices":[]},{"id":"4a18e92","type":"defect","title":"Wall Covering- Masonry Cracking","text":"The inspector observed indications of major structural cracking of the masonry on the exterior of the home.  Cracking was observed at one or more areas.\n\nMonitoring the masonry walls of the house is needed. Although masonry can deform elastically over long periods of time to accommodate small amounts of movement, large movements normally cause cracking. Cracking can result from a variety of problems: differential settlement of the foundation; drying shrinkage; expansion and contraction due to ambient thermal and moisture variations; improper support over openings; the effects of freeze-thaw cycles; the corrosion of iron and steel wall reinforcement; differential movement between building materials; expansion of salts; and the bulging or leaning of walls.\n\nRecommendation\n\nThe inspector recommends a licensed structural engineer evaluate the structure to determine if the cracking of the masonry is a result of a structural failure.  A licensed contractor should also evaluate the masonry and repair or replace as needed.","sev":"moderate","choices":[]},{"id":"b56532d","type":"defect","title":"Inadequate Ground Clearance","text":"I checked the distance between the bottom of wood components and the ground surface (or grade). In locations that have little or no snow, the distance should be no less than 8 inches. In locations with significant lasting snow, the bottom of wood elements should be no less than 8 inches above the average snow depth.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"b5af77d","type":"defect","title":"Hail Damage","text":"I observed indications of major hail damage.","sev":"moderate","choices":[]},{"id":"294c532","type":"defect","title":"Drip Edge and/ or Flashing Installed Incorrectly","text":"Drip Edge and Fascia are both often installed incorrectly per manufacturers specifications.  Gaps can allow water infiltration and damage the underlying structure.  There could be hidden damage.  Caulking can be used to seal gaps, however this will require annual maintenance.  Replacement of the flashing is the recomended long term solution.\n\nSee below for proper installation diagrams:","sev":"moderate","choices":[]},{"id":"3f6f35a","type":"defect","title":"Exterior Trim Shows Signs Of Pest Damage","text":"The wood trim shows signs of pest damage.  The inspector is not a pest control specialists, no specifics were confirmed as to the extent of the damage or the type of pest.  Consult with a licensed contractor to determine the cost for repair or replacement.","sev":"moderate","choices":[]},{"id":"653ebd7","type":"defect","title":"Observed Growth and/or Discoloration On Vinyl Siding","text":"This is an Aesthetic Issue Only.  Cleaners can be purchased which will remove the stain.  Power washing the siding can also help remove the stain.","sev":"minor","choices":[]},{"id":"cfede80","type":"defect","title":"Observed Moss Growth On Brick","text":"Moss growth may lead to deterioration of the mortar or brick damaging the structure.  Recommend removal of moss and assessment of the brick by a qualified mason.","sev":"minor","choices":[]},{"id":"c9b4783","type":"defect","title":"Siding Installed Without Starter Strip","text":"Parts of the siding were installed without the use of a starter strip.  The siding is not secure on the bottom and could pull loose overtime resulting in water infiltration into the structure.  Recommend repair by a licensed contractor.","sev":"minor","choices":[]},{"id":"058a2c9","type":"defect","title":"J-block Installed Incorrectly","text":"The nailing flange of the j-block should be installed behind the siding.  Improper installation can lead to water penetration and damage to the structure.  Recommend repair by a licensed contractor to ensure water is properly shed away from the structure.","sev":"minor","choices":[]},{"id":"33c5568","type":"defect","title":"Possible Asebestos Containing Material","text":"The siding may contain asbestos, a material that is known to cause cancer or respiratory issues.  This material can also be expensive to remove as it must be properly disposed of and handled during construction, however, unless disturbed or it becomes friable no immediate action is needed.  The siding may contain asbestos, a material that is known to cause cancer or respiratory issues.  This material can also be expensive to remove as it must be properly disposed of and handled during construction, however, unless disturbed or it becomes friable no immediate action is needed.  Follow this link for more information on Asbestos.","sev":"moderate","choices":[]},{"id":"be07814","type":"defect","title":"Siding Deformed Due To Possible Window Reflection","text":"Deformed or bubbled siding can be caused by the sun reflecting off windows.  Newer windows often contain materials like titanium zinc-dioxide and crystalline structures to help reflect sunlight from the windows.  This can cause the heat, which is being reflected away from the window, to hit nearby siding at certain times of the day, causing damage.  1) Placing a Full Screen over the window \u2013 The full screen over the glass will break the solar energy apart and create what\u2019s called solar diffraction by the threads of the woven screen creating less energy coming from the sun to the focal point. You can ask us which neighbor\u2019s window will need this if necessary.","sev":"minor","choices":[]},{"id":"44d29cc","type":"defect","title":"Stone Facade Loose- Improper Lathe","text":"The stone fa\u00e7ade is loose.  It doesn't appear the proper metal lathe was used when installing.  This is not a structural issue, only a cosmetic one, however repair may be expensive and loosen further overtime.","sev":"moderate","choices":[]},{"id":"2317674","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]},{"id":"3890773","type":"info","title":"Vinyl Siding: Vinyl Siding Information","text":"Aluminum siding is inspected by looking for damage, proper flashings, and the overall installation concentrating on significant deficiencies.\n\nAluminum siding is not a watertight cladding and is expected to allow some degree of moisture behind it as it heavily relies on the performance of the weather-resistive barrier (if present), or if installed over an existing wall cladding it relies on that cladding and its WRB or felt paper to manage and prevent water infiltration into the wall cavity. Prior to 2003 vinyl siding was allowed to be installed directly over OSB wall sheathing with no WRB in place as the unsealed nature of aluminum siding will allow air to dry the underlying components.\n\nRegardless measures should be taken to prevent bulk moisture from entering behind the cladding with proper flashings and sealants.","sev":"minor","choices":[]},{"id":"8ea2772","type":"info","title":"Aluminum Siding- Aluminum Siding Information","text":"Aluminum siding is inspected by looking for damage, proper flashings, and the overall installation concentrating on significant deficiencies.\n\nAluminum siding is not a watertight cladding and is expected to allow some degree of moisture behind it as it heavily relies on the performance of the weather-resistive barrier (if present), or if installed over an existing wall cladding it relies on that cladding and its WRB or felt paper to manage and prevent water infiltration into the wall cavity. Prior to 2003 vinyl siding was allowed to be installed directly over OSB wall sheathing with no WRB in place as the unsealed nature of aluminum siding will allow air to dry the underlying components.\n\nRegardless measures should be taken to prevent bulk moisture from entering behind the cladding with proper flashings and sealants.","sev":"minor","choices":[]},{"id":"428fd76","type":"defect","title":"Exterior Brick Cladding \u2013 Mortar Joint Condition","text":"Certainly! Here\u2019s a professionally worded narrative suitable for a home inspection report:\n\n---\n\n\ud83e\uddf1 Exterior Brick Cladding \u2013 Mortar Joint Condition\n\nDuring the inspection of the home\u2019s exterior brick cladding, the inspector observed multiple areas where mortar joints were loose, damaged, or showing signs of deterioration. These compromised joints were noted particularly around window sills, corners, and near grade level, though other sections may also be affected.\n\n\u26a0\ufe0f Why This Is a Concern\n\nMortar joints play a critical role in maintaining the structural integrity and weather resistance of masonry walls. When mortar becomes loose or deteriorated:\n\n\u2022 Moisture infiltration can occur, leading to potential water damage within the wall cavity.\n\n\u2022 Freeze-thaw cycles may exacerbate cracking and spalling of bricks.\n\n\u2022 Pest intrusion becomes more likely through weakened gaps.\n\n\u2022 Over time, the overall stability of the brick veneer may be compromised, increasing the risk of costly repairs.\n\n\ud83d\udee0\ufe0f Recommendation\n\nIt is recommended that a qualified masonry contractor be consulted to repoint the affected mortar joints. Repointing involves removing the damaged mortar and replacing it with new material to restore the wall\u2019s integrity and appearance. Prompt attention to this issue will help prevent further deterioration and preserve the long-term durability of the exterior cladding.\n\n---\n\nLet me know if you\u2019d like this tailored for a specific property or inspection format.","sev":"minor","choices":[]},{"id":"5c89dd9","type":"info","title":"Probing Of Wood","text":"Any areas of wooden trim, siding, or other wood components will be probed if water damage (wood rot) was suspected. Any photos of a screwdriver stuck into wood represents water damage/wood rot to some extent. Hidden damage is always a possibility at these areas. These areas of damage will require further evaluation to determine the extent of the damage, along with repairs made as deemed necessary by a qualified contractor.","sev":"minor","choices":[]}]},{"name":"GFCIs & Electrical","c":[{"id":"4f5c680","type":"defect","title":"Exterior Receptacle- Missing In Service Cover","text":"SFTY- In-service covers are the current standard for exterior outlets.  They help prevent moisture from shorting out plugs when in use by providing a protective cover over the outlet even while plugged in.\n\nCorrective Action\n\nReplacement of all covers which do not meet this current standard is recommended.\n\nSample In-Use Cover","sev":"minor","choices":[]},{"id":"a7c2060","type":"limit","title":"Unable to Inspect Everything","text":"LMT - I was unable to inspect every electrical component or proper installation of the GFCI system according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the electrical system as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"38382d8","type":"info","title":"Inspected GFCIs","text":"I inspected ground-fault circuit interrupter receptacles and circuit breakers observed and deemed to be GFCIs using a GFCI tester, where possible.","sev":"minor","choices":[]},{"id":"836849d","type":"defect","title":"Receptical Not GFCI Protected","text":"SFTY The receptacle was not GFCI protected.  This is a safety hazard.  Replacement of the receptacle to meet current standards by a licensed electrician is recommended.","sev":"major","choices":[]},{"id":"2eb511a","type":"limit","title":"Unable to Test GFCI","text":"LMT - I was unable to test the GFCI at the exterior. Inspection restriction.","sev":"minor","choices":[]},{"id":"4a887df","type":"defect","title":"No Power Detected On Exterior Outlet","text":"The outlet did not have power at the time of the inspection.  This may be due to a loose wire connection, which could cause arcing and a fire or injury.  Recommend evaluation and repair of the outlet by a licensed electrician is recomended.","sev":"moderate","choices":[]},{"id":"424e2cd","type":"defect","title":"Polarity Reversed On Receptacle","text":"The inspectors tester shows the hot and neutral wires were reversed on this outlet.  This can cause injury as the hot current will now enter any device plugged into this outlet on the neutral circuit.  This could electrify parts of the device even when the device is off.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"ed5d81a","type":"defect","title":"Electrical Defect","text":"I observed indications of an electrical defect at the exterior.","sev":"moderate","choices":[]},{"id":"a19f6da","type":"defect","title":"GFCI Would Not Trip Using Device Test Button","text":"","sev":"moderate","choices":[]},{"id":"2bd7dbc","type":"defect","title":"Loose Receptical Box","text":"","sev":"moderate","choices":[]},{"id":"26ba46f","type":"defect","title":"Outlets Were Not Present On The Exterior Of The Home","text":"The National Electric Code (NEC) now requires a minimum of two exterior receptacles for a home, located at the front and back and usually on the wall of the house, and they must be GFCI-protected for shock prevention and have an in-use or weatherproof cover. The required receptacles cannot be higher than six foot six inches (6\u2019-6\u201d).","sev":"minor","choices":[]},{"id":"856c40a","type":"defect","title":"Fixture Not Sealed Properly","text":"The lack of a sealant and mounting block allows water to get behind the fixture.  Possible electrical hazard.  Caulk the fixture and install a J-block to prevent water from getting behind the fixture.","sev":"minor","choices":[]},{"id":"74f384a","type":"defect","title":"Light Fixture Damaged","text":"","sev":"moderate","choices":[]},{"id":"29cf975","type":"defect","title":"Doorbell Not Present","text":"","sev":"moderate","choices":[]},{"id":"9602bbf","type":"defect","title":"Improper Installation of GFCI","text":"I observed indications of improper installation at the GFCI device.","sev":"moderate","choices":[]},{"id":"97a9fbd","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"eab58db","type":"defect","title":"Missing Receptacle","text":"I observed indications that there was a missing electrical receptacle outlet at the house exterior. At a minimum, there should be at least one receptacle in the front and back of the house.","sev":"moderate","choices":[]},{"id":"f06836d","type":"defect","title":"Weatherproofing Seal Around Outlet Cover Missing","text":"The seal prevents moisture from damaging or coming in contact with th

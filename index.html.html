ds adding a cover.","sev":"minor","choices":[]},{"id":"6383af9","type":"defect","title":"Receptical Not Installed Prooerly","text":"","sev":"moderate","choices":[]},{"id":"b301d1d","type":"defect","title":"Light Cover Missing","text":"","sev":"minor","choices":[]},{"id":"31bcbf7","type":"defect","title":"Receptacles painted over","text":"Receptacles throughout the home were painted over.  This is in violation of manufacturer recommendations.  Replacement is recommended.","sev":"moderate","choices":[]},{"id":"d434264","type":"defect","title":"Temporary Cord","text":"","sev":"major","choices":[]},{"id":"d7a6eac","type":"defect","title":"Recepticle Not Energized","text":"","sev":"moderate","choices":[]},{"id":"dccddfb","type":"defect","title":"Light Fixture Is Not Functioning","text":"The light fixture was not functioning at the time of the inspection.  This could be due to a burned out light bulb or the fixture or electrical system could be damaged.","sev":"minor","choices":[]},{"id":"7e2e9e4","type":"defect","title":"Ceiling Fan Did Not Operate","text":"The inspector could not get the ceiling fan to operate. It may be damaged.  Repair recommended.","sev":"moderate","choices":[]},{"id":"bed3a19","type":"defect","title":"Open Ground","text":"SFTY- The inspector observed an electrical receptacle that showed an open ground when tested.  This is a safety hazard and should be repaired by a licensed electrician.","sev":"major","choices":[]},{"id":"3ab7b3b","type":"defect","title":"Open connection","text":"SFTY- During the inspection of the electrical system, it was observed that multiple wiring connections and/or loose wires were not installed in a junction box, resulting in an open connection.\n\nPotential Hazard: Making wiring connections outside of a junction box poses several significant hazards:\n\n\u2022\nFire Risk: Exposed wires increase the risk of electrical arcing, which can lead to sparks and potentially cause a fire.\n\n\u2022\nElectrical Shock: Exposed wiring poses a risk of electrical shock to individuals coming into contact with the wires.\n\n\u2022\nCode Violation: Wiring connections made outside of junction boxes are not compliant with electrical code standards, which could lead to legal and insurance issues.\n\nIt is strongly recommended to have a licensed electrician repair the wiring connections. Proper repair involves installing junction boxes to contain and protect the wiring connections, ensuring compliance with electrical code standards and mitigating safety hazards.","sev":"major","choices":[]}]}]},{"name":"Attic, Insulation & Ventilation","subs":[{"name":"Structural Components & Observations in Attic","c":[{"id":"d4314dd","type":"defect","title":"Possible Mold & Moisture Problem in Attic","text":"I observed indications of a possible mold growth issue and excessive moisture or humidity in the attic space. Major defect.   Mold can cause health issues and damage the structure.  For more information on the effects of the mold click here.  Remediation of the potential mold should be done by a qualified contractor.  The inspector recommends an IICRC mold abatement contractor, to find one in your area click here.\n\nWhile the inspector always recomends a IICRC certified mold abatement contractor the EPA does allow for a homeowner to abate their own mold if it is under 10 square feet.  It is important to always follow proper safety procedures (for more information click here).\n\nThere are many chemicals that are advertised to clean the mold, however they are not all equal.  The product we recommend for cleaning most areas of suspected mold is Concrobium.  The inspector has discussed the use of this product with the engineers from the company as well as a representative from the EPA and feels comfortable that, while following manufacturer instructions, the product is effective and safe to use.\n\nOnce properly cleaned the area should be primed using a mold inhibiting paint.  The product we recommend is Zinsser Mold Killing Primer.  After much research the inspector believes this product will perform as intended when used properly.","sev":"moderate","choices":[]},{"id":"cca84f5","type":"limit","title":"Could Not See Everything in Attic","text":"LMT - I could not see and inspect everything in the attic space. The access is restricted and my inspection is limited.","sev":"minor","choices":[]},{"id":"747dc22","type":"defect","title":"Active Water Penetration Observed","text":"I observed indications of active water penetration in the attic. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"b1f2f37","type":"info","title":"Structural Components Were Inspected","text":"Structural components were inspected from the attic space according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"f0c6225","type":"defect","title":"Evidence of Rodents- Observation","text":"Observation-\n\nDuring the inspection of the interior, the inspector observed rodent droppings in select areas of the home. The presence of droppings suggests recent or ongoing rodent activity, which may pose health risks and indicate potential entry points or nesting areas.\n\nRecommendation\n\nIt is recommended that a licensed pest control specialist be consulted to assess the extent of the infestation, identify entry points, and implement appropriate remediation measures. Cleaning and sanitizing affected areas, followed by sealing gaps and monitoring for further activity, will help restore a safe and pest-free environment.","sev":"minor","choices":[]},{"id":"cd77245","type":"defect","title":"Prior Water Penetration Observed","text":"I observed indications that sometime in the past there was water penetration or intrusion into the attic. Water marks were observed. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"fa16bb6","type":"defect","title":"Structural Defect in Attic","text":"I observed a major structural defect in the attic.","sev":"moderate","choices":[]},{"id":"be5e447","type":"defect","title":"Roof Truss Component Was Cut","text":"I observed engineered truss components that have been cut or modified. Trusses are engineered and should not be modified or cut after being installed. This is a major structural defect that can be corrected by a qualified professional.","sev":"moderate","choices":[]},{"id":"8607c92","type":"defect","title":"Improper Notch, Hole, or Cut","text":"I observed from the attic indications of cutting, notching and boring of framing members that may, in my opinion, present a structural or safety concern.\n\nThere are structural concerns because of this condition. Major defect.\n\nCorrection and further evaluation is recommended.\n\nNotches in solid lumber joists, rafters and beams can not be greater than 1/6th of the member's depth, must not be longer than 1/3rd of the member depth, and must not be located in the middle 1/3rd of the span.\n\nNotches at the ends must not exceed 1/4th the member depth.\n\nThe tension side of members 4 inches or greater in thickness must not be notched, except at the ends.\n\nThe diameter of holes bored or cut into members must not exceed 1/3rd the member depth.\n\nHoles must not be closer than 2 inches to the top or bottom of the member, or to any other hole located in the member. If the member is notched, the hole must not be closer than 2 inches to the notch.","sev":"moderate","choices":[]},{"id":"be0f09e","type":"defect","title":"Improper Construction Practices","text":"I observed from the attic indications of poor workmanship and poor construction techniques. There are structural concerns because of this poor construction and building practice at this area. Major defect.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"063814a","type":"defect","title":"Improper Nails Used On Roofing","text":"Large 16d nails were observed in the attic.  Improper nails may not Hold the shingles down resulting in damage,'","sev":"moderate","choices":[]},{"id":"e1c3340","type":"defect","title":"Attic Ladder Not Installed Properly","text":"The attic ladder has been modified and doesn\u2019t operate properly.  This is a safety issue.  Repair by a licensed comtract.","sev":"major","choices":[]},{"id":"34a3146","type":"limit","title":"Installation Of Ceiling Coverings Restricted Inspection","text":"LMT - The attic had cardboard installed over the ceiling which restricted the inspection of the structural components, insulation, and roof sheeting.","sev":"minor","choices":[]},{"id":"fb6332a","type":"defect","title":"Townhouse Common Wall Defect","text":"Townhouses should be separated by two one-hour fire-resistance-rated wall assemblies, with some exceptions where there is a fire sprinkler system installed.\n\nI can't see everything in the attic, including the neighbor's side of the wall. But a fire-resistance-rated wall separating the townhouses should be continuous from the foundation to the underside of the roof sheathing or deck.\n\nThere shouldn't be any openings, no plumbing or mechanical equipment, and no ducts or vents in the common wall.","sev":"minor","choices":[]},{"id":"bb5e730","type":"defect","title":"Missing Lighting for Attic Storage","text":"I observed a lack of lighting for the attic storage area.\n\nAreas used for storage require a switched lighting outlet.","sev":"moderate","choices":[]},{"id":"04bc7d3","type":"limit","title":"Attic Access Not Located","text":"LMT - The attic was not inspected.  The inspector could not find an attic access.  This is an inspection limitation.","sev":"minor","choices":[]},{"id":"c40ef12","type":"limit","title":"Personal Belongings Blocked Attic Access","text":"LMT - Personal belongings blocked parts or the complete attic.  The attic should be inspected once personal belongings are removed.","sev":"minor","choices":[]},{"id":"8013bae","type":"limit","title":"Attic Not Accessible","text":"LMT - The attic was not accessible at the time of the inspection.  Inspection restriction.","sev":"minor","choices":[]},{"id":"2f80f7e","type":"limit","title":"Condominium Limiation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Insulation in Attic","c":[{"id":"844ce13","type":"defect","title":"Additional Insulation Recommended","text":"During the inspection of the attic and ceiling insulation, the inspector observed multiple areas where insulation was compressed below 6 inches in thickness. These sections are insufficient to meet current energy standards and may allow unwanted air movement through the building envelope.\n\nRecommendation\n\nIt is recommended that a qualified insulation contractor evaluate the affected areas and perform air sealing and insulation upgrades as needed. Restoring proper insulation depth and sealing gaps will improve energy efficiency, enhance indoor comfort, and help meet modern building performance standards.\n\n  For more information on how to properly install insulation in the attic click here.","sev":"moderate","choices":[]},{"id":"72587cf","type":"info","title":"Insulation Was Inspected","text":"During the home inspection, I inspected for insulation in unfinished spaces, including attics, crawlspaces and foundation areas.  I inspected for ventilation of unfinished spaces, including attics, crawlspaces and foundation areas.  And I inspected mechanical exhaust systems in the kitchen, bathrooms and laundry area.\n\nI attempted to describe the type of insulation observed and the approximate average depth of insulation observed at the unfinished attic floor area or roof structure.\n\nI reported as in need of correction the general absence of insulation or ventilation in unfinished spaces.","sev":"minor","choices":[]},{"id":"157966f","type":"defect","title":"Attic Access- Lacks Insulation","text":"I observed indications that the access to the attic was not insulated and sealed properly. This condition will create a heat/energy loss area.\n\nRecommendation\n\nAdding insulation and air sealing at the attic access is recommended.","sev":"minor","choices":[]},{"id":"4821f5c","type":"info","title":"Type of Insulation Observed","text":"","sev":"minor","choices":["Fiberglass","Cellulose","Spray Foam","Foam-board","Mineral Wool","Vermiculite","Undeterminted","Blown In Fiberglass"]},{"id":"a4eed78","type":"defect","title":"Insulation Hanging","text":"I observed sections of the insulation that were hanging. Improperly installed. Not maintained.","sev":"moderate","choices":[]},{"id":"c32d4ce","type":"info","title":"Approximate Average Depth of Insulation","text":"Determining how much insulation should be installed in a house depends upon where a home is located. The amount of insulation that should be installed at a particular area of a house is dependent upon which climate zone the house is located and the local building codes.","sev":"minor","choices":["missing insulation","insulation thickness varied greatly","1-3 inches","3-6 inches","6-9 inches","9-12 inches","greater than 12 inches"]},{"id":"3742c35","type":"defect","title":"General Absence of Insulation","text":"I observed indications of the general absence of insulation in the unfinished attic area.","sev":"moderate","choices":[]},{"id":"8ecd372","type":"defect","title":"Insulation Compressed by Steps","text":"I observed indications that the insulation in the attic was stepped upon. The insulation in those areas are compressed. The insulation is not as thick and not performing as expected. Adding insulation in these areas is recommend.","sev":"minor","choices":[]},{"id":"926f42b","type":"defect","title":"Vapor Barrier Installed Upside Down","text":"I observed indications that the vapor barrier at the installed insulation was not installed properly. It seemed to have been installed on the incorrect side. The vapor barrier should be on the other side of the insulation. An improper installation of the vapor barrier could create moisture and condensation problems.","sev":"moderate","choices":[]},{"id":"d77bfde","type":"defect","title":"Improper Installation","text":"I observed indications that the insulation was improperly installed.","sev":"moderate","choices":[]},{"id":"6dfb73c","type":"info","title":"Approximent Insulation R-value","text":"","sev":"minor","choices":[]},{"id":"6cfd7dd","type":"limit","title":"Visual Access Restricted","text":"LMT - Covering restricted visual inspection of the insulation.","sev":"minor","choices":[]},{"id":"54525c9","type":"limit","title":"Parts Inaccessible","text":"LMT - Parts of the attic were inaccessible at the time of the inspection.  Inspection restriction.","sev":"minor","choices":[]},{"id":"b982363","type":"limit","title":"Attic Inaccessible","text":"LMT - The attic was not accessible at the time of the inspection.  Inspection Restriction.","sev":"minor","choices":[]},{"id":"2b727c0","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Ventilation in Attic","c":[{"id":"25f8f99","type":"defect","title":"Possible Microbial Growth Observed","text":"","sev":"moderate","choices":[]},{"id":"17cf048","type":"info","title":"Ventilation Inspected","text":"During the home inspection, I inspected for ventilation in unfinished spaces, including attics, crawlspaces and foundation areas. And I inspected for mechanical exhaust systems.\n\nI report as in need of correction the general absence of ventilation in unfinished spaces.","sev":"minor","choices":[]},{"id":"7db622f","type":"defect","title":"General Absence of Ventilation","text":"I observed indications of the general absence of ventilation in the unfinished attic area.","sev":"moderate","choices":[]},{"id":"50f4de5","type":"defect","title":"Attic Ventilation Insufficient","text":"Attic venting was insufficient at time of inspection. Modern standards recommend 1.5 square feet of venting area for every 300 square feet of attic floor space. Recommend an attic contractor evaluate and remedy.","sev":"moderate","choices":[]},{"id":"71b7d3c","type":"defect","title":"Attic Fan Inoperable","text":"I observed that the attic fan was inoperable at time of inspection. Recommend an attic fan specialist evaluate and repair.","sev":"moderate","choices":[]},{"id":"1782f8a","type":"defect","title":"Gable Vent Damaged","text":"Gable vent was damaged, which could allow pests to enter. Recommend a qualified attic or ventilation contractor repair.","sev":"moderate","choices":[]},{"id":"74e21fd","type":"defect","title":"Improper Installation","text":"The inspector observed that attic insulation baffles (also called ventilation chutes or rafter vents) were not installed at the eaves. Baffles are necessary to maintain an openair pathway from the soffit vents into the attic space. Without these channels, insulation can block airflow at the eaves, restricting proper attic ventilation. Insufficient ventilation can contribute to problems such as elevated attic moisture, condensation, mold growth, reduced insulation performance, and premature roof covering deterioration. Maintaining continuous airflow from the soffits to the attic ridge or roof vents is essential for temperature and moisture control within the attic.\n\nCorrective Action\n\nThe inspector recommends installation of appropriate baffles at all eave locations by a qualified contractor to ensure unobstructed ventilation and help protect the roof assembly and attic insulation from moisture\u2011related damage.","sev":"moderate","choices":[]},{"id":"b21f118","type":"defect","title":"Whole House Fan Inoperable","text":"Whole house fan was inoperable at time of inspection. Recommend a qualified whole house fan contractor evaluate and repair.","sev":"moderate","choices":[]},{"id":"e6ddef1","type":"limit","title":"Condominium Limitation","text":"LMT- This system or component is typically maintained by the condominium association and is not within the scope of this home inspection. As such, it was not evaluated. Buyers are encouraged to review the condominium association\u2019s maintenance responsibilities and inspection records for further information about the condition and upkeep of this system. If additional concerns arise, consulting the association or a qualified professional is recommended.","sev":"minor","choices":[]}]},{"name":"Mechanical Exhaust System","c":[{"id":"fcfb5be","type":"info","title":"Mechanical Exhaust in Kitchen Inspected","text":"I inspected the mechanical exhaust system in the kitchen.","sev":"minor","choices":[]},{"id":"901c888","type":"defect","title":"Bathroom Fan Exhausts Into Attic","text":"I observed that the bathroom ventilation fan exhausted into the attic space. This can cause moisture and mold issues. All mechanical exhaust fans must terminate outside.","sev":"moderate","choices":[]},{"id":"95f1682","type":"defect","title":"Attic Fan Did Not Operate","text":"","sev":"moderate","choices":[]},{"id":"48fb5bb","type":"info","title":"Mechanical Exhaust in Bathrooms Inspected","text":"I inspected the mechanical exhaust system in the bathrooms.","sev":"minor","choices":[]},{"id":"90322c3","type":"defect","title":"Dryer Exhausts Into Attic","text":"I observed that the clothes dryer exhausted into the attic space. This will cause major moisture and mold issues. This is also a fire hazard. All mechanical exhaust fans must terminate outside.","sev":"moderate","choices":[]},{"id":"c7ec7b7","type":"info","title":"Mechanical Exhaust in Laundry Room Inspected","text":"I inspected the mechanical exhaust system in the laundry room area.","sev":"minor","choices":[]},{"id":"eaeb691","type":"defect","title":"Dryer Exhausts Into Crawlspace","text":"I observed that the clothes dryer exhausted into the crawlspace. This will cause major moisture and mold issues. This is also a fire hazard. All mechanical exhaust fans must terminate outside.","sev":"moderate","choices":[]},{"id":"782ef1d","type":"info","title":"Exhaust Fans","text":"","sev":"minor","choices":["Fan Only","Fan with Light","Fan/Heat/Light","None"]},{"id":"f333503","type":"defect","title":"Exhaust Duct Loose","text":"I observed loose and disconnected duct related to the mechanical exhaust ventilation.","sev":"moderate","choices":[]},{"id":"8545b6b","type":"defect","title":"Kitchen Fan Exhausts Into Attic","text":"I observed that the kitchen ventilation fan exhausts into the attic space. This can cause moisture and mold issues. All mechanical exhaust fans must terminate outside.","sev":"moderate","choices":[]}]},{"name":"Electrical In Attic","c":[{"id":"faf1171","type":"defect","title":"Junction Box Missing Cover","text":"","sev":"moderate","choices":[]}]},{"name":"Attic Access","c":[{"id":"938e890","type":"info","title":"Attic Inspected From Access","text":"The attic was only inspected from the access.  Cellulose insulation was installed with no walkway.  Traversing across the cellulose can diminish its insulation properties.  This is a Limitation of the Inspection","sev":"minor","choices":[]},{"id":"c143db6","type":"limit","title":"Personal Belongings Blocked Attic Access","text":"LMT - Personal belongings blocked parts or the complete attic.  The attic should be inspected once personal belongings are removed.","sev":"minor","choices":[]},{"id":"b068143","type":"limit","title":"Attic Access Not Removed","text":"LMT - The attic access was secured to drywall only.  This can make it impossible for the inspector to replace if removed.  The inspector doesn\u2019t remove these types of attic accesses and recommends they are replaced with a removable access.  The attic was not inspected.  Recommend further evaluation.  Inspection limitation","sev":"minor","choices":[]},{"id":"8bda589","type":"limit","title":"Attic Not Fully Inspected- Limited Walkway","text":"LMT - The walkway in the attic did not run the full length of the attic.  Due to the height restriction the inspector did not traverse the entire attic.  Inspection limitation.","sev":"minor","choices":[]},{"id":"546cc2c","type":"info","title":"Attic Access Type","text":"","sev":"minor","choices":["Pull Down Ladder","Hatch"]},{"id":"2ce8a64","type":"defect","title":"Pull,Down Ladder Not Installed To Manufacturers Standards","text":"","sev":"major","choices":[]}]},{"name":"Roofing Fasteners","c":[{"id":"506b745","type":"defect","title":"Roofing Fasteners Not Long Enough","text":"","sev":"moderate","choices":[]}]},{"name":"Whole House Attic Fan","c":[{"id":"3972cd6","type":"limit","title":"Attic Fan Did Not Operate","text":"","sev":"minor","choices":[]}]}]},{"name":"Bathrooms","subs":[{"name":"Bathroom Toilets","c":[{"id":"08dbe5a","type":"defect","title":"Toilet Bowl Loose","text":"The toilet bowl was loose at one or more fixtures.  This could be caused by a loose flange, toilet bolts which need to be tightened, or rotted flooring.\n\nCorrective Action\n\nFurther evaluation by a licensed plumber to determine the cause of the loose toilet and repair is recommended.","sev":"major","choices":[]},{"id":"14e3134","type":"info","title":"Toilets Inspected","text":"I flushed all of the toilets.","sev":"minor","choices":[]},{"id":"dd86599","type":"defect","title":"Seat Loose","text":"The toilet seat was loose.  This can be a safety hazard.  The seat should be tightened.","sev":"minor","choices":[]},{"id":"be378c9","type":"defect","title":"Defect at Flushing Mechanism","text":"I observed indications of a defect at the flushing mechanism in the toilet tank.","sev":"moderate","choices":[]},{"id":"3f5b0a7","type":"defect","title":"Toilet Did Not Flush","text":"I observed that the toilet did not flush as expected.","sev":"minor","choices":[]},{"id":"566566e","type":"defect","title":"Active Leak at Shutoff Valve","text":"I observed an active water leak at the toilet's shutoff valve.","sev":"moderate","choices":[]},{"id":"6b91c9a","type":"defect","title":"Active Water Leak at Toilet","text":"I observed an active water leak at a toilet.","sev":"moderate","choices":[]},{"id":"9aa3888","type":"defect","title":"Damage at Toilet","text":"I observed damage at a toilet.","sev":"moderate","choices":[]},{"id":"d569dae","type":"defect","title":"Loose Handle at Toilet","text":"I observed a loose handle at the toilet.","sev":"minor","choices":[]},{"id":"7be58e0","type":"defect","title":"Missing Component at Toilet","text":"I observed a missing component at the toilet.","sev":"minor","choices":[]},{"id":"0a70e95","type":"defect","title":"Missing Toilet","text":"I observed that there was no toilet. Missing toilet.","sev":"moderate","choices":[]},{"id":"48d8409","type":"defect","title":"No Running Water at Toilet","text":"I observed that there was no running water at the toilet.","sev":"moderate","choices":[]},{"id":"0e8d9ab","type":"defect","title":"Inadequate Clearance at Toilet","text":"I observed indications of inadequate clearance at the toilet.\n\nThere should be 21 inches of clearance in front of the toilet. And 15 inches of clearance measured from the center of the toilet.","sev":"minor","choices":[]}]},{"name":"Sinks, Tubs & Showers","c":[{"id":"0aefa60","type":"limit","title":"Plumbing Access Panel Seal Shut","text":"LMT - I observed that the plumbing access panel was sealed shut. Inspection restriction.","sev":"minor","choices":[]},{"id":"e1afd9e","type":"defect","title":"Drain Trap- Does Not Meet Current Standard- S-trap","text":"The inspector observed indications of a defect at the sink drain trap. Plumbing was installed improperly and double trapped, was missing a vent, and a flexible drain connector was used.  The inspector also noted an S-trap, which are not permitted.  S-traps can allow water to be siphoned from the weir of the trap, allowing sewer gases to enter the home.\n\nCorrective Action\n\nThe inspector recommends evaluation of the drain piping under bathroom sinks by a licensed plumber and repairs made as necessary to meet current standards.","sev":"moderate","choices":[]},{"id":"327dc7d","type":"info","title":"Ran Water at Sinks, Tubs & Showers","text":"I ran water at all bathroom sinks, bathtubs, and showers. I inspected for deficiencies in the water supply by viewing the functional flow in two fixtures operated simultaneously.","sev":"minor","choices":[]},{"id":"f22299f","type":"limit","title":"Plumbing Panel Not Installed","text":"LMT - I observed that there was not a plumbing access panel installed for the bathroom fixtures. I recommended one to be installed.","sev":"minor","choices":[]},{"id":"002a8e1","type":"defect","title":"Stopper Missing","text":"The sink stopper is missing.  Replacement is recommended.","sev":"minor","choices":[]},{"id":"4da8b26","type":"defect","title":"Sink Drains Slow","text":"The bathroom sink drains slow.  This could be due to poor design, a blockage in the drain line, or hair in the drain.  Repair by a licensed plumber recommended.","sev":"minor","choices":[]},{"id":"9b03484","type":"defect","title":"Active Water Leak","text":"I observed indications of an active water leak.","sev":"moderate","choices":[]},{"id":"8121d8e","type":"defect","title":"Tub Stopper Defect","text":"I observed that the tub stopper does not work. Defect.","sev":"moderate","choices":[]},{"id":"1341089","type":"defect","title":"Caulking Cracked, Shrunk, and/or Mildewed","text":"The tub caulking was cracked, shrunk, or mildewed.  The caulking should be replaced.  Improper caulking can lead to water damage behind the tub.  Replacement of the caulking is recommended.","sev":"minor","choices":[]},{"id":"626a32b","type":"defect","title":"Tub Spout- Loose","text":"A loose tub spout was observed.  This can mean the plumbing was installed improperly which could result in a leak.\n\nRecommendation\n\nThe inspector recommends the tub spout be evaluated and installed to meet current plumbing standards.","sev":"moderate","choices":[]},{"id":"7b9ab17","type":"defect","title":"Damaged Tiles in Shower","text":"I observed damaged tiles in the bathroom shower.","sev":"moderate","choices":[]},{"id":"b768954","type":"defect","title":"Evidence Of Water Leak","text":"There is evidence of a past or present water leak under the bathroom sink.  It was not active at the time of the inspection and may have been fixed.","sev":"minor","choices":[]},{"id":"ef3c57d","type":"defect","title":"Showerhead Leaking","text":"The showerhead was leaking at the connection point.  It may need to be tightened, sealed, or replaced.","sev":"minor","choices":[]},{"id":"925f75a","type":"defect","title":"Aerator Missing/ Damaged","text":"The aerator of the faucet is missing or damaged.  This will allow a non-laminar flow of water which could splash out of the sink.  Replacement is recommended.","sev":"minor","choices":[]},{"id":"657e49d","type":"defect","title":"Defect at Trap Component","text":"I observed indications of a defect at the sink drain trap.","sev":"moderate","choices":[]},{"id":"62f0ad4","type":"defect","title":"Damage at Fixture","text":"I observed damage at the fixture.","sev":"moderate","choices":[]},{"id":"64c7891","type":"defect","title":"Inadequate Water Flow at Fixture","text":"I observed indications of a defect in the water supply by viewing the functional flow in two fixtures operated simultaneously. The flow was not as strong as expected.","sev":"moderate","choices":[]},{"id":"1673293","type":"defect","title":"Signs of rodents","text":"","sev":"minor","choices":[]},{"id":"e0fb62d","type":"defect","title":"Sink Cracked/ Damaged","text":"The sink has hairline or moderate cracks that could allow water to leak.  There was not a leak observed at the time of the inspection, however the leak could form at anytime.  Replacement of the sink or refinishing is recommended.","sev":"moderate","choices":[]},{"id":"79dcc5a","type":"defect","title":"Drain Rusted","text":"","sev":"moderate","choices":[]},{"id":"443eb9a","type":"info","title":"Bathroom Sink Types","text":"","sev":"minor","choices":["Pedistal","Vanity Double Bowl","Vanity Single Bowl","Wall Hung Single Bowl"]},{"id":"9ce06a5","type":"info","title":"Tub/ Surround/ Shower Material","text":"","sev":"minor","choices":["Fiberglass/ Acrylic","Steel","Tile","None","Claw foot","Curtain"]},{"id":"d4ac0d1","type":"defect","title":"No Running Water at Fixture","text":"I observed that there was no running water at the fixture.","sev":"moderate","choices":[]},{"id":"6c6f5c1","type":"info","title":"Shower Door Type","text":"","sev":"minor","choices":["None","Framelss Glass","Framed Glass","Swing","Sliding"]},{"id":"914541f","type":"defect","title":"Corrosion At Shut Off Valve","text":"Minor corrosion was observed at the shut off valve.  This could indicate a current or past leak.  Further evaluation by a licensed plumber is recommended.","sev":"minor","choices":[]},{"id":"43f5048","type":"defect","title":"Drawer Loose","text":"","sev":"minor","choices":[]},{"id":"55188b0","type":"defect","title":"Light not rated for wet location","text":"","sev":"moderate","choices":[]},{"id":"67ff4ea","type":"defect","title":"Low water pressure","text":"","sev":"moderate","choices":[]},{"id":"f58fbf0","type":"defect","title":"Faucet Improperly Repaired","text":"The faucet shows signs of being repaired Improperly.  Replacement of the faucet is recommended to prevent future failure.","sev":"moderate","choices":[]},{"id":"6be92d7","type":"defect","title":"Cold Handle Doesnt Operate Properly","text":"","sev":"moderate","choices":[]},{"id":"ef439d7","type":"defect","title":"Tub Surround Loose","text":"The tub surround was loose.  This type of tub surround is known to have a short lifespan which is accelerated when not properly installed, such as in this home.  Budget for replacement of the tub surround.  Hidden damage may exist behind the tub surround.","sev":"moderate","choices":[]},{"id":"6ece3fd","type":"defect","title":"Loose Fixture","text":"During the inspection of the bathroom plumbing fixtures, the inspector observed that the faucet was loose and not securely installed. The fixture showed movement when handled and appeared to lack proper anchoring to the sink or countertop surface.\n\nA loose bathroom faucet presents several functional and maintenance concerns:\n\n\u2022 Water leakage risk, especially around the base where movement may compromise the seal.\n\n\u2022 Reduced usability, as the fixture may shift during operation or fail to maintain proper alignment.\n\n\u2022 Potential damage to plumbing connections, due to stress or vibration from repeated use.\n\n\u2022 Indication of improper installation, which may affect long-term performance and durability.\n\nRecommendation\n\nIt is recommended that a qualified plumber or contractor evaluate and properly secure the faucet fixture. Reinstallation or adjustment will help prevent leaks, improve functionality, and ensure the fixture remains stable during regular use.","sev":"moderate","choices":[]},{"id":"0f0f9c0","type":"defect","title":"Loose Tiles in Shower","text":"I observed loose tiles in the bathroom shower which indicates water damage behind the tiles.","sev":"moderate","choices":[]},{"id":"ab3fb63","type":"defect","title":"Missing Component at Fixture","text":"I observed a missing component at the fixture.","sev":"moderate","choices":[]},{"id":"44a0699","type":"defect","title":"Hot & Cold Was Reversed","text":"I observed that the hot and cold water supply at the fixture was reversed. The standard for a fixture is to have the hot water supply controlled by the valve or handle on the left and the cold water by the right-side handle.","sev":"moderate","choices":[]},{"id":"fb7621b","type":"defect","title":"Handle Loose","text":"I observed that the fixture handle is loose.","sev":"minor","choices":[]},{"id":"10b3dfe","type":"defect","title":"Shower Head Loose","text":"I observed that the shower head is loose.","sev":"minor","choices":[]},{"id":"20daf2b","type":"defect","title":"Inadequate Clearance","text":"I observed indications of inadequate clearance at the fixture.\n\nThere should be 21 inches of clearance in front of the sink and bathtub. And 30 inches of clearance at the shower.","sev":"minor","choices":[]},{"id":"661aaac","type":"limit","title":"Not functional","text":"LMT - The fixture was not functional at the time of the inspection.  This can prevent inspection of supply lines, drains, and hide leaks.  The fixture should be inspected once it is functional again.","sev":"minor","choices":[]},{"id":"36a7001","type":"defect","title":"Safety Glazing Defect","text":"I observed indications of a defect related to the required safety glazing in the bathroom.\n\nWindows and doors within the area of a tub, shower or sauna require safety glazing. Those areas are specific hazardous locations because the occupant could break the glazing, causing serious injury.","sev":"moderate","choices":[]},{"id":"f764db9","type":"defect","title":"Tub chipped","text":"The tubs had chips out of the finish.  The inspector recommends replacement of the tub however you could also refinish it.","sev":"moderate","choices":[]},{"id":"9210490","type":"defect","title":"Flexible Drain Observed","text":"","sev":"moderate","choices":[]},{"id":"05c1403","type":"defect","title":"Corroded Water Supply Lines","text":"The inspector noted corroded pipes under the bathroom sink.  This could cause a leak and damage if left without repair.  Repair by a licensed plumber is recommended.","sev":"major","choices":[]}]},{"name":"Hydromassage Bathtub","c":[{"id":"2fc43e8","type":"info","title":"Tub Filled and Turned On","text":"I filled the tub and turned on the bubbles.","sev":"minor","choices":[]},{"id":"cfac63c","type":"defect","title":"Missing Access at Hydromassage Tub","text":"I observed missing access to the electrical equipment for the hydromassage bathtub.\n\nAccess is required to all electrical equipment of the hydromassage tub. Receptacles supplying equipment must be located so the face is within direct view and within 1 foot of the service access opening.","sev":"moderate","choices":[]},{"id":"3dfa00a","type":"defect","title":"Missing GFCI for Tub Equipment","text":"I observed a lack of GFCI protection for the hydromassage tub equipment.\n\nHydromassage bathtub electrical equipment must be on an individual branch circuit and be protected by a readily accessible GFCI device.","sev":"moderate","choices":[]},{"id":"e27427e","type":"defect","title":"Active Water Leak","text":"I observed indications of an active water leak at the tub.","sev":"moderate","choices":[]},{"id":"1c333f4","type":"defect","title":"Damage at Tub","text":"I observed damage at the hydromassage bathtub.","sev":"minor","choices":[]},{"id":"4d52532","type":"defect","title":"Loose / Missing Component","text":"I observed a loose or missing component at the tub.","sev":"minor","choices":[]},{"id":"7f59110","type":"defect","title":"No Running Water at Fixture","text":"I observed that there was no running water at the tub fixture.","sev":"moderate","choices":[]},{"id":"87f0815","type":"defect","title":"Hot & Cold Was Reversed","text":"I observed that the hot and cold water supply at the tub fixture was reversed.\n\nThe standard for a fixture is to have the hot water supply controlled by the valve or handle on the left and the cold water by the right-side handle.","sev":"moderate","choices":[]},{"id":"1380ed4","type":"defect","title":"Tub Stopper Defect","text":"I observed that the tub stopper does not work. Defect.","sev":"moderate","choices":[]}]},{"name":"Bathroom Exhaust Fan / Window","c":[{"id":"9e53492","type":"info","title":"Inspected Bath Exhaust Fans","text":"I inspected the exhaust fans of the bathroom(s). All mechanical exhaust fans should terminate outside. Confirming that the fan exhausts outside is beyond the scope of a home inspection.","sev":"minor","choices":[]},{"id":"4e68813","type":"defect","title":"Bath Fan- Vents To Attic","text":"The bath fan vents directly into the attic.  This introduces a large amount of moisture into the attic and can cause moisture damage and mold overtime.\n\nRecommendation\n\nThe inspector recommends a licensed mechanical contractor installed the bath fan to terminate on the exterior of the home.","sev":"moderate","choices":[]},{"id":"cbe8ce5","type":"defect","title":"Bath Fan Did Not Turn On","text":"I observed that the bathroom exhaust fan did not turn on as expected.","sev":"moderate","choices":[]},{"id":"ab57af2","type":"defect","title":"Fan Rattles","text":"I observed indications that the fan rattles unexpectedly.","sev":"minor","choices":[]},{"id":"8dfcac1","type":"defect","title":"Light Did Not Turn On","text":"I observed that the bathroom light did not turn on. Could be a light bulb not working, or it could be something electrical.","sev":"moderate","choices":[]},{"id":"b7d00fb","type":"defect","title":"Improperly Exhausting","text":"I observed that the bathroom fan is improperly exhausting air from the bathroom.\n\nExhaust air from bathrooms, toilet rooms, water closet compartments, and other similar rooms shall not be:\n\n\u2022 exhausted into an attic, soffit, ridge vent, crawlspace, or other areas inside the building; or\n\n\u2022 recirculated within a residence or to another dwelling unit.","sev":"moderate","choices":[]},{"id":"fda5c84","type":"defect","title":"Cracked Glass","text":"I observed cracked windowpane glass. Hazardous.","sev":"moderate","choices":[]},{"id":"b6b43c5","type":"defect","title":"Missing Component at Fan","text":"I observed a missing component or piece of the bathroom fan.","sev":"moderate","choices":[]},{"id":"7b31992","type":"defect","title":"Missing Fan","text":"I observed that the bathroom does not have a mechanical exhaust fan installed.\n\nRegardless of what kind of ventilation system may be installed for the rest of the house, exhaust fans are recommended in the bathrooms to remove excess moisture, cleaning chemical fumes, etc. The fan should be ducted to exhaust outside of the home.","sev":"moderate","choices":[]},{"id":"3ca048e","type":"defect","title":"Loose Fan","text":"I observed that the bathroom fan is loose.","sev":"minor","choices":[]},{"id":"79ffa8e","type":"defect","title":"Excessive Moisture/Condensation","text":"I observed indications of excessive moisture and condensation in the bathroom.\n\nWarm, moist air may condense on cold surfaces in the bathroom. If mold develops, it may cause health problems for sensitive occupants. Condensation could cause damage to the walls or surface materials.","sev":"minor","choices":[]},{"id":"a5994c2","type":"defect","title":"Moisture at Window","text":"I observed indications of excessive moisture or water intrusion at a window. Further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"f5c16b5","type":"defect","title":"Damaged Hardware at Window","text":"I observed damage to the hardware at a window.","sev":"moderate","choices":[]},{"id":"f016166","type":"defect","title":"Window (Glazing) Inside Shower","text":"I observed that the window inside the shower area is a safety defect. The window glass does not appear to be safety glass. Potentially hazardous.\n\nWindows (or glazing) in walls of bathtubs and showers where the bottom edge of the glazing is less than 60 inches measured vertically above any standing or walking surface:\n\n\u2022 is considered a hazardous location; and\n\n\u2022 must be safety glazing (or safety glass); and\n\n\u2022 must be identified by the manufacturer's designation as safety glass.","sev":"moderate","choices":[]},{"id":"c811b64","type":"defect","title":"Heat Lamp Defect","text":"I observed that the heat lamp fixture in the bathroom did not work.","sev":"moderate","choices":[]},{"id":"f101328","type":"limit","title":"No Bath Fan","text":"LMT -  A ventilation fan was not installed in the bathroom.\n\nThe presence of a bath fan in a residential property is of significant importance and serves multiple essential purposes. A properly functioning bath fan plays a crucial role in maintaining a healthy and comfortable living environment while also preserving the structural integrity of the home.\n\nA bath fan effectively removes excess moisture and humidity from the bathroom. During showers or baths, high levels of moisture are generated, which can lead to the formation of mold, mildew, and other moisture-related issues. These problems not only create an unsightly appearance but also pose potential health risks to the occupants, such as respiratory problems and allergies. By expelling moist air and preventing its accumulation, a bath fan helps to mitigate these concerns and maintain a dry and hygienic bathroom environment.\n\nFurthermore, the elimination of excess moisture through a bath fan also helps to safeguard the structural integrity of the property. Excessive humidity can lead to the deterioration of building materials, such as drywall, wood framing, and paint. Prolonged exposure to moisture can cause these materials to warp, decay, or even promote the growth of rot. By efficiently ventilating the bathroom, a bath fan aids in preventing moisture-related damage and prolongs the lifespan of the building components.\n\nIn addition to moisture control, a bath fan assists in odor removal. Bathrooms often contain strong odors from personal hygiene activities. A properly functioning fan helps to extract these odors, preventing them from spreading throughout the home and ensuring a more pleasant and fresh-smelling environment.\n\nMoreover, the presence of a bath fan contributes to the overall comfort of the occupants. It helps to reduce steam, which can create discomfort by making the bathroom feel excessively warm and humid. By swiftly removing steam and maintaining a comfortable level of humidity, a bath fan enhances the overall enjoyment and usability of the bathroom space.","sev":"minor","choices":[]},{"id":"f2bfb7c","type":"defect","title":"Heat Fan Defect","text":"I observed that the heat fan is defective. Not working.","sev":"moderate","choices":[]},{"id":"c741d92","type":"defect","title":"Water Damage At Window Trim","text":"Many windows show signs of condensation in the interior of the home.  This can cause damage to trim and the surrounding areas.  Hidden damage may exist.  This could be due to the humidifier being set too high or a lack of ventilation in the home.","sev":"moderate","choices":[]},{"id":"55df427","type":"defect","title":"Fan nearing end of useful life","text":"","sev":"moderate","choices":[]},{"id":"5309a5f","type":"defect","title":"Window Not Safety Glazed","text":"Windows within 60 inches horizontal from the waters edge of a bathtub, shower, sauna, steamroom, hot tub, spa, whirlpool, or swimming pool and less than 60 inches above the walking surface is required to be constructed of safety glazing.  This is a safety hazard and should be corrected by a licensed contractors as soon as possible.","sev":"major","choices":[]}]},{"name":"GFCIs & Electrical","c":[{"id":"43dcf1d","type":"defect","title":"Missing GFCI","text":"I observed indications that a GFCI is missing in an area that is required to keep people safe.","sev":"moderate","choices":[]},{"id":"613c744","type":"limit","title":"Unable to Inspect Everything","text":"LMT - I was unable to inspect every electrical component or proper installation of the GFCI system according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the electrical system as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"6c77260","type":"info","title":"Inspected GFCIs","text":"I inspected ground-fault circuit interrupter receptacles and circuit breakers observed and deemed to be GFCIs using a GFCI tester, where possible.","sev":"minor","choices":[]},{"id":"7a61afc","type":"limit","title":"Unable to Test GFCI","text":"LMT - I was unable to test the GFCI at the exterior. Inspection restriction.","sev":"minor","choices":[]},{"id":"00cce50","type":"defect","title":"Hot and Neutral Wires Reversed","text":"The inspectors tester shows the hot and neutral wires were reversed on this outlet.  This can cause injury as the hot current will now enter any device plugged into this outlet on the neutral circuit.  This could electrify parts of the device even when the device is off.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"db38920","type":"defect","title":"Missing Receptacle","text":"I observed indications that there was a missing electrical receptacle outlet at the house exterior. At a minimum, there should be at least one receptacle in the front and back of the house.","sev":"moderate","choices":[]},{"id":"1d4e6b6","type":"defect","title":"No Power Detected On GFCI Outlet","text":"The outlet did not have power at the time of the inspection.  This may be due to a loose wire connection, which could cause arcing and a fire or injury.  Recommend evaluation and repair of the outlet by a licensed electrician is recomended.","sev":"moderate","choices":[]},{"id":"7db66b5","type":"defect","title":"GFCI Defect","text":"I observed indications of a defect at a GFCI.","sev":"moderate","choices":[]},{"id":"827cc56","type":"defect","title":"Improper Installation of GFCI","text":"I observed indications of improper installation at the GFCI device.","sev":"moderate","choices":[]},{"id":"85ceaa3","type":"defect","title":"Missing In Service Receptical Cover","text":"In-service covers are the current standard for exterior outlets.  They help prevent moisture from shorting out plugs when in use by providing a protective cover over the outlet even while plugged in.  Replacement of all covers which do not meet this current standard is recommended.","sev":"minor","choices":[]},{"id":"70d17ac","type":"defect","title":"Outlets Were Not Present On The Exterior Of The Home","text":"The National Electric Code (NEC) now requires a minimum of two exterior receptacles for a home, located at the front and back and usually on the wall of the house, and they must be GFCI-protected for shock prevention and have an in-use or weatherproof cover. The required receptacles cannot be higher than six foot six inches (6\u2019-6\u201d).","sev":"minor","choices":[]},{"id":"1e04e2a","type":"defect","title":"Hot and Ground Wires Reversed","text":"The inspectors tester shows the hot and ground wires were reversed on this outlet.  This can cause injury as the outlet and bonding circuit could be electrified.  Immediate repair by a licensed electrician is recomended.","sev":"major","choices":[]},{"id":"dbd97b7","type":"defect","title":"Electrical Defect","text":"I observed indications of an electrical defect at the exterior.","sev":"moderate","choices":[]},{"id":"ba537a4","type":"defect","title":"GFCI Wouldn't Reset","text":"The tested GFCI would not reset.","sev":"moderate","choices":[]},{"id":"e998d00","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"cc70da3","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"2104926","type":"defect","title":"Weatherproofing Seal Around Outlet Cover Missing","text":"The seal prevents moisture from damaging or coming in contact with the electrical circuit.  Seal gaps with an approved gasketing material.","sev":"minor","choices":[]},{"id":"f57f51e","type":"defect","title":"Bulb Is Flickering","text":"The flickering is related to loose wiring.  Ensure the wires are securely connected with a proper connector.  If the bulb is still flickering, have repaired by a qualified electrician.  A flickering bulb may indicate potential loose wiring.","sev":"minor","choices":[]},{"id":"0ba4e05","type":"defect","title":"Fixture Not Sealed Properly","text":"The lack of a sealant and mounting block allows water to get behind the fixture.  Possible electrical hazard.  Caulk the fixture and install a J-block to prevent water from getting behind the fixture.","sev":"minor","choices":[]},{"id":"a969a26","type":"defect","title":"Receptacle Box Loose","text":"A loose receptacle box could cause the wiring to become loose or damaged.  Repair by a licensed electrician is recommended.","sev":"minor","choices":[]}]},{"name":"GFCI & Electric in Bathroom","c":[{"id":"ad20188","type":"info","title":"GFCI-Protection Tested","text":"I inspected the GFCI-protection at the receptacle near the bathroom sink by pushing the test button at the GFCI device or using a GFCI testing instrument.\n\nAll receptacles in the bathroom must be GFCI protected.","sev":"minor","choices":[]},{"id":"38fdd71","type":"defect","title":"Receptacle Is Not GFCI Protected","text":"I observed that the receptacle in the bathroom is not testing as being GFCI protected. This is a hazardous condition.","sev":"moderate","choices":[]},{"id":"94818d4","type":"defect","title":"GFCI Not Testing As Functional","text":"I observed a defect at the GFCI in the bathroom. It was not testing properly. Not functioning. Further evaluation by a licensed electrician is recomended.","sev":"moderate","choices":[]},{"id":"3ebbe79","type":"defect","title":"Missing Switch Cover","text":"","sev":"moderate","choices":[]},{"id":"3c8b6a7","type":"defect","title":"Light Within Shower/Tub Defect","text":"I observed a lighting fixture within close proximity of a shower/tub fixture. It does not appear to be an approved lighting fixture that is permitted in this zone.\n\nThis zone is 3 feet horizontal by 8 feet vertical above the threshold of a shower or the rim of a bathtub. This is a hazardous condition.\n\nA recessed or surface mounted light fixture is allowed in this zone, but it must be designed for use in a damp location. I will not be able to confirm or deny this type of fixture. It's beyond the scope of a home inspection. Further evaluation is recommended in order to be safe.","sev":"moderate","choices":[]},{"id":"9cb13c4","type":"defect","title":"GFCI Improperly Wired","text":"I observed a defect at the GFCI in the bathroom. It was not properly wired. Repair by a licensed electrician is recommended.","sev":"moderate","choices":[]},{"id":"17aeeb2","type":"defect","title":"GFCI Wouldn't Trip","text":"SFTY- The tested GFCI would not trip when using the inspectors testing device.  This could be an idication of a failed device or improper wiring technique.  Repair by a licensed electrician is recommended.","sev":"major","choices":[]},{"id":"0588f26","type":"defect","title":"Missing Receptacle Within 3' of Sink","text":"I observed that there was no receptacle within 3 feet of the bathroom sink. This is a requirement. And this receptacle must be GFCI protected.","sev":"moderate","choices":[]},{"id":"72830e9","type":"defect","title":"Light/ Fan Missing Cover","text":"The cover is missing from the light/ fan fixture.  This is cosmetic only.","sev":"minor","choices":[]},{"id":"9b67a62","type":"defect","title":"Receptacle Within Tub/Shower Defect","text":"There is a receptacle within or directly over a tub or shower space. This is a hazardous condition.","sev":"moderate","choices":[]},{"id":"a05a207","type":"defect","title":"Switch Within Tub/Shower Defect","text":"There is a switch within or directly over a tub or shower space. This is a hazardous condition.","sev":"moderate","choices":[]},{"id":"7529734","type":"defect","title":"Ceiling Fan Within Shower/Tub Defect","text":"I observed a ceiling fan fixture within close proximity of a shower/tub fixture.\n\nThis zone is 3 feet horizontal by 8 feet vertical above the threshold of a shower or the rim of a bathtub. This is a hazardous condition.","sev":"moderate","choices":[]}]},{"name":"Heat Source in Bathroom","c":[{"id":"4b40267","type":"defect","title":"Nearing End Of Useful Life","text":"","sev":"minor","choices":[]},{"id":"40ab14f","type":"info","title":"Heat Source in Bathroom Was Inspected","text":"I inspected the heat source in the bathroom (register/baseboard).","sev":"minor","choices":[]},{"id":"f02e643","type":"defect","title":"Did Not Turn On","text":"I observed that the heat source in the bathroom did not turn on.","sev":"moderate","choices":[]},{"id":"492ab84","type":"defect","title":"Missing Heat Source in Bathroom","text":"I observed that there is a missing heat source in the bathroom. Every bathroom should have a source of heat.","sev":"moderate","choices":[]},{"id":"9e6661e","type":"defect","title":"Register Covered","text":"I observed that the heat source is covered up. There should be a functional heat source in the bathroom.","sev":"moderate","choices":[]},{"id":"cb3cb41","type":"defect","title":"Damage to Heat Source","text":"I observed that the heat source unit in the bathroom is damaged. Defect.","sev":"moderate","choices":[]}]},{"name":"Cabinetry, Ceiling, Walls & Floor","c":[{"id":"13cafb2","type":"defect","title":"Self Adhesive Tile","text":"Self adhesive tile is known to have a short lifespan when installed in wet locations.  Budget for replacement and/or repair in the near future.","sev":"minor","choices":[]},{"id":"439036c","type":"defect","title":"Ceiling Damage","text":"I observed damage at the bathroom ceiling.","sev":"minor","choices":[]},{"id":"85203b5","type":"defect","title":"Wall Damage","text":"I observed damage at the bathroom ceiling.","sev":"minor","choices":[]},{"id":"3073674","type":"defect","title":"Floor Damage","text":"I observed damage at the bathroom floor.","sev":"minor","choices":[]},{"id":"f3a66ab","type":"defect","title":"Cabinet Damage","text":"I observed indications of damage at the bathroom cabinetry.","sev":"minor","choices":[]},{"id":"d719c35","type":"defect","title":"Water Damage at Cabinet Shelf","text":"I observed indications of water damage at the bottom shelf of the bathroom cabinet, under the sink. Indication of a prior water leak.","sev":"minor","choices":[]},{"id":"347f9bd","type":"defect","title":"Mirror Defect","text":"I observed indications of a defect at the mirror in the bathroom.","sev":"minor","choices":[]},{"id":"e0fe24f","type":"defect","title":"Loose Cabinet Door","text":"I observed a loose cabinet door.","sev":"minor","choices":[]},{"id":"3613760","type":"defect","title":"Ceiling Height Too Short","text":"A bathroom, toilet room, or laundry room must have  a ceiling height of at least 6'8\" with the exception of beams, girders, ducts, or other obstructions that can reduce the requirement to 6'4\".  Repair to meet current standards by a licensed contractor is recommended.","sev":"minor","choices":[]}]},{"name":"Door","c":[{"id":"b69d943","type":"defect","title":"Door Does Not Close Properly","text":"I observed that the bathroom door did not close properly.","sev":"minor","choices":[]},{"id":"55584a0","type":"defect","title":"Door Doesn't Latch","text":"I observed that a door does not latch and close properly.","sev":"minor","choices":[]},{"id":"a0c4aa2","type":"defect","title":"Door Lock Not Working","text":"I observed that the bathroom door did not lock properly.","sev":"minor","choices":[]},{"id":"4b44791","type":"defect","title":"Minor Damage at Door","text":"I observed indications of minor damage at the bathroom door.","sev":"minor","choices":[]},{"id":"983a102","type":"defect","title":"Closet Door Missing","text":"I observed that a closet door is missing.","sev":"minor","choices":[]},{"id":"acb038a","type":"defect","title":"Hinges Loose","text":"","sev":"minor","choices":[]},{"id":"c636ad7","type":"defect","title":"Major Damage at Door","text":"I observed major damage at the bathroom door.","sev":"minor","choices":[]},{"id":"f2345e0","type":"info","title":"Door Material","text":"","sev":"minor","choices":["Hollow Core","Solid Core","Louvered","Solid Wood","Metal","Mirror"]},{"id":"177582a","type":"info","title":"Door Type","text":"","sev":"minor","choices":["Swing","Bifold","Pocket","Sliding"]}]}]},{"name":"Doors, Windows & Interior","subs":[{"name":"Doors","c":[{"id":"25b9e77","type":"info","title":"Doors Inspected","text":"I inspected a representative number of doors according to the Home Inspection Standards of Practice by opening and closing them. I did not operate door locks and door stops, which is beyond the scope of a home inspection.","sev":"minor","choices":[]},{"id":"0c1478b","type":"defect","title":"Door Binding","text":"The interior door binds when operated.  Adjustment needed.","sev":"minor","choices":[]},{"id":"d795eda","type":"defect","title":"Door Doesn't Latch","text":"I observed that a door does not latch and close properly.","sev":"minor","choices":[]},{"id":"e0cd3b7","type":"defect","title":"Damaged Door","text":"I observed damage to the door.","sev":"minor","choices":[]},{"id":"9236210","type":"defect","title":"Damaged Door Hardware","text":"I observed damage to the door hardware.  The bifold door top roller was damaged and the door would not properly open and close.  Replacement of the hardware is recommended.\n\nExample of bifold door hardware.  Your door is missing the white roller on the right hand side of the picture.","sev":"minor","choices":[]},{"id":"c4e2d28","type":"defect","title":"Missing Weather Stripping","text":"I observed missing weather stripping at the exterior door.","sev":"minor","choices":[]},{"id":"03e0779","type":"defect","title":"Door Sticks","text":"I observed that the door sticks.  Adjustment is necessary.","sev":"minor","choices":[]},{"id":"0c585f1","type":"defect","title":"Screwed Shut","text":"","sev":"moderate","choices":[]},{"id":"fb5e8c1","type":"defect","title":"Closet Door Missing","text":"I observed that a closet door is missing.","sev":"minor","choices":[]},{"id":"a9d7fb1","type":"defect","title":"Closet Light Fixture Defecty","text":"I observed a defect at the closet light fixture. Potential fire hazard.","sev":"moderate","choices":[]},{"id":"4d52507","type":"info","title":"Door Type","text":"","sev":"minor","choices":["Bifold","Swing","Pocket","Sliding"]},{"id":"50f5ea7","type":"defect","title":"Damaged Trim at Door","text":"I observed damaged wood trim at the door.","sev":"minor","choices":[]},{"id":"4b54758","type":"info","title":"Door Material","text":"","sev":"minor","choices":["Hollow Core","Solid Wood","Metal","Mirror"]},{"id":"9d9c4e0","type":"defect","title":"Door Off Track","text":"","sev":"moderate","choices":[]},{"id":"642db9f","type":"defect","title":"Insulated Glass Window Lost Seal","text":"The problem here is not high indoor moisture levels but rather that the double pane \"insulated\" glass windows have lost their seal against air intrusion. Once an insulated glass window seal has been broken, changing temperatures and variations in barometric pressure are sufficient to periodically push outdoor or indoor air into the space between the insulated glass panes.\n\neveral factors can cause the loss of seal of an insulated glass window including mechanical stresses such as uneven pressures on the window sash due to building or framing movement (perhaps due to inadequate framing around the window), poor quality original window sash construction, or mechanical damage to the window sash from other sources.\n\nBecause at least sometimes the air entering the insulated glass window sash (or door glass) contains more moisture than was in the desiccated air (or other gas) originally within the sealed window, that moisture first enters, then condenses on the interior surfaces of the glass.\n\nLater even if changes in temperature and barometric pressure cause the window to \"exhaust\" or \"breathe out\" some of its air, the moisture that was condensed on the window glass interior surface remains.\n\nThe effect of the minute but ongoing breathing in and out of the insulated window whose seal has been lost is an accumulation of moisture and on occasions air and water borne minerals or dust. The combination of moisture, minerals and dust condensing on the interior surfaces of the insulated glass window causes an ever-increasing fogging of the window sash until it becomes as opaque as the windows shown in our photograph above.\n\nThe repair for this condition is window glass or complete window replacement.","sev":"moderate","choices":[]},{"id":"913d98e","type":"defect","title":"Interior-Keyed Deadbolt","text":"I observed at the exterior door an interior-keyed dead bolt, which makes an emergency exit difficult. This is a potential hazardous condition. There should be no interior-keyed deadbolts installed. Replacement recommended.","sev":"minor","choices":[]},{"id":"0e4b213","type":"defect","title":"Loose Handle","text":"","sev":"moderate","choices":[]},{"id":"e9a2566","type":"info","title":"Door Missing","text":"","sev":"minor","choices":[]},{"id":"af9acc0","type":"defect","title":"Door Missing","text":"","sev":"minor","choices":[]},{"id":"7d30cf9","type":"defect","title":"Door Hardware- Missing","text":"The inspector observed door was missing hardware at the time of the inspection.  This could Result in a lack of a weatherproof seal leading to higher energy bills.  Replacement of the hardware is recommended.","sev":"moderate","choices":[]}]},{"name":"Switches, Fixtures & Receptacles","c":[{"id":"418878b","type":"limit","title":"Unable to Inspect Everything","text":"LMT - I was unable to inspect every electrical component or proper installation of the system according to modern code. A licensed electrician or township building code inspector could perform that type of test, which is beyond the scope of my visual-only home inspection. I inspected the electrical system as much as I could according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"1f0a760","type":"defect","title":"Reversed Polarity","text":"I observed indications of multiple wall receptacles that have been wired with reversed polarity. This could create an electrical shock hazard as there will always be electrical current flowing out of the outlet even if your appliance is off.  Repair by a licensed electrical contractor is recommended.","sev":"moderate","choices":[]},{"id":"6cf61b5","type":"defect","title":"Loose Receptacle","text":"I observed indications of a loosely connected receptacle. Not secured to the wall. Defect.","sev":"moderate","choices":[]},{"id":"ece4646","type":"defect","title":"Ungrounded Receptacle","text":"I observed indications of one or more wall receptacles that were tested as being ungrounded. The wall receptacle apparently has a disconnected ground connection. This is a potential electrical hazard.","sev":"moderate","choices":[]},{"id":"7d221de","type":"defect","title":"Cover Plates Missing or Damaged","text":"I observed one or more wall receptacles with a missing or damaged cover plate.","sev":"minor","choices":[]},{"id":"0f5ac24","type":"defect","title":"Light Inoperable, Could Be Bulb","text":"I observed one or more lights that were not turning on. A new light bulb was possibly needed. We recommend asking the homeowner about why this light fixture did not turn on.","sev":"moderate","choices":[]},{"id":"60494e1","type":"defect","title":"Power Not Present at Receptacle","text":"I observed indications that power was not present at a receptacle.","sev":"minor","choices":[]},{"id":"ccbfe3c","type":"defect","title":"Switch Missing","text":"","sev":"minor","choices":[]},{"id":"ced02c2","type":"defect","title":"2' Wall Missing Receptacle","text":"I observed a lack of a wall receptacle at a wall space that is 2 feet or greater.","sev":"minor","choices":[]},{"id":"5bf06ec","type":"defect","title":"Cover Not In Place","text":"I observed a receptacle with a cover (plate) that was not in place.","sev":"minor","choices":[]},{"id":"32bf554","type":"info","title":"Inspected a Switches, Fixtures & Receptacles","text":"I inspected a representative number of switches, lighting fixtures and receptacles.","sev":"minor","choices":[]},{"id":"367c7a8","type":"defect","title":"Damaged Electrical Component","text":"I observed damage to an electrical component. Electrical hazard.","sev":"moderate","choices":[]},{"id":"0850519","type":"defect","title":"Inadequate Number of Receptacles in a Room","text":"I observed indications of a minimal number of receptacles in a room.","sev":"moderate","choices":[]},{"id":"dfb519c","type":"defect","title":"Major Defect","text":"I observed indications of a major defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"49c9f24","type":"defect","title":"Material Defect","text":"I observed indications of a material defect during the inspection. Major defect. Hazard. Correction and further evaluation is recommended.","sev":"major","choices":[]},{"id":"553b8c4","type":"defect","title":"Missing Ground at Receptacle","text":"I observed indications of a missing, open, or disconnected ground at a receptacle. Hazard.","sev":"moderate","choices":[]},{"id":"ca2fc30","type":"defect","title":"Missing Tamper Resistant Type","text":"I observed wall receptacles that are not tamper resistant type.\n\nAll 15- and 20-amp, 120-volt wall receptacle outlets should be listed as tamper resistant type, unless they are located 5 and a half feet above the floor.","sev":"moderate","choices":[]},{"id":"9d32f11","type":"defect","title":"More Than 6' Apart","text":"I observed a lack of wall receptacles.\n\nA receptacle should be no more than 6 feet apart along the wall.","sev":"minor","choices":[]},{"id":"1e5d591","type":"defect","title":"Polarity Was Incorrect","text":"I observed indications of incorrect polarity at a receptacle.","sev":"moderate","choices":[]},{"id":"ea1d6f9","type":"defect","title":"Switches Installed Improperly","text":"One or more switches are installed improperly. Recommend licensed electrician repair or replace.","sev":"moderate","choices":[]}]},{"name":"Floors, Walls, Ceilings","c":[{"id":"7610092","type":"info","title":"Floors, Walls, Ceilings Inspected","text":"I inspected the readily visible surfaces of floors, walls and ceilings. I looked for material defects according to the Home Inspection Standards of Practice.","sev":"minor","choices":[]},{"id":"166aabc","type":"defect","title":"Stain(s) on Ceiling- Ghosting","text":"Ghosting occurs when dust, soot, or other airborne particles settle on cooler areas of a ceiling, often highlighting the outlines of structural elements like ceiling joists. This happens because these areas tend to be slightly colder due to differences in heat conductivity and insulation. When candles are used, they emit soot and other particulates that contribute to the accumulation of these residues on the ceiling. The combination of cooler surface temperatures at the joists and additional soot from candles makes ghosting more pronounced, revealing the joist outlines more clearly.","sev":"minor","choices":[]},{"id":"444578f","type":"defect","title":"Floor Slopes","text":"Multiple areas of the floors sloped.  While this is common in older homes it can sometimes be a sign of structural issues.  It can also be a nuisance or tripping hazard.  Further evaluation by a licensed contractor is recommended.","sev":"moderate","choices":[]},{"id":"bb04b88","type":"defect","title":"Damaged (General)","text":"The home had general moderate damage visible at the time of the inspection. Recommend service by a qualified contractor.","sev":"moderate","choices":[]},{"id":"88d6db7","type":"defect","title":"Moisture Damage","text":"Stains on the walls visible at the time of the inspection appeared to be the result of moisture intrusion. The source of moisture may have been corrected. Recommend further examination by a qualified contractor to provide confirmation.","sev":"moderate","choices":[]},{"id":"a00e89b","type":"defect","title":"Minor Damage","text":"Minor damage or deterioration to the ceiling was visible at the time of the inspection.","sev":"moderate","choices":[]},{"id":"4cb0f2b","type":"defect","title":"Minor Corner Cracks","text":"Minor cracks at the corners of doors and windows in walls. Appeared to be the result of long-term settling. Some settling is not unusual in a home of this age and these cracks are not a structural concern.","sev":"moderate","choices":[]},{"id":"daaf8cd","type":"defect","title":"Water Stains","text":"There are stains on the ceiling/wall that should be repaired.  The source of the stain should be discovered and repaired.","sev":"minor","choices":[]},{"id":"e1dec15","type":"defect","title":"Carpet Damaged","text":"Cosmetic damage only","sev":"minor","choices":[]},{"id":"49ae819","type":"info","title":"Wall Material","text":"","sev":"minor","choices":["Drywall","Panneling","Tile","Plaster","Wood","OSB"]},{"id":"e69b76c","type":"info","title":"Finished Floor Material","text":"","sev":"minor","choices":["Tile","Carpet","Laminated","Ceramic Tile","Vinyl","Wood","Wood Planking","VCT Tile","Slate","Vinyl Tile Self Adhesive"]},{"id":"05c3957","type":"defect","title":"Major Corner Cracks","text":"I observed","sev":"minor","choices":[]},{"id":"3629ee2","type":"defect","title":"Possible Mold","text":"There are possible signs of fungi growth on ceiling. It is unknown if this is a safety hazard. Recommend a qualified mold inspector evaluate.","sev":"moderate","choices":[]},{"id":"2b28357","type":"info","title":"Ceiling Material","text":"","sev":"minor","choices":["Drywall","Plaster","Tile","Panneling"]},{"id":"71437f7","type":"defect","title":"Paint Cracking","text":"Wall paint was cracking in one or more areas. Recommend a qualified painter evaluate and apply a new coat.\n\nHere is a DIY article on treating cracking paint.","sev":"moderate","choices":[]},{"id":"161a349","type":"defect","title":"Poor Patching","text":"Sub-standard drywall patching observed at time of inspection. Recommend re-patching.","sev":"moderate","choices":[]},{"id":"4b12490","type":"defect","title":"Possible Asbestos Containing Flooring","text":"","sev":"moderate","choices":[]},{"id":"b7cb58f","type":"defect","title":"Carpet Stains","text":"Carpet had areas of staining or discoloration. Recommend a thorough steam clean by a qualified carpet cleaning company","sev":"moderate","choices":[]},{"id":"5c03cd0","type":"defect","title":"Door Knob Hole","text":"I observed a hole in the wall caused by a door knob.","sev":"minor","choices":[]},{"id":"04f15df","type":"defect","title":"Flooring Not Properly Installed","text":"","sev":"moderate","choices":[]},{"id":"8ef9ab7","type":"defect","title":"Moderate Wear","text":"Floors in the home exhibited moderate surface wear along major paths of travel. Recommend a qualified flooring contractor evaluate for possible re-finish.","sev":"moderate","choices":[]},{"id":"311e451","type":"defect","title":"Nail Pops","text":"Protruding nail heads visible at the time of the inspection appeared to be the result of contact with moisture. After the source of moisture is located and corrected, protruding nails should be removed, drywall re-fastened and the drywall finished to match the existing wall surfaces. All work should be performed by a qualified drywall or painting contractor.","sev":"moderate","choices":[]},{"id":"233fbe4","type":"defect","title":"Recent Roof Leak Damage","text":"Stains on the ceiling appear to be the result of roof leaks. The source of leakage should be identified and corrected, and the ceiling re-painted.","sev":"moderate","choices":[]},{"id":"eece038","type":"defect","title":"Sagging Drywall","text":"Ceiling drywall sagged visibly at the time of the inspection. This appears to be due to leakage from above. The source of moisture intrusion should be identified and corrected, and the damaged section of drywall replaced.","sev":"moderate","choices":[]},{"id":"fdea5b1","type":"defect","title":"Severe Damage","text":"Severe ceiling damage observed. Recommend a qualified drywall or structural engineer evaluate and advise.","sev":"moderate","choices":[]},{"id":"0a2681a","type":"defect","title":"Severe Wear","text":"Floors have severe surface wear in many areas. Recommend a qualified flooring contractor evaluate & remedy.\n\nHere is a DIY article that outlines how to refinish wood floors yourself.","sev":"moderate","choices":[]},{"id":"2039df9","type":"defect","title":"Tiles Loose","text":"Loose tiles are present at time of inspection. Recommend a qualified contractor re-attach and seal.","sev":"moderate","choices":[]},{"id":"aac12f8","type":"defect","title":"Tiles Missing","text":"One or more floor tiles were missing. Recommend installing/replacing missing tiles.","sev":"moderate","choices":[]}]},{"name":"Stairs, Steps, Stoops, Stairways & Ramps","c":[{"id":"44cc76b","type":"info","title":"Stairs, Steps, Stoops, Stairways & Ramps Were Inspected","text":"I inspected the stairs, steps, stoops, stairways and ramps that were within the scope of my home inspection.\n\nAll treads should be level and secure. Riser heights and tread depths should be as uniform as possible. As a guide, stairs must have a maximum riser of 7-3/4 inches and a minimum tread of 10 inches.","sev":"minor","choices":[]},{"id":"9b84acd","type":"defect","title":"Headroom at Stairway Too Low (6' 8\")","text":"I observed that the headroom at the stairs is too low. The minimum is 6 feet and 8 inches.","sev":"moderate","choices":[]},{"id":"21416ed","type":"defect","title":"Big Differences Between Treads (3/8\")","text":"I observed that there's a difference between the stair treads from one to another that is greater than 3/8 of an inch.\n\nThis poses as a trip hazard. The difference between one step and other is at most 3/8 of an inch.","sev":"moderate","choices":[]},{"id":"f29e7c8","type":"defect","title":"Missing Handrail","text":"I observed a missing handrail.\n\nThere is more than one step here, and I recommend installing a handrail for safety.","sev":"moderate","choices":[]},{"id":"5b4fcbb","type":"defect","title":"Tread Depth Too Short (Smaller Than 10\")","text":"I observed a defect at the stair riser depth. It's too short.\n\nThe minimum tread depth is 10 inches, measured between the projected nosings of adjacent treads. This poses a trip hazard.","sev":"moderate","choices":[]},{"id":"473aded","type":"defect","title":"Width of Stairway Too Narrow (36\")","text":"I observed that the width of the stairway (above the handrail) is less than the standard minimum of 36 inches.","sev":"minor","choices":[]},{"id":"a26c91e","type":"defect","title":"Damage at Step","text":"I observed a damage at a step. This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"65b8e0e","type":"defect","title":"Riser Height Too Tall (Greater Than 7 3/4\")","text":"I observed a defect at the stair riser height.\n\nThe riser height maximum is 7 3/4 inches measured vertically between the stair treads. This poses a trip hazard.","sev":"moderate","choices":[]},{"id":"7f4e0c8","type":"defect","title":"Loose Carpeting at Stairs","text":"I observed indications of loose carpeting at the stairs.","sev":"minor","choices":[]},{"id":"22f1092","type":"defect","title":"Loose Handrail","text":"I observed a loose handrail.","sev":"moderate","choices":[]},{"id":"e293c46","type":"defect","title":"Problem with 3-Way Switch at Stairs","text":"I observed indications of a problem with the 3-way lighting switch at the stairs.","sev":"minor","choices":[]},{"id":"6090b92","type":"defect","title":"Slippery Steps","text":"I observed indications at the stair treads or steps are slippery.","sev":"minor","choices":[]},{"id":"807b2c3","type":"defect","title":"Stairway Illumination","text":"I observed inadequate illumination (lighting) for the stairway.\n\nAll stairs should have adequate lighting to see where you're stepping. There should be lighting for the stairway, steps, treads, and landings. For the exterior stairs, there should be a light at the top landing.","sev":"moderate","choices":[]},{"id":"34ee8b2","type":"defect","title":"Trip Hazard at Step","text":"I observed a trip hazard at a step. This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"6fb19fe","type":"defect","title":"Window Safety Glazing Not Present In Stairway","text":"The inspector noted the windows were not manufactured with safety glazing.  Windows within 36\" vertical of a stair nosing to be safety glazing.  All windows within 60\" of the front of the plane of the bottom step of a stairway is also required to be manufactured of safety glazing.  This is a safety hazard and should be corrected by a licensed window installation company.","sev":"major","choices":[]},{"id":"95f8af9","type":"defect","title":"Unsupported","text":"","sev":"major","choices":[]},{"id":"6e34a31","type":"defect","title":"Handrail Missing Returns","text":"","sev":"moderate","choices":[]}]},{"name":"Railings, Guards & Handrails","c":[{"id":"95c00a8","type":"info","title":"Railings, Guards & Handrails Were Inspected","text":"I inspected a repre

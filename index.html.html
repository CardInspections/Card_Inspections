ing.","sev":"moderate","choices":[]},{"id":"da57c3a","type":"defect","title":"Trip Hazard at Step","text":"I observed a trip hazard at a step. This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"bc67e5b","type":"defect","title":"Damage at Step","text":"I observed a damage at a step. This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"4d55294","type":"defect","title":"Loose Handrail","text":"I observed a loose handrail.","sev":"moderate","choices":[]},{"id":"e69c8c6","type":"defect","title":"Missing Handrail","text":"I observed a missing handrail at the exterior steps.\n\nThere is more than one step here, and I recommend installing a handrail for safety.","sev":"moderate","choices":[]},{"id":"c402917","type":"defect","title":"Headroom at Stairway Too Low (6' 8\")","text":"I observed that the headroom at the stairs is too low. The minimum is 6 feet and 8 inches.","sev":"moderate","choices":[]},{"id":"e24f23f","type":"defect","title":"Big Differences Between Treads (3/8\")","text":"I observed that there's a difference between the stair treads from one to another that is greater than 3/8 of an inch.\n\nThis poses as a trip hazard. The difference between one step and other is at most 3/8 of an inch.","sev":"moderate","choices":[]},{"id":"f5a3035","type":"defect","title":"Problem with 3-Way Switch at Stairs","text":"I observed indications of a problem with the 3-way lighting switch at the stairs.","sev":"minor","choices":[]},{"id":"68f9f18","type":"defect","title":"Slippery Steps","text":"I observed indications at the stair treads or steps are slippery.","sev":"minor","choices":[]},{"id":"3a7968a","type":"limit","title":"Could Not Use Access Ladder","text":"LMT - The door was locked and prevented entry to the garagePersonal belongings blocked access to the attic access.  Limitation. The attic was not fully inspected.","sev":"minor","choices":[]}]},{"name":"Railings, Guards & Handrails","c":[{"id":"7334d15","type":"info","title":"Railings, Guards & Handrails Were Inspected","text":"I inspected the railings, guards and handrails that were within the scope of the home inspection.","sev":"minor","choices":[]},{"id":"0d01c0d","type":"defect","title":"Missing Handrail","text":"I observed a missing handrail.\n\nThere is more than one step here, and I recommend installing a handrail for safety.","sev":"moderate","choices":[]},{"id":"88ff4c1","type":"defect","title":"Loose Railing Component","text":"I observed a loose railing component.  This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"minor","choices":[]},{"id":"2a3be14","type":"defect","title":"Handrail Not Graspable","text":"I observed a handrail that is not grippable or graspable.  This condition is a safety hazard.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"679acf6","type":"defect","title":"Guard Opening Was Too Large (4\")","text":"I observed improper spacing between intermediate balusters, spindles and rails at a required guard.  This is a safety hazard, especially for small children.\n\nGuards may not allow the passage of a sphere 4 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"5543d14","type":"defect","title":"Stair Guard Opening Was Too Large (4 3/8\")","text":"I observed improper spacing between intermediate balusters, spindles and rails.  This is a safety hazard, especially for small children.\n\nGuardrails are required on open sides of stairways and should have intermediate rails that do not allow the passage of a sphere 4 3/8 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"2f604a4","type":"defect","title":"Stair Guard Opening Was Too Large (6\")","text":"I observed improper spacing between intermediate balusters, spindles and rails.  This is a safety hazard, especially for small children.\n\nAnd opening at the guard on the open side of a stair formed by the riser, the tread and bottom rail of the guard should not allow the passage of a sphere 6 inches in diameter.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"0371c8a","type":"defect","title":"Improper Guardrail Height (Not 36\")","text":"I observed indications of a defect related to the height of a guardrail.\n\nGuardrails are normally required to be 36 inches above standing surface next to the guardrail.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"1e7db74","type":"defect","title":"Improper Stair Guardrail Height (Not 34\")","text":"I observed indications of a defect related to the height of a guardrail at the stairs.\n\nGuards on the open side of a stairway must be at least 34 inches in height above the walking surface or the line connecting the nosings of the stair treads.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"8b40ddb","type":"defect","title":"Improper Handrail Height","text":"I observed indications of a defect related to the height of a railing.  Handrails are normally required to be 34 to 38 inches above the stair nosing on at least one side of all stairs with three or more risers.\n\nCorrection and further evaluation is recommended.","sev":"moderate","choices":[]},{"id":"0b9e782","type":"defect","title":"Handrail is Not Continuous","text":"I observed that the handrail is not continuous. It should be.\n\nHandrails for stairs must be continuous for the full length of the stairway.","sev":"moderate","choices":[]}]},{"name":"Moisture Intrusion in Garage","c":[{"id":"45eb6cf","type":"defect","title":"Active Moisture Intrusion / Water Penetration Observed","text":"I observed indications of active moisture intrusion (water penetration) into the garage.","sev":"moderate","choices":[]},{"id":"cba2403","type":"defect","title":"Water Marks Observed","text":"I observed indications of water intrusion in the garage. Water marks. Further evaluation of the water intrusion problem is recommended.","sev":"minor","choices":[]},{"id":"d253fa7","type":"defect","title":"Efflorescence in Garage","text":"I observed indications of efflorescence in the garage.\n\nEfflorescence is the white chalky powder that might be found on the surface of a concrete or brick wall. It can be a cosmetic issue, or it can be an indication of moisture intrusion that could lead to major structural and indoor air quality issues.","sev":"minor","choices":[]}]},{"name":"Boiler","c":[{"id":"f243e8b","type":"defect","title":"Relief Valve Leaking","text":"The relief valve on the boiler was leaking.  The relief valve is an important safety device and needs to be properly maintained at all times to avoid injury in the event of an emergency.  Immediate repair by a licensed mechanical contractor is recommended.","sev":"major","choices":[]},{"id":"3b14df9","type":"limit","title":"Not Operational","text":"LMT -The boiler was not operational in the garage.  It was not inspected.","sev":"minor","choices":[]}]},{"name":"Chimney","c":[{"id":"51405b2","type":"defect","title":"Damaged","text":"","sev":"moderate","choices":[]}]},{"name":"Fuel Lines In Garage","c":[{"id":"08f2890","type":"defect","title":"CSST","text":"Improper bonding of Corrugated Stainless Steel Tubing (CSST) piping can increase the odds of failure.  Electrical discharge can cause holes to form in the pipe causing gas leaks.  Evaluation by a licensed electrician or HVAC contractor to ensure all installation requirements have been met is recommended.  To learn more about CSST click here.","sev":"major","choices":[]}]},{"name":"Garage Heat Source","c":[{"id":"98842a9","type":"limit","title":"Fuel Supply Turned Off","text":"LMT - The fuel supply to the garage heat source was not operational.  The garage heat source was not inspected.","sev":"minor","choices":[]}]}]},{"name":"Pest Activity","subs":[{"name":"WDO Signs","c":[{"id":"738f882","type":"defect","title":"Possible Signs of WDO","text":"The inspector noted possible signs of a wood destroying organism (WDO).  WDO\u2019s can cause major damage to a home.  Hidden damage may exist.  Further evaluation by a licensed pest control specialist is recommende.","sev":"moderate","choices":[]}]},{"name":"General Pest Signs","c":[{"id":"299c919","type":"defect","title":"Rodent Droppings","text":"","sev":"moderate","choices":[]}]},{"name":"Non-WDO Signs","c":[{"id":"63d9d2e","type":"defect","title":"Signs of pests were observed- Non-wood destroying","text":"The inspector observed signs of pests that are typically not considered wood destroying.  No recent activity was observed, however We recommend a pest control specialist evaluate further.","sev":"minor","choices":[]}]}]}];

function itemCard(k,it,s){

 return `<div class="item" style="border-left:5px solid ${d?COL[it.sev]:"#94a3b8"}"><div class="ih"><b>${TL[it.type]}</b>
 <select data-act="pick" ${a}><option value="">— pick from library (${lib.length}) —</option>${lib.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join("")}</select>
 <button data-act="mv" ${a} data-d="-1">▲</button><button data-act="mv" ${a} data-d="1">▼</button><button data-act="tolib" ${a}>Save to library</button><button data-act="del" ${a}>🗑</button></div>
 <label>Title</label><input data-f="title" ${a} value="${esc(it.title)}">${ch}
 <label>Narrative</label><textarea data-f="text" ${a}>${esc(it.text)}</textarea>

 `:""}
 <label>Photos</label>${cam("photo",a)}
 <div class="ph">${it.photos.map((p,n)=>`<span><img src="${p}"><button data-act="rmph" ${a} data-n="${n}">×</button></span>`).join("")}</div></div>`}

 L.forEach(c=>{const cn=n+1;let subs="",cs="",j=0;

     k++;const num=`${cn}.${j+1}.${k}`,col=COL[it.sev];cnt[it.sev]++;if(it.safety)saf++;
     def+=`<div class="dcard" id="d-${num}"><div class="dh" style="background:${col}"><span>${num} ${esc(it.title)}</span><span>${it.safety?"⚠ SAFETY · ":""}${SL[it.sev]}</span></div><div class="dbody">
     ${it.loc?`<div><b>Location:</b> ${esc(it.loc)}</div>`:""}${sel?`<div><b>${esc(it.title)}:</b> ${esc(sel)}</div>`:""}${(it.text||"").trim()?`<div class="pw">${esc(it.text.trim())}</div>`:""}
     ${(it.rec||"").trim()?`<div class="pw"><b>Recommendation:</b> ${esc(it.rec.trim())}</div>`:""}
     ${it.photos.length?`<div class="rp">${it.photos.map(p=>`<img src="${p}">`).join("")}</div>`:""}</div></div>`;
     cs+=`<div class="srow"><span class="dot" style="background:${col}"></span><div><b style="color:${col}"><a href="#d-${num}">${num} ${esc(it.title)}</a></b>${it.safety?" <b>⚠ Safety</b>":""} — ${SL[it.sev]}${it.loc?`<br><small>Location: ${esc(it.loc)}</small>`:""}</div></div>`;
    }else{const h=li(it);if(h){if(it.type=="info")inf+=h;else lim+=h}}});
   if(!(inf||lim||def))return;j++;
   subs+=`<h3>${cn}.${j} ${esc(s.name)}</h3>${inf?`<h4>Descriptions</h4><ul>${inf}</ul>`:""}${lim?`<h4>Disclaimers</h4><ul>${lim}</ul>`:""}${def?`<h4>Concerns and Observations</h4>${def}`:""}`});
  if(subs){n++;toc.push(`<a href="#sec-${cn}">${cn}. ${esc(c.name)}</a>`);body+=`<h2 id="sec-${cn}">${cn}. ${esc(c.name)}</h2>${subs}`}
  if(cs)sum+=`<h3><a href="#sec-${cn}">${cn}. ${esc(c.name)}</a></h3>${cs}`});
 const summary=`<div class="summary" id="summary"><h2>Summary of Deficiencies</h2><div class="counts"><div style="background:${COL.major}">Major: ${cnt.major}</div><div style="background:${COL.moderate}">Moderate: ${cnt.moderate}</div><div style="background:${COL.minor}">Minor: ${cnt.minor}</div><div style="background:#111827">Safety: ${saf}</div></div>${sum||"<p>No deficiencies recorded.</p>"}</div>`;
 const d=S.date?new Date(S.date+"T12:00"):null,SA='<a href="#summary">Summary of Deficiencies</a>',tocL=(S.sumFirst?[SA].concat(toc):toc.concat([SA]));
 return `<div class="card noprint"><h2>Report Preview</h2><p>When it looks right, click <b>Save as PDF</b>. In the print window set <b>Destination</b> to <b>Save as PDF</b>, switch <b>Headers and footers</b> OFF, then Save.</p><button class="p" data-act="print">Save as PDF</button></div>
 <div class="report"><div class="cover"><div class="biz">${BIZ.name}</div><h1>Inspection Report</h1>
 <div class="dateaddr">${d?`<div class="dblock"><b>${d.toLocaleDateString("en-US",{month:"long"})}</b><span>${d.getDate()}</span><i>${d.getFullYear()}${fmtT()?" · "+fmtT():""}</i></div>`:""}<div class="addr">${esc(S.addr).replace(/,\s*/,",<br>")}</div></div>
 ${S.photo?`<div class="photo"><img src="${S.photo}"></div>`:'<div style="height:30px"></div>'}
 <div class="cinfo"><div><h5>Client</h5>${esc(S.client.name)}${line("",S.client.phone)}${line("",S.client.email)}</div>
 <div><h5>Inspector</h5>${BIZ.owner}<div>${BIZ.addr}</div><div>${BIZ.phone}</div><div>${BIZ.email}</div><div style="margin-top:4px">${BIZ.creds}</div></div>
 <div><h5>Real Estate Agent</h5>${esc(R.name)}${line("",R.phone)}${line("",R.email)}</div></div></div>
 <div class="toc"><h2>Table of Contents</h2>${tocL.map((t,i)=>`<div>${S.sumFirst&&i==0?"":""}${t}</div>`).join("")}</div>
 ${S.sumFirst?summary:""}${body||"<p>No items entered yet.</p>"}${S.sumFirst?"":summary}</div>`}

function render(){
 document.querySelectorAll("header button[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t==tab));
 $("main").innerHTML={setup:vSetup,inspect:vInspect,lib:vLib,report:vReport}[tab]()}

document.addEventListener("input",e=>{const t=e.target,d=t.dataset,f=d.f;
 if(d.p){setp(d.p,t.type=="checkbox"?t.checked:t.value);save()}
 else if(f&&d.k){const it=find(d.k,d.id);it[f]=t.type=="checkbox"?t.checked:t.value;save();if(f=="sev")render()}
 else if(f&&d.lm){const m=L[lc].subs[ls].c.find(m=>m.id==d.lm);m[f]=f=="choices"?t.value.split(/\s*,\s*/).filter(Boolean):t.value;saveLib()}});

document.addEventListener("change",async e=>{const t=e.target,d=t.dataset;
 if(d.act=="pick"){const m=L.flatMap(c=>c.subs).flatMap(s=>s.c).find(x=>x.id==t.value),it=find(d.k,d.id);if(m){it.title=m.title;it.text=m.text;it.sev=m.sev||"minor";it.choices=(m.choices||[]).slice();it.sel=[];save();render()}}
 else if(d.act=="photo"){const it=find(d.k,d.id);for(const f of t.files)it.photos.push(await shrink(f,1000));save();render()}
 else if(d.act=="cover"){if(t.files[0]){S.photo=await shrink(t.files[0],1400);save();render()}}
 else if(d.act=="lc"){lc=+t.value;ls=0;render()}
 else if(d.act=="ls"){ls=+t.value;render()}
 else if(d.act=="openfile"&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!j.items||!j.client)throw 0;if(!confirm("Open this file? It replaces the inspection currently on screen."))return;fix(j);S=j;save();tab="inspect";render()}catch(x){alert("That is not a valid inspection file.")}t.value=""}
 else if(d.act=="libimport"&&t.files[0]){try{const j=JSON.parse(await t.files[0].text());if(!Array.isArray(j)||!j[0].subs)throw 0;if(confirm("Replace your library with this file?")){L=j;lc=ls=0;saveLib();render()}}catch(x){alert("That file is not a valid library file.")}}});

document.addEventListener("click",e=>{const a=e.target.closest("[data-act]");if(!a||["SELECT","INPUT"].includes(a.tagName))return;
 const d=a.dataset,x=d.act,it=d.k?find(d.k,d.id):null;
 if(x=="tab"){tab=d.t;window.scrollTo(0,0)}
 else if(x=="cat"){cat=+d.i;window.scrollTo(0,0)}
 else if(x=="add"){(S.items[d.k]=S.items[d.k]||[]).push({id:uid(),type:d.t,title:"",text:"",rec:"",loc:"",sev:"minor",safety:false,photos:[],choices:[],sel:[]});save()}
 else if(x=="del"){if(!confirm("Delete this item?"))return;S.items[d.k]=S.items[d.k].filter(i=>i.id!=d.id);save()}
 else if(x=="mv"){const arr=S.items[d.k],i=arr.indexOf(it),j=i+ +d.d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save()}
 else if(x=="libmv"){const arr=L[lc].subs[ls].c,i=arr.findIndex(m=>m.id==d.id),j=i+ +d.d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];saveLib()}
 else if(x=="libhidecat"){L[lc].hidden=!L[lc].hidden;saveLib()}
 else if(x=="libhidesub"){const s=L[lc].subs[ls];if(s){s.hidden=!s.hidden;saveLib()}}
 else if(x=="libdelcat"){if(L.length<2||!confirm("Delete the category "+L[lc].name+" and everything in it?"))return;L.splice(lc,1);lc=ls=0;cat=0;saveLib()}
 else if(x=="savef"){saveFile();return}
 else if(x=="openf"){$("#opn").click();return}
 else if(x=="chip"){const c=it.choices[+d.n],i=it.sel.indexOf(c);i<0?it.sel.push(c):it.sel.splice(i,1);save()}
 else if(x=="rmph"){it.photos.splice(+d.n,1);save()}
 else if(x=="tolib"){const s=L[cat].subs.find(s=>L[cat].name+"|"+s.name==d.k);s.c.push({id:uid(),type:it.type,title:it.title,text:it.text,sev:it.sev,choices:(it.choices||[]).slice()});saveLib();alert("Saved to the library.");return}
 else if(x=="print"){document.title="Inspection Report - "+(S.addr||"Home");window.print();return}
 else if(x=="new"){if(confirm("Save this inspection to a file before starting a new one?\n\nOK = save it first.\nCancel = continue without saving."))saveFile();if(!confirm("Clear everything and start a new inspection? (Your narrative library is kept.)"))return;S=blank();save();tab="setup"}
 else if(x=="libadd"){L[lc].subs[ls].c.push({id:uid(),type:d.t,title:"",text:"",sev:"minor",choices:[]});saveLib()}
 else if(x=="libdel"){if(!confirm("Delete this comment from the library?"))return;L[lc].subs[ls].c=L[lc].subs[ls].c.filter(m=>m.id!=d.id);saveLib()}
 else if(x=="libaddsub"){const n=prompt("New sub group name:");if(!n)return;L[lc].subs.push({name:n,c:[]});ls=L[lc].subs.length-1;saveLib()}
 else if(x=="libdelsub"){if(!confirm("Delete this whole sub group and its comments?"))return;L[lc].subs.splice(ls,1);ls=0;saveLib()}
 else if(x=="libaddcat"){const n=prompt("New category name:");if(!n)return;L.push({name:n,subs:[{name:"General",c:[]}]});lc=L.length-1;ls=0;saveLib()}
 else if(x=="libreset"){if(!confirm("Replace your library with the original Spectora import? Your edits to the library will be lost."))return;L=JSON.parse(JSON.stringify(DEFAULT_LIB));lc=ls=0;saveLib()}
 else if(x=="libexport"){const u=document.createElement("a");u.href=URL.createObjectURL(new Blob([JSON.stringify(L,null,1)],{type:"application/json"}));u.download="card-library.json";u.click();return}
 else if(x=="impbtn"){$("#imp").click();return}
 render()});
(async()=>{L=(await idbGet("lib"))||JSON.parse(JSON.stringify(DEFAULT_LIB));S=(await idbGet("insp"))||(()=>{try{return JSON.parse(localStorage.getItem("cis_insp"))}catch(e){return null}})()||blank();fix(S);render()})();
</script></body></html>
